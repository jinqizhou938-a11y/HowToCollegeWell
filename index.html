的一层缓冲。", "收益": "国家对公办全日制普通高校中家庭经济特别困难、无法缴纳学费的学生（特别是孤残学生、少数民族学生、烈士子女、优抚家庭子女等）实行学费减免，具体办法由学校制定；高校普遍设立临时困难补助或专项资助资金，用于家庭出现重大变故学生的紧急救助。相关政策还要求高校对陷入网贷等困境的学生建立专门帮扶机制。", "证据等级": "B", "来源": "《高等学校学生资助政策简介》（全国学生资助管理中心编）；中国银保监会等五部门 (2021). 关于进一步规范大学生互联网消费贷款监督管理工作的通知（要求高校完善特殊困难救助机制）。<https://www.xszz.edu.cn/>", "备注": "受益人是自己。找辅导员开口不丢人，这是制度专门留的口子。申请时把突发情况的时间、花费和证明材料说具体，比泛泛说\"家里困难\"有效得多。"}, "extra": []}, {"n": 16, "title": "评奖就是一场材料战：平时建证书文件夹，公示期要盯着", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱，平时留意收集即可。", "说人话": "奖学金评的是\"能拿出证据的成绩\"，材料不全、时间对不上，成绩再好也可能被刷。平时就把获奖证书、项目立项书、竞赛通知、志愿服务记录随手扫描归档；每年评审季照着通知的清单逐条核对。评审结束后一般有公示期，发现漏算、算错要马上提出来。", "收益": "各高校奖学金评审一般包括个人申请、班级或年级评议、学院初评、学校审定、校内公示等环节，公示期通常不少于 5 个工作日；评审材料要求提供获奖证书、成绩单、项目证明等原件或扫描件。国家奖学金、国家励志奖学金按学年评审，一般 9 月底前完成申请。", "证据等级": "C", "来源": "各高校奖学金评审办法与评审通知（公示期等属通行做法，逐校差异）；教育部 (2017). 普通高等学校学生管理规定（奖励相关条款）。", "备注": "证书要看两个点：发证单位级别和获奖时间。很多奖学金只认本学年、只认省级以上。公示期是你唯一能纠错的窗口，过了就只能等明年。"}, "extra": []}, {"n": 17, "title": "用\"名额 / 人数\"倒推：你现在这个排名，能拿到哪一类", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱，一次算清楚。", "说人话": "判断能不能拿奖，靠的不是感觉，是名额和你排名的位置。比如某学院本年级 300 人、国家奖学金名额 2 个，那基本要专业前 1% 才有戏；国家励志奖学金按本科在校生 3% 算大约 9 个名额，前 3% 且困难的学生才有机会；校级一等奖若覆盖 10%，前 30 名就稳得多。先问清名额，再对照自己的排名。", "收益": "国家励志奖学金覆盖面约为本科在校生总数的 3%、高职约 3.3%；国家助学金覆盖面本科约 20%、高职约 22%；本专科国家奖学金全国每年 12 万名。这些比例可以作为估算的锚点，但具体到某校某院的名额分配，以学校下达的评审名额为准。", "证据等级": "C", "来源": "财政部、教育部 (2024). 财教〔2024〕181 号（覆盖面相关表述）；各高校评审名额分配办法（逐校差异）。", "备注": "名次比绝对分数更有意义，因为比较的是同年级同专业。大一就该查清\"专业多少人、往年名额几个、我排第几\"，别等评奖当天才懵。"}, "extra": []}, {"n": 18, "title": "所有\"先交钱才能领钱\"的助学金、奖学金都是诈骗", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，不点链接就是全部成本。", "说人话": "真实的资助发放只有一个路径：学校资助部门审核之后，直接把钱打到你本人银行卡，全程没有任何\"手续费\"\"验证费\"\"解冻费\"。凡是短信、QQ、微信通知你\"助学金到账，点链接核对银行卡\"\"账户冻结，先交保证金\"的，一律是诈骗，专挑开学和发放季下手。", "收益": "国家奖助学金、国家助学贷款发放均经学校资助管理部门审核后直接发至学生本人银行卡，不存在要求缴纳手续费、验证账户的环节。公安机关反诈提示：凡以\"助学金发放\"\"银行卡冻结\"\"刷信誉\"为由要求转账、索要短信验证码的，均为诈骗；遇可疑情况拨打全国反诈专线 96110 或 110。", "证据等级": "B", "来源": "全国学生资助管理中心防诈骗提示；公安部与各地公安机关反诈宣传。<https://www.xszz.edu.cn/>", "备注": "受益人是自己。两条铁律：一是任何验证码都不给任何人；二是拿不准就先挂掉，直接打辅导员或学校资助中心电话核实。假 APP、假贷款中介是同一套剧本。"}, "extra": []}, {"n": 19, "title": "办助学贷款不收任何中介费，遇到\"包过\"\"代办\"要警惕", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "国家助学贷款由县级学生资助管理中心和经办银行免费办理，不向学生收取任何手续费，也不存在什么\"内部渠道\"\"包过\"。市面上号称\"帮你办助学贷款、收几百块服务费\"的中介，要么是赚你信息差的冤枉钱，要么就是直接骗证件、骗费用的诈骗。自己按官方指南办，流程并不复杂。", "收益": "生源地信用助学贷款的受理和发放不向学生收取任何费用；需要提交的材料由各地学生资助管理中心按政策规定明确要求，办理渠道为县级学生资助管理中心和经办银行，学生只需提供真实材料即可，无需通过第三方代办。", "证据等级": "B", "来源": "全国学生资助管理中心助学贷款办理指南与防诈骗提示。<https://www.xszz.edu.cn/>", "备注": "同时警惕\"注销校园贷\"\"影响征信、帮你修复\"这一类话术——征信不存在\"花钱修复\"，凡声称能消除真实不良记录的，都是诈骗。"}, "extra": []}, {"n": 20, "title": "把资助的钱单独记账，别混进生活费一次花完", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱，花的是记账习惯。", "说人话": "国家奖学金一学年一次性发 1 万元，助学金按学期或按月发，学费减免则直接冲抵学费。这些钱的性质完全不同：学费减免和贷款要用来交学费住宿费，助学金和奖学金才是生活结余。混在一起乱花，很容易出现\"以为自己很有钱、结果下学期交不上学费\"的窘境。", "收益": "国家奖学金一般于每年 12 月 31 日前一次性发放；国家助学金多按学期或按月发放；国家助学贷款优先用于支付学费和住宿费，超出部分才可用于生活费；学费减免直接减免应缴学费。高校通常通过学生资助卡或本人银行卡发放，并要求资助资金专款专用。", "证据等级": "C", "来源": "财教〔2024〕181 号、财教〔2024〕188 号相关规定；各高校资助资金发放办法（通行做法）。", "备注": "建议把每一笔资助到账单独记一行，标注用途（学费/住宿费/生活）。这跟第 11 章的记账方法是同一件事，只是把\"来源\"这一列填清楚。"}, "extra": []}, {"n": 21, "title": "资助的优先级：先认定、再用不用还的钱、最后才贷款和兼职", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，一次想清楚。", "说人话": "缺钱时正确的顺序是：① 先做家庭经济困难认定（打开所有资助的钥匙）；② 申领不用还的钱（国家助学金、学费减免、临时补助）；③ 再用国家助学贷款（低息、可控的债）；④ 校内勤工助学（时间换钱、安全）；⑤ 最后才考虑校外兼职。反过来先借网贷、先做高风险兼职，是最吃亏的顺序。", "收益": "国家助学贷款在校期间由财政全额贴息、利率为同期同档次 LPR 减 70 个基点；国家助学金平均每生每年 3700 元；国家励志奖学金每生每年 6000 元；校内勤工助学有协议、工时上限和酬金底线保障。四者共同构成\"不借高利贷也能读完书\"的安全网。", "证据等级": "A", "来源": "财政部、教育部 (2024). 财教〔2024〕181 号；财政部、教育部等 (2024). 财教〔2024〕188 号；《高等学校学生勤工助学管理办法（2018 年修订）》。<https://www.xszz.edu.cn/>", "备注": "受益人是自己。做任何\"先借一笔周转一下\"的决定前，先把上面这张清单过一遍，通常你会发现有一条更便宜、更安全的路还没走。"}, "extra": []}, {"n": 22, "title": "毕业离校前必须做\"还款确认\"：不做，可能按违约处理", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，登录系统确认一次。", "说人话": "办了助学贷款的学生，毕业离校前要在系统里完成还款确认，核对本金、利率、还款计划和还款方式，同时更新手机号等联系方式。漏做这一步，银行的扣款通知发不到你手上，很容易在完全不知情的情况下逾期，白白在征信上留下一笔记录。", "收益": "国家助学贷款的借款学生在毕业离校前，应按经办银行和学校要求办理还款确认手续，确认贷款本金、利息、还款期限、还款方式和联系方式等信息。根据《征信业管理条例》，逾期还款信息会报送金融信用信息基础数据库，不良信息自终止之日起保存 5 年，可能影响后续贷款、信用卡及部分岗位背景审查。", "证据等级": "B", "来源": "《征信业管理条例》（国务院令第 631 号）；全国学生资助管理中心助学贷款还款指南；中国人民银行征信中心。<https://www.pbccrc.org.cn/>", "备注": "受益人是自己。同时做两件事：① 把还款日设成手机日历提醒；② 毕业前查一次本人信用报告，确认没有莫名多出来的贷款账户。"}, "extra": []}, {"n": 23, "title": "在校期间至少查一次征信报告：确认没有多出来的账户", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "个人信用报告由中国人民银行征信中心出具，记录你的贷款、信用卡和还款情况。每年可以免费查询两次本人信用报告，线上通过征信中心官网就能查简版。在校期间至少查一次，确认没有莫名其妙多出来的贷款账户或者被冒名开的卡；毕业前再查一次，把该解决的问题在离校前解决掉。", "收益": "中国人民银行征信中心提供个人信用报告查询服务，个人每年可免费查询 2 次本人信用报告；线上渠道一般可获取简版报告，详版可到人民银行分支机构或授权网点查询。信用报告是金融机构信贷审批的重要依据，也是识别身份被冒用、账户异常的重要工具。", "证据等级": "A", "来源": "中国人民银行征信中心（个人信用报告查询服务）。<https://www.pbccrc.org.cn/>", "备注": "辨认真假：征信报告只有央行征信中心这一个官方出口，任何\"付费查征信\"\"花钱消除不良记录\"的 App 或中介都是假的。查询一定从官方网址或银行官方 App 进。"}, "extra": []}, {"n": 24, "title": "一张全年资助日历：把窗口期提前标进手机", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，一次就好。", "说人话": "资助和评奖是有节奏的：秋季学期开学后先做困难认定和各类奖学金评审，接着发助学金；暑假前后办生源地助学贷款的首次申请和续贷；毕业学年则要做还款确认、关注基层就业代偿和应征入伍资助的申报时间。把这几件事提前标进手机日历，就不会出现\"想起来的时候窗口已经关了\"这种遗憾。", "收益": "国家奖学金、国家励志奖学金一般在秋季学期评审、9 月底前完成申请；生源地助学贷款办理集中在暑假（约 7—9 月）；困难认定每学年进行一次；应征入伍和基层就业代偿的申报多在毕业学年进行。每一类都有明确的时间窗口，错过通常要等第二年。", "证据等级": "C", "来源": "本节的汇总（依据见第 1 至 23 条各自的来源；属操作清单，非文献结论）。", "备注": "清单里凡是带时间的（认定、贷款、评奖、还款确认），判断依据是\"学校当年的通知\"，不是\"去年的经验\"。每年政策细则都会调整，以当年官方通知为准。"}, "extra": []}]}, {"file": "10-兼职实习与赚钱.md", "title": "10. 兼职、实习与赚钱：怎么不被坑", "entries": [{"n": 1, "title": "找兼职只走三条渠道：学校勤工助学、正规平台、熟人介绍", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱，花点筛选时间。", "说人话": "安全的兼职渠道其实只有三条：① 学校的勤工助学岗位（有协议、有工时上限、有酬金底线）；② 正规招聘平台上有营业执照企业的岗位；③ 老师、学长学姐、熟人直接介绍的活。除此之外，凡是\"高薪、零门槛、日结、先加群\"的广告，先默认它是骗局，别抱侥幸。", "收益": "《高等学校学生勤工助学管理办法（2018 年修订）》规定：学生在校内勤工助学须与学校勤工助学管理服务组织签订具有法律效力的协议书；在校外勤工助学须经学校授权，由学校、用人单位和学生三方签订协议，明确三方权利义务、意外伤害处理办法和争议解决方式；未经学校同意，任何单位和个人不得聘用在校学生打工。", "证据等级": "B", "来源": "教育部、财政部 (2018). 高等学校学生勤工助学管理办法（2018 年修订）。<https://www.moe.gov.cn/jyb_xwfb/s5147/201809/t20180905_347280.html>", "备注": "找兼职的第一条标准不是\"钱多不多\"，而是\"有没有正规主体、有没有书面协议\"。没有主体和协议的，钱越多风险越大。"}, "extra": []}, {"n": 2, "title": "校内勤工助学有两条硬上限：每周不超过 8 小时、每月不超过 40 小时", "tag": {"money": "0", "time": "中", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱，占课余时间。", "说人话": "校内勤工助学有两条硬上限：原则上每周不超过 8 小时、每月不超过 40 小时。也就是说它本质是\"贴补生活费\"，不是\"养活自己\"，别指望靠它月入几千。好处是地点在校内、时间可协调、有协议兜底，特别适合课多、又需要一点零花钱的学生。", "收益": "《高等学校学生勤工助学管理办法（2018 年修订）》：安排勤工助学岗位应优先考虑家庭经济困难学生；学生参加勤工助学时间原则上每周不超过 8 小时、每月不超过 40 小时。校内固定岗位按月计酬，以每月 40 个工时酬金原则上不低于当地最低工资标准或居民最低生活保障标准为基准；临时岗位按小时计酬，原则上不低于每小时 12 元。", "证据等级": "A", "来源": "教育部、财政部 (2018). 高等学校学生勤工助学管理办法（2018 年修订）。<https://www.moe.gov.cn/jyb_xwfb/s5147/201809/t20180905_347280.html>", "备注": "如果某个\"校内岗位\"的工时和酬金明显超出上面的范围，先确认它是不是走了正规勤工助学渠道，别被挂在学校名义下的私人用工套住。"}, "extra": []}, {"n": 3, "title": "刷单返利：一切的\"做任务返钱\"都是诈骗", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，但一次可能被骗几千到几万元。", "说人话": "刷单诈骗的剧本几乎固定：先给你几十元小佣金建立信任，再让你做\"大额任务\"垫资，然后以\"系统卡单\"\"操作错误\"为由要你继续转账，直到你自己反应过来。学生是重点目标，真实案例里一次被骗 4000 元到 4 万余元的都有，钱基本追不回来。", "收益": "公安机关通报的典型手法是：在高校兼职群、社交平台投放\"高薪零门槛\"广告，用首单小额返现（50 到 300 元）制造正反馈，再逐步加大任务金额，最后以\"卡单\"\"系统故障\"拒绝提现，要求缴纳\"解冻金\"\"保证金\"。警方提示：任何要求垫付资金、购买虚拟物品或转账才能获得佣金、返利的，都是诈骗；被骗后应立即停止转账、保留聊天与转账记录，拨打 110 或全国反诈专线 96110。", "证据等级": "B", "来源": "公安部与各地公安机关反诈宣传；新华社关于暑期学生刷单诈骗的报道。", "备注": "一句话记住就够——兼职不会让你先垫钱。凡是\"先转钱、再返现\"的，无论话术多顺，都是诈骗。"}, "extra": []}, {"n": 4, "title": "出租、出借银行卡和电话卡：可能构成帮助信息网络犯罪活动罪", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，代价可能是刑事责任。", "说人话": "\"借你的银行卡收一笔钱，给你几百块\"\"用你的卡走个流水\"——这是电信网络诈骗洗钱链条里最常见的一环。卡一旦被用作涉案收款，卡主往往是第一个被查的人。这类犯罪在年轻人中高发，判决书里经常出现\"我以为只是帮朋友一个忙\"这种辩解，但法律不认这个理由。", "收益": "《中华人民共和国刑法》第二百八十七条之二规定：明知他人利用信息网络实施犯罪，为其犯罪提供互联网接入、服务器托管、通讯传输等技术支持，或者提供广告推广、支付结算等帮助，情节严重的，处三年以下有期徒刑或者拘役，并处或者单处罚金。出租、出借、出售银行卡、支付账户、电话卡，为他人转移涉案资金提供帮助，可能构成该罪。", "证据等级": "A", "来源": "《中华人民共和国刑法》第二百八十七条之二（帮助信息网络犯罪活动罪）。<https://flk.npc.gov.cn/>", "备注": "出借的银行卡通常还会被金融惩戒数年不能正常使用，直接影响工资发放和日常支付。为几百块赔上一个案底和几年不便，怎么算都不划算。"}, "extra": []}, {"n": 5, "title": "帮人代收款、跑分：可能构成掩饰、隐瞒犯罪所得罪", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，代价可能是刑事责任。", "说人话": "\"帮忙代收一笔钱给你 5% 提成\"\"帮我转账、我付你手续费\"，听着像轻松的兼职，实际是在替诈骗团伙洗钱。除了可能构成帮助信息网络犯罪活动罪，如果明知是犯罪所得而代为转移、窝藏，还可能构成掩饰、隐瞒犯罪所得罪。提成越高，越说明这钱来路不正。", "收益": "《中华人民共和国刑法》第三百一十二条规定：明知是犯罪所得及其产生的收益而予以窝藏、转移、收购、代为销售或者以其他方法掩饰、隐瞒的，处三年以下有期徒刑、拘役或者管制，并处或者单处罚金；情节严重的，处三年以上七年以下有期徒刑，并处罚金。", "证据等级": "A", "来源": "《中华人民共和国刑法》第三百一十二条（掩饰、隐瞒犯罪所得、犯罪所得收益罪）；第二百八十七条之二。<https://flk.npc.gov.cn/>", "备注": "\"只是走个账\"\"只是帮忙收一下\"是最常出现在判决书里的开场白。任何按流水比例给你提成的\"收款活\"，直接拒绝。"}, "extra": []}, {"n": 6, "title": "校园代理、拉人头、发展下线：这可能是传销", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，但可能赔上人际关系的全部风险。", "说人话": "判断标准很简单：赚钱靠\"卖东西\"还是靠\"拉人\"。如果收益主要来自发展下线的入门费，而不是真实商品的销售，那基本就是传销。校园里常见的形式是\"刷单兼职\"\"微商代理\"\"校园合伙人\"\"内部推荐返利\"，特点是先让你交钱或囤货，再让你拉同学进来。", "收益": "《禁止传销条例》规定，以发展人员数量作为计酬或返利依据、要求参加者缴纳费用或购买商品等方式获得加入资格的，可以认定为传销；《中华人民共和国刑法》第二百二十四条之一规定，组织、领导以推销商品、提供服务等经营活动为名，要求参加者缴纳费用或购买商品获得加入资格，并按一定顺序组成层级、直接或间接以发展人员数量作为计酬或返利依据，骗取财物、扰乱经济社会秩序的传销活动的，处五年以下有期徒刑或者拘役，并处罚金；情节严重的，处五年以上有期徒刑，并处罚金。", "证据等级": "B", "来源": "《禁止传销条例》；《中华人民共和国刑法》第二百二十四条之一（组织、领导传销活动罪）。<https://flk.npc.gov.cn/>", "备注": "有一个隐性代价常被忽略：这类事最先消耗的是同学和朋友的信任，钱赔了还能再挣，关系赔了很难复原。"}, "extra": []}, {"n": 7, "title": "冒充客服退款、注销校园贷：两类最常见的定向诈骗", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，但可能一次损失全部积蓄。", "说人话": "有两类专门针对学生的诈骗话术：一是\"你在平台的贷款额度要注销，否则影响征信\"，诱导你去各平台借款再转给对方；二是\"你买的商品有质量问题，我们给你退款\"，然后让你下载屏幕共享软件、输入验证码，把卡里的钱转走。共同点是都在电话里制造\"不马上处理就出大事\"的紧迫感。", "收益": "公安机关反诈部门明确，\"注销校园贷\"\"影响征信\"\"退款理赔\"是常见诈骗话术，正规金融机构和电商平台不会要求用户通过借款、转账或开启屏幕共享来处理所谓\"账户问题\"。接到此类电话应直接挂断，通过官方 App 或官方客服自行核实；被骗后立即拨打 110 或 96110。", "证据等级": "B", "来源": "公安部与各地公安机关反诈宣传；中国银保监会等五部门 (2021). 关于进一步规范大学生互联网消费贷款监督管理工作的通知（校园贷风险提示）。", "备注": "两个动作能挡掉大部分：不开启屏幕共享、不把验证码给任何人。真正的客服不会让你先借钱再还款。"}, "extra": []}, {"n": 8, "title": "培训贷、押金、入职费：正规单位不会向求职者收钱", "tag": {"money": "中", "time": "少", "will": "否", "gain": "大", "scope": "金钱"}, "fields": {"成本": "可能先垫几千到上万元。", "说人话": "正规用人单位不会向求职者收钱。凡是入职前要交\"押金\"\"服装费\"\"体检费\"\"培训费\"的，或者让你先贷款参加\"岗前培训、包就业\"的，都是坑。培训贷尤其恶劣：你签的是一份贷款合同，培训质量完全没保障，课没上完就背上了债。", "收益": "《中华人民共和国劳动合同法》第九条规定：用人单位招用劳动者，不得扣押劳动者的居民身份证和其他证件，不得要求劳动者提供担保或者以其他名义向劳动者收取财物。培训机构以\"包就业\"\"先培训后上岗\"为名，诱导学员办理分期贷款缴纳培训费的，属于典型的培训贷套路，学员往往在未获得相应服务的情况下即背负债务。", "证据等级": "B", "来源": "《中华人民共和国劳动合同法》第九条。<https://flk.npc.gov.cn/>", "备注": "判断法：任何\"先让你出钱\"的岗位都不要去。真缺人、真给钱的岗位，流程里不会有让你掏钱的环节。"}, "extra": []}, {"n": 9, "title": "家教：最稳的学生兼职，但要管好安全和收款", "tag": {"money": "0", "time": "中", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱，花的是通勤和备课时间。", "说人话": "家教是学生兼职里性价比比较高的一种：单价远高于校内勤工，时间灵活，不用垫钱，还能把学科知识再梳理一遍。风险主要在安全和收款两头：第一次上门前一定把地址、时间、对方联系方式告诉室友或家人；费用按次结，最好是上完即结或者先结后上，别拖成\"月底一起算\"。", "收益": "家教属于校外勤工助学或个人劳务，酬金由双方协商；按《高等学校学生勤工助学管理办法（2018 年修订）》，校外勤工助学酬金不应低于当地最低工资标准。建议通过学校勤工助学组织或正规家教平台介绍，避免私下接单带来的安全与纠纷风险。", "证据等级": "C", "来源": "教育部、财政部 (2018). 高等学校学生勤工助学管理办法（2018 年修订）相关要求；家教市场通行做法。", "备注": "个人劳务收入同样可能涉及个人所得税，通过正规平台结算的一般会代扣。务必确认辅导对象是学生本人且家长知情，避免卷入代写作业、代考等违规行为。"}, "extra": []}, {"n": 10, "title": "实习协议、三方协议、劳动合同：三种文件三种效力", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，花十分钟读懂条款。", "说人话": "找工作时会碰到三种不同的文件：实习协议管\"你在校期间去公司干活\"；三方协议（就业协议书）管\"你毕业后要去这家公司\"；劳动合同管\"你已经正式入职了\"。三者效力不同，最容易被忽略的是三方协议里的违约金条款——签之前一定把那一行看清楚。", "收益": "三方协议（就业协议书）是毕业生、学校、用人单位三方签订的就业意向协议，通常约定违约责任。自 2023 年起，不再发放《全国普通高等学校毕业生就业报到证》《全国毕业研究生就业报到证》，用人单位可凭劳动合同、就业协议书（含网签协议）或学历证书为毕业生办理报到入职手续，毕业生通过全国高校毕业生毕业去向登记系统完成去向登记。", "证据等级": "A", "来源": "中共中央组织部、人力资源社会保障部、教育部、公安部、国务院国资委 (2023). 关于做好取消普通高等学校毕业生就业报到证有关衔接工作的通知。<https://www.mohrss.gov.cn/SYrlzyhshbzb/jiuye/zcwj/202305/t20230512_499929.html>", "备注": "三方协议违约金一般设有上限（常见为一个月工资或一个固定金额），签字前问清楚。网签之后想毁约，要走正规解约流程，别直接失联——失联可能被记入诚信记录。"}, "extra": []}, {"n": 11, "title": "实习期不等于试用期：混淆了会在权益上吃暗亏", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，但要分清概念。", "说人话": "实习和试用是两回事。在校生去企业实习，一般签实习协议，法律上通常不构成正式劳动关系；试用期则是正式建立劳动关系之后的一个考察阶段，受《劳动合同法》约束，有期限上限、有工资下限、要缴社保。把\"实习\"当成\"试用\"，很可能在权益上吃暗亏。", "收益": "《中华人民共和国劳动合同法》第十九条规定：劳动合同期限三个月以上不满一年的，试用期不得超过一个月；一年以上不满三年的，试用期不得超过二个月；三年以上固定期限和无固定期限的劳动合同，试用期不得超过六个月；同一用人单位与同一劳动者只能约定一次试用期。试用期包含在劳动合同期限内，用人单位应当依法为劳动者缴纳社会保险。", "证据等级": "A", "来源": "《中华人民共和国劳动合同法》第十九条、第二十条。<https://flk.npc.gov.cn/>", "备注": "实习期间企业通常只购买意外伤害保险、不缴社保；正式入职后，用人单位应自用工之日起一个月内签订书面劳动合同。谈的时候把\"是实习还是试用\"\"有没有社保\"问清楚。"}, "extra": []}, {"n": 12, "title": "实习报酬的个税：预扣 20%—40%，但年度汇算往往能退", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "实习报酬和正式工资在税务上不是一回事。实习生拿到的报酬通常按\"劳务报酬所得\"计税，预扣税率分 20%、30%、40% 三档，看着很高；但到次年办年度汇算时，这笔收入会和你的其他综合所得合并重新计算，多扣的部分往往能退回来。别看到预扣 20% 就以为被吞了。", "收益": "按《中华人民共和国个人所得税法》，劳务报酬所得以收入减除费用后的余额为收入额，适用 20% 至 40% 的超额累进预扣率；年度终了后并入综合所得进行汇算清缴，多退少补。学生实习取得的劳务报酬同样需要依法申报，年度汇算可通过个人所得税 App 办理。", "证据等级": "B", "来源": "《中华人民共和国个人所得税法》及其实施条例；国家税务总局关于个人所得税综合所得汇算清缴的规定。<https://www.chinatax.gov.cn/>", "备注": "签实习协议时把\"税前还是税后\"\"怎么发\"写清楚。次年 3 到 6 月记得做汇算，很多学生就是这样意外退回一笔钱。"}, "extra": []}, {"n": 13, "title": "给境外公司远程干活：先弄清收款和税务", "tag": {"money": "0", "time": "中", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱，但要处理收款和税务。", "说人话": "给境外公司远程干活，到手的钱会被平台抽成、汇率、转账手续费吃掉一部分，别只看\"时薪多少美元\"。同时这笔收入属于应税所得，需要依法申报；跨境收汇还要遵守外汇管理规定，个人每年有等值 5 万美元的便利化额度。金额大或者长期做，最好提前把税务和收款路径理清楚。", "收益": "按现行个人外汇管理规定，个人结汇和境内个人购汇实行年度总额管理，年度总额分别为每人每年等值 5 万美元，在额度内凭本人有效身份证件在银行办理；个人为境外单位提供劳务取得的所得，属于个人所得税应税所得，应依法申报纳税。", "证据等级": "B", "来源": "国家外汇管理局《个人外汇管理办法》及其实施细则；《中华人民共和国个人所得税法》。<https://www.safe.gov.cn/>", "备注": "金额不大时通常由平台代扣，长期做要咨询专业人士。同时警惕\"刷单式\"的境外兼职骗局，凡是要求你先垫资、先买设备、先交保证金的，都是诈骗。"}, "extra": []}, {"n": 14, "title": "简历和作品集：写\"证据\"而不是写\"自传\"", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，花的是整理时间。", "说人话": "简历不是自传，是\"证据清单\"。每一条经历都尽量写成\"动词 + 具体事 + 可量化结果\"，比如\"独立完成 12 个门店的销售数据整理，输出周报模板并被团队沿用\"，而不是\"协助部门日常工作\"。作品集同理，把项目、代码、设计稿、文章整理成一个能点开的链接，比一堆形容词有说服力。", "收益": "招聘实践中的通行标准是：可量化的具体成果比笼统的职责描述更容易通过简历筛选；技术、设计、内容类岗位通常要求提供作品集或项目链接。用人单位在校招中普遍进行学历和经历核实，所以简历内容必须真实可查。", "证据等级": "C", "来源": "招聘与简历评估的通行做法。", "备注": "宁可写\"自主完成的一个小项目\"，也不要编造实习经历。背景调查一问就穿帮，代价是 offer 撤销甚至诚信记录。"}, "extra": []}, {"n": 15, "title": "选实习的标准：能不能写成简历上一行具体的字", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "同样两个月，一份实习让你写出\"独立完成 XX 报表，覆盖 12 个门店的销售数据\"，另一份只能写出\"协助部门日常工作\"。选实习时先问三个问题：我会做什么具体的事、能拿到什么可展示的产出、带我的主管愿不愿意给我写推荐信或配合背调。名字响但只能打杂的实习，价值低于小公司但有具体产出的岗位。", "收益": "简历筛选与面试评估中，可迁移技能（工具使用、业务流程、协作方式）、行业认知和推荐人背书，是实习留给学生的核心资产；实习转正是应届生进入企业的常见路径之一。", "证据等级": "C", "来源": "校园招聘与实习指导的通行做法。", "备注": "实习前问清楚\"能写进简历的产出是什么\"，比问\"公司大不大\"更重要。一份能讲出细节的实习，面试时能撑起十分钟。"}, "extra": []}, {"n": 16, "title": "实习时间线：大二暑期开始，大三暑期最关键", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，花的是寒暑假。", "说人话": "一般节奏是：大一大二在学校里做小项目、参加竞赛；大二升大三的暑期做第一份实习，哪怕公司不大；大三升大四的暑期做一份\"能争取留用\"的实习。大三暑期那份实习，直接决定你秋招时有没有能讲出来的经历，也是最该提前半年就开始投简历的一份。", "收益": "秋季校园招聘（秋招）一般集中在毕业前一年的 9 至 11 月，春季招聘（春招）在次年 3 至 4 月；多数企业在校招中要求或倾向于有实习经历的候选人，实习转正是应届生进入企业的常见路径之一。", "证据等级": "C", "来源": "校园招聘通行时间安排与企业招聘实践（属通行做法）。", "备注": "没有实习经历也能找到工作，但选择会少很多，而且第一份工作的质量会影响后面几年的起点。大三暑假才开始投，往往已经晚了。"}, "extra": []}, {"n": 17, "title": "\"买实习\"\"买内推\"\"实习证明代开\"：简历造假会反噬", "tag": {"money": "中", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "几百到上万元。", "说人话": "花几千块买一份\"远程实习证明\"，背调一问就穿帮。更严重的后果是：一旦被认定为简历造假，offer 撤销、行业口碑受损，甚至触及学历与诚信记录。所谓\"付费内推\"\"保 offer\"，正规公司基本不认，真出事时中介早跑了，损失只能自己扛。", "收益": "用人单位在校招中普遍进行背景调查（学历、成绩、实习经历核实）。伪造实习经历属于简历造假，可能导致录用撤销；伪造学历学位信息还可能触及《中华人民共和国学位法》关于以不正当手段取得入学资格或毕业证书的规定及诚信记录制度。", "证据等级": "B", "来源": "全国人大常委会 (2024). 中华人民共和国学位法（第三十七条）；招聘背景调查通行做法。<https://www.moe.gov.cn/>", "备注": "宁可写\"自主完成的一个小项目\"，也别写假的实习经历。真实的、哪怕很小的项目，也比买来的证明经得起追问。"}, "extra": []}, {"n": 18, "title": "实习期间的保密与竞业：别把公司资料拷回家", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "实习协议里通常有保密条款。把公司的代码、客户名单、内部文档拷到个人电脑或网盘，可能构成侵犯商业秘密，严重的要负刑事责任。离职时把工作交接清楚，别顺手带走\"自己写的东西\"——只要是在职务范围内形成的成果，归属往往不由你说。", "收益": "侵犯商业秘密可能承担民事赔偿责任，情节严重的可能构成侵犯商业秘密罪。竞业限制是指离职后一定期限内不得到与原单位有竞争关系的单位任职，期限最长不超过两年，期间用人单位应按月支付经济补偿；实习协议一般约定保密义务，但较少设置竞业限制。", "证据等级": "B", "来源": "《中华人民共和国反不正当竞争法》关于商业秘密的规定；《中华人民共和国刑法》第二百一十九条（侵犯商业秘密罪）；《中华人民共和国劳动合同法》关于竞业限制的规定。<https://flk.npc.gov.cn/>", "备注": "技术、算法、内容类岗位尤其要注意：离职带走源码、客户资料、训练数据，都可能踩线。交接时留一份交接清单并双方签字。"}, "extra": []}, {"n": 19, "title": "时间与绩点的取舍：别用低时薪换掉高加权学分", "tag": {"money": "0", "time": "多", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "花的是时间，要自己权衡。", "说人话": "兼职和实习最大的隐性成本是时间，而绩点、保研资格、奖学金是有硬门槛的。大一大二把大量时间投在低时薪兼职上，很可能换来的是排名下滑，后面用再多兼职收入也补不回来。合理的做法是先把课业稳住，再用空出来的时间做和方向相关的兼职或实习。", "收益": "多数高校的保研（推免）资格按前几学期成绩排名确定，且对\"无不及格课程\"\"外语达标\"有硬性要求；在学分加权平均下，大一大二的学分密度高，对总绩点影响最大。国家奖学金、国家励志奖学金和多数校级奖学金也大多以学年成绩为前提。", "证据等级": "C", "来源": "教育部 (2017). 普通高等学校学生管理规定（考核与成绩记载）；各高校推免工作办法与评奖办法（通行做法）。", "备注": "判断法：先算清楚\"这份兼职每周占几小时、会不会影响期末\"，再决定接不接。用低时薪换掉高加权学分，通常是亏的。"}, "extra": []}, {"n": 20, "title": "内容创作与自媒体：签约前先看清四件事", "tag": {"money": "0", "time": "多", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱，花的是持续投入。", "说人话": "做内容、拍视频、写公众号是能变成收入的，但前期很长一段时间是零收入，而且平台、MCN 的合同里常埋着坑：独家绑定、作品版权归对方、违约金极高、收益分配模糊。签之前把\"账号归属、版权、解约条件、违约金\"四项看清楚，宁愿不签也别签死。", "收益": "自媒体收益主要来自平台分成、广告、带货和知识付费，变现周期长且不稳定。签约 MCN 或平台时，合同常约定独家合作、内容所有权归属、账号控制权和违约金，部分格式条款可能显著加重创作者责任。签约前应逐条确认关键条款。", "证据等级": "C", "来源": "内容创作与 MCN 签约的通行做法与公开报道。", "备注": "别信\"先交钱加入、包涨粉包变现\"的机构，这类绝大多数是骗局。真正的变现靠内容和粉丝，而不是靠交学费。"}, "extra": []}, {"n": 21, "title": "代注册公司、挂名当法人：这不是兼职，是背风险", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，代价可能是无限风险。", "说人话": "\"用你的身份证帮我注册个公司，当个法人，给你几千块\"\"帮我挂个股东名，什么都不用做\"——这种活千万别接。公司的债务、税务、涉诉责任是跟着公司和法定代表人走的，一旦对方跑路或者公司涉案，背锅的是你，还会影响你未来的就业、贷款甚至考研政审。", "收益": "按《中华人民共和国公司法》及相关规定，法定代表人和股东需依法对公司行为承担相应责任；公司欠税、欠债、涉诉，法定代表人和股东可能被限制高消费、纳入失信名单。为他人代持股份、挂名法定代表人，若公司从事违法活动，挂名人可能被追究相应责任。", "证据等级": "B", "来源": "《中华人民共和国公司法》关于股东与法定代表人责任的规定；市场监管与失信惩戒相关制度。<https://flk.npc.gov.cn/>", "备注": "判断法：任何\"你不用干活、只用出个身份就能拿钱\"的机会，背后一定有人想用你的身份承担风险。身份证、银行卡、电话卡、人脸认证，一律不外借。"}, "extra": []}, {"n": 22, "title": "收费内推、虚假招聘与\"黑中介\"", "tag": {"money": "中", "time": "少", "will": "否", "gain": "大", "scope": "金钱"}, "fields": {"成本": "可能先交几百到几千。", "说人话": "正规企业的招聘不向求职者收费。\"交钱保过面试\"\"付费直通大厂\"\"内部名额有限，先交定金\"这类，绝大多数是黑中介或者骗局。还有一种更隐蔽的：用高薪诱饵骗你入职，实际是让你做电销、刷单甚至跑分，等发现不对时已经陷进去了。", "收益": "《人力资源市场暂行条例》规定，经营性人力资源服务机构从事职业中介活动应当取得人力资源服务许可，不得以欺诈、暴力、胁迫等方式从事职业中介活动，不得向个人收取押金等费用。求职者遇到虚假招聘、收费内推，可向人力资源社会保障部门投诉举报。", "证据等级": "B", "来源": "《人力资源市场暂行条例》（国务院令第 700 号）；人力资源社会保障部求职防骗提示。<https://www.mohrss.gov.cn/>", "备注": "入职前查一下公司工商信息，确认它真实存在、经营范围对得上。岗位描述模糊、面试极其简单、\"高薪零门槛\"的，基本都要警惕。"}, "extra": []}, {"n": 23, "title": "校招 offer 与违约：签字前把三项问清楚", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，但要读懂条款。", "说人话": "拿到 offer、签了三方协议之后想反悔，是要按约定承担违约责任的。有些公司还会在 offer 或补充协议里约定\"签约后不去要赔 X 万\"，签字之前一定看清楚。反过来说，公司违法解除或者不按约定录用你，你同样有依据主张权利，关键是保留好书面材料。", "收益": "三方协议（就业协议书）通常约定违约金，常见做法是约定为一个月工资或一个固定金额并设上限。自 2023 年起就业报到证取消后，用人单位可凭劳动合同、就业协议书或学历证书办理报到入职，毕业生通过全国高校毕业生毕业去向登记系统完成去向登记；毁约要走正规解约流程。", "证据等级": "B", "来源": "中共中央组织部等五部门 (2023). 关于做好取消普通高等学校毕业生就业报到证有关衔接工作的通知；就业协议违约责任的通行约定。<https://www.mohrss.gov.cn/SYrlzyhshbzb/jiuye/zcwj/202305/t20230512_499929.html>", "备注": "签约前把\"违约金、服务期、户口与档案去向\"三项问清楚。不要为了一个 offer 草率签署多份协议，最后解约成本会叠加。"}, "extra": []}, {"n": 24, "title": "一张\"接不接这份活\"的五条清单", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱。", "说人话": "把这一节压成一张判断清单：① 有没有正规主体和书面协议；② 要不要先垫钱、先交钱（要就先拒）；③ 是不是让我出借身份证、银行卡、电话卡或者当法人（是就先拒）；④ 会不会占用大量上课和期末时间；⑤ 有没有能写进简历的产出。五条里只要有一条踩雷，就果断放弃。", "收益": "这份清单对应的是前面各条的硬规则：勤工助学须有协议与工时上限、任何要求垫资或出借\"两卡\"的兼职都可能涉诈涉罪、兼职时间会挤占绩点、可量化的产出才是简历资产。把这五条当成筛选标准，能挡掉绝大多数坑。", "证据等级": "C", "来源": "本节的汇总（依据见第 1 至 23 条各自的来源；属操作清单，非文献结论）。", "备注": "最后一步永远是\"先核实再答应\"。多花十分钟问清主体、协议和付款方式，比事后维权省事得多。"}, "extra": []}]}, {"file": "11-钱消费与征信.md", "title": "11. 钱、消费与征信：学生最容易踩的几个坑", "entries": [{"n": 1, "title": "记一个月的账，你会找到吃掉生活费的那 20%", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱，每天花一分钟记。", "说人话": "大多数人的超支其实集中在少数几项：外卖、奶茶咖啡、游戏充值、网购凑单、周末聚餐。记一个月账，把金额从高到低排一遍，找到排在前两名的砍掉，一个月往往能省下几百元。别一上来就全面节衣缩食，那样通常坚持不过两周，先在最大的一两个口子上动手。", "收益": "个人预算管理的基本方法是记录支出、按类别汇总、识别高占比项并做取舍；微信、支付宝的月度账单本身就提供自动分类，不需要额外工具。常见的入门框架是 50-30-20（必要支出 50%、想要 30%、储蓄 20%），可作参考，但学生阶段收入不固定，比例需要自己调整。", "证据等级": "C", "来源": "个人财务管理通行方法（50-30-20 属常见经验框架，无权威原文）。", "备注": "第一个月先只记录、不评价，第二个月再动手砍。记录本身就是约束——很多人记着记着就少点了几次外卖。"}, "extra": []}, {"n": 2, "title": "分期和\"低息\"：先把年化利率算出来再说", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，五分钟。", "说人话": "\"每月 88 元，分 12 期\"听起来一点不贵，但它把真实利率藏起来了。因为每一期都在还本金，你实际占用资金的时间远短于一年，所以名义手续费率的 1.8 到 2 倍才是真实年化。同一笔 12 期、名义手续费率 7% 的分期，真实年化往往在 13% 以上。要比，就把所有人都换算成年化利率。", "收益": "消费分期的\"手续费率\"通常按初始本金计算，实际年化利率约等于名义手续费率的 1.8 至 2 倍（期数越多越接近 2 倍）；监管部门要求金融机构以明显方式向借款人明示年化利率。判断划算与否，应在同一口径（年化利率）下比较。", "证据等级": "B", "来源": "金融消费者权益保护关于明示年化利率的通行要求；分期真实利率的通行测算方法。", "备注": "判断法：凡是把\"月供多少\"当卖点、而不肯直接告诉你\"年化多少\"的，基本都不便宜。分期购物的到手价和一次性付款价，也要放在一起比。"}, "extra": []}, {"n": 3, "title": "信用卡分期、最低还款、取现：三条收费最高的路", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，五分钟。", "说人话": "信用卡分期、最低还款、取现是三条收费最高的路。最低还款从消费入账日起就按日息万分之五计息、按月复利，年化接近 18%；取现通常还有手续费，并从取现当天起算利息。分期\"免息\"往往只是把利息改叫手续费。这三样应急可以，长期当常规操作就是给银行打工。", "收益": "信用卡最低还款额一般为消费金额的 10%，未还部分自记账日起按日利率万分之五计收利息，并按月计收复利，折算年化超过 18%；取现通常收取手续费并按日计息。信用卡分期业务多以\"手续费\"名义按月收取，折算年化同样显著高于名义费率。", "证据等级": "B", "来源": "《银行卡业务管理办法》与商业银行信用卡领用合约的通行条款；金融消费者权益保护宣传。", "备注": "记住一个数：日息万分之五约等于年化 18%。任何按日计息的产品，先用这个数把年化估出来，再看值不值得。"}, "extra": []}, {"n": 4, "title": "逾期的红线叫\"连三累六\"，它只看准不准时", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "征信里有一条行业内的红线叫\"连三累六\"：连续 3 个月逾期，或者两年内累计 6 次逾期。踩到这条线，申请房贷、车贷、信用卡往往直接被拒，或者被要求更高利率、更多首付。它不看你欠多少钱，只看你还不还、准不准时，所以哪怕几十块的小额逾期也一样伤。", "收益": "个人信用报告如实记录信贷还款情况，\"连三累六\"是商业银行信贷审批中常见的负面参考指标。根据《征信业管理条例》，征信机构对个人不良信息的保存期限自不良行为或者事件终止之日起为 5 年，超过 5 年应当删除。", "证据等级": "B", "来源": "《征信业管理条例》（国务院令第 631 号）；商业银行信贷审批的通行做法。", "备注": "最容易中招的是\"忘了还\"而不是\"还不起\"：设置自动还款、还款日提前两三天提醒，能挡掉绝大多数非主观逾期。"}, "extra": []}, {"n": 5, "title": "个人征信报告每年免费查两次：确认没有多出来的账户", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "个人信用报告由中国人民银行征信中心出具，记录你的贷款、信用卡和还款情况。每年可以免费查询两次本人信用报告，线上通过征信中心官网或银行 App 就能查简版。建议在校期间至少查一次，确认没有莫名多出来的贷款账户；毕业前再查一次，把该解决的问题在校内解决掉。", "收益": "中国人民银行征信中心提供个人信用报告查询服务，个人每年可免费查询 2 次本人信用报告；线上查询一般可获取简版报告，详版可到人民银行分支机构或授权网点查询。信用报告是金融机构信贷审批的重要依据。", "证据等级": "A", "来源": "中国人民银行征信中心（个人信用报告查询服务）。<https://www.pbccrc.org.cn/>", "备注": "辨认真假：征信报告只有央行征信中心这一个官方出口，任何\"付费查征信\"\"帮你消除不良记录\"的 App 或中介都是假的。查询一定从官方网址或银行官方 App 进。"}, "extra": []}, {"n": 6, "title": "不良信息保存 5 年，从\"终止之日\"起算", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "不良信息不是\"跟一辈子\"，也不是\"花钱就能消\"。按条例，它自不良行为或事件终止之日起保存 5 年，超过 5 年应当删除。关键在于\"终止之日\"怎么算：钱没还完，计时还没开始；还清了才开始算 5 年。所以最快的\"修复\"办法，就是把欠款还清。", "收益": "《征信业管理条例》第十六条规定：征信机构对个人不良信息的保存期限，自不良行为或者事件终止之日起为 5 年；超过 5 年的，应当予以删除。任何机构和个人无权擅自修改、删除真实准确的信用记录，声称\"花钱修复征信\"\"洗白征信\"的均为骗局。", "证据等级": "A", "来源": "《征信业管理条例》（国务院令第 631 号）；中国人民银行征信中心。<https://www.pbccrc.org.cn/>", "备注": "征信没有\"修复\"业务，只有\"异议处理\"：发现记录有误，可向征信中心或放贷机构提出异议申请，由机构核查更正。这和\"花钱洗白\"是两回事。"}, "extra": []}, {"n": 7, "title": "校园贷、套路贷：先把\"真实利率\"和\"催收手段\"看清", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "金钱"}, "fields": {"成本": "本金可能翻好几倍。", "说人话": "校园贷、套路贷的典型特征是：门槛极低、放款极快、利率极高，再用\"砍头息\"\"服务费\"\"逾期费\"把债务滚大。一旦还不上，就出现骚扰通讯录、恐吓、逼迫签新借条等暴力催收。这类借贷里很多条款本身就不受法律保护，但催收带来的精神压力是真实的。", "收益": "民间借贷利率受司法保护上限约束，超过合同成立时一年期 LPR 四倍的部分不受法律保护；以\"砍头息\"\"服务费\"等名义预扣本金、虚增债务的，实际利率远超表面利率。遭遇暴力催收（骚扰通讯录、恐吓、非法拘禁等）应当报警，公安机关依法打击针对学生的套路贷与暴力催收。", "证据等级": "B", "来源": "最高人民法院关于审理民间借贷案件适用法律若干问题的规定；公安机关关于打击套路贷、暴力催收的宣传。", "备注": "判断法：正当的金融产品不会用\"骚扰家人和朋友\"来催收。遇到威胁，第一时间报警并保留证据，别自己去\"拆东墙补西墙\"。"}, "extra": []}, {"n": 8, "title": "国家明令禁止小贷公司给大学生放互联网消费贷", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "2021 年起，小额贷款公司不得把大学生作为互联网消费贷款的目标客户，不得针对大学生精准营销，也不得向大学生发放互联网消费贷款。也就是说，你现在在手机上刷到的\"学生可借、秒到账、无抵押\"的贷款广告，本身就是违规甚至非法的。这一条是识别黑网贷最省事的标尺。", "收益": "中国银保监会办公厅、中央网信办秘书局、教育部办公厅、公安部办公厅、中国人民银行办公厅《关于进一步规范大学生互联网消费贷款监督管理工作的通知》（2021 年）规定：小额贷款公司不得将大学生设定为互联网消费贷款的目标客户群体，不得针对大学生群体精准营销，不得向大学生发放互联网消费贷款；未经银行业监督管理部门或地方金融监督管理部门批准设立的机构，不得为大学生提供信贷服务。", "证据等级": "A", "来源": "中国银保监会等五部门 (2021). 关于进一步规范大学生互联网消费贷款监督管理工作的通知。<https://www.gov.cn/zhengce/zhengceku/2021-03/17/content_5593569.htm>", "备注": "银行在风险可控、落实第二还款来源（如父母）的前提下，可以提供小额、短期的消费信贷。查不到放贷牌照的机构，就是非法的，别碰。"}, "extra": []}, {"n": 9, "title": "已经借了怎么办：别以贷养贷，先做三件事", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，但要面对。", "说人话": "如果已经陷进网贷，先做三件事：① 立刻停止再借，以贷养贷只会让雪球越滚越大；② 把所有欠款列成一张表，写清平台、本金、利率、还款日；③ 告诉家人或辅导员，别一个人扛。学校对陷入网贷的学生有专门帮扶机制，也有心理辅导，越早说越好处理。", "收益": "五部门通知要求高校\"对于已经陷入网贷泥淖的大学生，建立专项机制，指导他们通过理智有效的方式解决所欠网贷问题，加强心理干预辅导\"。遭遇暴力催收可报警；对超过司法保护上限的利息，可以通过协商或诉讼主张不予支付超出部分。", "证据等级": "A", "来源": "中国银保监会等五部门 (2021). 关于进一步规范大学生互联网消费贷款监督管理工作的通知。<https://www.gov.cn/zhengce/zhengceku/2021-03/17/content_5593569.htm>", "备注": "越早说越好，是这一条最重要的一句。很多学生扛到催收打给全家、打给学校才开口，那时候债务和心理压力都已经大得多。"}, "extra": []}, {"n": 10, "title": "校园里的\"投资\"\"虚拟币\"\"区块链\"：学生是最容易被割的一层", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "金钱"}, "fields": {"成本": "本金可能全部损失。", "说人话": "以\"校园大使\"\"内部额度\"\"稳赚不赔\"\"推荐返佣\"为卖点的投资类项目，不管包装成虚拟币、外汇、原始股还是\"AI 量化\"，本质都是拉人入局。我国明确禁止虚拟货币相关的非法金融活动，参与虚拟货币投资交易的风险由个人自行承担，出问题很难追回，也不受法律保护。", "收益": "中国人民银行等部门《关于进一步防范和处置虚拟货币交易炒作风险的通知》（2021 年）明确：虚拟货币相关业务活动属于非法金融活动；参与虚拟货币投资交易活动存在法律风险，其民事法律行为无效，产生的损失由个人自行承担。组织者以高回报为诱饵吸收公众资金，可能构成非法吸收公众存款罪或集资诈骗罪。", "证据等级": "A", "来源": "中国人民银行等十部门 (2021). 关于进一步防范和处置虚拟货币交易炒作风险的通知。<http://www.pbc.gov.cn/>", "备注": "判断法：任何人拉你入局、并按你拉的人头给你分成，无论讲得多专业、多\"高科技\"，都是传销结构。承诺\"稳赚不赔\"的，没有例外。"}, "extra": []}, {"n": 11, "title": "帮人收款、出租银行卡和电话卡：可能构成帮信罪", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，代价可能是刑事责任。", "说人话": "\"借你的卡收笔钱，给你几百块\"\"帮我在平台走个流水\"——这是电诈洗钱链条里最常见的一环。卡一旦被用作涉案收款，卡主是第一个被查的人。出租、出借、出售银行卡、支付账户、手机卡，或者为他人转移涉案资金提供帮助，都可能构成帮助信息网络犯罪活动罪。", "收益": "《中华人民共和国刑法》第二百八十七条之二规定：明知他人利用信息网络实施犯罪，为其犯罪提供技术支持或者提供广告推广、支付结算等帮助，情节严重的，处三年以下有期徒刑或者拘役，并处或者单处罚金。涉案的银行卡通常还会被金融惩戒数年不能正常使用。", "证据等级": "A", "来源": "《中华人民共和国刑法》第二百八十七条之二（帮助信息网络犯罪活动罪）。<https://flk.npc.gov.cn/>", "备注": "判决书里最常出现的一句话是\"我以为只是帮朋友一个忙\"。为几百块赔上一个案底和几年不便，怎么算都不划算。"}, "extra": []}, {"n": 12, "title": "电信诈骗的话术与\"三不一多\"", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "电信网络诈骗的话术看着五花八门，类型其实就那么几类：刷单返利、虚假投资理财、虚假贷款、冒充电商客服退款、冒充公检法、冒充熟人或领导、杀猪盘。防的原则可以概括成\"三不一多\"：不轻信、不透露、不转账，多核实。任何要你转账、要验证码、要屏幕共享的，先停下来挂断再说。", "收益": "反诈宣传的通行提示是\"不轻信、不透露、不转账，多核实\"。公安机关提示，遇可疑情况可拨打全国反诈专线 96110 咨询，被骗后立即拨打 110 报警并保留聊天、转账记录。冒充公检法类诈骗中，真正的司法机关不会通过电话、聊天软件要求转账到\"安全账户\"。", "证据等级": "B", "来源": "公安部与各地公安机关反诈宣传；国家反诈中心提示。", "备注": "两个瞬间最危险：一是对方让你\"不要挂电话、不要告诉别人\"；二是让你\"先转一笔验证一下\"。出现任何一个，直接挂断。"}, "extra": []}, {"n": 13, "title": "被骗后的\"紧急止付\"：时间就是钱", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "被骗之后，时间是能不能追回钱的关键。公安机关和银行有\"紧急止付\"机制，越早报警、越早提供转账信息，冻结对方账户、拦下资金的可能性越大。所以发现被骗的第一反应不是自责、也不是去跟骗子理论，而是立刻报警，把转账记录、对方账号、聊天截图都保存好。", "收益": "公安机关在办理电信网络诈骗案件中可以依法采取紧急止付、快速冻结等措施。被害人应尽快拨打 110 或到就近派出所报案，提供涉案账户、转账时间和金额等信息。资金拦截有很强的时效性，报警越早，挽回损失的可能性越高。", "证据等级": "B", "来源": "最高人民法院、最高人民检察院、公安部关于办理电信网络诈骗等刑事案件适用法律若干问题的意见；公安机关反诈宣传。", "备注": "别删聊天记录、别注销账号，那些都是证据。也别自己去联系骗子要求退款，通常只会被要求再转一笔\"手续费\"。"}, "extra": []}, {"n": 14, "title": "二手买、二手卖：宿舍里能省下最多的钱", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "教材、自行车、显示器、小电器、考研资料，这些在学校二手群、跳蚤市场、正规二手平台都能买到，价格常是新品的二到五成。反过来，毕业时把用不上的东西卖出去，也是一笔钱。核心原则是：当面验货、走平台担保交易、不私下转账，尤其电子设备要当场验机。", "收益": "校园二手交易是学生群体内部的高流动性市场，教材和考研资料因版本与考试周期集中，流动性尤其高。二手交易的风险主要集中在私下转账和货不对板，走平台担保交易、当面验货可显著降低风险。", "证据等级": "C", "来源": "校园二手交易实践（通行做法）。", "备注": "买二手电子设备要验机、查看电池健康度和序列号；卖东西要拍到实物细节和瑕疵。私下转账是校园二手被骗的主要形式，钱货不同时就是风险。"}, "extra": []}, {"n": 15, "title": "手机套餐：最容易被\"自动续费\"吃钱的地方", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱，一年省几百。", "说人话": "手机套餐是最容易被\"自动续费\"吃钱的地方。常见浪费有三种：套餐流量远超实际用量、忘了退订的增值服务、合约机的隐形绑定。省钱的逻辑是：先查清自己每月真实用量，再换成匹配的套餐；到期时主动评估要不要换，别默认续约。", "收益": "三大运营商均提供套餐查询、变更和退订服务，可通过官方 App 或营业厅办理；不少互联网套餐价格低于同档位线下套餐。合约机通常以\"低价购机\"换取一定期限的在网承诺，提前解约可能需支付违约金。", "证据等级": "C", "来源": "通信运营商套餐服务与合约机条款的通行做法。", "备注": "办套餐前把\"月租、流量、通话、合约期、违约金\"五项看清楚。别为了一部便宜的合约机，绑上两年高月租。"}, "extra": []}, {"n": 16, "title": "租房押金与中介费：入住和退租时都要拍照", "tag": {"money": "0", "time": "中", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "可能损失一个月押金。", "说人话": "实习或毕业租房，坑主要在押金和中介费。要点有三：① 签合同前拍照记录房屋现状和已有损坏；② 明确押金退还条件和时限、以及退租时的清洁费怎么算；③ 中介费按当地规定和合同约定支付，拒绝\"看房费\"\"诚意金\"这类额外名目。押金纠纷的证据，通常就是入住和退租时的照片。", "收益": "住房租赁中，押金用于担保承租人履约，退租时在扣除应由承租人承担的费用后应予以退还；入住时对房屋及设施现状拍照留证，是发生押金争议时的重要证据。正规中介的收费项目和标准应在合同中明确，多地规定中介不得收取未予标明的费用。", "证据等级": "C", "来源": "住房租赁合同与押金处理的通行做法（各地规定不同）。", "备注": "签约前核对房东身份和房屋产权，避免遇到\"二房东\"转租。转租要原房东书面同意，否则容易钱房两空。"}, "extra": []}, {"n": 17, "title": "出行省钱：先错峰，再比价，最后用学生身份", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "学生出行能用足的就三类工具：学生优惠火车票（每学年 4 次，需先做优惠资质核验）、学生价的景区门票和交通票、以及错峰出行。同一段路程，提前订和临时订、节假日和平时的价差可能翻倍，省钱的顺序是：先错峰，再比价，最后用学生身份。", "收益": "学生优惠火车票每学年可购买 4 次单程，限家庭居住地至院校（实习地点）之间，使用普通旅客列车硬座、硬卧和动车组二等座，每学年乘车前需办理一次优惠资质核验（可在 12306 App 线上完成）。多数景区、博物馆、剧院对学生实行票价优惠。", "证据等级": "B", "来源": "中国国家铁路集团关于学生优惠票的规定及 12306 购票指南；景区优惠票的通行做法。", "备注": "优惠区间要写火车站站名（不是地名），填错取不出票；每学年第一次乘车前记得做资质核验，否则按原价。"}, "extra": []}, {"n": 18, "title": "学生证和\"学生认证\"能便宜的东西：一份清单", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "学生身份本身就是一张打折卡，但很多人不知道能便宜什么。常见的包括：软件教育版（办公、设计、开发工具）、云服务与存储的学生包、视频和音乐平台的学生会员、部分电商和外卖平台的学生认证价、健身和文娱场馆的学生票。核验一般要用学信网学籍信息或校园邮箱，毕业后会自动失效。", "收益": "多数软硬件厂商和互联网平台提供凭校园邮箱或学信网学籍信息申请的教育版、学生版或学生价，价格常为正常价的几折甚至免费；学生优惠通常需要定期重新核验学籍，毕业或学籍失效后自动终止。", "证据等级": "C", "来源": "各平台学生认证与教育版申请的通行做法。", "备注": "别为了省几百块去买\"假学生认证\"——既可能被骗，也可能涉及冒用身份。真正需要多个软件时，先看学校图书馆和信息化中心有没有已经买好的正版授权。"}, "extra": []}, {"n": 19, "title": "把钱花在\"复利型支出\"上：判断标准是\"回报能持续多久\"", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "花的是判断力。", "说人话": "同样的钱，花在不同地方回报差别很大。\"复利型支出\"是指今天花出去、之后还能持续带来回报的支出：电脑和生产力工具、正版软件、专业书籍、一门真能提升技能的课、一次能写进简历的证书或竞赛报名费。相对的\"消耗型支出\"是花完就没了，比如冲动购物、无意义的聚餐、为面子买的装备。", "收益": "判断一项支出是否\"复利型\"，可以问三个问题：它带来的是资产、技能还是体验？这些收益能持续多久？有没有更便宜的替代方案？教育投入、健康投入和能形成作品或资质的投入，通常具有更长的回报周期。", "证据等级": "C", "来源": "个人财务与人力资本投资的通行框架（属经验性判断）。", "备注": "注意\"复利型\"也常被用来给冲动消费找借口：一台每天都要用的电脑值得花钱，一台为了喜欢而买、一年开机三次的显示器就不值得。"}, "extra": []}, {"n": 20, "title": "支付痛感：为什么刷手机比掏现金更舍得花钱", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "为什么刷卡、刷手机比掏现金更舍得花钱？因为支付方式和消费之间的\"痛感\"被削弱了，尤其当账单延后、分期把大额拆成小份时。行为经济学研究发现，支付方式越\"不心疼\"，消费越容易失控。一个实用对策是：大额非必需消费，给自己设一个 24 小时冷静期，睡一觉再决定。", "收益": "Prelec 和 Loewenstein（1998）的研究发现，信用卡等延后支付的支付方式会降低消费者对支付的\"痛感\"，从而提高购买意愿和消费金额；行为经济学据此提示，可以通过提高支付摩擦（如现金支付、设置预算、延迟决策）来抑制冲动消费。", "证据等级": "B", "来源": "Prelec, D., & Loewenstein, G. (1998). The Red and the Black: Mental Accounting of Savings and Debt. Marketing Science, 17(1), 4–28.", "备注": "行为层面的对策很简单：网购先加购物车、不立即结算；把支付 App 的免密支付关掉；大额支出设 24 小时冷静期。给自己制造一点\"麻烦\"，就能省下不少钱。"}, "extra": []}, {"n": 21, "title": "生活费不够的三条正路：资助、勤工、兼职", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "钱不够的时候，正当的顺序是：先看资助（助学金、困难补助、学费减免、助学贷款），再找校内勤工助学（安全、有协议），最后才考虑校外兼职。这个顺序的理据是风险从低到高：资助和贷款可控，校内岗有保障，校外兼职的风险最高。反过来先借高息网贷、先做高风险兼职，是最亏的排序。", "收益": "国家助学贷款本专科每年最高 2 万元、研究生每年最高 2.5 万元，在校期间利息由财政全额补贴；国家助学金平均每生每年 3700 元；校内勤工助学有协议、工时上限和酬金底线保障。三者共同构成\"不借高利贷也能读完书\"的安全网。", "证据等级": "A", "来源": "财政部、教育部等 (2024). 财教〔2024〕188 号；财政部、教育部 (2024). 财教〔2024〕181 号；《高等学校学生勤工助学管理办法（2018 年修订）》。<https://www.xszz.edu.cn/>", "备注": "任何\"先借一笔周转一下\"的建议，都要先跟这三条路比一遍。通常你会发现，有一条更便宜、更安全的路还没走。"}, "extra": []}, {"n": 22, "title": "冒充公检法与\"杀猪盘\"：先用恐惧或感情控制你", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "金钱"}, "fields": {"成本": "可能损失全部积蓄甚至被迫借贷。", "说人话": "两类针对学生的高危诈骗：一是冒充公检法，说你\"涉嫌洗钱、需要配合调查\"，要求把钱转入\"安全账户\"或下载指定 App；二是\"杀猪盘\"，先在社交软件上和你培养感情，再引你到虚假投资或博彩平台。共同点是：先用恐惧或情感控制你，再诱导你离开正规渠道转账。", "收益": "公安机关反诈宣传明确，公检法机关不会通过电话、短信、聊天软件办案，不会要求当事人转账到\"安全账户\"，也不存在需要\"配合调查资金流向\"这回事；网络交友后被推荐的投资、博彩、理财平台，绝大多数是诈骗。遇可疑情况拨打 96110 咨询，被骗立即拨打 110。", "证据等级": "B", "来源": "公安部与各地公安机关反诈宣传；国家反诈中心提示。", "备注": "无论对方出示什么\"通缉令\"\"逮捕令\"图片，先挂断，自己打官方电话或去派出所核实。真实的办案不会在电话里跟你要钱。"}, "extra": []}, {"n": 23, "title": "装好国家反诈中心 App，把账户安全设置过一遍", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱，几分钟。", "说人话": "手机里装上\"国家反诈中心\"App，开启来电预警，能拦截一部分诈骗电话和短信；支付宝、微信、银行 App 里的账户安全设置（支付限额、免密关闭、交易提醒）也要过一遍。这些工具不能百分百挡住诈骗，但能拦住大量低水平骚扰，也能在出事时帮你更快发现异常。", "收益": "国家反诈中心 App 由公安部相关部门推出，提供诈骗预警、身份验真、举报和风险查询等功能；银行和支付机构普遍提供交易提醒、限额设置和账户冻结服务。公安机关提示，接到 96110 来电通常意味着你可能正遭遇诈骗，应及时接听核实。", "证据等级": "C", "来源": "公安部国家反诈中心 App 功能介绍；银行与支付机构的账户安全服务（通行做法）。", "备注": "工具只是辅助，真正决定安全的还是那几个习惯：不给验证码、不共享屏幕、不点陌生链接、不向陌生账户转账。"}, "extra": []}, {"n": 24, "title": "每年做一次\"金钱体检\"，花半小时", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱。", "说人话": "每年用半小时把这几件事过一遍：查一次征信报告、核对名下有没有陌生账户、看一遍各平台的自动续费和分期、给下学期列一个预算、确认助学贷款和奖助学金的到账与还款信息。花半小时，能挡掉很多\"莫名其妙少钱\"和\"突然被告知逾期\"的情况。", "收益": "个人信用报告每年可免费查询 2 次；支付平台的账单与自动续费管理可帮助识别不必要支出；助学贷款需按期还款、按期更新联系方式。定期体检式核对，能及时发现账户异常、逾期风险和资金错配。", "证据等级": "C", "来源": "本节的汇总（依据见第 1 至 23 条各自的来源；属操作清单，非文献结论）。", "备注": "把这次体检定在每年固定的时间（比如生日或开学），比\"想到了再说\"更容易执行。"}, "extra": []}]}, {"file": "12-时间精力睡眠与身体.md", "title": "12. 时间、精力、睡眠与身体：大学里最贵的四样", "entries": [{"n": 1, "title": "睡够 7 小时是底线：短睡、长睡都和死亡率升高相关", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "不花钱，代价是每天少刷一小时手机。", "说人话": "睡眠不是可以随便压缩的\"成本项\"。长期睡不够，先垮的是记忆巩固、情绪调节和免疫，考试周尤其明显——你熬夜省下的两小时，会用第二天一整天的低效率来还。更麻烦的是它不报错：你不会立刻生病，只是慢慢变得迟钝、易怒、容易感冒。把\"睡够\"当成每天必须完成的事，而不是\"没事就多睡会儿\"。", "收益": "Cappuccio 等人对 16 项前瞻队列研究、逾 138 万人的系统综述与元分析发现，以每晚 7—8 小时为参照，短睡（<7 小时）和长睡（>8—9 小时）都与全因死亡风险升高相关。中国睡眠研究会《2025 中国睡眠健康研究白皮书》（基于可穿戴设备、覆盖 31 个省级行政区、超 15 万志愿者）显示，我国人群夜间平均睡眠时长 6.85 小时、平均入睡时间 00:18，26% 的人夜间睡眠不足 6 小时。", "证据等级": "A", "来源": "Cappuccio FP, D'Elia L, Strazzullo P, Miller MA (2010). Sleep duration and all-cause mortality: a systematic review and meta-analysis of prospective studies. *Sleep*, 33(5): 585–592；中国睡眠研究会 (2025). 2025 中国睡眠健康研究白皮书（发布稿与数据摘要）。", "备注": "受益人是自己。别拿\"我睡 5 小时也精神\"当理由——主观感受好，不代表代谢和免疫没付出代价。"}, "extra": []}, {"n": 2, "title": "固定起床时间：比\"今晚早点睡\"容易做到", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，改一个闹钟设定。", "说人话": "想调作息的人几乎都失败在\"今晚必须早睡\"上——入睡时间不由意志控制，躺下越急越睡不着。但起床时间是可控的：把它固定下来（比如每天 7 点，周末最多晚一小时），白天的困意会在几天后把入睡时间自然往前拉。顺序是先定起床，再让入睡跟着来，反过来往往一步都动不了。", "收益": "睡眠由昼夜节律系统与\"睡眠压力\"共同决定，固定起床时间能稳定光照、进食、活动这些外界授时线索，使入睡时间同步前移；这是睡眠卫生与失眠认知行为治疗（CBT-I）中最常被强调的一条（属通行做法，无全国性随机对照数字）。中国睡眠研究会《2025 中国睡眠健康研究白皮书》显示，仅 21% 的大学生零点前入睡、32% 的大学生早上 9 点后醒来，晚睡晚起是普遍状态。", "证据等级": "C", "来源": "睡眠卫生与失眠认知行为治疗（CBT-I）通行建议（属通行做法）；中国睡眠研究会 (2025). 2025 中国睡眠健康研究白皮书。", "备注": "受益人是自己。周末补觉别超过两小时——\"补到中午\"会把刚稳住的节律又推回去，周一更难起。"}, "extra": []}, {"n": 3, "title": "睡眠怎么巩固记忆：别把复习全押在考前通宵", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱，只是把顺序换一下。", "说人话": "白天学的东西不会自己存进脑子里，睡眠期间大脑在做\"归档\"。所以\"白天学、晚上睡\"比\"晚上学、白天困\"记得牢。具体做法：把背诵和需要理解的内容分散到几天，每天睡前花十分钟过一遍当天要点，第二天早上再回忆一次。通宵复习看似多学了六小时，实际是把归档和第二天状态一起赔掉。", "收益": "\"突触稳态假说\"认为清醒时突触连接持续增强、睡眠时被重新归一化并筛出重要信息（该假说仍是主流模型之一，属学术假设而非已定论）。睡眠期的慢波活动与海马依赖的记忆巩固相关，是记忆研究中的常见发现，但具体机制仍有争议。", "证据等级": "C", "来源": "Tononi G, Cirelli C (2003). Sleep and synaptic homeostasis: a hypothesis. *Brain Research Bulletin*, 62(2): 143–150（突触稳态假说的原始提出）；睡眠与记忆巩固的关系属学界讨论中的研究方向，尚无统一定论。", "备注": "受益人是自己。至少保证考前一晚睡够——状态衰减造成的丢分，通常比多背两小时换来的分多。"}, "extra": []}, {"n": 4, "title": "午睡控制在 20—30 分钟：长了反而更困", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，占用下午半小时。", "说人话": "午睡的正确用法是\"充电\"而不是\"补觉\"。躺下 20 到 30 分钟，还没进入深睡就起来，醒来是清醒的；一睡一个半小时进入深睡再被叫醒，会有明显的\"睡懵\"感，整个下午都昏。中国睡眠研究会的数据显示 72% 的人午睡超过 30 分钟，属于典型睡过头。设个闹钟，别指望自然醒。", "收益": "睡眠惰性（醒来后短期的迟钝）与从深睡中被唤醒相关，因此在进入深睡前结束小睡可减轻不适感；短时小睡对警觉度的提升，在睡眠研究中被反复观察到（属通行做法）。中国睡眠研究会《2025 中国睡眠健康研究白皮书》：72% 的受调查者午睡超过 30 分钟。", "证据等级": "B", "来源": "中国睡眠研究会 (2025). 2025 中国睡眠健康研究白皮书（午睡时长数据）；睡眠惰性与小睡时长的通行研究口径。", "备注": "受益人是自己。下午 3 点以后别补长觉，会顶掉晚上的睡意，形成\"晚上不困、白天补觉\"的循环。"}, "extra": []}, {"n": 5, "title": "熬夜之后的补觉边界：能缓解，不能全补回来", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱。", "说人话": "偶尔熬一晚，第二天的小睡和早睡能明显缓解，不必恐慌。但慢性睡眠不足是\"累积债\"，周末一次补到中午补不平，还会打乱节律。正确的应对是：第二天正常起床、下午小睡 20 分钟、当晚早点睡，而不是\"睡到下午再重来\"。真正的策略是别让它变成每周常态，而不是熬完再找补。", "收益": "急性睡眠剥夺后的恢复性睡眠能部分改善警觉度与情绪，但慢性睡眠限制下的认知缺陷不能靠单次补觉完全逆转；周末\"社交时差\"（工作日与休息日作息大幅错位）本身与代谢紊乱相关（属睡眠医学通行口径）。中国睡眠研究会《2024 中国居民睡眠健康白皮书》显示 24:00 前入睡的大学生仅占 29%，52% 在 24:00—2:00 入睡。", "证据等级": "B", "来源": "中国睡眠研究会 (2024). 2024 中国居民睡眠健康白皮书（大学生入睡时间数据）；睡眠剥夺恢复与\"社交时差\"的通行研究口径。", "备注": "受益人是自己。给熬夜设一条硬线：连续两晚超过凌晨 1 点，第三晚必须按固定时间睡。"}, "extra": []}, {"n": 6, "title": "把最耗时间的 App 移出手机首屏：改环境比逼自己有效", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "不花钱，两分钟。", "说人话": "意志力是会用完的，但\"打开 App 要多按两下\"不耗意志力。把短视频、游戏、社交从首屏挪到文件夹第三页，关掉推送，设屏幕使用时间上限，睡前把手机放到床够不到的地方——这些改动一次做好，之后每天都替你省时间。反过来，\"我要自律\"这种话一天要重新说一遍，说不了几天。中国睡眠研究会数据显示 39% 的大学生每日使用手机超过 8 小时。", "收益": "把默认选项和环境线索改掉，比依赖意志力更可持续；塞勒与桑斯坦在《助推》（Nudge, 2008）中系统论证了默认设置与选择架构对行为的塑造作用。达克沃斯等人 2016 年提出，高自控者更多依赖\"情境策略\"——主动避开诱惑、改造环境，而非硬扛冲动（*Perspectives on Psychological Science*）。", "证据等级": "B", "来源": "Thaler RH, Sunstein CR (2008). *Nudge: Improving Decisions About Health, Wealth, and Happiness*；Duckworth AL, Gendler TS, Gross JJ (2016). Situational Strategies for Self-Control. *Perspectives on Psychological Science*, 11(1): 35–55；中国睡眠研究会 (2025). 2025 中国睡眠健康研究白皮书（手机使用时长数据）。", "备注": "受益人是自己。一次到位：删掉最上瘾的两个 App，或把它们挪到需要搜索才能打开的层级，比\"每天少玩一小时\"好执行。"}, "extra": []}, {"n": 7, "title": "实施意图：把\"打算做\"写成\"几点、在哪、做什么\"", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "不花钱，写一行字。", "说人话": "拖延大多不是懒，是任务太模糊引发的焦虑。\"这周写论文\"没法执行，\"周二晚 7 点，在图书馆三楼，先写完引言第一段\"可以。把计划写成\"如果到了某个时间/某个地点/出现某种情况，那么我就做某个具体动作\"的句式，执行率会明显上升。便宜到离谱，但真正照做的人很少。", "收益": "Gollwitzer 提出\"实施意图\"（implementation intentions）概念，指出把目标绑定到具体的\"如果—那么\"线索上，能把行为从\"需要临时决定\"变成\"看到线索就自动触发\"。Gollwitzer 与 Sheeran 2006 年对 94 项独立研究（逾 8000 名被试）的元分析估计，实施意图对目标达成有中等偏大的效应量（d≈0.65）。", "证据等级": "A", "来源": "Gollwitzer PM (1999). Implementation intentions: Strong effects of simple plans. *American Psychologist*, 54(7): 493–503；Gollwitzer PM, Sheeran P (2006). Implementation intentions and goal achievement: A meta-analysis of effects and processes. *Advances in Experimental Social Psychology*, 38: 69–119.", "备注": "受益人是自己。写的时候要含\"时间 + 地点 + 具体动作\"三要素，缺一个就退化成空话。"}, "extra": []}, {"n": 8, "title": "任务拆解 + 番茄工作法：把\"开始\"这个动作变便宜", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，需要一个计时器。", "说人话": "拖延最卡人的不是\"做多久\"，是\"怎么开始\"。番茄工作法（工作 25 分钟、休息 5 分钟）的作用是把任务切到\"小到不吓人\"，让你先动手再说。配合拆解更有效：把\"写课程论文\"拆成\"找 5 篇文献→列提纲→写 300 字\"，每格番茄只对付其中一小块。这套方法不是万能药，但对付\"迟迟不开始\"最省事。", "收益": "番茄工作法由 Francesco Cirillo 于 20 世纪 80 年代末提出，本质是把长任务切块、用固定时长降低启动门槛（属通行的时间管理做法，缺少统一实验数据）。其价值主要在减少\"任务太大不知从哪下手\"造成的回避。", "证据等级": "C", "来源": "番茄工作法的通行做法（属通行做法，无统一学术文献）。", "备注": "受益人是自己。别纠结\"25 分钟科不科学\"——换成 40 分钟也行，重点是先有一个\"只做这一小块\"的约定。"}, "extra": []}, {"n": 9, "title": "图书馆和固定情境：同一份作业，在宿舍写要三小时", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，多走十分钟路。", "说人话": "同一份作业，在宿舍写可能要三小时，在图书馆写可能一小时。区别不在你变了，而在环境里的干扰少了。给每类事配一个固定地点——上课在教室、自习在图书馆、开会去活动室、休息回宿舍——久了之后\"到了那个地方就进入那个状态\"，不用每次重新做心理建设。", "收益": "情境线索与行为之间存在稳定关联，固定地点有助于形成\"到哪就做哪件事\"的行为模式（属环境心理学的通行做法，无单一数字）。达克沃斯等人 2016 年关于自控的论述也指出，改造情境比事后压制冲动更有效（*Perspectives on Psychological Science*）。", "证据等级": "C", "来源": "环境—行为关联与情境线索的通行做法；Duckworth AL, Gendler TS, Gross JJ (2016). Situational Strategies for Self-Control. *Perspectives on Psychological Science*, 11(1): 35–55.", "备注": "受益人是自己。\"在床上学习\"是效率杀手，因为床的核心功能是睡觉，两者会互相干扰。"}, "extra": []}, {"n": 10, "title": "免费的运动资源：体育课、场馆、健身房、社团", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "多数高校体育场馆、健身房对本校学生免费或低价开放。", "说人话": "毕业后健身房年卡要几千元，学校里的场地基本免费，还有体育课、体育社团和校队。大学四年是建立运动习惯最便宜的窗口：现在养成的习惯，往后几十年都在替你省医疗费。别等\"有空了再运动\"，把它当成课表上的一格排进去，才有机会跑起来。", "收益": "WHO《关于身体活动和久坐行为的指南》（2020）建议成人每周进行 150—300 分钟中等强度或 75—150 分钟剧烈强度有氧活动，每周至少 2 天进行肌肉强化活动，并能用任何强度的活动替代久坐。教育部《高等学校体育工作基本标准》（教体艺〔2014〕4 号）要求高校配备体育设施、保障体育工作经费，并对学生体育社团数量等提出要求。", "证据等级": "A", "来源": "世界卫生组织 (2020). 关于身体活动和久坐行为的指南. <https://www.who.int/zh/news/item/25-11-2020-every-move-counts-towards-better-health-says-who>；教育部 (2014). 高等学校体育工作基本标准（教体艺〔2014〕4 号）. <https://www.moe.gov.cn/srcsite/A17/moe_938/s3273/201406/t20140612_171180.html>", "备注": "受益人是自己。体育课不是\"混学分\"的水课——把它当成每周被安排好的两次运动，是最省事的启动方式。"}, "extra": []}, {"n": 11, "title": "久坐与全因死亡：每 45—60 分钟起身动两分钟", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "不花钱，站起来两分钟。", "说人话": "学生的一天常是\"坐着上课 + 坐着自习 + 坐着刷手机\"，连续十几个小时不动。久坐本身和全因死亡风险升高相关，而且它和\"你每周运动够不够\"是两笔账——就算每周练三次，剩下时间一直坐着也不划算。最简单的方法：设个 45 或 60 分钟的提醒，起来接水、走两分钟、看远处，成本几乎为零。", "收益": "WHO《关于身体活动和久坐行为的指南》（2020）明确指出：限制久坐时间、用任何强度的活动替代久坐，对健康有益；成人应达到每周 150—300 分钟中等强度有氧活动并每周至少 2 天肌肉强化活动。久坐行为与全因死亡风险升高的关联，是该指南纳入的观察证据之一。", "证据等级": "A", "来源": "世界卫生组织 (2020). 关于身体活动和久坐行为的指南（久坐行为章节）. <https://www.who.int/zh/news/item/25-11-2020-every-move-counts-towards-better-health-says-who>", "备注": "受益人是自己。把\"接水\"设定成固定动作——每次起身都顺路接一杯水，同时解决久坐和饮水两件事。"}, "extra": []}, {"n": 12, "title": "近视防控：每天户外自然光不少于 1 小时", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，把室外时间排出来。", "说人话": "近视一旦加深就难回退，成年后高度近视还会抬高视网膜病变等风险。大学生手机电脑不离手，近距离用眼时间比中小学生更长。能做的其实很朴素：每天到户外待够一段时间（自然光照是关键，不只是\"看远处\"），配合 20—20—20 法则——每用眼 20 分钟看 20 英尺（约 6 米）外 20 秒。别等度数又涨了才想起。", "收益": "教育部等八部门《综合防控儿童青少年近视实施方案》（2018）要求增加户外活动和锻炼，每天接触户外自然光不少于 1 小时，并控制电子产品使用；该方案的年龄定位是儿童青少年，但\"户外光照延缓近视进展\"的原理对成年人的用眼习惯同样有参考意义。", "证据等级": "A", "来源": "教育部等八部门 (2018). 综合防控儿童青少年近视实施方案. <http://www.moe.gov.cn/srcsite/A17/moe_943/s3285/201808/t20180830_346672.html>", "备注": "地区差异。该方案针对中小学生，大学生不在其规定的适用范围内；本条借用的是\"增加户外光照、减少持续近距离用眼\"的思路，属对政策的迁移应用。"}, "extra": []}, {"n": 13, "title": "食堂吃够蛋白质：照着膳食指南的数字点", "tag": {"money": "低", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "食堂比外卖便宜得多（同一顿饭常差 5 到 10 元）。", "说人话": "学生最常见的饮食错误是\"碳水堆满、蛋白不够\"——米饭面条吃一大份，鸡蛋、肉、豆制品、奶吃得少。换算很具体：一个鸡蛋约 6 克蛋白，250 毫升牛奶约 8 克，一块豆腐、一个鸡腿各贡献十来克。一天三顿都在食堂吃，比顿顿点外卖一个月能省几百元。省钱和吃对在这里是同向的，很少见。", "收益": "《中国居民膳食指南（2022）》平衡膳食八准则给出核心推荐数字：平均每天摄入 12 种以上食物、每周 25 种以上；动物性食物平均每天 120—200 克，其中每周鱼 300—500 克、蛋类 300—350 克、畜禽肉 300—500 克；奶及奶制品相当于每天 300 毫升以上液态奶；谷类 200—300 克（其中全谷物和杂豆 50—150 克）、薯类 50—100 克；蔬菜不少于 300 克（深色占 1/2）、水果 200—350 克。", "证据等级": "A", "来源": "中国营养学会 (2022). 中国居民膳食指南（2022）平衡膳食八准则. <https://cnsoc.org/knowledge/442220200.html>", "备注": "受益人是自己。每餐一个动作：先挑一份优质蛋白（蛋、奶、豆、鱼、禽、瘦肉），再用主食补齐，顺序反过来容易吃成\"一碗面\"。"}, "extra": []}, {"n": 14, "title": "外卖与高油高盐：一顿顶掉一天的油盐额度", "tag": {"money": "中", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "单价比食堂高，一个月差出几百元。", "说人话": "外卖为了好吃，油和盐都给得足。膳食指南建议每天烹调油 25—30 克、盐不超过 5 克，而一份重口味外卖（麻辣香锅、干锅、盖浇饭加酱）往往就能把一天的额度用掉大半。偶尔吃没关系，天天吃就是长期账。真要天天外食，选清淡的品类（汤面、清蒸、白灼），把酱料分开放，能少掉一部分油盐。", "收益": "《中国居民膳食指南（2022）》推荐成年人每天摄入食盐不超过 5 克、烹调油 25—30 克、添加糖不超过 50 克（最好 25 克以下）；并推荐每周至少进行 5 天中等强度身体活动、累计 150 分钟以上，以及\"每小时起来动一动\"。", "证据等级": "B", "来源": "中国营养学会 (2022). 中国居民膳食指南（2022）平衡膳食八准则. <https://cnsoc.org/knowledge/442220200.html>", "备注": "受益人是自己。别只看热量数字做选择——真正难控的是钠和油，多数外卖页面上并不标注。"}, "extra": []}, {"n": 15, "title": "喝水和含糖饮料：白开水免费，甜饮料很贵", "tag": {"money": "低", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "白开水几乎不花钱，一瓶甜饮料几元。", "说人话": "成年人每天饮水建议男性 1700 毫升、女性 1500 毫升，白开水或茶水最合适。含糖饮料的问题在于\"喝进去的糖不顶饱\"：一瓶 500 毫升含糖可乐的糖在 50 克上下，已经压到甚至超过每日 50 克添加糖的上限，而你并不会因此少吃饭。把常喝的甜饮料换成白开水或淡茶，是极低成本的一步。", "收益": "《中国居民膳食指南（2022）》推荐成年男性每天饮水 1700 毫升、女性 1500 毫升；添加糖每天不超过 50 克，最好 25 克以下，并建议不喝或少喝含糖饮料。一瓶 500 毫升含糖碳酸饮料的添加糖通常在 50 克量级。", "证据等级": "B", "来源": "中国营养学会 (2022). 中国居民膳食指南（2022）平衡膳食八准则. <https://cnsoc.org/knowledge/442220200.html>", "备注": "受益人是自己。用带刻度的水杯或设喝水提醒，比\"想起来才喝\"靠谱；运动后补水优先白水，运动饮料只在高强度长时运动后才有意义。"}, "extra": []}, {"n": 16, "title": "咖啡因：单次不超过 200mg、全天不超过 400mg", "tag": {"money": "低", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "一杯咖啡十几到几十元，一个月能花掉上百元。", "说人话": "咖啡因能短期提高警觉度，但不是睡眠的替代品——对已经严重缺觉的人，它只是让你以更差的状态继续硬撑。更实用的是记两个数：健康成人单次摄入不超过 200 毫克、全天不超过 400 毫克。一杯现磨咖啡大致 80—150 毫克，一罐能量饮料常在 80—160 毫克，别一天叠着喝。下午晚些时候再喝，会推迟入睡。", "收益": "欧洲食品安全局（EFSA）2015 年科学意见认为，对健康成人而言，单次咖啡因摄入不超过 200 毫克、全天不超过 400 毫克一般不会引起安全问题（孕妇另有更低限值）。咖啡因半衰期约 5 小时，晚间摄入会影响入睡与睡眠质量。", "证据等级": "A", "来源": "European Food Safety Authority (2015). Scientific Opinion on the Safety of Caffeine. *EFSA Journal*, 13(5): 4102. <https://www.efsa.europa.eu/en/efsajournal/pub/4102>", "备注": "受益人是自己。实操：下午 3 点以后不碰；考前用它换一次早起可以，别用它换长期熬夜。"}, "extra": []}, {"n": 17, "title": "能量饮料别兑酒：心血管和判断力一起出问题", "tag": {"money": "低", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，改一个喝法。", "说人话": "把能量饮料兑酒喝（或酒后再灌能量饮料）是聚会里的常见操作，也是危险组合。咖啡因会让人\"感觉没那么醉\"，但并不会降低血液酒精浓度——于是喝得更多、判断更差，心脏负担也更重。喝就单喝，别混；感觉醉了就停，别用提神饮料把自己\"续\"回来。", "收益": "咖啡因可掩盖酒精的中枢抑制效应，导致饮酒量增加和风险行为上升；高糖、高咖啡因的能量饮料与酒精同服对心血管的短期影响，已有研究和监管警示关注（属公共卫生通行警示口径，尚缺统一定量结论）。", "证据等级": "B", "来源": "咖啡因—酒精混合饮用的公共卫生警示（如 EFSA 2015 对咖啡因与酒精交互作用的说明）；能量饮料与酒精同服风险的公共卫生通行口径。", "备注": "受益人是自己。真要喝，先吃主食、控制速度、定好回宿舍的方式；\"感觉还挺清醒\"正是最危险的时候。"}, "extra": []}, {"n": 18, "title": "体测的两条线：毕业要 50 分，评优要\"良好\"", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱，花的是每周的运动时间。", "说人话": "体测不是体育课的小测验，它有两道硬线：毕业时总评达不到 50 分按结业处理；测试成绩达到良好及以上才能参加评优评奖。也就是说，体测既可能卡住毕业证，也可能卡住奖学金。好消息是它提前两三个月练就够，不用等通知下来才慌。", "收益": "教育部《高等学校体育工作基本标准》（教体艺〔2014〕4 号）：全面实施《国家学生体质健康标准》，每年对所有学生进行体质健康测试，成绩列入学生档案，作为评优、评先的重要依据；毕业时测试成绩达不到 50 分者按结业处理（因病或残疾凭医院证明申请并经审核通过可准予毕业）；毕业年级学生测试成绩及格率须达 95% 以上。《国家学生体质健康标准》进一步规定：成绩达到良好及以上方可参加三好学生、奖学金评选；不及格者本学年度准予补测一次；毕业成绩按毕业当年学年总分的 50% 与其他学年平均得分的 50% 之和评定。", "证据等级": "A", "来源": "教育部 (2014). 高等学校体育工作基本标准（教体艺〔2014〕4 号）. <https://www.moe.gov.cn/srcsite/A17/moe_938/s3273/201406/t20140612_171180.html>；教育部、国家体育总局关于实施《国家学生体质健康标准》的通知及标准应用问答. <https://www.moe.gov.cn/moe_879/moe_1252/s8447/201412/t20141204_179589.html>", "备注": "受益人是自己。免测、缓测通道见第 1 章第 10 条；体测项目（1000/800 米、引体向上/仰卧起坐、坐位体前屈、立定跳远等）提前练，分数和状态都能拿回来。"}, "extra": []}, {"n": 19, "title": "大学生医保：校医院、转诊单、异地备案", "tag": {"money": "低", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "一年几百元（个人缴费部分）。", "说人话": "一般流程是：校内先到校医院（很多学校校医院挂号便宜或直接报销一部分），需要转诊的要开转诊单再去定点医院；寒暑假回老家或去外地实习看病，要先办异地就医备案，否则报销比例会明显降低，甚至要自己先垫全款再回去手工报销。开学第一件事就是把校医院的位置、门诊时间、电话和报销流程存进手机。", "收益": "大学生随学校所在地参加城乡居民基本医疗保险，个人缴费标准由各地确定（2025 年度多地标准为每人每年 400 元左右，财政补助占大头）；城乡居民医保实行\"就医地目录、参保地政策\"，异地就医需按规定备案（可通过国家医保服务平台 App 线上办理），未备案或自行前往非定点机构就医的报销比例通常显著降低。", "证据等级": "B", "来源": "国家医保局、财政部、国家税务总局关于做好城乡居民基本医疗保障工作的通知（2024 年）及各地实施细则；国家医保服务平台异地就医备案办事指南。", "备注": "地区差异。个人缴费标准、报销比例、起付线、封顶线与备案方式各省差异很大，以学校所在地当年文件为准。"}, "extra": []}, {"n": 20, "title": "一年做一次基线检查：看趋势比看异常更早", "tag": {"money": "低", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "基础项目花费不高，很多学校提供入学体检或年度体检。", "说人话": "入学体检的数据别扔，它是你的健康基线（身高、体重、血压、视力、肝功能、胸片）。之后每年对一下：体重有没有明显变化、血压有没有升高、视力有没有退、情绪有没有持续低落。发现\"趋势\"比发现\"异常\"早得多——等它变成指标异常，往往已经走了好几年的下坡。", "收益": "新生入学体检通常包含身高、体重、血压、视力、内科、外科、胸片（结核筛查）、肝功能等项目；《学校结核病防控工作规范（2017 版）》要求将结核病检查作为新生入学体检必查内容。基线数据的价值在纵向对比，单次\"正常\"意义有限。", "证据等级": "B", "来源": "国家卫生计生委、教育部 (2017). 学校结核病防控工作规范（2017 版）；教育部 (2017). 普通高等学校学生管理规定（健康管理相关条款）；高校新生入学体检通行项目。", "备注": "受益人是自己。把每年的体检结论单按年份存进同一个云盘文件夹，四年后能看到完整趋势线。"}, "extra": []}, {"n": 21, "title": "久坐的局部账：颈椎、腰椎、手腕", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，换一个姿势。", "说人话": "整天低头看手机、弓背对着笔电，最先出问题的不是心肺，是颈肩腰和手腕——酸胀、发麻、转头咔咔响，年轻时不当事，拖成慢性疼痛很麻烦。能立刻改的：屏幕抬到与视线齐平，坐时让腰有支撑，每 45 分钟起身一次，手机举高别低头。这些不是\"养生\"，是避免四年后天天贴膏药。", "收益": "长时间固定姿势与颈肩腰劳损、腕部不适相关，间断活动和调整工位高度是通行的缓解与预防做法（属通行做法，无统一人群数据）。成年人的活动建议可参照 WHO《关于身体活动和久坐行为的指南》（2020）中\"限制久坐、用任何强度活动替代\"的原则。", "证据等级": "C", "来源": "颈肩腰劳损与工位人体工学的通行做法；世界卫生组织 (2020). 关于身体活动和久坐行为的指南. <https://www.who.int/zh/news/item/25-11-2020-every-move-counts-towards-better-health-says-who>", "备注": "受益人是自己。出现持续手麻、夜间痛醒、无力，别只靠拉伸，去骨科或康复科看一下。"}, "extra": []}, {"n": 22, "title": "月经与运动：不用因此停练", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱。", "说人话": "月经不是运动的禁区。多数人经期照常做中等强度运动没问题，甚至能缓解腹胀和情绪波动；量大的头一两天可以降强度、换项目（散步、拉伸、瑜伽），不必整周停练。真正要注意的是长期高强度训练叠加热量摄入不足，可能造成月经紊乱甚至闭经——出现这种情况要去妇科或内分泌科，而不是硬扛。这不是\"体质差\"。", "收益": "适度运动对经期不适的缓解作用、以及\"能量可用性不足\"（长期摄入不足 + 高强度消耗）与月经紊乱的关联，在运动医学与妇科领域有较多讨论（属通行做法与研究共识方向，无全国统一数字）。具体个案需由医生评估。", "证据等级": "C", "来源": "经期运动与女性运动员\"能量可用性不足\"的通行做法与研究方向（本条第 22 条为一般性建议，不构成医学指导）。", "备注": "受益人是自己。出现闭经、经期严重疼痛或异常出血，去正规医院就诊，别靠网上的偏方或拖延。"}, "extra": []}, {"n": 23, "title": "烟和酒：没有\"少抽点没事\"这回事", "tag": {"money": "中", "time": "少", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "烟酒本身是持续支出，一个月可能上百到上千元。", "说人话": "吸烟没有任何\"安全剂量\"，唯一有效的做法是不抽或彻底戒掉；二手烟同样有害。饮酒方面，近年权威口径越来越倾向于\"越少越好\"，而不是\"每天一杯有益健康\"。学生阶段最容易把烟酒当成社交工具，但它们带来的成本和风险是实打实的：钱、成瘾、肝损伤、意外风险，全是你自己扛。", "收益": "《中国居民膳食指南（2022）》建议儿童青少年、孕妇、乳母不饮酒，成年人若饮酒应严格限量（一天酒精量不超过 15 克），并明确不推荐出于\"健康理由\"饮酒。戒烟的收益在戒烟后迅速显现，且戒烟越早、长期获益越大（属公共卫生通行口径，可参见 WHO 烟草控制相关内容）。", "证据等级": "B", "来源": "中国营养学会 (2022). 中国居民膳食指南（2022）（饮酒限量建议）. <https://cnsoc.org/knowledge/442220200.html>；WHO 烟草与酒精控制的通行口径（无安全摄入水平、越少越好）。", "备注": "受益人是自己。想戒烟可以问校医院或当地戒烟门诊，别只靠\"这次一定忍住\"；把常一起抽烟喝酒的场合减少，比单靠意志更管用。"}, "extra": []}, {"n": 24, "title": "什么时候该看睡眠门诊：三个月的门槛", "tag": {"money": "低", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "挂号费，几元到几十元。", "说人话": "偶尔睡不好不用紧张。但如果\"入睡难、睡不稳、早醒\"每周出现三次以上、持续三个月以上，并且已经影响到白天的工作学习（困、注意力差、情绪差），这就不是\"最近累\"，而可能符合失眠障碍的判断标准，该去精神科或睡眠门诊看，而不是靠数绵羊和加量咖啡因硬撑。能治，别拖。", "收益": "失眠障碍的通行诊断标准（DSM-5、ICD-11）通常要求入睡困难、维持睡眠困难或早醒每周至少 3 次、持续至少 3 个月，并伴有日间功能损害；认知行为治疗（CBT-I）是公认的一线非药物治疗。达到该阈值时应寻求专业评估。", "证据等级": "B", "来源": "失眠障碍的诊断要点（DSM-5、ICD-11 通行口径）；失眠认知行为治疗（CBT-I）作为一线治疗的专业共识；中国睡眠研究会 (2024、2025) 睡眠健康白皮书相关数据。", "备注": "受益人是自己。就诊时如实说明用了多少咖啡因、多少酒、作息如何——这些是医生判断的关键，瞒着会耽误事。"}, "extra": []}]}, {"file": "13-宿舍社团与人际.md", "title": "13. 宿舍、社团与人际：怎么少内耗", "entries": [{"n": 1, "title": "室友之间先说清三件事：作息、卫生、声音", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "不花钱，开一次十分钟的宿舍会。", "说人话": "室友矛盾九成来自三件事——睡觉时间不一致、公共区域卫生没人管、外放声音和打电话。开学第一个月就把这三条讲清楚，哪怕只是口头约定，也比半年后翻脸便宜得多。定约定时用\"我需要\"而不是\"你应该\"：前者是在划边界，后者听起来是指责，对方会本能地顶回来。把三条写进宿舍群公告或贴一张纸在门上，比\"口头说过\"更容易执行。约定里再补一句\"违反时怎么提醒\"（先群里 @ 一次，再当面说），就不必每次现想怎么开口。", "收益": "《普通高等学校学生管理规定》（教育部令第 41 号，2017 年 9 月 1 日施行）要求学生遵守学校管理制度、文明住宿，学校对学生住宿、安全教育等负有管理职责；各高校学生宿舍管理规定普遍对作息、卫生轮值、噪音设有基本要求，并设宿舍长、宿管、辅导员等协调机制。开学初形成明确约定可减少后续纠纷（具体效果因宿舍而异，无全国统一数据）。", "证据等级": "B", "来源": "教育部 (2017). 普通高等学校学生管理规定（教育部令第 41 号）；各高校学生宿舍管理规定（通行做法）.", "备注": "受益人是自己。约定写成文字，比\"当时说好了\"管用——这不是不信任，是省得以后各记各的。"}, "extra": []}, {"n": 2, "title": "宿舍矛盾升级了找谁：宿管 → 辅导员 → 调宿舍", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱。", "说人话": "顺序是先自己沟通，再找宿舍长，再找宿管，最后找辅导员；实在合不来可以申请调宿舍。调宿舍通常要理由和空床位，学期中比学期末难办，但学校一般不会让学生\"无解地耗着\"。如果已经出现人身安全威胁（动手、跟踪、砸门），别自己\"再忍忍\"，直接找辅导员和保卫处——忍到出事的案例每年都有。沟通尽量留文字：一是省得记错，二是万一要升级处理，这就是时间线。", "收益": "各高校学生宿舍管理部门受理住宿调整申请，一般需本人申请、辅导员同意，常见理由包括严重作息冲突、身心健康原因等；辅导员承担学生日常矛盾调解与突发情况处置职责（属各校通行流程，具体条件逐校不同）。《普通高等学校学生管理规定》（教育部令第 41 号）要求学校加强学生住宿管理与安全教育。", "证据等级": "B", "来源": "各高校学生宿舍调整办法与辅导员职责分工（通行做法）；教育部 (2017). 普通高等学校学生管理规定（教育部令第 41 号）.", "备注": "受益人是自己。提出调宿舍时，把\"冲突时间、沟通过几次、有没有影响休息和学习\"写清楚，比只说\"合不来\"更容易被受理。"}, "extra": []}, {"n": 3, "title": "违规电器和消防：处分是小事，起火是大事", "tag": {"money": "低", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，遵守规定即可。", "说人话": "热得快、电饭锅、大功率取暖器、私接电线、在宿舍给电动车电池充电，这些在几乎所有高校都明令禁止，因为宿舍楼的线路设计和疏散条件根本扛不住。别用\"别人也在用\"给自己开脱：宿舍楼是人员密集场所，一旦起火，代价是整栋人一起付，而且可能要负法律责任，不只是记个处分。", "收益": "《高等学校消防安全管理规定》（教育部、公安部令第 28 号，2010 年 1 月 1 日施行）对学生宿舍的用火用电、电动自行车停放充电等作出明确消防要求，禁止违章用火用电。《中华人民共和国消防法》规定，过失引起火灾尚不构成犯罪的依法处罚，构成犯罪的依法追究刑事责任；造成他人损害的还需承担民事赔偿。", "证据等级": "A", "来源": "教育部、公安部 (2009). 高等学校消防安全管理规定（教育部 公安部令第 28 号）. <https://www.moe.gov.cn/srcsite/A08/s7056/201001/t20100113_85422.html>；全国人大常委会《中华人民共和国消防法》（火灾责任相关条款）。", "备注": "受益人是自己（以及整栋楼的人）。这条不是\"学校管得宽\"，是线路和疏散通道的物理限制决定的。"}, "extra": []}, {"n": 4, "title": "宿舍安全自查：每周花两分钟看一眼", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，两分钟。", "说人话": "能救命的检查就那几样——插线板有没有过载、电线有没有被床架压破皮、充电宝有没有鼓包发烫、有没有人离开时还插着大功率电器、灭火器和疏散通道在哪、有没有人抽烟。这些不用背，设个每周日晚的提醒，花两分钟扫一眼就行。出事时\"以为有人管\"是最危险的。入住第一周就记清三件事：最近的安全出口、最近的灭火器、最近的消防栓在哪。", "收益": "《高等学校消防安全管理规定》（教育部、公安部令第 28 号）要求高校对学生宿舍开展经常性消防安全检查与教育，学生有配合并遵守消防安全规定的义务；熟悉逃生路线、掌握灭火器使用、不堵塞疏散通道属基本消防要求。", "证据等级": "B", "来源": "教育部、公安部 (2009). 高等学校消防安全管理规定（教育部 公安部令第 28 号）. <https://www.moe.gov.cn/srcsite/A08/s7056/201001/t20100113_85422.html>", "备注": "受益人是自己。检查出来的问题（插座发烫、通道堆物）当场就跟室友说，别自己默默处理——这是全宿舍的事。"}, "extra": []}, {"n": 5, "title": "宿舍公共空间：洗衣房、开水房、公共厨房的错峰与清洁", "tag": {"money": "低", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "几乎不花钱，多走两步、多等十分钟。", "说人话": "宿舍里最容易积怨的地方不是卧室，是共用的那几平米——洗衣机里泡着别人的衣服、开水房排队、公共厨房台面油渍没人擦、卫生间垃圾桶满了没人倒。解法是三条默认规则：用完立刻清（洗碗池、灶台、洗衣机滤网）；衣服洗完十分钟内取走，别占机；错峰用（避开午休与熄灯前的高峰）。这些不是道德，是把\"谁该干\"变成\"用完就顺手\"。真遇到有人长期占机、占灶，也别私下忍，在群里说一句或找宿管，比憋着强。", "收益": "《普通高等学校学生管理规定》（教育部令第 41 号）要求学生遵守学校管理制度、文明住宿；《高等学校消防安全管理规定》（教育部、公安部令第 28 号）要求保持疏散通道与公共区域畅通、禁止违规用火用电。各高校学生宿舍管理规定普遍对公共卫生轮值、公共设施使用作出要求，并设宿管巡查（属通行做法，具体规则逐校不同）。", "证据等级": "B", "来源": "教育部 (2017). 普通高等学校学生管理规定（教育部令第 41 号）；教育部、公安部 (2009). 高等学校消防安全管理规定（教育部 公安部令第 28 号）. <https://www.moe.gov.cn/srcsite/A08/s7056/201001/t20100113_85422.html>", "备注": "受益人是自己。公共厨房用明火或大功率电器的，先确认宿舍楼是否允许——很多学校宿舍根本不允许做饭，违规就是第 3 条那条消防红线。"}, "extra": []}, {"n": 6, "title": "点外卖与共享物品：把\"公共\"和\"私人\"分开", "tag": {"money": "低", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "偶尔多一点小钱。", "说人话": "室友翻车往往不在大事，在\"我随手用了你的洗面奶\"\"这包零食算谁的\"\"外卖谁点的谁付\"。规则很简单：公共用品（纸巾、洗衣液、垃圾袋）先说好 AA 还是轮流买；私人东西（零食、护肤品、充电器）动之前先问一句。不写规则就默认\"大家随便用\"，迟早有人心里不舒服，最后变成\"谁都不说、谁都别扭\"。另外，别在宿舍楼道长期堆放外卖垃圾——引来的是蟑螂和宿管，不是省事。", "收益": "共享物品与费用分摊是宿舍纠纷的高频来源，事前明确规则、使用公共采买账户或记账工具属通行做法（无统一数据）。教育部令第 41 号要求学生遵守校规、尊重他人合法权益、文明住宿。", "证据等级": "C", "来源": "宿舍公共物品与费用分摊的通行做法（属通行做法）；教育部 (2017). 普通高等学校学生管理规定（教育部令第 41 号）.", "备注": "受益人是自己。推荐一个共享记账小程序，或一张纸贴在门后，谁买谁记，月底一结，比\"记得我买过\"省事。"}, "extra": []}, {"n": 7, "title": "室友之间的金钱往来：AA 与代付，让结账变成流程", "tag": {"money": "低", "time": "少", "will": "否", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "室友之间最伤感情的不是大钱，是无数笔\"几块钱\"——代付的外卖、代买的用品、垫的门票。解法不是\"算得太清会生分\"，而是把它变成习惯：谁垫的当场发个收款码，或者用一个群记账工具，月底统一结。让\"结账\"变成流程，就不必有人在心里记账，更不必有人鼓起勇气开口讨要。别把\"这次算了\"当大方，它往往变成下一回的默认；也别在群收款时点名催某一个人，私下一句即可。", "收益": "频繁的小额金钱往来若不及时结清，容易累积成情绪和纠纷；采用即时转账或群记账等工具、约定固定结算周期属通行做法（无统一数据）。清晰的小额账目反而有助于维持关系。", "证据等级": "C", "来源": "宿舍内小额金钱往来的通行做法（属通行做法）.", "备注": "受益人是自己。别人帮你代付后主动立刻转回，比\"等他想起来\"体面得多；自己代付后当场发码，也比攒到月底一次性讨要好开口。"}, "extra": []}, {"n": 8, "title": "宿舍里的\"第三方传话\"：不满当面说，别让中间人转达", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，花的是开口的勇气。", "说人话": "宿舍里最常见的激化方式，是\"你让 A 去跟 B 说我受不了他半夜打游戏\"。传话一定会变形：A 为了少得罪人，会把话削软或加料，B 听到的往往是\"你被联合针对了\"，而不是\"这件事希望你改一下\"。正确做法是直接跟 B 说，而且要就事论事：\"你昨晚十二点半还在外放，我第二天早八，能不能戴耳机？\"只描述行为和对你的影响，不评价人。实在不敢直接说，就找宿舍长或宿管当面一起说，也别用\"代传\"。", "收益": "间接沟通在传递中失真、并容易被理解为\"拉帮结派\"，是人际沟通的常见规律（属通行做法，无统一数据）。教育部令第 41 号要求学生文明住宿、尊重他人合法权益，直接表达诉求并留文字记录，是减少宿舍纠纷的通行做法。", "证据等级": "C", "来源": "宿舍沟通与冲突处理的通行做法（属通行做法）；教育部 (2017). 普通高等学校学生管理规定（教育部令第 41 号）.", "备注": "受益人是自己。三条界线：不替别人传对室友的不满；不把室友的抱怨原样转述给被抱怨的人；不在背后给室友\"贴标签\"。"}, "extra": []}, {"n": 9, "title": "室友出现心理危机时你该做什么：直接问、不承诺保密、打 12356", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，但需要你打破沉默。", "说人话": "如果室友长期情绪低落、说\"活着没意思\"、把心爱的东西送人、突然异常平静，别装没看见，也别自己扛。三件事：① 直接、平静地问——\"你最近是不是特别难受，有没有想过伤害自己？\"直接询问不会诱发危险，这是自杀干预的通行口径；② 不要承诺保密——你要做的是带他去找能帮忙的人，不是替他守住一个可能致命的秘密；③ 陪他去校心理健康教育与咨询中心，或拨打全国统一心理援助热线 12356（也可拨共青团 12355）。当场有危险就打 120 或 110。", "收益": "教育部等十七部门《全面加强和改进新时代学生心理健康工作专项行动计划（2023—2025 年）》要求高校开设心理健康必修课、定期监测学生心理健康状况，并完善\"学校—院系—班级—宿舍/个人\"四级预警网络——宿舍正是最前端的观察点。国家卫生健康委 2024 年通知（国卫医政函〔2024〕259 号）明确全国统一心理援助热线 12356 自 2025 年 5 月 1 日起开通。中国科学院心理研究所《2024 年大学生心理健康状况调查报告》显示，80.0% 的大学生知道学校提供免费心理咨询服务，但仅 2.8% 实际使用过——知道的人多、用的人少，室友常常是唯一能推动他的人。", "证据等级": "A", "来源": "教育部等十七部门 (2023). 全面加强和改进新时代学生心理健康工作专项行动计划（2023—2025 年）；国家卫生健康委 (2024). 国卫医政函〔2024〕259 号（全国统一心理援助热线 12356）；中国科学院心理研究所 (2024). 2024 年大学生心理健康状况调查报告；教育部 (2018). 高等学校学生心理健康教育指导纲要（教思政〔2018〕41 号）.", "备注": "受益人是别人，也是自己。这个主题更完整的自助与求助内容见第 15 章（心理健康）；本条只讲\"作为室友，你能做的三个动作\"。"}, "extra": []}, {"n": 10, "title": "被孤立、被排挤：多半不是你的错，别一个人扛", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "不花钱，但需要一个开口的勇气。", "说人话": "被宿舍孤立、被小团体排挤，是真实存在也真实难受的事。第一，先分清是\"合不来\"还是\"被针对\"——合不来可以换环境，被针对（造谣、联合排挤、威胁）就是需要外部介入的事。第二，别把它当成\"我这个人有问题\"的证据。第三，去找人：辅导员、班主任、学校心理健康教育与咨询中心都可以谈，而且会谈。一个人硬扛只会越扛越糟。如果已经影响到吃饭、睡觉、上课，就别再\"再看看\"，直接约一次心理咨询——第一次去不需要理由充分。", "收益": "高校普遍设有辅导员/班主任与心理健康教育与咨询中心，可为学生提供矛盾调解与心理支持；《普通高等学校学生管理规定》（教育部令第 41 号）与《高等学校学生心理健康教育指导纲要》（教思政〔2018〕41 号）要求学校维护学生合法权益、提供心理健康教育与咨询服务。向正式渠道求助是有效的处理路径。", "证据等级": "C", "来源": "教育部 (2017). 普通高等学校学生管理规定（教育部令第 41 号）；教育部 (2018). 高等学校学生心理健康教育指导纲要（教思政〔2018〕41 号）；各高校学生事务与心理咨询服务说明（通行做法）.", "备注": "受益人是自己。别急着\"反省自己哪里做得不好\"——被排挤的原因常常与你无关；先处理处境，再谈自我。"}, "extra": []}, {"n": 11, "title": "社团留一到两个就好，别都留", "tag": {"money": "0", "time": "多", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "会费通常不高，主要成本是时间。", "说人话": "大一加五六个社团是常态，到大二还在跑的往往剩两三个。社团的真实收益是三样：一群同好、几段经历、几件能写进简历的具体事。留一到两个你真正在做事、能拿到角色和产出的，比挂六个名字有用。判断标准很实在——\"这个社团里，年底我说得出自己干成了什么吗？\"说不出来，说明你只是名字在册。别用\"多个朋友\"当留一堆社团的理由，社团里真正熟起来的人，通常来自一起做过事的那几个。", "收益": "社团经历的价值体现在具体角色与产出（策划活动、负责宣传、带队参赛），这些可写入简历与综测材料；广而不深的参与在评估中权重很低（属通行做法）。教育部、共青团中央《高等学校学生社团管理暂行办法》对社团的登记、活动与指导作出规范。", "证据等级": "C", "来源": "教育部、共青团中央《高等学校学生社团管理暂行办法》；学生组织与简历评估的通行做法（属通行做法）.", "备注": "受益人是自己。会费、时间、精力都要算总账：留 1 个能做出作品的，胜过留 5 个只用来签到的。"}, "extra": []}, {"n": 12, "title": "体面地退出一个社团：越拖越难开口", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，最多被挽留几句。", "说人话": "决定退出时，别玩消失。正确做法是：提前和负责人说一声，把手上的活儿交接清楚（谁接、进度到哪、材料在哪），退群前道个谢。看起来多花十分钟，实际上是保住了一个以后可能帮得上你的人。玩消失的代价是\"这人靠不住\"的口碑，在这个学校会跟着你很久。交接时把\"我做了哪些事 + 材料在哪\"写成一段话发出去，两分钟的事，比事后被追问省心。", "收益": "退出学生组织的规范做法是提前告知、完成交接、礼貌退出（属通行做法，无统一数据）。学生组织中\"负责任\"的评价会影响后续的推荐、内推与跨组织协作机会。", "证据等级": "C", "来源": "学生组织退出的通行做法（属通行做法）.", "备注": "受益人是自己。别在活动正忙时突然退——挑一个节点说，并在找到接手人之后再走，比\"明天不来了\"体面得多。"}, "extra": []}, {"n": 13, "title": "学生工作（班委、学生会）值不值：看你缺什么", "tag": {"money": "0", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "每周几小时到十几小时。", "说人话": "学生工作的收益大致三块：综测加分、组织协调能力、和老师混熟（信息与机会）。代价是时间。判断方法很直接——如果你已经有更划算的加分和成长方式（竞赛、科研、实习），那学生工作的边际价值就低；如果你缺的是\"被看见\"和\"练手\"，它就很划算。别为了\"别人都在干\"而干。先问清加分规则再决定：有的是每学年加分，有的只在任职当年加，有的要求任职满一学年才认，别干满一年发现不算数。", "收益": "多数高校将担任班委、学生会或社团干部纳入综合素质测评加分范围，但各校加分数值、是否每学年累计差异很大，应以本校办法为准；学生工作中获得的组织与沟通能力是可迁移技能。", "证据等级": "B", "来源": "各高校本科生综合素质测评/学生管理规定中关于干部加分的条款（校际差异大，以本校文件为准）.", "备注": "地区差异。具体加分数值以本校学生手册与综测办法为准；同一条杠，不同学院可能算法不同。"}, "extra": []}, {"n": 14, "title": "学生组织里的\"活儿分配\"：别做永远干活的那个，把活变成简历产出", "tag": {"money": "0", "time": "中", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "时间，但可以通过\"挑活\"降下来。", "说人话": "学生组织里总有一个人负责收尾、借场地、做表格，也总有一个只在合影时出现。别默认自己是前者。两个动作：① 接活前先问清\"这件事有没有负责人、成果算谁的\"——没有署名的杂活（跑腿、占座、贴海报）能干，但要在群里留下记录；② 主动争取\"有产出\"的活（活动策划、宣传物料、复盘报告、公众号排版），并把成果做成可展示的东西——一份策划案、一篇推文、一张数据复盘表。年底写简历时，头衔没用，\"我独立完成了什么\"才有用。", "收益": "综合素质测评与简历评估关注的是具体角色与产出，而非参与次数；多数高校的综测办法把学生干部与活动成果纳入加分，但以本校文件为准（属通行做法）。把\"劳动\"沉淀为\"作品\"是可迁移的做法。", "证据等级": "B", "来源": "各高校本科生综合素质测评办法中关于学生工作与活动成果的条款（校际差异大，以本校文件为准）；学生组织分工与产出管理的通行做法.", "备注": "受益人是自己。被反复安排纯杂活又不给署名和机会时，可以直接问负责人\"我在这个项目里负责哪一块、结束后能不能给我一份证明\"——问出口，本身就是筛选。"}, "extra": []}, {"n": 15, "title": "拉票与选举：想清楚你图的是什么", "tag": {"money": "0", "time": "中", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "时间与精力，偶尔还有人情成本。", "说人话": "班委、社团和学生会常涉及选举拉票。上台前先想清楚：你要的是那个头衔，还是那个位置上能做的事？如果是为了综测加分，先把加分规则查明白，别拿一个月的时间和一堆人情去换一个其实不认的加分。如果是为了锻炼和资源，那就认真选、认真做。落选也别当否定——学生选举的结果受很多非能力因素影响，一次没选上说明不了什么。拉票时别承诺做不到的事，兑现不了反而更快塌房。", "收益": "选举与学生干部任免通常有校级流程文件规定（产生方式、任期、职责），干部身份对应的加分与评价以本校办法为准（属通行做法）。把\"想要什么\"先写下来再决定是否参选，是常见的决策方法。", "证据等级": "C", "来源": "各高校学生干部选拔与管理办法（通行做法，逐校差异）.", "备注": "受益人是自己。参选前把\"我当选后要做的一件事\"想出来，比背十句口号都管用。"}, "extra": []}, {"n": 16, "title": "\"内卷\"与同辈压力：区分\"我要\"和\"别人在比\"", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，但要练一个习惯。", "说人话": "同辈压力最贵的地方，是让你把时间花在\"别人都在做\"的事上：别人报四六级就跟着报，别人考研就跟着考，别人卷通识课绩点就跟着卷。解法不是\"不看别人\"，而是每次想跟风时问一句：这件事我想要，还是我怕落后？分得清这两个，能省下大量被浪费的时间。给自己划一条线：凡是\"因为别人都做\"才想做的事，先放一周再决定。要防的不是\"别人比你努力\"，而是\"你把别人的目标当成了自己的目标\"。", "收益": "费斯汀格的社会比较理论（1954）指出，人在缺乏客观标准时，会通过与他人比较来评估自身；这种比较是普遍心理机制，也是同辈压力的来源之一。识别\"比较驱动\"与\"目标驱动\"的差别，是常见的自我管理做法。", "证据等级": "B", "来源": "Festinger L (1954). A Theory of Social Comparison Processes. *Human Relations*, 7(2): 117–140.", "备注": "受益人是自己。判断一件事值不值得做，看的是\"它能不能帮我达成自己的目标\"，而不是\"做这件事的人多不多\"。"}, "extra": []}, {"n": 17, "title": "社交媒体的自我呈现：你看到的是别人的高光", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，代价是注意力。", "说人话": "朋友圈、小红书、短视频里呈现的都是剪辑过的高光——别人拿奖、别人实习、别人旅行。你拿自己的日常去比别人的精选集，永远比不过，只会越刷越焦虑。可以做两件小事：把容易让你产生比较焦虑的账号取关或折叠；给自己定一个每天刷社交媒体的时段上限，而不是随时点开。刷到一条让你难受的内容，就是取关它的理由，不需要更充分的理由。别在睡前刷——情绪被拉低后，最直接影响的是当天的睡眠和第二天的状态。", "收益": "社会比较理论（Festinger, 1954）指出人在缺乏客观标准时会通过与他人比较来评估自身；社交媒体上的\"向上比较\"与情绪低落、焦虑的关联，是近年来受到关注的研究方向（属研究方向，无全国统一数字）。减少被动浏览是常见的应对做法。", "证据等级": "B", "来源": "Festinger L (1954). A Theory of Social Comparison Processes. *Human Relations*, 7(2): 117–140；社交媒体使用与情绪的比较研究方向。", "备注": "受益人是自己。把\"取关让你难受的账号\"当成一次清理，十分钟就能做完，成本极低。"}, "extra": []}, {"n": 18, "title": "弱关系网络：有用的机会多来自\"不熟的人\"", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，日常顺手维护。", "说人话": "你可能以为机会都来自\"铁哥们\"，其实大量实习、内推、选课经验、组队邀约来自\"弱关系\"——同专业不同班、上过同一门课、社团里见过几次、学长学姐的朋友。维护弱关系不需要天天聊，只要别断：期末问一句某门课的复习范围，投实习前问一句对方单位的情况，都是低成本动作。想扩宽弱关系，最有效的不是加好友，而是\"跨出本专业\"：选一门外院的课、参加一次校级比赛，都会自然结识不同圈子的人。", "收益": "格兰诺维特 1973 年在《美国社会学杂志》发表的《弱关系的力量》指出，在求职与信息扩散中，弱关系往往比强关系提供更多\"新信息\"，因为强关系圈子高度重叠、信息重复，而弱关系桥接了不同圈子。这一结论影响了后续的社会网络与劳动力市场研究。", "证据等级": "A", "来源": "Granovetter MS (1973). The Strength of Weak Ties. *American Journal of Sociology*, 78(6): 1360–1380.", "备注": "受益人是自己。\"弱关系\"不靠送礼维系，靠的是\"上次你帮了我，这次我也愿意回你一句\"的互惠。"}, "extra": []}, {"n": 19, "title": "熟人借物、借账号：这几样东西，亲室友也不能借", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，代价是\"显得不够意思\"。", "说人话": "东西分三类。可以借：雨伞、充电宝、笔记、教材、计算器——丢了顶多赔钱。谨慎借：电脑、车、大额现金——先想清损坏和出事算谁的。绝对不能借：身份证、银行卡/校园卡、校园网与教务账号、学位证/毕业证扫描件。前三样直接牵扯实名与法律责任：你借出的账号如果被用来发违法信息、办网贷、过账，追责先找到你。拒绝的话术很简单：\"这个不是我小气，是我自己要用，学校也规定不能外借。\"", "收益": "《中华人民共和国网络安全法》第二十四条规定，网络运营者为用户办理入网、提供信息发布等服务时，应当要求用户提供真实身份信息，用户不提供真实身份信息的不得为其提供服务——这正是不该把校园网账号、教务账号借给他人使用的原因之一：实名服务被他人冒用，风险落在实名者身上。《中华人民共和国民法典》第一千零一十九条规定未经同意不得使用、公开他人肖像。出借银行卡、支付账户还有被用于电信网络诈骗\"跑分\"过账的风险，相关部门对出租、出借、出售手机卡和银行卡（\"两卡\"）有明确的整治要求。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国网络安全法》第二十四条；全国人大《中华人民共和国民法典》第一千零一十九条。另见第 16 章（电脑、账号与数字安全）关于\"两卡\"出租出借的罚则。", "备注": "受益人是自己。真正的朋友不会因为你不出借证件和账号而翻脸；会翻脸的，往往正是想拿它去做你不愿意的事。"}, "extra": []}, {"n": 20, "title": "怎么求助：把问题说到能被帮", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，写一段话。", "说人话": "很多人求助失败，是因为说得太模糊——\"学长这门课怎么学？\"对方不知道从哪答。改成：我是谁、我遇到什么具体问题、我已经试过什么、我想请你帮我做哪一件具体的事。例子：\"我是大二学 X 的，期中考了 62，这周要交大作业但不知道怎么查文献，能不能占用你 15 分钟告诉我图书馆数据库怎么用？\"背景 + 已尝试 + 具体请求三要素齐全，被回应的概率高得多。求助不是示弱，而是把对方帮你的成本降到最低。", "收益": "求助信息包含\"背景 + 已尝试 + 具体请求\"三要素时，被有效回应的概率更高（属通行沟通做法，无统一数据）。对方答应过\"回头我看看\"的，隔一天再补一句具体的追问，比干等有效。", "证据等级": "C", "来源": "请求与求助沟通的通行做法（属通行做法）.", "备注": "受益人是自己。求助要具体到\"帮我做哪一件事、占你多长时间\"，对方才好答应，也才好拒绝——这对双方都轻松。"}, "extra": []}, {"n": 21, "title": "怎么拒绝：先谢、再说清、给替代", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，主要是心理负担。", "说人话": "拒绝不需要长篇道歉。三段式就够：① 谢谢你想着我（认可对方）；② 这件事我这次做不了（说清界线，别含糊给希望）；③ 我能做的是……（给一个替代方案或时间点）。比如\"谢谢你想到我，这次的 PPT 我今晚实在做不了，但我可以把去年那份模板发你参考\"。含糊的\"我看情况吧\"最伤人，也最容易被二次索取。拒绝前不必解释一堆理由——理由越多，越像在讨价还价。对反复越界的人，重复同一句话就够了。", "收益": "\"明确拒绝 + 提供替代\"比拖延回避更能维护关系，是通行的沟通做法（无统一数据）。含糊答应对双方都造成误会，且往往导致更差的结局。", "证据等级": "C", "来源": "拒绝与边界沟通的通行做法（属通行做法）.", "备注": "受益人是自己。拒绝时不用把\"为什么不行\"讲透——讲得越细，越像在给自己找台阶，也越容易被逐条反驳。"}, "extra": []}, {"n": 22, "title": "班级群、年级群：置顶什么、屏蔽什么，正事只认教务系统", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，设置一次。", "说人话": "班级群、年级群最大的问题是\"重要通知和闲聊混在一起\"，你屏蔽了怕漏事，不屏蔽又一直被打断。可操作的做法是：把课程群、班级群置顶并开着通知，把年级大群和闲聊群设成\"只看 @ 我\"或免打扰；真正的正事不在群里——选课时间、补考安排、成绩公布都以教务系统公告为准，群里说的\"据说\"\"好像\"一律以系统为准；每学期开学和期末，每周固定刷一次教务系统与学校官方公众号。群消息只当\"提醒你去系统确认\"，不作为事实来源。", "收益": "《普通高等学校学生管理规定》（教育部令第 41 号）要求学校建立并公开学籍管理等制度，考试安排、成绩公布、注册选课等关键事项以学校正式公告与系统为准；\"选课时间、补考安排只在教务系统公告\"是各校通行做法（属通行做法）。把群消息与官方系统分层处理，可降低漏看与误信的概率。", "证据等级": "B", "来源": "教育部 (2017). 普通高等学校学生管理规定（教育部令第 41 号）；各高校教务处系统使用说明与选课须知（通行做法）.", "备注": "受益人是自己。群里的\"重要通知截图\"一律去教务系统或学校公众号核对原文——截图人人可 P，也常常是几年前的旧消息。"}, "extra": []}, {"n": 23, "title": "和老师、辅导员沟通：具体、简短、给选项", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "有效的沟通格式：① 一句话说清你是谁、为什么找；② 一句话说你已经做了什么；③ 给出你想要的、具体的帮助和可选时间。别只发\"老师您好，在吗？\"——对方回\"在\"，你还得再解释一遍，来回三趟。请假、缓考、成绩核查、资助申请这类事都有时间窗口和流程，先问清比事后补救容易得多。找辅导员前先想清\"我要他帮我做什么\"：是盖章、是批假，还是转介到别的部门；说不清诉求的沟通，往往被一拖再拖。", "收益": "请假、缓考、成绩核查、资助申请等事务通常有明确流程与时限（属通行做法）；《普通高等学校学生管理规定》（教育部令第 41 号）规定学校对学生作出处理或处分决定时应当告知事实、理由与依据，学生对处分决定不服可以依程序申诉，因此关键沟通留痕有助于后续主张权利。简明、具体、留出选择空间的沟通方式能提高回复效率。", "证据等级": "B", "来源": "教育部 (2017). 普通高等学校学生管理规定（教育部令第 41 号，学生申诉相关条款）；学术与行政沟通的通行做法.", "备注": "受益人是自己。涉及成绩、学籍、处分的沟通尽量留文字记录；涉及隐私的约当面谈。"}, "extra": []}, {"n": 24, "title": "性骚扰：留证、说\"不\"、走正式渠道", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "判断有没有越界，标准很简单：你有没有明确表达不想要，对方有没有停。遭遇骚扰时，三件事最重要：明确拒绝（尽量留下文字记录）、保存证据（聊天记录、录音、证人）、走正式渠道（学校学生工作部门或纪检、辅导员；严重的直接报警）。别因为\"怕闹大\"而沉默——沉默常常被读成默许，反而让对方变本加厉。涉及学校教职工的，可向学校纪检监察部门或上级教育行政部门举报。", "收益": "《中华人民共和国民法典》第一千零一十条规定，违背他人意愿，以言语、文字、图像、肢体行为等方式对他人实施性骚扰的，受害人有权依法请求行为人承担民事责任；并规定机关、企业、学校等单位应当采取合理的预防、受理投诉、调查处置等措施。《中华人民共和国妇女权益保障法》（2022 年修订，2023 年 1 月 1 日施行）进一步要求学校建立防范性骚扰的机制；《普通高等学校学生管理规定》（教育部令第 41 号）设有学生申诉渠道。", "证据等级": "A", "来源": "全国人大《中华人民共和国民法典》第一千零一十条；全国人大常委会《中华人民共和国妇女权益保障法》（2022 年修订）；教育部 (2017). 普通高等学校学生管理规定（教育部令第 41 号，学生申诉相关条款）.", "备注": "受益人是自己。涉嫌犯罪的直接报警；无论走哪条渠道，先把证据固定下来——聊天记录截图、时间地点、在场的人，都是后续处置的基础。"}, "extra": []}, {"n": 25, "title": "借钱与借条：写清楚比讲感情安全", "tag": {"money": "中", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱，花的是面子。", "说人话": "借钱给同学，最稳妥的做法是：借条写清借贷双方姓名、金额、日期、还款时间、有无利息，借款人本人签名；金额大的走银行或微信转账留痕，别给现金。别觉得\"写借条伤感情\"——真到要不回来的那天，能救你的只有那张纸和转账记录。反过来，你自己借钱时也照此办理，对双方都好。借条上务必写全姓名和身份证号并核对，重名的人不少，光一个名字可能说不清是谁。", "收益": "《中华人民共和国民法典》合同编第十二章\"借款合同\"规定：借款合同是借款人向贷款人借款、到期返还借款并支付利息的合同（第 667 条）；自然人之间的借款合同，自贷款人提供借款时成立（第 679 条）；禁止高利放贷，借款的利率不得违反国家有关规定（第 680 条）。借条、转账记录是主张权利的关键证据。", "证据等级": "A", "来源": "全国人大《中华人民共和国民法典》合同编第十二章\"借款合同\"（第 667、679、680 条等）.", "备注": "受益人是自己。对方拖延不还时注意诉讼时效——及时主张权利并留下催收记录，别拖到\"钱还能要、权利已过期\"。"}, "extra": []}, {"n": 26, "title": "担保与\"帮忙签字\"：你可能就此背上几万元", "tag": {"money": "高", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱，花的是签字那一秒的警惕。", "说人话": "帮人做担保、或在别人递来的合同上\"就签个字帮个忙\"，是学生最无意识背上几万元债务的方式。担保不是\"见证\"，而是承诺——对方不还，你可能要替他还。签字前一定问三件事：我签的是什么角色（见证人还是保证人）、是哪种保证、最坏情况我要还多少钱。答不上来就别签。也别当\"名义借款人\"帮同学办贷款，钱他拿去花、债记在你名下，是最典型的学生债务陷阱。", "收益": "《中华人民共和国民法典》合同编第十三章\"保证合同\"规定：保证分为一般保证和连带责任保证；当事人对保证方式没有约定或者约定不明确的，按照一般保证承担保证责任（第 686 条）；连带责任保证下，债权人可以请求债务人履行债务，也可以直接请求保证人在其保证范围内承担保证责任（第 688 条）。\"见证人\"与\"保证人\"法律后果完全不同。", "证据等级": "A", "来源": "全国人大《中华人民共和国民法典》合同编第十三章\"保证合同\"（第 681、686、688 条等）.", "备注": "受益人是自己。签任何文件前，先看清自己是以什么身份签、签在哪一行；不确定就拍照回去问清楚再签。"}, "extra": []}, {"n": 27, "title": "合租与租房：合同、押金、二房东", "tag": {"money": "高", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "常见\"押一付三\"，月租通常高于宿舍。", "说人话": "租房三件事：① 合同写清租期、租金、押金数额与退还条件、维修责任、违约怎么处理；② 押金尽量走转账留痕，退租时当场验收、当场退；③ 警惕\"二房东\"——他不是产权人，转租要经房东同意，否则可能你交了钱却被真正的房东请出去。签字前确认对方有没有权出租，最好看一眼房产证或房东的授权。先问清学校对校外住宿的报备要求，再签租约。", "收益": "《中华人民共和国民法典》合同编第十四章\"租赁合同\"规定：租赁合同的内容一般包括租赁物名称、数量、用途、租赁期限、租金及其支付期限和方式、租赁物维修等条款（第 703 条）；承租人经出租人同意可以将租赁物转租给第三人，未经同意转租的，出租人可以解除合同（第 716 条）；租赁期限届满，承租人应当返还租赁物（第 733 条）。押金退还条件应在合同中明确。", "证据等级": "B", "来源": "全国人大《中华人民共和国民法典》合同编第十四章\"租赁合同\"（第 703、716、733 条等）；各高校学生校外住宿管理规定（通行做法）.", "备注": "地区差异。部分高校要求学生校外住宿须向学校报告备案（出于安全与学籍管理需要），先问清学校要求再签租约。"}, "extra": []}, {"n": 28, "title": "这几条边界，越早立越省事", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱。", "说人话": "把这一章压成几句能记住的话：宿舍的事开学就说清，别攒到翻脸；公共空间\"用完就顺手\"；不满当面说，别让中间人传话；室友情绪异常就直接问，不承诺保密，该打 12356 就打；社团留能真做事的，退出要交接；借证件和账号一律说不；借钱写借条、签字前先看清自己是什么身份；任何涉及人身安全和法律的事，都别自己扛。边界不是冷漠，是让关系能长期处下去的规则。记住三个求助入口：辅导员、学校保卫处、校心理健康教育与咨询中心——手机里先存好。", "收益": "提前确立边界、留好凭证、遇事走正式渠道，是处理人际与法律风险的通行做法（无统一数据）。这些做法在冲突发生后能显著降低处理成本。", "证据等级": "C", "来源": "本章的汇总（依据见第 1—27 条各自的来源；属操作提示，非文献结论）.", "备注": "受益人是自己。心理援助热线 12356 也存一下——它 24 小时可打，关键时刻不用现找号码。"}, "extra": []}]}, {"file": "14-恋爱.md", "title": "14. 恋爱：从喜欢一个人到保护自己", "entries": [{"n": 1, "title": "先算清恋爱的两笔账：每周多少小时、每月多少钱", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，花一个记账的晚上。", "说人话": "恋爱真实的成本不是\"送了多少礼物\"，是时间和钱的持续流出。每周见面、通勤、聊天、吵架和好，加起来常是十几个小时；吃饭、交通、礼物、节日，一个月下来常常超过伙食开销。做两件事就能看清：把\"每周投入的小时数\"和\"每月的支出\"各记一个月。记完你会得到一个数字，而不是一个模糊的\"还行\"。算账不是小气，是把\"我愿意为这段关系付多少\"从感觉变成明码标价——先知道价格，再决定买不买、买多少。这个动作本身也能帮你在关系里保持清醒：你到底是在投入，还是在被动地被消耗。", "收益": "时间和金钱都是有限资源，投入一段关系意味着放弃其他用途，经济学用\"机会成本\"描述这种\"选了 A 就放弃的 B\"；把隐性投入显性化（记小时数、记支出）是个人资源配置的通行做法。同一份时间投在课程、实习或技能上通常可累积为可见产出，投在关系上则取决于关系质量，二者不可直接换算，但都应纳入判断。", "证据等级": "C", "来源": "机会成本与资源显性化的通行做法（经济学通行概念）；属个人管理方法，无全国统一数据。", "备注": "受益人是自己。粗糙基线：交通 + 餐饮 + 礼物按月统计；时间按\"小时/周\"记，连\"聊天与情绪消耗\"一起算。"}, "extra": []}, {"n": 2, "title": "恋爱会不会挤掉保研、实习和复习：先把机会成本算出来", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，花的是做取舍的清醒。", "说人话": "保研看的是前几学期的学分加权成绩与排名，实习要的是每周固定的在岗时间，考研要的是连续几个月的大块复习时间——这三样都对\"时间是否连续、是否稳定\"很敏感。恋爱本身不必然挤掉它们，真正挤掉的是\"随时被打断\"。所以在关键学期先明确一件事：哪些时段是留给学业的硬边界（比如每个工作日晚 7 点到 10 点），把它像课表一样固定下来，再安排关系。不是\"为学业牺牲感情\"，是别让不可逆的那件事被可以延后的事吃掉。", "收益": "多数高校推免（保研）资格按前几学期成绩排名确定，且对无不及格课程、外语达标有硬性要求，成绩具有累积性、后期很难追回；考研与实习同样依赖连续时间投入。在关键学期为高优先事项设定固定时段，是常见的时间管理方法；具体推免规则以本校办法为准。", "证据等级": "B", "来源": "教育部 (2017). 普通高等学校学生管理规定（考核与成绩记载）；各高校推免工作办法（校际差异大，以本校文件为准）。", "备注": "受益人是自己。判断标准很实在：如果一段关系让你长期无法保证连续复习时间，那么被牺牲的不是\"恋爱\"，是\"选择权\"。相关规则见第 4 章。"}, "extra": []}, {"n": 3, "title": "异地恋：多出来的不是感情难度，是机票、时间和沟通成本", "tag": {"money": "中", "time": "多", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "交通与通讯费用，以及双倍的通勤时间。", "说人话": "异地恋额外的成本是三样可量化的东西：往返交通费（高铁、机票，按学期算）、路上的时间（一个来回常常一天）、以及\"信息不同步\"带来的沟通成本——你不知道对方今天发生了什么，只能靠转述，误会更容易积压。它的收益也很具体：你有完整的时间做自己的事，不受日常牵扯。所以异地不是\"更苦\"或\"更纯粹\"，是一笔更贵的账：钱多花、时间多花、日常陪伴少了。把这笔账算清楚，再决定维持多久、多久见一次、谁跑。别用\"感情够深就能扛\"代替算账——钱和时间是硬约束。", "收益": "异地关系中见面频率、交通支出与沟通质量是影响关系稳定的实际变量；将\"见面频率、预算、谁跑\"提前约定，属个人关系管理的通行做法（无全国统一数据）。把不可量化的\"感情\"换成可执行的约定，能减少后续摩擦。", "证据等级": "C", "来源": "异地关系成本构成的通行做法（属通行做法）。", "备注": "受益人是自己。可操作的一条：把\"多久见一次、谁跑、路费怎么分\"写成可执行的约定，比反复讨论\"你想不想我\"更实在。"}, "extra": []}, {"n": 4, "title": "同班、同课题组谈恋爱：先想清楚\"分手之后怎么继续上课\"", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，花的是提前想清\"退出成本\"。", "说人话": "同班、同宿舍楼、同课题组谈恋爱的特殊之处，是\"退出成本\"高：分手后还要一起上同一门课、开同一个组会、坐同一间实验室，甚至共享同一个导师和同一批同学。开始之前先想清楚三件事：分手后能不能正常上课和共事、共同的朋友圈怎么处、有没有需要\"分家\"的共享事务（共同的群、共同的账、共同的课题任务）。不是不能谈，而是要把\"最坏情况\"提前想一遍——把退出路径想清楚的人，反而更敢开始，也更容易在出现问题时及时止损。", "收益": "亲密关系中的\"投资模型\"（Rusbult, 1980）认为，承诺水平由满意度、替代选择的质量、以及已投入的资源共同决定；当退出成本（已投入、共同社交圈、共享事务）很高时，人会更倾向维持关系，即使满意度已经下降——这正是\"同班、同组\"关系需要提前评估退出成本的原因。", "证据等级": "B", "来源": "Rusbult CE (1980). Commitment and satisfaction in romantic associations: A test of the investment model. *Journal of Experimental Social Psychology*.", "备注": "受益人是自己。开始前问自己一句：\"如果三个月后分手，我们能一起把这门课、这个组会、这批朋友正常处完吗？\""}, "extra": []}, {"n": 5, "title": "恋爱里的钱怎么处理：AA、共同消费，以及借钱要不要写借条", "tag": {"money": "中", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，花的是开口谈钱的尴尬。", "说人话": "恋爱中的金钱纠纷，多数不是因为数额大，而是因为\"没说过\"。分三件事处理：① 日常共同消费（吃饭、看电影）——提前定一个规则（AA、轮流请、或按收入比例），规则一旦定了就别每次临时计较；② 大额共同支出（旅行、租房）——留转账记录，谁出多少记清楚；③ 借钱给对方——写借条。借条上写清双方姓名、金额、出借日期、还款期限，借款人本人签名，款项走转账留痕。别信\"我们之间还写这个太见外\"——真要不到的那天，能救你的只有那张纸和转账记录。反过来，你向别人借钱时也照此办理，是对双方都负责。", "收益": "《中华人民共和国民法典》合同编规定：借款合同是借款人向贷款人借款、到期返还借款并支付利息的合同（第 667 条）；自然人之间的借款合同，自贷款人提供借款时成立（第 679 条）；禁止高利放贷，借款利率不得违反国家有关规定（第 680 条）。借条、转账记录是主张债权的关键证据；普通诉讼时效一般为三年，自权利人知道或者应当知道权利受到损害及义务人之日起计算。", "证据等级": "A", "来源": "全国人大《中华人民共和国民法典》合同编第十二章\"借款合同\"（第 667、679、680 条）及总则诉讼时效相关条款。", "备注": "受益人是自己。写借条时核对姓名与身份证号（重名的人不少），约定清楚的还款日期比\"你方便时还我\"更可执行。"}, "extra": []}, {"n": 6, "title": "把需求说清楚，而不是等对方猜", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，花的是把感受翻译成请求的练习。", "说人话": "很多争吵的起点不是\"谁错了\"，是\"我以为你懂\"。等对方猜的代价是：猜错→失望→攒着不说→某天因为一件小事爆发。可操作的替换是\"具体请求\"：把\"你根本不在乎我\"换成\"这周我压力很大，希望你晚上能留半小时听我说说\"。公式是\"描述事实 + 说明影响 + 提出具体请求\"。具体请求有可执行、可拒绝、可验证三个好处：对方知道该做什么，你也能知道有没有被满足。这不是矫情，是降低沟通的出错率。说得越具体，对方猜错的空间就越小，你们为同一件事反复吵的概率也越低。", "收益": "把模糊指责改写为具体、可执行请求（\"事实—影响—请求\"结构），是沟通训练中的通行做法；相较于评价对方人格，描述行为与自身感受更不易触发对抗（属通行沟通做法，无统一数据）。", "证据等级": "C", "来源": "非暴力沟通与\"具体请求\"表达的通行做法（属通行做法）。", "备注": "受益人是自己。练习句：用\"我需要……\"开头，比用\"你为什么总是……\"开头，成功率通常高得多。"}, "extra": []}, {"n": 7, "title": "吵架的方式比吵架的次数更决定关系走向", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱。", "说人话": "任何关系都会吵——决定关系的不是\"有没有冲突\"，是\"怎么吵\"。有四个把小事升级成大事的动作：指责对方人格（\"你就是自私\"）、轻蔑（翻白眼、嘲讽）、急着防卫（\"我还不是因为你……\"）、关上门不说话（冷暴力、消失）。它们针对的是人，不是事。有效的吵法是：先针对具体的事（\"昨天你答应的事没做到\"），说清它对你的影响，再一起想一个下次怎么办。情绪过载时可以暂停——提前说好\"我们先停 20 分钟，冷静了再谈\"，比硬吵到天亮有用得多。吵完能不能回到同一件事上，比吵得多凶更重要。", "收益": "Gottman 与 Levenson 对夫妻冲突的追踪研究发现，批评、蔑视、防卫、回避这类负面互动模式与后续关系解体相关（Gottman & Levenson, 1992）；针对具体行为而非对方人格的争论、以及在情绪过载时暂停，是冲突管理的通行做法。", "证据等级": "B", "来源": "Gottman JM, Levenson RW (1992). Marital processes predictive of later dissolution: Behavior, physiology, and health. *Journal of Personality and Social Psychology*, 63(2): 221–233.", "备注": "受益人是自己。\"暂停\"要约定好时间（20 分钟、明天晚饭后），否则\"暂停\"就变成了消失。"}, "extra": []}, {"n": 8, "title": "边界：时间、社交、手机、隐私，哪些不能让", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，花的是明确说\"不\"的勇气。", "说人话": "亲密不等于没有边界。四样东西要保持属于自己：① 时间——你需要独处、学习、见朋友的时间，不必每时每刻报备；② 社交——你有权保留自己的朋友，恋人没有权力替你决定跟谁来往；③ 手机——密码是你的，随时被检查不是\"在乎\"，是控制；④ 隐私——病历、家庭情况、聊天记录、身体，都属于你，别人无权替你公开或索取。边界不是把对方推开，是让关系有可持续的空间。可以练习一句\"这件事我不舒服，我希望……\"，在越界刚发生时就说出来，比忍到爆发省事得多。", "收益": "清晰、稳定的个人边界有助于降低关系中的控制与冲突，是关系与自我管理的通行做法（无统一数据）。把\"手机、行踪、社交\"纳入被监控范围，是控制型关系的典型特征之一（见第 11 条）。", "证据等级": "C", "来源": "个人边界与优先级管理的通行做法（属通行做法，无统一数据）。", "备注": "受益人是自己。判断一条边界是否合理：它是否让你更安心地做自己，而不是让你越来越怕做错。"}, "extra": []}, {"n": 9, "title": "为什么我总是患得患失：依恋类型给了一个解释框架", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，花的是自我观察的时间。", "说人话": "为什么同样一段关系，有人很稳、有人一整天没收到消息就开始慌？一个被广泛使用的解释是\"依恋类型\"：安全型对亲密和独立都比较自在；焦虑型容易担心被抛弃、需要反复确认；回避型在关系太近时想逃、习惯用疏远保护自己。它来自早期照料关系，但成年后并非不能调整——意识到\"我现在是被依恋模式牵着走\"，本身就能让你从\"情绪拉着我跑\"变成\"我看到情绪在跑\"。焦虑型可以练习直接说需求（见第 6 条），回避型可以练习留一句\"我需要点时间，但我会回来\"。它描述倾向，不判决结局。", "收益": "Hazan 与 Shaver 提出，成人浪漫关系可以被理解为一种依恋过程，个体的依恋风格（安全型、焦虑型、回避型）会影响其对亲密与分离的反应（Hazan & Shaver, 1987）。依恋类型是描述性框架，不是给人贴标签或决定关系结局的宿命。", "证据等级": "B", "来源": "Hazan C, Shaver P (1987). Romantic love conceptualized as an attachment process. *Journal of Personality and Social Psychology*, 52(3): 511–524.", "备注": "受益人是自己。类型不是\"我天生就这样所以改不了\"，而是\"我容易这样，所以我可以提前准备对策\"。"}, "extra": []}, {"n": 10, "title": "\"是不是合适\"怎么判断：看相处后的状态，而不是心动强度", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，花的是把\"感觉\"换成\"观察\"的时间。", "说人话": "心动强度高不高，和你适不适合长期相处，是两件事。一个更靠谱的判断方式是看\"和这个人在一起之后，你变成了什么状态\"：睡眠、食欲、学习效率是变好还是变差？你敢不敢说真实想法，还是总要揣摩对方脸色？你的朋友和家人还在不在身边？吵架之后问题是被解决，还是被压下去？心理学里常引用 Sternberg 的爱情三角理论，把爱情拆成亲密（亲近与联结）、激情（心动与吸引）、承诺（长期维系的意愿）三个成分——激情最容易来也最快退，亲密和承诺才是长期关系的地基。用这三个成分给自己打个分，比反复问\"我到底有多爱他\"清楚得多。", "收益": "Sternberg 的爱情三角理论（Sternberg, 1986）提出，爱情由亲密、激情、承诺三种成分构成，不同成分的组合对应不同类型的爱情；据此评估一段关系时，应同时看三种成分的现状与变化，而不是只看激情强度。", "证据等级": "B", "来源": "Sternberg RJ (1986). A triangular theory of love. *Psychological Review*, 93(2): 119–135.", "备注": "受益人是自己。一个低成本自检：写下\"和 TA 在一起之后，我睡得更好还是更差、成绩更好还是更差、朋友更多还是更少\"。"}, "extra": []}, {"n": 11, "title": "情感操控（PUA）的识别信号", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，花的是承认\"这段关系有问题\"的勇气。", "说人话": "健康的喜欢会让你更自在，操控会让你更自我怀疑。以下信号出现得越多，越需要警惕：① 反复贬低——\"除了我没人要你\"\"你怎么这么笨\"；② 隔离——让你和朋友、家人疏远，说\"他们都不懂你\"；③ 查手机、查行踪、要求实时报备；④ 用爱绑架——\"你要是爱我就……\"（删好友、借钱、发照片、放弃机会）；⑤ 忽冷忽热——今天热情明天消失，让你不断自我检讨\"是不是我做错了\"；⑥ 把所有问题都归到你身上。识别它不是为了马上定罪，而是为了把\"是不是我不好\"换成\"这是不是一种控制\"。一旦能这样提问，你就从被牵着走，变成了在观察这段关系。", "收益": "控制型关系常伴随贬低、隔离、监控、情感勒索、间歇性强化（忽冷忽热）等模式，这些特征在关系暴力与心理虐待的相关研究与干预实践中被反复识别；识别模式有助于把\"我做错了什么\"重新框定为\"这是一段需要重新评估的关系\"（属通行做法与研究共识方向，无统一数字）。", "证据等级": "C", "来源": "情感操控与心理虐待识别的通行口径（属通行做法，无统一文件依据）。", "备注": "受益人是自己。判断标准不是\"对方是不是坏人\"，是\"这段关系让你更自在，还是让你越来越小\"。"}, "extra": []}, {"n": 12, "title": "分手后被纠缠、跟踪、骚扰：可以申请人身安全保护令", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，花的是收集证据和走程序的精力。", "说人话": "分手之后被反复纠缠、跟踪、堵人、威胁、骚扰，很多人以为\"没结婚、没法管\"。这是过时的想法。2023 年 1 月 1 日起施行的《中华人民共和国妇女权益保障法》（2022 年修订）第二十九条明确规定：禁止以恋爱、交友为由或者在终止恋爱关系、离婚之后，纠缠、骚扰妇女，或者泄露、传播妇女隐私和个人信息；妇女遭受上述侵害或者面临上述侵害现实危险的，可以向人民法院申请人身安全保护令。也就是说，即使没有婚姻关系、甚至已经分手，只要有现实的侵害危险，就能向法院申请保护令。另外，《中华人民共和国反家庭暴力法》第三十七条规定：家庭成员以外共同生活的人之间实施的暴力行为，参照本法规定执行——同居关系同样适用。要做的是：保留证据（聊天记录、录音、报警回执、证人），到申请人或被申请人居住地、暴力发生地的人民法院提出申请。", "收益": "《中华人民共和国妇女权益保障法》（2022 年修订，2023 年 1 月 1 日施行）第二十九条将\"恋爱、交友或终止恋爱关系、离婚后纠缠骚扰妇女\"纳入可申请人身安全保护令的范围；《中华人民共和国反家庭暴力法》（2016 年 3 月 1 日施行）第三十七条规定家庭成员以外共同生活的人之间的暴力参照本法执行；该法第十六条规定，家庭暴力情节较轻、依法不给予治安管理处罚的，由公安机关对加害人给予批评教育或者出具告诫书——告诫书可以作为证据。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国妇女权益保障法》（2022 年修订）第二十九条；全国人大常委会《中华人民共和国反家庭暴力法》第十六条、第三十七条。", "备注": "受益人是自己。有紧急危险先打 110；保护令可以单独申请，不需要先提起离婚或其他诉讼。"}, "extra": []}, {"n": 13, "title": "同居情形与证明标准：为什么保护令比一般官司\"更容易拿到\"", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "很多人不知道两个关键点。第一，什么叫\"家庭暴力\"。《最高人民法院关于办理人身安全保护令案件适用法律若干问题的规定》（法释〔2022〕17 号，2022 年 8 月 1 日施行）第三条明确：家庭成员之间以冻饿或者经常性侮辱、诽谤、威胁、跟踪、骚扰等方式实施的身体或者精神侵害行为，属于家庭暴力——也就是说，精神侵害（长期辱骂、威胁、跟踪）也算，不只是动手。第二，也是最重要的一点，这份司法解释第六条把签发人身安全保护令的证明标准定为\"存在较大可能性\"，低于普通民事诉讼要求的\"高度可能性\"。翻译成人话：你不用把证据做到\"几乎百分之百确定\"，只要能证明\"你面临家暴现实危险有较大可能\"，法院就可以签发。这就是为什么在被纠缠、跟踪、威胁时，保护令往往比打一场普通官司更快、更可行。", "收益": "《最高人民法院关于办理人身安全保护令案件适用法律若干问题的规定》（法释〔2022〕17 号，2022 年 8 月 1 日施行）第三条将以冻饿、经常性侮辱、诽谤、威胁、跟踪、骚扰等方式实施的身体或精神侵害纳入\"家庭暴力\"范畴；第六条规定，人民法院根据当事人的申请及提交的证据，认为申请人面临家庭暴力现实危险的存在具有较大可能性的，可以作出人身安全保护令——这一\"较大可能性\"标准低于一般民事诉讼的\"高度可能性\"，举证负担相对更轻。", "证据等级": "A", "来源": "最高人民法院 (2022). 关于办理人身安全保护令案件适用法律若干问题的规定（法释〔2022〕17 号）. <https://www.court.gov.cn/>", "备注": "受益人是自己。报警回执、告诫书、医院诊断、聊天与通话记录、证人证言，都可以用来证明\"较大可能性\"；越早开始留存越好。"}, "extra": []}, {"n": 14, "title": "私密照片和视频：不要拍、不要存、不要配合\"留个纪念\"", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，代价是学会拒绝。", "说人话": "最省事的安全策略不是\"事后维权\"，是\"从一开始就不产生\"。任何以\"留个纪念\"\"证明你爱我\"\"只是我们俩看\"为由索要私密照片、视频或要求视频裸聊的，都可以直接拒绝，因为一旦离手，你就失去了对它的控制——随时可能被泄露、被要挟。如果已经发生过：不要配合任何\"再发一张就删\"的条件，保留全部聊天与转账记录，立即报警。传播他人私密影像属于侵害隐私；以此要挟财物的可能构成敲诈勒索；传播淫秽物品情节严重的，还可能承担刑事责任。这不是\"你活该\"，法律保护的是被侵害的人。对方越是催得急、越是拿感情施压，越说明这件事的风险不在你身上，而在他的意图上。", "收益": "《中华人民共和国民法典》第一千零三十二条规定自然人享有隐私权，第一千零三十三条规定除法律另有规定或者权利人明确同意外，任何组织或者个人不得拍摄、窥视他人身体的私密部位，不得拍摄、窥视、窃听、公开他人的私密活动，不得处理他人的私密信息；散布他人隐私可依《中华人民共和国治安管理处罚法》予以拘留、罚款；以私密影像要挟财物可能触犯《中华人民共和国刑法》敲诈勒索罪（第二百七十四条），传播淫秽物品情节严重的可能触犯传播淫秽物品罪（第三百六十四条）。", "证据等级": "A", "来源": "全国人大《中华人民共和国民法典》第一千零三十二条、第一千零三十三条；全国人大常委会《中华人民共和国治安管理处罚法》（侵犯人身权利相关条款）；全国人大
