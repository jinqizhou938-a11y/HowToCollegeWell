本校学籍、学分按协议认定）；② 自费访学/访问学生（自己交对方学费、以旁听或修课为主，学分认定更麻烦）；③ 中介包装的\"名校短期项目\"（贵、学分少、主办方未必是该校官方）。价格差能到十几万，报名前必须弄清自己属于哪一种。", "收益": "校际交换项目一般依据两校合作协议执行，学生通常免交对方学费、仍在本校注册并按其规定认定学分；自费访学或访问学生需自行承担对方学费，学分认定以本校规定为准；市场上部分\"名校项目\"由第三方机构承办，非校方官方项目，学分与经历价值有限。", "证据等级": "C", "来源": "各高校交换生与自费访学管理办法；留学市场的通行做法（各校与各项目差异大，属通行做法）。", "备注": "受益人是自己。识别法：看招生简章落款是\"XX 大学国际合作与交流处\"还是某教育公司的名字。"}, "extra": []}, {"n": 17, "title": "暑校与短期项目：适合试水，不适合当\"经历\"刷", "tag": {"money": "中", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "短则一两周，费用从几千到几万不等（国外暑校更贵）。", "说人话": "短期项目的好处是不占一学期、能试水某个方向、顺便看看学校；坏处是贵、学分认定通常有限，而且同类项目太多，简历上一段\"参加某暑校\"的边际价值很低。适合目标明确的人（比如想申请对方学校的研究生，先去混个脸熟），不适合\"随便去玩玩\"。", "收益": "国内外高校及机构每年开设暑期学校，形式包括课程、科研实习、语言项目；学分是否认定取决于本校规定，多数短期项目不承诺学分转换。判断项目价值的关键是\"有没有产出\"（一份研究报告、一封来自任课教授的推荐信、一个后续可延续的课题），而非\"去过\"。", "证据等级": "C", "来源": "各高校暑期项目通知与报名说明（属通行做法，各项目差异大）。", "备注": "谨慎。判断法：如果一个项目的宣传里只有\"名校\"和\"证书\"，没有\"能带走什么产出\"，就把它当旅游产品看。"}, "extra": []}, {"n": 18, "title": "交学费之前，先查认证院校名单与留学预警", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，半小时。", "说人话": "出国留学最大的风险不是贵，是\"读完回国不认证\"。查两步：① 教育部教育涉外监管信息网（jsj.moe.gov.cn）的\"国外院校\"名单，这是官方依据；② 中国留学服务中心（中留服）的认证院校查询（yxcx.cscse.edu.cn）。中留服的认证范围以\"最近五年内出具过认证书的院校\"为准，长期无认证记录的会被移出名单，所以名单是动态的。另外，教育部每年发布\"留学预警\"，中留服还会对个别院校启动\"加强认证审查\"——被列入的院校，认证处理期限原则上不少于 60 个工作日。", "收益": "教育部教育涉外监管信息网（jsj.moe.gov.cn）由教育部国际合作与交流司主管，公布认可的海外院校名单并发布留学预警；中国留学服务中心（cscse.edu.cn）提供国（境）外学历学位认证，认证院校名单按最近五年出具认证书的院校动态维护。据中留服公告，对认证数据异常、举报频繁的部分国外院校，将依《国（境）外学历学位认证办法》启动加强认证审查，处理期限原则上自提交申请之日起不少于 60 个工作日，并建议审慎选择。", "证据等级": "A", "来源": "教育部教育涉外监管信息网 jsj.moe.gov.cn；中国留学服务中心认证院校查询 <https://yxcx.cscse.edu.cn/rzyxmd>；教育部留学服务中心关于对部分国外院校学历学位认证加强认证审查的公告（2024）.", "备注": "受益人是自己。两步都查完再交钱。特别提醒：市场上一些\"低门槛、免语言、快速毕业\"的海外硕士项目，正是加强审查的高发区。"}, "extra": []}, {"n": 19, "title": "中外合作办学：院校合规不等于\"这个项目\"合规", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，十分钟。", "说人话": "读\"3+1\"\"2+2\"\"4+0\"这类中外合作办学项目，要额外查一步：这个项目本身有没有备案。海外学校在监管网有名字，只说明学校合规；你读的这个合作项目，还要在教育部中外合作办学监管工作信息平台上查得到批准书或备案。查不到的项目，毕业时学历认证会出问题。", "收益": "中外合作办学实行审批与备案管理，须符合《中华人民共和国中外合作办学条例》。教育部中外合作办学监管工作信息平台（crs.jsj.edu.cn）提供\"教育部审批和复核的机构及项目名单\"与\"由地方审批报教育部备案的机构及项目名单\"的查询，可按中方高校、外方高校、专业、国别检索。选择项目时应核对项目是否在上述名单内，并注意其学历学位授予与认证安排。", "证据等级": "B", "来源": "教育部中外合作办学监管工作信息平台 crs.jsj.edu.cn；《中华人民共和国中外合作办学条例》（国务院令第 372 号）及其实施办法.", "备注": "受益人是自己。判断法：招生老师说\"学校是认证名单里的\"，你要接着问\"这个合作项目有没有批准书编号、在 crs.jsj.edu.cn 上查得到吗\"。"}, "extra": []}, {"n": 20, "title": "语言成绩 2 年有效期：卡着申请时间考，别在大一考完", "tag": {"money": "高", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "雅思/托福一场报名费通常两千元上下，加备考时间。", "说人话": "雅思和托福的成绩有效期都是\"自考试日起 2 年\"，不是\"从出分日算\"。很多人的错法是：大一\"有空先考着\"，到大四申请时发现已经过期，等于白白花了两千块和几个月。正确做法是倒推：如果大三下申请、大四入学，那么最晚在大三上就要考出可用成绩，最好留出一次重考的机会。交换、保研、留学三条路对语言成绩的时间要求不一样，别用一套时间表。", "收益": "雅思（IELTS）成绩自考试之日起 2 年内有效（学术类与培训类同）；托福 iBT 成绩自考试之日起 2 年有效（ETS 规定），过期后不再提供成绩查询与送分服务。多数海外院校要求申请时提交有效期内的成绩，部分院校还要求入学时成绩仍在有效期内；保研、交换的语言门槛常见为六级 425 分以上，或托福 85、雅思 6.0 以上。", "证据等级": "B", "来源": "IELTS 官方关于成绩有效期的说明 <https://www.ielts.org/>；ETS 关于 TOEFL iBT 成绩有效期的说明 <https://www.ets.org/toefl>；各高校保研与交换的语言门槛（各校差异）。", "备注": "受益人是自己。如果只是\"想练英语\"，用免费资源就够；花钱考之前，先确认目标清单里有没有一处写着\"需要这个成绩\"。"}, "extra": []}, {"n": 21, "title": "竞赛、专利、论文能折算学分：先查本校的认定范围和上限", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱，但要提前审批。", "说人话": "不少学校允许把创新创业、学科竞赛获奖、专利、论文、社会实践等折算成学分。这是\"顺手多拿学分\"的渠道，但三个变量各校不同：能折哪些、折多少（比例和上限）、找谁审批。最常见的亏法是先花了钱和时间做完，才发现本校不认这一项，或者已经超出折算上限。", "收益": "《普通高等学校学生管理规定》明确，学校可以对学生参加创新创业等活动以及发表论文、获得专利授权等与专业学习相关的经历、成果，折算为学分。教育部在对全国政协提案的答复（教提案〔2017〕第 29 号）中重申了学分折算与转换的制度安排。具体认定范围、比例上限和审批流程由各校规定。", "证据等级": "B", "来源": "教育部 (2017). 普通高等学校学生管理规定（第三章关于成绩考核与学分的规定）；教育部对全国政协十二届五次会议提案的答复（教提案〔2017〕第 29 号）. <https://www.moe.gov.cn/jyb_xxgk/xxgk_jyta/jyta_xueshengsi/201802/t20180228_328160.html>", "备注": "受益人是自己。动作顺序：先查本校《创新创业学分认定办法》→ 确认目标赛事/成果在不在目录里 → 再决定投多少时间。"}, "extra": []}, {"n": 22, "title": "休学创业与退役复学：转专业、弹性学制上有政策倾斜", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "如果你打算休学一年去创业，或者去当兵，记住政策是站在你这边的：休学创业或退役后复学的学生，因自身情况需要转专业的，学校应当优先考虑；休学期限一般以一年为限、累计不超过两年；应征入伍的，学校保留其入学资格或学籍至退役后两年。也就是说，\"去当兵再回来转专业\"在制度上是一条走得通的路。", "收益": "《普通高等学校学生管理规定》第二十一条规定，休学创业或退役后复学的学生，因自身情况需要转专业的，学校应当优先考虑；第五节\"休学与复学\"规定休学一般以一年为限、累计不得超过两年，应征参加中国人民解放军（含中国人民武装警察部队）的，学校保留其入学资格或者学籍至退役后两年。各校在此基础上实行弹性学制，允许学生在最长学习年限内完成学业。", "证据等级": "A", "来源": "教育部 (2017). 普通高等学校学生管理规定（第二十一条、第五节\"休学与复学\"）.", "备注": "受益人是自己。这条和第 1 章第 2 条（保留学籍/义务兵资助）配套看：当兵本身还有学费补偿等账面收益。"}, "extra": []}, {"n": 23, "title": "换赛道最便宜的一步：先修一门目标专业的核心课", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，只占一门课的时间。", "说人话": "想转专业、想辅修、想跨考，最省钱的做法是：选一门目标专业的核心课、读一本它的入门书、找一个该专业的人聊一小时。用一学期验证\"我是真的喜欢，还是只想从现状逃跑\"。逃跑型的转专业，转过去半年后往往照样不开心，因为问题不在专业；而喜欢型的，一门课就够你确认。", "收益": "转专业的成本（可能降级、补修、延毕）具有不可逆性，因此\"先小成本验证再决定\"优于\"先投入再后悔\"。职业与生涯规划领域普遍建议通过课程试修、信息访谈（informational interview）等方式验证方向；本书的四种资源框架中，这一步几乎不消耗金钱、时间与毅力，只消耗一学期的一门课。", "证据等级": "C", "来源": "属通行做法与本书作者的判断（无单一文件依据）。", "备注": "受益人是自己。验证清单：这门课我是越上越想深入，还是越上越想逃？如果是后者，先分辨是\"专业不对\"还是\"我最近状态不对\"。"}, "extra": []}, {"n": 24, "title": "换赛道决策表：四列填完，多数纠结会变成算术题", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，一个晚上。", "说人话": "把每条选项（不换、转专业、辅修、第二学士学位、交换、微专业）都填成四列：① 要花几年、② 要花多少钱、③ 门槛是什么（绩点/考试/语言/名额）、④ 出口是什么（能考什么岗位、能申什么研、能进什么行业）。填完之后你会发现，很多\"必须转\"的焦虑其实是因为没算账；也有些\"再忍忍就好\"的自我安慰，一算成本立刻不成立。", "收益": "把换赛道当成一次投资决策（比较成本与预期收益、评估不可逆程度）是职业规划领域的通行框架；本书的四列可直接复用于任何\"要不要换\"的决策。核心是区分三类成本：可逆成本（时间、金钱）、半可逆成本（学分、绩点）、不可逆成本（学制年限、应届生身份）。", "证据等级": "C", "来源": "由本章以上各条汇总的判断方法（属本书作者的整理）。", "备注": "受益人是自己。这也是本章性价比最高的一条：不花钱、不花时间，却能把后面几年的方向定得更准。"}, "extra": []}]}, {"file": "06-考证与技能.md", "title": "6. 考证与技能：哪些真的回本，哪些是智商税", "entries": [{"n": 1, "title": "考证第一步：查它在不在《国家职业资格目录》里", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，十分钟。", "说人话": "在中国，\"职业资格\"是有目录的——只有目录内的事项，才是国家统一设置、统一组织的职业资格。花几千块报班之前，先上人社部网站搜一下这张证在不在目录里；不在目录里的，含金量基本由发证机构自说自话。目录是动态调整的，还能查到哪些证刚刚退出。", "收益": "《国家职业资格目录（2021 年版）》由人力资源社会保障部于 2021 年 11 月 23 日公布，共 72 项职业资格：专业技术人员职业资格 59 项（其中准入类 33 项、水平评价类 26 项），技能人员职业资格 13 项。与 2017 年版相比，职业资格总数减少 68 项、压减比例达 49%；除与公共安全、人身健康等密切相关的工种外，73 项水平评价类技能人员职业资格全部退出目录，不再由政府或其授权单位认定发证，改为社会化职业技能等级认定。", "证据等级": "A", "来源": "人力资源社会保障部 (2021). 国家职业资格目录（2021 年版）及答记者问. <https://www.mohrss.gov.cn/xxgk2020/1_2_x/jd/202112/t20211202_429299.html>", "备注": "受益人是自己。目录里的 72 项可以逐条看去：有\"资格类别\"一列，写着\"准入类\"还是\"水平评价类\"，这一列比证书名称重要得多。"}, "extra": []}, {"n": 2, "title": "准入类和水平评价类：只有准入类是\"无证不得从业\"的硬门槛", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "同样是国家职业资格，两类差别很大。准入类职业资格关系公共利益或涉及国家安全、公共安全、人身健康、生命财产安全，且有法律法规或国务院决定作依据——通俗说就是\"没有这个证，这类工作你不能干\"。水平评价类则是\"证明你的水平\"，人社部门把评价交给行业或社会化机构，不持证也能从事相关岗位。所以真正卡人的岗位，卡的是准入类。", "收益": "按人社部说明，准入类职业资格\"均有法律法规或国务院决定作为依据\"；水平评价类职业资格\"具有较强的专业性和社会通用性\"。目录中典型的准入类包括：教师资格、法律职业资格、注册会计师、注册建筑师、建造师、执业医师、护士执业资格、执业药师、注册消防工程师、注册安全工程师、演出经纪人员资格、导游资格、专利代理师等；水平评价类包括：计算机技术与软件专业技术资格、社会工作者职业资格、会计专业技术资格、经济专业技术资格、资产评估师等。", "证据等级": "A", "来源": "人力资源社会保障部 (2021). 国家职业资格目录（2021 年版）\"资格类别\"列及答记者问；中国就业网 (2021-12-03). 人力资源社会保障部公布 2021 年版《国家职业资格目录》.", "备注": "受益人是自己。判断法：问\"没有这张证，我还能不能从事这个岗位\"。能，就是水平类；不能，才是准入类。"}, "extra": []}, {"n": 3, "title": "目录外的\"职业技能等级证书\"：认人社部门备案的评价机构", "tag": {"money": "低", "time": "中", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "报名费与培训费差别大，从几百元到数千元。", "说人话": "现在大量技能类证书（电工、养老护理员、电子商务师等）已经不在国家职业资格目录里，而是改成\"职业技能等级认定\"——由经过人社部门备案的用人单位或社会培训评价组织来认定、发证。这类证书的含金量取决于\"发证机构有没有备案\"，所以第二步就是去查备案名单，查不到的机构发的证，就当它是培训结业证明。", "收益": "人社部门实施职业技能等级认定，评价机构须经人力资源和社会保障部门备案；技能人才评价工作网公布经备案的职业技能等级认定机构清单，含机构名称、可评价的职业（工种）及等级范围、联系方式。职业技能等级证书信息可在技能人才评价证书全国联网查询系统查询。", "证据等级": "B", "来源": "人力资源社会保障部技能人才评价工作网（osta.mohrss.gov.cn）关于职业技能等级认定机构备案与查询的说明；职业技能等级评价机构公示查询系统. <http://pjjg.osta.org.cn/>", "备注": "地区差异。同一工种的\"证书\"可能由不同机构发放，认可度由此不同。报名前查两件事：机构是否备案、这个工种是否在它的评价范围内。"}, "extra": []}, {"n": 4, "title": "证书真伪核验：两个官方入口，别信图片和公章", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱，两分钟。", "说人话": "拿到证书照片、或者怀疑一张证是假的，都可以自己核验。技能类证书去\"技能人才评价证书全国联网查询\"输证书编号+姓名+证件号；学历学位去学信网查。用这个动作防两件事：一是自己别被假机构骗，二是求职时对方给的\"资质\"也能核实。查询本身免费、全天可查、不受地域限制。", "收益": "技能人员职业资格证书与职业技能等级证书可通过技能人才评价证书全国联网查询系统（zscx.osta.org.cn 和 jndj.osta.org.cn）核验，输入\"证书编号、证件号码、姓名\"中相应组合即可查询，免费、全天、不限地域；在技能人才评价工作网（osta.mohrss.gov.cn）查不到证书信息时，应与颁发证书的评价机构联系，或咨询 12333 服务热线。学历学位与学籍信息可通过中国高等教育学生信息网（学信网，chsi.com.cn）核验。", "证据等级": "A", "来源": "人力资源社会保障部. 职业技能等级证书查询办事指南. <https://www.osta.org.cn/banshizhinan/content4.html>；中国政府网. 职业技能等级证书、技能人员职业资格证书上这儿查. <https://app.www.gov.cn/govdata/gov/202201/06/480434/article.html>；学信网 <https://www.chsi.com.cn/>", "备注": "受益人是自己。注意核验对象是\"证书信息\"而不是\"发证机构名字\"——机构名字可以编，联网可查的证书编号编不了。"}, "extra": []}, {"n": 5, "title": "四六级：报名资格、425 分线和口试，一次说清", "tag": {"money": "低", "time": "中", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "报名费每科次 30 到 40 元上下（各考点略有差异），加上备考时间。", "说人话": "四六级是\"学生专属、便宜、用途广\"的一类证：多数高校把四级和毕业、学位、六级报名挂钩；CET4 达到 425 分及以上才能报考六级。它也是很多单位简历筛选、保研和部分考公岗位的语言门槛。要注意报名资格有范围（全日制在校生和在籍研究生），以及\"报名后旷考可能影响下一次报名资格\"这类校规。", "收益": "全国大学英语四、六级考试（CET）报考资格为全日制普通及成人高等院校本科、专科在校生和在籍研究生；修完大学英语四级课程的可报考四级；CET4 成绩达到 425 分及以上方可报考六级。考试一般每年上半年和下半年各举行一次，报名通过全国大学英语四、六级考试报名网（cet-bm.neea.edu.cn）进行。部分高校规定报名后无故缺考者取消下一次报名资格。", "证据等级": "A", "来源": "全国大学英语四、六级考试（CET）报名公告与各省教育考试院通知（如黑龙江省招生考试院 2025 年下半年报名通知）. <http://www.hljea.org.cn/info/1018/12842.htm>；全国大学英语四、六级考试报名网 <https://cet-bm.neea.edu.cn/>", "备注": "受益人是自己。四六级是性价比很高的一类证：便宜、通用、准备成本可控。唯一要防的是\"大一不想考、大三没得考\"——毕业后就不能再考了。"}, "extra": []}, {"n": 6, "title": "四六级刷分：425 是够用线，500 是好看线，550 是能写进简历线", "tag": {"money": "低", "time": "中", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "每次考试加几十元报名费和一两个月备考。", "说人话": "425 分只解决\"过没过\"，不解决\"好不好看\"。500 分以上，在多数简历筛选里算\"合格\"；550 分以上，才可能被外企或涉外岗位当加分项写进去。所以判断要不要刷分只需要一句：你的目标清单里，有没有哪一处写着比 425 更高的分数要求（保研细则、目标企业招聘、留学项目）？有就刷，没有就不考；重复考三次只为了\"证明自己\"，收益极低。", "收益": "不同场景对四六级分数的要求不同，多无全国统一标准：多数高校的学位外语要求与考研复试语言参考线常设 425 分；部分高校的推免、交换项目与用人单位简历筛选会设更高门槛（如 500 分或 550 分以上）。由于各校各单位自定，判断依据应以目标院校/单位当年文件为准。", "证据等级": "C", "来源": "各高校推免与交换项目外语要求、用人单位招聘条件汇总（属通行做法，无全国统一标准，以目标单位文件为准）。", "备注": "受益人是自己。注意：部分学校对\"刷分\"有限制（如只允许在校期间报考若干次），报名前看清本校规定。"}, "extra": []}, {"n": 7, "title": "全国计算机等级考试（NCRE）二级：拿得快的\"基础技能证\"", "tag": {"money": "低", "time": "中", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "报名费通常几十到一百多元一科次。", "说人话": "计算机二级在不少学校的综测加分、部分岗位报考条件里被当作\"基础技能证明\"，考试周期短、通过率不算低，属于\"顺手拿一个\"的类型。但要清醒：如果你已经能熟练用办公软件、会写代码，它的信号价值就很有限——真正卡人的岗位看的是作品和笔试机试。所以性价比排序是\"二级 MS Office 高于二级编程语言\"，因为后者不如直接做项目。", "收益": "全国计算机等级考试由教育部教育考试院主办，分为多个级别与科目（如二级 MS Office、二级 C 语言、二级 Python 等），证书可作为部分岗位的报考条件或加分依据之一；各校是否将其纳入综测加分、学分认定，由本校规定。", "证据等级": "C", "来源": "教育部教育考试院全国计算机等级考试报考说明；各高校综测加分办法（属通行做法，各校认可度不同）。", "备注": "受益人是自己。判断法：只在你未来的目标清单里出现\"计算机二级\"四个字时才考；没出现，就用作品替代。"}, "extra": []}, {"n": 8, "title": "教师资格证：在校大三可报，笔试—面试—认定三步走", "tag": {"money": "低", "time": "中", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "笔试加面试报名费共几百元，加认定体检费等。", "说人话": "教资的门槛不高，是\"多一条退路\"型的证，且在校生就能提前考。三条关键信息：① 普通高校在校三年级及以上学生可凭在籍学习证明报考；② 学历要求按学段分（幼儿园、小学要专科及以上，初中、高中要本科及以上）；③ 成绩有有效期，笔试单科 2 年、合格证明 3 年，必须在有效期内完成认定。另外要记住：拿证不等于入编，考教师编还要另外竞争。", "收益": "《中小学教师资格考试暂行办法》规定：笔试单科成绩有效期为 2 年；笔试和面试均合格者颁发《中小学教师资格考试合格证明》，有效期 3 年，是申请认定教师资格的必备条件。各省报名公告普遍规定，普通高等学校在校三年级及以上学生可凭在籍学习证明报考（专科层次为应届生）。《教师资格条例》规定，参加教师资格考试有作弊行为的，3 年内不得再次参加。教育部《关于推进师范生免试认定中小学教师资格改革的通知》（教师函〔2022〕1 号）规定，符合条件的师范生可参加学校组织的教育教学能力考核。", "证据等级": "A", "来源": "教育部. 中小学教师资格考试暂行办法（第十八条、第十九条）. <https://ntce.neea.edu.cn/html1/report/1507/1139-1.htm>；各省 2025 年中小学教师资格考试（笔试）报名公告；中小学教师资格考试网 <https://ntce.neea.edu.cn/>", "备注": "各校差异/地区差异。省份对报考年级、居住证、在校生报考地的规定略有不同，以报考省份当年公告为准。想清楚：拿到证之后，你会不会真的去考教师编。"}, "extra": []}, {"n": 9, "title": "普通话水平测试：最便宜、最快能拿到的一张证", "tag": {"money": "低", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "报名费通常几十元，一天考完、几周出成绩。", "说人话": "这是所有证书里最便宜、最快的一种，而且是某些路径的硬条件：教师资格认定对普通话等级有要求（语文教师通常要求二级甲等及以上，其他学科二级乙等及以上，具体看当地认定公告）；播音、主持、部分公务员岗位也有等级要求。2003 年 6 月 15 日以后取得的普通话水平测试等级证书长期有效，不用怕过期。", "收益": "普通话水平测试分三级六等，等级证书全国通用。教师资格认定对普通话等级有要求（一般语文教师不低于二级甲等、其他学科不低于二级乙等，以当地认定公告为准）。按规定，2003 年 6 月 15 日之后取得的普通话等级证书无时限要求（此前取得的执行 5 年有效期）。", "证据等级": "B", "来源": "普通话水平测试管理规定与教师资格认定相关要求（各认定机构公告不同）；普通话水平测试管理规定（教育部令第 16 号）.", "备注": "受益人是自己。想考教资的，顺手把它一起考掉——它比教资笔试便宜、也更容易过。"}, "extra": []}, {"n": 10, "title": "驾照：大学四年是时间成本最低的窗口", "tag": {"money": "中", "time": "中", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "贵的时候三五千，学生团购优惠常有；时间上是每周几个半天，持续一两个月。", "说人话": "驾照本身不难，难的是\"毕业后挤出整块时间\"。工作后请不了那么多假，异地学车还要居住证明，所以大学期间——尤其寒暑假——是学车成本最低的窗口。争议在于\"要不要现在学\"：如果你所在的城市长期不需要开车，可以延后；但从时间账上看，大学确实是最便宜的档位。", "收益": "机动车驾驶证申领需依次通过科目一至科目四考试，取得后长期有效（需按规定换证）。在校期间学车可利用寒暑假集中训练，避免毕业后与工作冲突；部分城市对非本地户籍学员报考有居住证或暂住登记要求。", "证据等级": "C", "来源": "机动车驾驶证申领和使用规定（公安部令第 162 号）及各地驾培机构的通行做法（属通行做法）。", "备注": "争议/因人而异。判断法：你毕业后三年内大概率会不会买车或需要开车？会，就趁大学学完。"}, "extra": []}, {"n": 11, "title": "雅思、托福：成绩 2 年有效，只在真要用的时候考", "tag": {"money": "高", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "一场报名费通常两千元上下（不同考试与地区不同），加备考时间。", "说人话": "语言成绩的坑不在难度，在\"有效期\"。雅思和托福都是自考试日起 2 年有效，不看出分日。所以\"大一有空先考着\"是最常见的浪费：等到大四申请时已经过期。正确做法是倒推申请时间表——留学申请通常在大四上学期，那么最晚在大三上就要出分，并留出一次重考余地。交换、保研、留学三条路的时间要求不一样，各有各的截止日。", "收益": "雅思成绩自考试之日起 2 年内有效；托福 iBT 成绩自考试之日起 2 年有效（ETS 规定），过期后不再提供成绩查询与送分服务。多数海外院校要求申请时提交有效期内的成绩，部分院校还要求入学时成绩仍在有效期内。英国签证对语言考试种类另有规定（部分签证不接受 TOEFL iBT）。", "证据等级": "B", "来源": "IELTS 官方成绩有效期说明 <https://www.ielts.org/>；ETS 关于 TOEFL iBT 成绩有效期的说明 <https://www.ets.org/toefl>", "备注": "受益人是自己。如果只是\"想练英语\"，用免费资源就够；花钱考一次的目标应该是\"用得上\"。"}, "extra": []}, {"n": 12, "title": "GRE 与 GMAT：只在特定升学路径上才需要", "tag": {"money": "高", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "一场报名费通常一千多元到两千多元，加备考两三个月。", "说人话": "GRE 是北美等地研究生院的通用入学考试，GMAT 主要面向商学院（MBA、部分商科硕士）。要注意两点：一是很多院校和专业已经\"不强制\"提交（test-optional 或 waive），二是它们的成绩有效期通常是 5 年，比语言成绩宽裕得多。所以判断法很简单：先确定目标项目要不要，再决定考不考；不要为了\"以后可能用\"先考一个。", "收益": "GRE 由 ETS 主办，GMAT 由 GMAC 主办，二者成绩有效期通常为 5 年（以考试机构官方规定为准），明显长于语言成绩的 2 年。多数海外院校在招生简章中明确是否要求或建议提交 GRE/GMAT 成绩，部分商学院以工作经历替代。", "证据等级": "B", "来源": "ETS 关于 GRE 成绩有效期的说明 <https://www.ets.org/gre>；GMAC 关于 GMAT 成绩有效期的说明 <https://www.gmac.com/>；各院校招生简章（以目标项目当年要求为准）。", "备注": "受益人是自己。判断顺序：先锁目标项目 → 看它写不写\"required\" → 再报名。别反过来。"}, "extra": []}, {"n": 13, "title": "注册会计师（CPA）：应届那年才能报，专业阶段 6 科、单科 5 年有效", "tag": {"money": "高", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "报名费按科目计（各省不同），加教材、时间和可能的培训费。", "说人话": "CPA 是国内财会领域含金量最高的执业资格，但它在校生里有个硬限制：报名要求\"具有高等专科以上学校毕业学历\"，所以本科在读只有大四应届那年才能报（专科大三、在读研究生可用本科学历报）。另一个关键数字是有效期：专业阶段 6 科的单科合格成绩 5 年内有效，5 年内没过完全部 6 科，先过的科目作废。所以它适合\"目标明确要进事务所或做财会\"的人，不适合\"先考着看看\"。", "收益": "《2025 年注册会计师全国统一考试报名简章》规定，专业阶段考试报名条件为：具有完全民事行为能力，且具有高等专科以上学校毕业学历，或者具有会计或者相关专业中级以上技术职称；专业阶段考试科目为会计、审计、财务成本管理、公司战略与风险管理、经济法、税法，每科百分制、60 分为合格线，单科合格成绩 5 年内有效；综合阶段考试需已取得专业阶段合格证。应届毕业生可报名，但须在规定时间内通过学信网完成学历认证。报名通过注册会计师全国统一考试网上报名系统（cpaexam.cicpa.org.cn）进行。", "证据等级": "B", "来源": "财政部注册会计师考试委员会 (2025). 2025 年注册会计师全国统一考试报名简章. <https://www.cicpa.org.cn/xxfb/tzgg/202503/W020250303518850852485.pdf>", "备注": "受益人是自己。中注协明确不举办、也不委托任何机构举办考前培训班，请勿轻信\"保过\"\"真题\"\"查分改分\"宣传。判断法：目标岗位的招聘要求里写没写 CPA？没写，先别投入几百小时。"}, "extra": []}, {"n": 14, "title": "ACCA：大一读完就可注册，注意免试与年费", "tag": {"money": "高", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "注册费、年费、考试费逐科计，累计可达数千到数万元。", "说人话": "ACCA 是国际性的会计资格，好处是\"在校生能考\"——完成大一课程后一般就能注册成为学员，会计相关专业还可申请部分科目免试（各校认证项目不同、免试门数不同）。但有两个容易被忽略的成本：一是年费，注册后每年都要交；二是免试通常要额外缴费。所以它更像\"要不要走外企/四大/国际财务这条线\"的选择，而不是\"多一个证\"。", "收益": "ACCA（特许公认会计师公会）允许在读大学生注册为学员，完成大一课程的学生一般可申请注册；会计学等相关专业、且所在院校项目获 ACCA 认证的，可按规定申请部分科目免试（免试需缴费，且按当年政策执行）。学员与会员需按年缴纳年费。ACCA 的认可度主要集中在跨国公司、会计师事务所与国际财务岗位，是否加分取决于目标雇主。", "证据等级": "C", "来源": "ACCA 官方注册与免试政策（以 ACCA 官网当年规定为准，属通行做法）。", "备注": "受益人是自己。判断法：目标雇主是四大、外企财务或国际业务，才值得投；目标是国内中小企业的普通财务岗，性价比不如\"会计初级 + 实操经验\"。"}, "extra": []}, {"n": 15, "title": "CFA：在校生最早在\"毕业前 23 个月\"考一级", "tag": {"money": "高", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "注册费加考试费以美元计，三级累计花费可观；官方建议每级约 300 小时学习。", "说人话": "CFA 是投资管理领域的国际资格，对在校生有一个明确的时间门槛：以本科生身份报名一级，所选考试窗口必须在\"毕业月份前 23 个月及以内\"；二级要在毕业前 11 个月以内；三级必须已经取得学士学位（或有 4000 小时相关工作经验）。按四年制本科算，最早大二暑假就能考一级。另外，报名必须持有效国际旅行护照，身份证不能入场。", "收益": "CFA Institute 规定：本科生报名一级时，所选考试窗口须在取得学士学位毕业月份前 23 个月及以内；参加二级考试须在毕业前 11 个月以内；参加三级考试须已完成学士学位或累计 4000 小时专业工作经验。每位考生每级最多考 6 次，同一日历年内最多考两次且不得连续考试窗口。报名须持有效国际护照，考试为全英文。", "证据等级": "B", "来源": "CFA Institute. CFA Program policies（考生资格与报名要求）. <https://www.cfainstitute.org/programs/cfa-program/policies>", "备注": "受益人是自己。三级考完后还要积累 4000 小时相关工作经验、完成推荐信审核，才能正式申请持证人资质——\"考过三级\"不等于\"持证\"。"}, "extra": []}, {"n": 16, "title": "法律职业资格考试：2018 年前后是两套规则，应届生可提前报", "tag": {"money": "中", "time": "多", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "报名费各省不同，加备考一年上下和可能的培训费。", "说人话": "法考是典型的准入类硬门槛——想当法官、检察官、律师、公证员，多数情形下必须通过它。报名条件有个关键的\"分水岭\"：2018 年 4 月 28 日《国家统一法律职业资格考试实施办法》实施前已取得学籍（考籍）或学历的，适用\"老人老办法\"（不限专业）；之后入学的适用\"新人新办法\"（一般要求全日制法学类本科学历加学士及以上学位，或有法律硕士/法学硕士及以上学位，或非法学类本科加从事法律工作满三年）。在校生也有机会：全日制普通高校次年应届本科、硕士及以上毕业生可以报名。", "收益": "据 2025 年国家统一法律职业资格考试公告（司法部公告第 4 号），报名专业学历条件为：具备全日制普通高等学校法学类本科学历并获得学士及以上学位；或全日制普通高等学校非法学类本科及以上学历并获得法律硕士、法学硕士及以上学位；或全日制普通高等学校非法学类本科及以上学历并获得相应学位且从事法律工作满三年。全日制普通高等学校、军队院校 2026 年应届本科、硕士及以上学历毕业生可以报名参加 2025 年考试。客观题考试两张试卷总分 300 分，全国统一合格分数线为 180 分；主观题总分 180 分，合格线 108 分；客观题合格成绩在本年度和下一个考试年度内有效。主观题考试由司法行政机关统一提供电子法律法规供查阅。", "证据等级": "A", "来源": "司法部 (2025). 2025 年国家统一法律职业资格考试公告（司法部公告第 4 号）. <https://www.moj.gov.cn/pub/sfbgw/zwxxgk/fdzdgknr/fdzdgknrtzwj/202506/t20250605_520493.html>", "备注": "各校差异。是否允许在校生、哪些年级可报，以当年公告为准；报名时须如实填报并对材料真实性负责，虚假报名成绩无效。"}, "extra": []}, {"n": 17, "title": "\"包过\"\"保就业\"一律不要：这不只是经验，还是法律规定", "tag": {"money": "高", "time": "多", "will": "否", "gain": "大", "scope": "金钱"}, "fields": {"成本": "常见话术下的学费几千到几万元。", "说人话": "正规考试不会有人替你保证通过，正规岗位不会有人替你保证入职。而且\"保证通过\"这类承诺本身是违法的：《广告法》明确禁止教育培训广告对升学、通过考试、获得学位学历或者合格证书，或者对教育、培训的效果作出保证性承诺。所以当你看到\"保过\"\"不过退费\"\"内部渠道\"，不用去研究合同细节，直接走人。\"不过退费\"四个字本身就是筛子。", "收益": "《中华人民共和国广告法》第二十四条规定，教育、培训广告不得含有下列内容：对升学、通过考试、获得学位学历或者合格证书，或者对教育、培训的效果作出明示或者暗示的保证性承诺；明示或者暗示有关考试机构或者其工作人员、考试命题人员参与教育、培训；利用科研单位、学术机构、教育机构、行业协会、专业人士、受益者的名义或者形象作推荐、证明。中注协等官方机构也明确不举办、不委托任何机构举办考前培训班。此类虚假宣传可向市场监管部门举报。", "证据等级": "B", "来源": "《中华人民共和国广告法》第二十四条；中国注册会计师协会考试报名简章中关于\"不举办或参与任何形式的考前培训班\"的特别提示.", "备注": "受益人是自己。附带提醒：凡是要求\"先交钱锁定名额、名额有限、今天不报明天涨价\"的，都是同一套销售话术。"}, "extra": []}, {"n": 18, "title": "继续教育学时：拿了证不是终点，很多资格要年检", "tag": {"money": "低", "time": "中", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "时间上每年几十学时，部分课程要缴费。", "说人话": "执业类和部分职业资格不是\"考过就一劳永逸\"：有的要求每年完成规定学时的继续教育，有的要定期注册或年检，缺一次可能影响执业或证书效力。所以拿证那天就要问清三件事：要不要继续教育、每年多少学时、在哪里登记。把它当成\"每年的一项固定支出\"，而不是一次考试。", "收益": "会计、注册会计师、执业药师、注册类工程师等行业普遍实行继续教育制度，要求持证人员每年完成规定学时（各行业标准不同）；教师资格实行 5 年一周期定期注册（从事教育教学工作且有编制的），连续两年审核不合格将被撤销资格。继续教育学时一般通过行业主管部门或行业协会平台登记。", "证据等级": "C", "来源": "各行业主管部门与行业协会的继续教育管理规定（属通行做法，各行业标准不同）。", "备注": "地区差异/各校差异。大学生现在不用管，但如果你考的是\"以后要执业\"的证，报班时顺便问一句\"继续教育怎么安排\"。"}, "extra": []}, {"n": 19, "title": "技能学习顺序：打字 → 搜索 → 表格 → 数据库 → 编程 → 写作", "tag": {"money": "0", "time": "多", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "免费资源足够（官方文档、公开课程、练习平台）。", "说人话": "真正影响你找工作和干活的技能没有人看证书，看的是你能不能当场做出来。学习顺序有讲究：先练盲打（一次投入，终身受益）；再练搜索（会用关键词和站内检索，等于给自己配了个外脑）；然后是表格（Excel/在线表，是绝大多数岗位的通用语言）；再是数据库查询（SQL，从\"看数据\"到\"取数据\"）；再是编程（Python 等，做自动化与数据处理）；最后是写作（把上面的一切写成别人看得懂的东西）。顺序错了也能学，只是效率低。", "收益": "可迁移技能（数据处理、写作、表达、信息检索）在多数岗位的面试中被直接考察；招聘中的技能评估通常通过笔试、机试、作品集或试用期完成，而非证书。技能学习的收益在\"能做出东西\"上兑现：一个表格、一份报告、一段能跑的代码，比一张证书更能说明问题。", "证据等级": "C", "来源": "招聘与技能培养的通行做法（属本书作者的整理，无单一文件依据）。", "备注": "受益人是自己。做三个能拿出手的小作品，比一张证书有用：比如\"把班级成绩做成自动统计表\"\"爬取并分析一份公开数据\"\"写一份 5 页的分析报告\"。"}, "extra": []}, {"n": 20, "title": "英语口语：证书救不了，场景才行", "tag": {"money": "0", "time": "多", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "几乎不花钱（校内资源、语伴、播客、影视）。", "说人话": "口语是典型的\"证书无用、场景有用\"的技能：你可以有六级 550 分，但真正开口还是卡壳；也可以没考过什么口语证，但能跟外教聊二十分钟。练法只有一条靠谱：用真实的、有压力的场景（英语角、留学生语伴、专业课的英文汇报、面试模拟）给自己创造开口机会，配合反复听和模仿。四六级的口试是可选环节，不考不影响笔试成绩，但考了能证明你\"敢说\"。", "收益": "四六级口语考试（CET-SET）为选考环节，成绩单独报告，不参加口试不影响笔试成绩与证书；口语能力在留学面试、外企岗位、学术会议等场景中直接影响结果。语言习得研究普遍支持\"可理解输入 + 大量输出机会\"的路径，而非单纯背单词与做题。", "证据等级": "C", "来源": "全国大学英语四、六级考试口语考试（CET-SET）报考说明；语言学习的通行做法（属通行做法）。", "备注": "受益人是自己。最低成本方案：每学期找一个固定语伴，每周一次、每次 30 分钟、只聊你这周做过的事。"}, "extra": []}, {"n": 21, "title": "刻意练习确实有效，但它解释不了全部差距", "tag": {"money": "0", "time": "中", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，但要投入大量有反馈的训练时间。", "说人话": "\"一万小时\"被传得太神了。原始研究说的是\"刻意练习\"（指明目标、专注、即时反馈、走出舒适区）是达到高水平的重要条件，但后来的元分析发现：刻意练习对表现差异的解释力因领域而异，在规则稳定、反馈清晰的领域（如音乐、棋类）较高，在结构松散、反馈模糊的领域（如某些职业与管理）较低。对大学生有用的结论是：练法比练量重要——找能给你即时反馈的人（老师、学长、竞赛评委、AI 助教），比闷头刷时长有效得多。", "收益": "Ericsson, Krampe & Tesch-Römer (1993) 在 *Psychological Review* 提出\"刻意练习\"框架，强调有明确目标、全神贯注、即时反馈与不断突破舒适区的练习方式；Macnamara, Hambrick & Oswald (2014) 在 *Psychological Science* 发表的元分析指出，刻意练习对不同领域表现差异的解释力低于早期估计（作者报告的解释比例因领域而异，在游戏与音乐中相对较高，在专业职业中较低）。因此刻意练习是必要条件而非充分条件，宜作为方法而非口号。", "证据等级": "B", "来源": "Ericsson, K. A., Krampe, R. T., & Tesch-Römer, C. (1993). The role of deliberate practice in the acquisition of expert performance. *Psychological Review*, 100(3), 363–406；Macnamara, B. N., Hambrick, D. Z., & Oswald, F. L. (2014). Deliberate practice and performance in music, games, sports, education, and professions: A meta-analysis. *Psychological Science*, 25(8), 1608–1618；Ericsson, K. A., & Pool, R. (2016). *Peak: Secrets from the New Science of Expertise*.", "备注": "受益人是自己。可执行的版本：给每次练习设一个\"这次要比上次好一点点\"的具体目标，并且每练一小时内至少获得一次外部反馈。"}, "extra": []}, {"n": 22, "title": "分散练习与自我测验：比\"重复阅读\"有效得多", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱，但要把\"读\"换成\"考自己\"。", "说人话": "如果你在备考（四六级、期末、考证），有两个方法投入产出比最高：一是分散练习（把同样的总时长拆成多天，而不是考前突击一晚）；二是提取练习（合上书，把刚才学的默写/复述/做题，而不是再读一遍）。原因是\"读起来很熟\"会给人一种\"我已经会了\"的错觉，而真正的记忆来自\"把它从脑子里取出来\"。第三条也常被验证：交错练习（把不同题型混着做）比同类题连着刷更能迁移。", "收益": "Dunlosky, Rawson, Marsh, Nathan & Willingham (2013) 对十种学习技术的效用做了系统评估，发表于 *Psychological Science in the Public Interest*：把\"练习测试（提取练习）\"与\"分散练习\"评为效用最高的一类技术，\"重读\"\"划重点\"\"总结\"评为效用较低的一类（需视条件而定）。这些结论对备考类学习（考证、四六级、期末考试）有直接可操作性。", "证据等级": "B", "来源": "Dunlosky, J., Rawson, K. A., Marsh, E. J., Nathan, M. J., & Willingham, D. T. (2013). Improving students' learning with effective learning techniques. *Psychological Science in the Public Interest*, 14(1), 4–58.", "备注": "受益人是自己。最省力的一步：把\"再读一遍\"换成\"合上书，写下刚才那三条要点\"，只改这一处，效果就不一样。"}, "extra": []}, {"n": 23, "title": "有些\"技能\"不能接：代考、代写、代刷单是犯罪不是副业", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，看完这一条就行。", "说人话": "有些\"兼职技能\"看起来只是\"帮个忙\"，其实是刑事风险。最常见的三类：① 替考/被替考——在法律规定的国家考试中代替他人或者让他人代替自己参加考试，是犯罪；② 代写论文、代写毕业论文/学位论文——不仅可能被撤销已授学位，组织代写的还可能涉及其他法律责任；③ 出租、出借银行卡、支付账户或帮忙\"跑分\"——可能构成帮助信息网络犯罪活动罪。这三件事的\"报酬\"通常只有几百上千元，但代价是犯罪记录，且不可逆。", "收益": "《中华人民共和国刑法》第二百八十四条之一规定：在法律规定的国家考试中，组织作弊的处三年以下有期徒刑或者拘役，并处或者单处罚金；情节严重的处三年以上七年以下有期徒刑，并处罚金；代替他人或者让他人代替自己参加该类考试的，处拘役或者管制，并处或者单处罚金。《中华人民共和国学位法》（2025 年 1 月 1 日施行）第三十七条规定，学位申请人在攻读学位期间存在代写、剽窃、伪造等学术不端行为的，经学位评定委员会决议，学位授予单位不授予学位或者撤销学位。刑法第二百八十七条之二规定帮助信息网络犯罪活动罪：明知他人利用信息网络实施犯罪，为其犯罪提供支付结算等帮助，情节严重的处三年以下有期徒刑或者拘役，并处或者单处罚金。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国刑法》第二百八十四条之一、第二百八十七条之二；全国人大常委会 (2024). 中华人民共和国学位法（第三十七条）.", "备注": "受益人是自己（涉及自由与未来）。判断法：凡是要你\"用别人的身份\"\"用你的账户过一笔钱\"\"签别人的名字\"的活儿，无论报酬多少，都不接。"}, "extra": []}, {"n": 24, "title": "判断一个证值不值的三问", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。每个证花五分钟问一次。", "说人话": "① 有没有哪条明文规则或岗位要求写着\"必须有它\"（不是\"有更好\"，是\"必须有\"）？② 没有它，我会失去哪个具体机会（哪个考试不能报、哪类岗位不能投、哪条分数线过不去）？③ 拿到它需要多少小时，这些小时用来做别的事会怎样？三个问题答完，多数\"看起来很值\"的证会被筛掉，剩下的几个才值得报名。", "收益": "这套方法把\"考证\"当成一次投资决策：比较成本（钱＋时间＋毅力）与收益（解锁的机会）。职业资格的价值集中在\"准入\"与\"筛选\"两个功能上（见本章第 2 条），超出这两个功能的部分通常是培训机构制造的溢价；而\"能力型技能\"（第 19—22 条）的兑现方式是可展示的作品与可验证的产出，不是证书。", "证据等级": "C", "来源": "由本章以上各条依据汇总的判断方法（属本书作者的整理）。", "备注": "受益人是自己。这一条也是本章性价比最高的一条：不花钱、不花时间，却能替你省掉几个月的备考和几千元的培训费。"}, "extra": []}, {"n": 25, "title": "国家出的免费课程平台，先用完再说付费", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱。注册账号即可学。", "说人话": "国内有一批国家级、免费开放的课程平台，很多人却先想到了付费课。**国家高等教育智慧教育平台**（教育部委托、高等教育出版社建设和运行维护，2022 年 3 月 28 日上线，<https://higher.smartedu.cn/>）汇聚国家级、省级一流课程，覆盖高等教育多个学科门类与专业类，另有虚拟仿真实验、电子教材、教学案例等配套资源，免费开放、注册即可学习，面向高校师生与社会公众。同一体系下还有：国家智慧教育公共服务平台 <https://www.smartedu.cn/>、国家职业教育智慧教育平台 <https://vocational.smartedu.cn/>。**\"先查国家级平台，再考虑付费课\"，是一条能省下几千元的习惯。**", "收益": "据平台公布口径，国家高等教育智慧教育平台汇聚 3.1 万门国家级、省级一流课程，覆盖高等教育 14 个学科门类、92 个专业类，另有虚拟仿真实验、电子教材、教学案例等配套资源 6.5 万余条；平台免费开放，注册账号即可学习。国家智慧教育公共服务平台为总入口，下设高等教育、职业教育、基础教育等子平台。", "证据等级": "B", "来源": "国家高等教育智慧教育平台 <https://higher.smartedu.cn/>；国家智慧教育公共服务平台 <https://www.smartedu.cn/>；国家职业教育智慧教育平台 <https://vocational.smartedu.cn/>。", "备注": "上面的课程数、学科门类数与资源条数为平台公布的资料口径，写作时点为 2026 年 10 月，会随平台更新变化，以平台当月显示为准。用法：先按专业或课程名搜，找到对口的一流课程对着学；没有完全对口的，用相近课程补基础。"}, "extra": []}, {"n": 26, "title": "学校图书馆的数据库，是你已经付过费的资源", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱（学校已购），用校园网或学校 VPN 访问即可。", "说人话": "知网、万方、维普、超星，以及各类外文数据库，多数高校图书馆已经购买，**用校园网或学校 VPN 访问完全免费**，下载文献不要钱。很多学生四年都没进去过，直到毕业写论文才发现\"下载一篇要几十块\"。另外有两个免费入口也值得记住：**国图公开课**（国家图书馆，<http://open.nlc.cn/>，累计 2300 余场讲座视频，大部分无需注册）、**中国工程科技知识中心**（中国工程院，<https://www.ckcest.cn/>）。还有一件事很多人不知道：图书馆通常提供**文献传递和查收查引**服务——写论文卡在\"找不到那篇文献\"时，先问图书馆员。", "收益": "高校图书馆通过校园网 IP 或统一身份认证，向在校生开放其购买的中外文数据库的检索与下载权限；在校园网外用学校提供的 VPN 或 WebVPN 访问同样有效。国家图书馆\"国图公开课\"平台累计上线讲座视频 2300 余场，多数资源无需注册即可观看；中国工程科技知识中心由中国工程院牵头建设，提供工程科技领域的知识服务。多数高校图书馆提供参考咨询、文献传递、馆际互借、查收查引等信息服务。", "证据等级": "B", "来源": "各高校图书馆数据库与 VPN 使用说明（通行做法）；国家图书馆国图公开课 <http://open.nlc.cn/>；中国工程科技知识中心 <https://www.ckcest.cn/>。", "备注": "受益人是自己（省的是钱和时间）。一条习惯：大一就把\"图书馆数据库 + 国图公开课 + 中国工程科技知识中心\"存进浏览器书签，写论文或查资料时先查这几个入口，再考虑付费下载。"}, "extra": []}, {"n": 27, "title": "怎么自己找资源：四步法", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "不花钱，花的是\"先想清楚再搜\"的那半小时。", "说人话": "自学最容易犯的错，是从\"别人推荐的一堆资源\"开始，结果收藏了十几个链接、一个都没学完。顺序反过来会好很多：① 先找**官方大纲或教材目录**（目标课程的 syllabus、教材前言、考试大纲），先确定\"该学什么\"，再去找\"用什么学\"；② 再找**官方文档**（编程、软件、平台类技能，官方文档永远是第一手且免费，比任何二手教程都准）；③ 然后找**有反馈的练习场**（题库、开源项目、公开数据集、竞赛），因为不动手等于没学；④ 最后**做出一个可交付物**（一个能跑的程序、一份分析报告、一个能用的小工具），它既是你学过的最好证明，也是下一个机会的敲门砖。搜索上再加三个固定动作：用 `site:` 限定站内搜索、用 `filetype:pdf` 找课件、用英文关键词把同一个主题再搜一遍——同样的主题，英文资料的密度常常高一个量级。", "收益": "这套顺序把\"找资源\"从\"收集链接\"变成\"先定目标、再定材料、最后产出\"。官方文档与大纲是权威一手来源（更新最快、口径最准）；练习场与可交付物对应技能学习中的\"输出\"，与本章第 19、21、22 条的方法一致。进阶检索语法（`site:`、`filetype:`）是通用且免费的信息检索技巧。", "证据等级": "C", "来源": "自学与信息检索的通行做法（属本书作者的整理，无单一文件依据）；官方文档、公开课大纲与练习平台的通用形态。", "备注": "受益人是自己。判断资源好坏的一句话：它能让你\"做出东西\"，还是只让你\"感觉学了很多\"？前者留，后者删。"}, "extra": []}, {"n": 28, "title": "建一个\"技能清单\"，每学期体检一次", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "不花钱。每学期末花两小时。", "说人话": "用任意笔记工具建一个清单，每条技能写四栏——现在到什么水平、想达到什么水平、靠什么资源学、什么时候能拿出一个产物。四栏里最关键的是最后一栏：**没有产物的学习，等于没发生。** 每学期末对着清单过一遍，只问三个问题：哪些是学了没用的？哪些是以为会了其实不会的？下学期只留几件？答完就砍掉一半，只留真正要推进的。", "收益": "把模糊的\"我要学 X\"写成\"水平—目标—资源—产物\"四栏，等于给每个技能定了一个可检查的交付标准；每学期一次的复盘对应\"分散练习\"里的间隔与回顾（见本章第 22 条），也避免把时间继续投在低回报的技能上。这一条与本章第 24 条同源：都是\"用一次低成本决策，替掉后面几个月的投入\"。", "证据等级": "C", "来源": "由本章第 19—25 条依据汇总的操作方法（属本书作者的整理）。", "备注": "受益人是自己。这一条花的成本最低（不花钱、两小时），换来的是不再把时间重复投在学不动的东西上：避免又一年白学。"}, "extra": []}]}, {"file": "07-AI自学与工具.md", "title": "7. AI 自学、工具与学习路径：大学期间怎么把 AI 用成真的能力", "entries": [{"n": 1, "title": "哪些技能在贬值、哪些在升值：先看你的产出里有几分是\"谁都能让 AI 生成\"的", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。花一次把手里技能过一遍的时间。", "说人话": "生成式 AI 正在压价\"信息搬运\"和\"模板套用\"这类活：基础翻译、初级文案、常规表格整理、简单代码片段——这些以前靠熟练度换钱的事，现在别人的成本也降下来了。它们不是消失，是\"不再稀缺\"。反过来升值的是四种能力：① 定义问题，把一句模糊的需求变成一个能动手的任务；② 判断质量，在一堆看起来都对的结果里挑出对的，并说出为什么；③ 跨领域整合，把两三个领域的知识接起来；④ 把 AI 的产出落到真实场景——对接真实数据、真实约束、真实的人。判断标准可以很具体：把你的产出拆成两部分，一部分是\"别人也能让 AI 生成\"的，一部分是\"必须有你才做得出来\"的；后面这部分占多少，你的不可替代性就有多少。", "收益": "把技能分成\"可被通用工具复制的部分\"和\"依赖判断、情境与整合的部分\"，是劳动力市场技能分析的常用框架（任务的可编码、可标准化程度越高，越容易被自动化替代）。对个人可操作的结论是：与其再练一个\"熟练工型\"技能，不如练习把 AI 产出接进真实约束的最后一公里——找数据、核事实、对需求、对交付标准。", "证据等级": "C", "来源": "技能可替代性与任务自动化的通行分析框架（属本书作者的整理，无单一文件依据）；生成式 AI 对通用文本、翻译、代码等任务的公开能力说明。", "备注": "受益人是自己。把这条和第 3 条叠起来看：先承认\"哪些活不值钱了\"，再去你专业里找\"AI 帮不上最后一公里\"的位置。"}, "extra": []}, {"n": 2, "title": "AI 能力的四层阶梯：会用 → 用得准 → 会验证 → 会搭", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "不花钱。花的是逐层往上走的练习时间。", "说人话": "AI 能力分四层，一层比一层难，也一层比一层值钱。第一层\"会用\"：能打开一个对话工具、把问题打进去、看懂回答——这一层几乎人人都会，不构成优势。第二层\"用得准\"：知道什么任务交给哪个模型、怎么把要求说清楚、怎么多轮迭代，出来的结果直接能用。第三层\"会验证\"：知道 AI 会在哪里胡说，能自己回原始来源核实，敢对结果负责。第四层\"会搭\"：把 AI 接进自己的流程——批量处理数据、把资料接给模型做问答、写成一个小工具。多数人停在第一层，差别就出在第二、三层：一个是\"效率\"，一个是\"可信\"。别急着往第四层跳，第二、三层没打好，搭出来的东西也只是把错误放大。", "收益": "这四层对应从\"使用工具\"到\"承担结果\"的责任递增：第二层决定你用得快不快，第三层决定你敢不敢把产出交出去，第四层决定你能不能把它嵌进长期工作流。后面第 17—27 条的学习路径正是按这四层由浅到深排的。", "证据等级": "C", "来源": "由本章第 1、24、25 条依据汇总的能力分层（属本书作者的整理，无单一文件依据）。", "备注": "受益人是自己。自查法：随便挑一个你常用的任务，问自己\"这个结果我敢不敢不核实就交出去\"——不敢，说明你还在第二层，接下来该练第三层（第 24、25 条）。"}, "extra": []}, {"n": 3, "title": "先把 AI 用在自己的专业上，而不是先学 AI 技术", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。花一次把专业里最耗时的事列出来的时间。", "说人话": "你不需要先变成程序员才用得上 AI。文科生可以用它整理史料、梳理文献脉络、练写作；商科生可以用它读财报、做案例分析、搭财务模型草稿；医学生可以用它梳理鉴别诊断思路、翻译英文指南、练病例问答；工科生可以用它解释报错、生成最小测试代码、查器件手册。起点不是\"我要学 AI 技术\"，而是\"我专业里最耗时的三件事是什么\"。把这三件事写下来，再一件件看 AI 能接走多少。这样做的好处是：学习路径自己就长出来了，而且每一步投入都能立刻在你正在做的事上回本。", "收益": "把工具对准本专业的高频耗时任务，可以让学习与使用同步发生——你不需要先修完一门课才能用上 AI，而是用完一次就得到一次反馈。这条与第 1 条\"升值的是把 AI 产出落到真实场景\"是同一逻辑的具体做法。", "证据等级": "C", "来源": "把技能练习嵌入真实任务的学习方法（属通行做法，无单一文件依据）。", "备注": "受益人是自己。第一步只做一件事：打开备忘录，写下\"我专业里最耗时的三件事\"，写在最上面的那件，今天就试着交给 AI 一次。"}, "extra": []}, {"n": 4, "title": "不要报\"AI 速成班\"：先看它的内容能不能在官方文档里免费拿到", "tag": {"money": "中", "time": "多", "will": "否", "gain": "中", "scope": "金钱"}, "fields": {"成本": "速成班常见定价从几百到几千元。", "说人话": "市面上的\"AI 速成班\"\"AI 变现课\"，讲的多是大模型的常识性用法，而这些东西各工具官方文档、快速上手示例和免费教程里都有，而且更新更快——官方文档永远比二手课新，因为课录完就定稿了，官方文档随工具升级同步改。判断一个 AI 付费课值不值，用第 6 章\"判断一个证值不值的三问\"同理：① 有没有哪条规则或岗位要求\"必须有它\"？② 没有它我会失去哪个具体机会？③ 它的内容我能不能在官方文档里免费拿到？三条里只要有一条指向\"其实不必要\"，就先别交钱。", "收益": "《中华人民共和国广告法》第二十四条规定，教育、培训广告不得对升学、通过考试、获得学位学历或者合格证书，或者对教育、培训的效果作出明示或者暗示的保证性承诺；因此凡出现\"包学会\"\"学完就能月入过万\"的宣传，本身就属违规宣传，可向市场监管部门举报。多数 AI 工具提供官方文档、快速上手示例与开发者指南，免费公开。", "证据等级": "B", "来源": "《中华人民共和国广告法》第二十四条；各 AI 工具官方文档与快速上手说明（以官方文档为准）。", "备注": "受益人是自己。判断资源好坏的一句话：它能让你\"做出东西\"，还是只让你\"感觉学了很多\"？前者留，后者删。工具迭代很快，本书写作时点为 2026 年 10 月，请以各工具官方文档为准。"}, "extra": []}, {"n": 5, "title": "英语为什么仍然是 AI 时代的杠杆：翻译给你\"能读\"，原文能力给你\"能判\"", "tag": {"money": "0", "time": "多", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱。花的是持续接触原文材料的时间。", "说人话": "最前沿的模型文档、技术报告、开源项目说明和社区讨论，绝大多数是英文；新模型、新工具的第一手资料往往先出英文版，中文教程慢一步，还可能翻漏关键前提。翻译工具（如 DeepL 这类专做翻译的工具，以及大模型自带的翻译能力）能帮你把字面读懂，但\"判断质量\"要你自己能做：这段结论的证据是什么、这个说法有没有前提、这条社区评论是批评还是赞赏。翻译给你的是\"能读\"，原文能力给你的是\"能判\"。中英对照读还有个副产品——你会更快发现机器翻译在哪里错了，而这个\"发现错误\"的能力，恰恰是第三层\"会验证\"的底子。", "收益": "语言学习研究支持\"在真实材料中大量输入 + 主动输出\"的路径（可理解输入假说，Krashen 1985），而非单纯背单词与做题；在 AI 时代，英文一手资料集中在官方文档、论文与开源社区，具备直接阅读原文能力的人，获取信息的时滞更短、判断更少依赖二手转述。", "证据等级": "B", "来源": "Krashen, S. D. (1985). *The Input Hypothesis: Issues and Implications*；英文一手技术文档与学术资料的通用形态（属通行做法）。", "备注": "受益人是自己。最低成本的做法：把你已经感兴趣的一门技术或一个方向，直接订阅英文原始文档或社区，每周读一段，不查每个生词、只求看懂结构。"}, "extra": []}, {"n": 6, "title": "AI 不能替你做的那几件事：这一条给全章定调", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。花的是想清楚\"这一步该不该交出去\"的一分钟。", "说人话": "AI 能替你查资料、写草稿、改语法、出练习题，但有四件事它替不了。① 建立判断力——它给的东西对不对，最终要你拍板，而判断力只能靠自己一次次判断练出来；② 承担结果——交上去的作业、签下的名字、做出的决定，责任是你的，工具不担责；③ 建立信任关系——导师愿不愿意带你、同学愿不愿意和你组队，看的是你这个人靠不靠谱，不是你的 AI 用得多溜；④ 想清楚自己要什么——选哪条路、把时间投在哪，AI 没有你的处境和偏好，答不了。把 AI 当成\"扩大你能做的事\"的工具，而不是\"替你做决定\"的替身；凡是把判断权和责任一起交出去的用法，短期省事，长期都在贬值。", "收益": "这条是全章的总口径：AI 承担的是\"读、整理、挑错、改语言\"，人保留的是\"判断、选择、担责\"。后面第 20—23 条的流程分工表、第 28—34 条的法律与边界，都是这条定调的具体化。", "证据等级": "C", "来源": "由本章第 1、2、20 条依据汇总的判断（属本书作者的整理，无单一文件依据）。", "备注": "受益人是自己。一句话记住：工具越强，\"用工具的那个你\"越重要。"}, "extra": []}, {"n": 7, "title": "通用对话大模型：你的第一入口，但不要只用一个", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "不花钱（多数有免费额度），实际花的是学习使用的时间。", "说人话": "通用对话大模型是最该先上手的工具。国内可直接使用的有 DeepSeek、通义千问、文心一言、豆包、Kimi、智谱清言、腾讯元宝等，国外有 ChatGPT、Claude、Gemini。挑选时看四点：支不支持长文本（能不能一次贴进一篇论文）、支不支持文件上传（PDF、表格、图片）、有没有深度思考模式（复杂推理时更稳）、有没有联网检索（能拿到较新的信息）。**重点不是\"选一个最好的\"，而是\"不要只用一个\"**——不同模型在不同任务上表现差别很大，同一个问题换一个模型，答案常常不一样。重要的任务，用两三个模型交叉验证，取交集、查分歧。", "收益": "《生成式人工智能服务管理暂行办法》（2023 年 8 月 15 日施行）对向我国境内公众提供生成式人工智能服务作出规范，要求服务提供者依法履行相应义务；用户选用时应优先使用依法提供服务的平台。不同模型在长文本理解、代码、推理、检索等任务上的公开评测表现存在差异，重要任务交叉使用多个模型，可降低单点错误风险。", "证据等级": "A", "来源": "国家互联网信息办公室等《生成式人工智能服务管理暂行办法》（2023 年 8 月 15 日施行）；各模型官方能力说明（以官方文档为准）。", "备注": "工具与功能迭代很快，本书写作时点为 2026 年 10 月，请以各工具官方文档为准。别把\"某个模型这次答对了\"当成可靠的判断依据——它下次可能就答错。"}, "extra": []}, {"n": 8, "title": "提示词（prompt）的实质不是咒语，是把任务说清楚", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，花的是把要求写清楚的那几分钟。", "说人话": "网上流传很多\"魔法提示词\"，其实没有咒语。有效提示词的实质是把任务说清楚，它包含五个要素：① 角色/背景——你是谁，我要你站在什么位置；② 任务——具体要做什么，动词开头；③ 输入材料——我提供的事实、数据、原文；④ 输出要求——格式、长度、语言，要不要分点、要不要表格；⑤ 判断标准——什么叫好，比如\"面向大一新生\"或\"不要用专业术语\"。可以套用的模板是：\"你现在是【角色】。请基于【材料】完成【任务】。要求：【格式/字数/语言】。判断标准：【什么算合格】。不确定的地方请标注出来。\" 另外，**多轮迭代比一次写出完美提示词更实际**：先让它出一版，你指出问题，再让它改，来回两三句往往比憋一个\"完美开头\"更快。", "收益": "把任务拆成\"角色、任务、输入、输出、标准\"五要素，是把模糊请求转成可执行指令的通行做法；它同时对应第三层\"会验证\"——你写清楚了\"什么算合格\"，才有依据判断 AI 的产出是不是合格。", "证据等级": "C", "来源": "提示词设计的通行做法（属通行做法，无单一文件依据）。", "备注": "工具与功能迭代很快，本书写作时点为 2026 年 10 月，请以各工具官方文档为准。第 19 条会教你把这些提示词存成自己的清单。"}, "extra": []}, {"n": 9, "title": "让 AI 帮你读长文档：问四类问题，但精读还得自己来", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "不花钱（多数有免费额度），花的是提问与核对的时间。", "说人话": "把论文、教材章节、政策原文、说明书丢给支持长上下文的模型或文档问答工具，能把你从\"读不完\"里捞出来。但别只让它\"总结\"，问四类问题更有用：① 这份材料在说什么（用你自己的话复述一遍）；② 它的结论靠什么支撑（哪些是数据、哪些是引用、哪些只是推测）；③ 哪里可能有争议或没讲清楚；④ 我需要记住哪三件事。它读完给你的是\"地图\"，精读还得你自己来——尤其要引用、要考试、要据此做决定的部分。注意数据边界：合同、他人信息、未公开材料不要随便上传（见第 29 条）。", "收益": "《中华人民共和国个人信息保护法》确立\"告知—同意\"与\"最小必要\"原则，处理个人信息应当限于必要范围；把长材料交给第三方 AI 服务前先做\"最小化处理\"（去标识、用示例数据替代），是把便利与合规平衡起来的通行做法。", "证据等级": "B", "来源": "全国人大常委会《中华人民共和国个人信息保护法》（告知同意、最小必要相关条款）；国家互联网信息办公室等《生成式人工智能服务管理暂行办法》（2023 年 8 月 15 日施行）。", "备注": "受益人是自己。长文本能力有上限，超长材料可能要分段输入；工具迭代很快，本书写作时点为 2026 年 10 月，请以各工具官方文档为准。"}, "extra": []}, {"n": 10, "title": "AI 辅助编程：从\"让它写\"改成\"让它讲、让它挑错\"", "tag": {"money": "0", "time": "多", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "不花钱（多数有免费额度），花的是自己读懂每一段的时间。", "说人话": "新手用编程 AI 最常见的误区是\"让它写完我就交\"。更有效的用法反过来：先让它解释报错——把那行红字贴给它，问\"这是什么意思、有几种可能原因\"；再让它写一个最小可运行的例子——能跑起来的一小段，你把它读懂；最后让它审查你自己写的代码——\"我这段哪里可能出错、命名和结构有什么问题\"。工具类别上，IDE 内的补全与对话式编程助手（如 GitHub Copilot、Cursor、通义灵码等）适合边写边问，独立对话模型适合先讲思路再动手。记住一条硬标准：你让它写的每一行，你都要能解释它为什么这么写——解释不了，就等于你没有这段代码。", "收益": "把 AI 定位成\"讲解答疑、生成最小示例、审查代码\"的助手而非\"代写者\"，能让学习与产出同步发生；这与第 1 条\"升值的是判断与整合\"一致：代码能不能用、为什么这么写，仍由你负责。", "证据等级": "C", "来源": "编程学习与 AI 辅助编程工具的通行做法（属通行做法，无单一文件依据）。", "备注": "工具与功能迭代很快，本书写作时点为 2026 年 10 月，请以各工具官方文档为准。"}, "extra": []}, {"n": 11, "title": "AI 辅助文献检索与综述：引用必须逐条回原文核", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱或低（部分学术工具有免费额度），花的是逐条核对引用的时间。", "说人话": "有一类工具专门帮你找文献、看文献之间的关系：学术检索与文献关系工具（如 Semantic Scholar、Connected Papers、Elicit、Consensus 这类），以及国内知网等平台的 AI 辅助功能。它们能从一个关键词出发，快速找到一批相关论文、看谁引了谁、大致梳理某个方向。但有一条硬提醒：**这类工具给出的参考文献，必须逐条回原始文献核对。** 它们经常会生成看起来很像、格式也很规整，但实际上不存在或对不上的引用——作者、年份、期刊可能全错。引用之前，去数据库里按题名或 DOI 搜一遍，搜不到就不写。", "收益": "生成式 AI 输出中的事实性错误（业内称\"幻觉\"）是当前公开评测中反复出现的已知问题，模型可能以高置信语气给出不存在的文献或错误的引用信息；学术写作对引用真实性有严格要求（引用著录规范另见第 20 条），因此文献检索类工具的输出应逐条回一手来源核验。", "证据等级": "B", "来源": "生成式 AI 事实性错误与\"幻觉\"的公开能力说明与评测（各模型表现不同，无单一文件口径）；学术写作与事实核查的通行做法。", "备注": "工具与功能迭代很快，本书写作时点为 2026 年 10 月，请以各工具官方文档为准。核引用时优先用 DOI 检索——DOI 是文献的唯一标识，最不容易出错。"}, "extra": []}, {"n": 12, "title": "AI 做图、做表、做 PPT：学术场合有硬边界", "tag": {"money": "0", "time": "中", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱或低（部分工具有免费额度），花的是学与改的时间。", "说人话": "这个类别包括三块：图像生成（如 Midjourney、Stable Diffusion 生态，以及国内的通义万相、即梦等）、做表（表格工具里的 AI 辅助）、做 PPT（演示工具的 AI 生成与排版功能）。它们能帮你快速出封面图、示意图、汇报初稿，省下大量排版时间。但学术场合有一条硬边界：**作业和论文里的配图，不能用生成图冒充实验数据、实拍照片或原始图表。** 把一张 AI 生成的\"实验照片\"写进报告，性质上属于伪造；投稿和竞赛通常要求声明是否使用了生成合成内容。做汇报用的示意图、封面图一般问题不大，但也要看具体场合的规则，先查清要求再动手。", "收益": "《中华人民共和国学位法》（2025 年 1 月 1 日施行）第三十七条规定，学位申请人存在代写、剽窃、伪造等学术不端行为的，经学位评定委员会决议，学位授予单位不授予学位或者撤销学位；用生成图冒充实验数据属于\"伪造\"范畴。多数期刊与竞赛在投稿要求中明确需声明是否使用生成式人工智能及其用途（具体以目标期刊、赛事当年规定为准）。", "证据等级": "A", "来源": "全国人大常委会 (2024). 中华人民共和国学位法（第三十七条）；各期刊、赛事的投稿与参赛声明要求（以当年规定为准）。", "备注": "工具与功能迭代很快，本书写作时点为 2026 年 10 月，请以各工具官方文档为准。"}, "extra": []}, {"n": 13, "title": "AI 处理音频视频：课堂录音之前先问老师", "tag": {"money": "0", "time": "中", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱或低（多数有免费额度），花的是转写与整理的时间。", "说人话": "这个类别里学生用得最多的是两件：语音转文字（如 Whisper 及其衍生工具、各类会议转写应用）和视频剪辑里的 AI 功能（自动字幕、自动抠像、智能成片）。讲座、访谈、自己练口语的录音转成文字，方便检索和整理；小组拍视频作业，AI 自动字幕能省很多时间。但有一条前置规矩：**课堂上要录音，先问老师；录到别人（同学）的声音和影像，也要经过对方同意。** 未经同意录他人的声音、影像并在群里转发，涉及他人的隐私和肖像权益；会议转写同理，涉及他人的发言内容不要随手外传。这一点与第 3 章\"录音拍照先问老师\"的口径一致。", "收益": "《中华人民共和国民法典》人格权编规定自然人享有隐私权与肖像权：未经同意制作、使用、公开他人肖像，以及侵扰他人私人生活安宁、泄露他人私密信息，均可能构成侵权（第一千零一十九条、第一千零三十二条等）。据此，课堂与会议场景下的录音录像应先征得相关方同意，是把便利建立在合规之上的做法。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国民法典》人格权编（第一千零一十九条肖像权、第一千零三十二条隐私权等）；课堂与会议录音的通行做法。", "备注": "工具与功能迭代很快，本书写作时点为 2026 年 10 月，请以各工具官方文档为准。"}, "extra": []}, {"n": 14, "title": "翻译与写作润色：润色语法和代写是两回事", "tag": {"money": "0", "time": "中", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱或低（多数翻译与润色工具有免费额度）。", "说人话": "翻译工具有 DeepL 这类专做翻译的，也有大模型自带的翻译和润色能力。用法上要分清两件事：**润色是\"你已经写了，让它改语法、改用词、改流畅度\"；代写是\"你没写，让它生成，你交上去\"。** 前者是工具帮你把想清楚的东西表达好，后者是学术不端。另外两条边界：① 语言考试的作文、需要体现个人能力的申请文书里，滥用 AI 容易被识破——阅卷人和招生官见过太多\"完美但不像你写\"的文字，不少考试还有相应的检测手段；② 引用和转写要如实，不能把机器翻译的段落当成自己的原创观点。判断标准就一句：交给它的时候，草稿是不是你先写出来的？", "收益": "《中华人民共和国学位法》（2025 年 1 月 1 日施行）第三十七条把\"代写\"列为可不授予或撤销学位的情形；把 AI 生成的正文当作自己的原创提交，属于代写。多数高校已要求作业与论文声明是否使用 AI 及使用方式（以本校规定为准，属各校差异）。", "证据等级": "A", "来源": "全国人大常委会 (2024). 中华人民共和国学位法（第三十七条）；各高校生成式人工智能使用规范（以本校规定为准）。", "备注": "工具与功能迭代很快，本书写作时点为 2026 年 10 月，请以各工具官方文档为准。"}, "extra": []}, {"n": 15, "title": "个人知识库与\"第二大脑\"：输入没有结构，检索再强也白搭", "tag": {"money": "0", "time": "多", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱或低（不少笔记工具免费），花的是长期维护输入习惯的时间。", "说人话": "这类工具是\"笔记工具 + AI\"的组合：支持本地 Markdown 的笔记软件（资料留在自己电脑上，隐私更好）、支持文档问答的笔记本工具（把资料丢进去，用自然语言提问）、以及国内的飞书、语雀等协作平台。它们解决的是\"资料散落各处、用时找不到\"的问题。但核心方法在\"输入\"这一端：**一条一议（一条笔记只装一件事）、打标签（用统一的关键词分类）、写自己的话（不要只复制粘贴原文）。** 如果你输入的全是整段复制、没有结构、没有你自己的理解，那么再强的检索也只是在垃圾堆里翻。先改输入习惯，再考虑上什么工具。", "收益": "检索的效果取决于输入的结构化程度——把笔记做成\"一条一议 + 统一标签 + 用自己的话复述\"，等于提前替未来的检索做了索引，也强制自己在输入时完成一次理解。\"用自己的话复述\"本质上是一次自我解释与回忆，Dunlosky 等 (2013) 把它归为有效但效用中等的学习技术，同时它把第 18 条讲的\"提取练习\"前置到了记录环节。", "证据等级": "B", "来源": "Dunlosky, J., Rawson, K. A., Marsh, E. J., Nathan, M. J., & Willingham, D. T. (2013). Improving students' learning with effective learning techniques. *Psychological Science in the Public Interest*, 14(1), 4–58；个人知识管理的通行做法。", "备注": "工具与功能迭代很快，本书写作时点为 2026 年 10 月，请以各工具官方文档为准。别先纠结用哪个软件，先用最顺手的笔记工具试着记一周\"一条一议\"的笔记。"}, "extra": []}, {"n": 16, "title": "本地模型与 API：想再往深走一步的入口", "tag": {"money": "中", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "本地部署的硬件成本可能不低（尤其显存）；API 按调用量付费。", "说人话": "前两条讲的都是\"网页或 App 里对话\"。再往深走，你会用到两类东西：一是本地模型——把模型跑在自己电脑上，数据不出本机，适合处理不能外传的材料，工具类别如 Ollama、LM Studio 一类；二是 API——按调用量付费，把模型接进你自己的程序，适合批量处理、重复任务自动化。什么时候需要它们：数据敏感不能上云、要处理成百上千条记录、要把 AI 嵌进自己的工作流。门槛要讲清楚：**本地跑大模型吃硬件，尤其是显存**，大一点的模型普通笔记本跑不动；API 要一点编程基础，还要管理好密钥和费用。这一条不是必选项，是给\"想再往深走一步\"的人的入口。", "收益": "本地推理工具可在离线状态下运行模型，适合对数据不出本机有要求的场景；通过 API 调用服务时，使用者同样应注意数据合规与密钥安全。本地部署对显存与算力有要求，具体门槛随模型规模而变。", "证据等级": "B", "来源": "国家互联网信息办公室等《生成式人工智能服务管理暂行办法》（2023 年 8 月 15 日施行）；本地推理工具与模型 API 的官方文档（以官方文档为准）。", "备注": "工具与功能迭代很快，本书写作时点为 2026 年 10 月，请以各工具官方文档为准。本章不给任何工具网址；安装前认准官方渠道，别从来路不明的\"镜像站\"下载。"}, "extra": []}, {"n": 17, "title": "第一周该做的三件事：注册、交一件真活、记录好坏", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱。第一周每天二十分钟左右。", "说人话": "别先看教程，先动手做三件事。① 注册一个通用大模型（第 7 条里挑一个国内可直接用的），花十分钟随便聊聊，熟悉界面。② 把你最耗时的一件日常事交给它一次——比如把这周的课件要点整理成提纲、把一段英文材料读一遍、把一堆积压的表格整理一下，看它到底能接走多少。③ 记录它做得好和做得差的地方：哪些任务它一下就对了，哪些它答得离谱。七天可以这样排：第 1 天注册并闲聊；第 2—3 天找一件真实任务交给它；第 4 天换一个模型问同样的问题做对比；第 5 天读一读它的官方文档；第 6 天把这周用成功的提示词存下来；第 7 天复盘\"哪些以后还要用、哪些不再用\"。", "收益": "第一周的目标不是\"学会 AI\"，而是拿到一份关于\"AI 能替你做什么、不能替你做什么\"的第一手观察，这份观察是后面所有学习路径的起点。先做一件真活再学方法，能让后面的方法都能挂到具体经验上。", "证据等级": "C", "来源": "先动手、再复盘的上手方式（属通行做法，无单一文件依据）。", "备注": "受益人是自己。工具与功能迭代很快，本书写作时点为 2026 年 10 月，请以各工具官方文档为准。"}, "extra": []}, {"n": 18, "title": "用 AI 学 AI：把\"自我测验\"和\"即时反馈\"这两件最难自己做到的事接上", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱（多数对话 AI 有免费额度），花的是做练习的时间。", "说人话": "学习法里有两件事特别有效、又特别难自己做到：一是自我测验（合上书考自己），二是即时反馈（有人马上告诉你哪里错了）。AI 恰好能补这两个位置：让它用大白话解释一个概念、让它按你刚学的章节出十道题、你把答案复述给它、让它挑出你遗漏和说错的地方、再让它换一种解释直到你听懂。顺序很关键——**先让它出题，你先做，它再讲评**；反过来\"它先讲、你只点头\"就没有效果。把它当\"随时在的陪练\"，而不是\"直接给答案的题库\"。", "收益": "Dunlosky, Rawson, Marsh, Nathan & Willingham (2013) 对十种学习技术做系统评估，发表于 *Psychological Science in the Public Interest*，把\"练习测试（提取练习）\"与\"分散练习\"评为效用最高的一类技术，\"重读\"\"划重点\"评为效用较低的一类；对话式 AI 在低成本下可部分承担\"持续出题并即时讲评\"的陪练角色。", "证据等级": "B", "来源": "Dunlosky, J., Rawson, K. A., Marsh, E. J., Nathan, M. J., & Willingham, D. T. (2013). Improving students' learning with effective learning techniques. *Psychological Science in the Public Interest*, 14(1), 4–58.", "备注": "受益人是自己。AI 出题也可能出错，让它讲评时多问一句\"这道题的答案依据是什么\"，关键结论回教材或原始来源再核一遍。"}, "extra": []}, {"n": 19, "title": "建一个\"我的 AI 用法清单\"：三个月后它比任何付费课都贴合你", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱。每次成功一次，存一条，长期积累。", "说人话": "用任何笔记工具建一个清单，把每次\"用得成功\"的提示词原样存下来，按任务分类（读文献、改语言、做统计、准备面试、整理笔记……）。再记两栏：这个任务适合哪个模型、要提醒它注意什么（比如\"不要编参考文献\"\"给出处\"）。坚持下来你会得到三件事：一是同类的活不用再想怎么写提示词，直接调用；二是你摸清了自己这套活儿的最佳拍档是哪个模型；三是三个月后，你手里有一份比任何付费课都贴合自己专业和习惯的东西。这份清单没有任何通用价值，但对你是量身定做的——正因如此，它比买来的课值钱。", "收益": "把\"用成功的提示词\"沉淀成可复用的清单，是把一次性的经验变成长期资产的低成本做法；它同时呼应第 8 条\"多轮迭代\"——你记下的往往是迭代收敛后的那一版。第 21 条的\"学一门课\"流程、第 20 条的\"读文献—写论文\"流程，都可以往这份清单里补条目。", "证据等级": "C", "来源": "把经验沉淀为可复用清单的通行做法（属本书作者的整理，无单一文件依据）。", "备注": "受益人是自己。工具与功能迭代很快，本书写作时点为 2026 年 10 月，请以各工具官方文档为准。"}, "extra": []}, {"n": 20, "title": "把 AI 接进\"读文献—写论文\"的流程：给一张分工表", "tag": {"money": "0", "time": "多", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱。花的是把整个流程拆开、逐段分工的时间。", "说人话": "论文流程可以拆成八步，每一步都问一句\"这步 AI 做什么、我做什么\"。① 找文献：AI 给关键词和相关方向，你去数据库检索并确认；② 读摘要筛选题：AI 帮你把一堆摘要分类、挑出可能相关的，你再定取舍；③ 精读：AI 解释难点、翻译术语，但原文你必须自己读，要引用的段落尤其如此；④ 做笔记：AI 帮你把笔记归类和改写成结构化提纲，笔记的原始内容你自己记；⑤ 列提纲：AI 给你两三个提纲版本作参考，逻辑主线你自己定；⑥ 写初稿：**由你写**，AI 只在你卡壳时给表述建议，不能替你成段生产正文；⑦ 查逻辑漏洞：AI 扮演审稿人挑刺，你判断哪条成立；⑧ 改语言：AI 润色语法用词，事实与观点仍由你负责。总原则：交给 AI 的是\"读、整理、挑错、改语言\"，留在自己手里的是\"判断、选择、写作、担责\"。", "收益": "《中华人民共和国学位法》（2025 年 1 月 1 日施行）第三十七条规定，学位申请人存在代写、剽窃、伪造等学术不端行为的，经学位评定委员会决议，学位授予单位不授予学位或者撤销学位——据此，\"写初稿\"这一步由谁完成，直接决定论文是否合规；文献引用应遵循《信息与文献 参考文献著录规则》（GB/T 7714—2015）等规范。", "证据等级": "A", "来源": "全国人大常委会 (2024). 中华人民共和国学位法（第三十七条）；国家标准化管理委员会《信息与文献 参考文献著录规则》（GB/T 7714—2015）。", "备注": "受益人是自己。最省事的自查：交之前问自己\"这份论文的提纲和结论，我能不能从头讲一遍\"——能，说明是你的；不能，说明你交出去的不够。"}, "extra": []}, {"n": 21, "title": "把 AI 接进\"学一门课\"的流程：上课不记笔记、全靠 AI 总结是效率最低的做法", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱。花的是把预习—上课—复习—考前串成一条线的时间。", "说人话": "一门课可以拆成四步，每步 AI 的位置不同。① 预习：让它根据课程名和教材目录，列出这门课的前置知识清单，你先把缺的补上；② 上课：**自己记笔记**，这一条不能省——上课不听、课后靠 AI 总结，是最低效的做法，因为你丢掉了理解发生的现场，只剩下别人（机器）消化过的结论；③ 复习：把你自己的笔记喂给它，让它出题考你、给你补遗漏；④ 考前：把错题和不懂的点交给它，让它换着角度解释，直到你真懂。整套下来，AI 承担的是\"出题、讲评、补漏\"，你承担的是\"上课听懂、自己记录、动手做题\"。", "收益": "该流程与第 18 条的两项高效学习技术（提取练习、即时反馈）一致——Dunlosky 等 (2013) 把\"练习测试\"评为高效用技术；第 3 章在讲笔记与预习时同样强调上课当场记录的价值。把上课环节保留给自己，是维持理解链条完整的关键。", "证据等级": "B", "来源": "Dunlosky, J., Rawson, K. A., Marsh, E. J., Nathan, M. J., & Willingham, D. T. (2013). Improving students' learning with effective learning techniques. *Psychological Science in the Public Interest*, 14(1), 4–58；学习方法的通行做法。", "备注": "受益人是自己。工具与功能迭代很快，本书写作时点为 2026 年 10 月，请以各工具官方文档为准。"}, "extra": []}, {"n": 22, "title": "用 AI 做数据分析：结论必须你自己看数据验证", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "不花钱（多数有免费额度），花的是自己运行与核对的时间。", "说人话": "让 AI 帮你写 SQL、写 Python 或 pandas、解释报错、解释一段统计结果，都很实用，尤其在你记不住语法的时候。但有一条必须守住：**结论要你自己看数据验证。** 大语言模型会编出不存在的列名、编出不存在的函数、算出前后矛盾的数字。正确姿势是：让它写代码 → 你运行 → 看真实的输出 → 如果报错或结果奇怪，把真实报错贴回去让它改。要分清\"它替你写代码\"和\"它替你下结论\"——前者可以，后者不行，因为数据在你手里，它看不到。判断结果对不对的最后一句话，永远是你对着数据说的。", "收益": "生成式 AI 输出中的事实性错误（\"幻觉\"）是当前公开评测中反复出现的已知问题，涉及具体数值、字段名、函数名时尤其需要回一手数据核验；数据分析的结论应以实际运行结果为准。", "证据等级": "B", "来源": "生成式 AI 事实性错误与\"幻觉\"的公开能力说明与评测（各模型表现不同，无单一文件口径）；数据分析与统计的通行做法。", "备注": "工具与功能迭代很快，本书写作时点为 2026 年 10 月，请以各工具官方文档为准。"}, "extra": []}, {"n": 23, "title": "用 AI 准备面试与汇报：成本极低、收益直观", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。每次准备前花二三十分钟。", "说人话": "这是成本极低、收益很直观的一类用法，三件事：① 让 AI 扮演面试官，用它自己出的题一条条追问你，你口头作答，它挑你答得含糊的地方；② 让 AI 扮演评委或答辩老师，对你的稿子或方案挑刺，专门问\"你凭什么这么说\"\"这个数据的来源是什么\"；③ 让它把稿子改成\"能听懂\"的版本——把专业术语换成日常说法、把长句拆短、标出你可能讲不清的地方。注意两点：模拟面试的题目要你自己准备真实岗位的问题，别用它的通用题；它给的\"标准答案\"不是标准答案，只当参考。走完一遍，你就能发现自己在哪些地方一开口就打架。", "收益": "用\"扮演追问者\"的方式制造有压力的输出场景，本质上是低成本的模拟练习；这与第 2 条\"用得准\"一致——把 AI 用在能立刻检验效果的场景（你的回答通不通顺、讲不讲得清），是最容易看到回报的用法。", "证据等级": "C", "来源": "面试与汇报准备的通行做法（属通行做法，无单一文件依据）。", "备注": "受益人是自己。工具与功能迭代很快，本书写作时点为 2026 年 10 月，请以各工具官方文档为准。"}, "extra": []}, {"n": 24, "title": "必须验证 AI 说的话：凡是法条、数字、文号、文献，一律回原始来源核", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。花的是每条多出来的那几分钟核对时间。", "说人话": "大语言模型会生成\"看起来合理但不存在\"的内容，业内叫\"幻觉\"：不存在的法条、张冠李戴的文号、编出来的数字、查不到的参考文献。它说得越流畅，越容易让人跳过核实。所以定一条硬规矩：**凡是法条、数字、文号、参考文献、人名职务，一律回原始来源核过才算数。** 核查动作很固定：法条查全国人大官网或中国政府网；部委政策查对应部委官网；文献查 DOI，或知网、万方；统计数据找统计年鉴或官方公报。核不出来，就当它不存在，宁可不用。这一条是第 2 条\"第三层：会验证\"的具体动作，也是全章的分水岭。", "收益": "生成式 AI 输出中的事实性错误（\"幻觉\"）是当前公开评测中反复出现的已知问题，模型可能以高置信语气给出错误或过期的具体信息；凡涉及可核验的具体事实（条号、文号、数字、DOI、文献题名），应以一手来源为准。这也是把 AI 产出用于学业与工作时成本最低的一层风控。", "证据等级": "B", "来源": "生成式 AI 事实性错误与\"幻觉\"的公开能力说明与评测（各模型表现不同，无单一文件口径）；学术写作与事实核查的通行做法。", "备注": "受益人是自己。把\"核实\"当成使用 AI 的固定步骤，而不是可选项——它应该出现在你每一次要拿 AI 产出做决定的流程里。"}, "extra": []}, {"n": 25, "title": "怎么识别\"一本正经的胡说\"：五个信号 + 两个让 AI 自证的提问法", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。花的是每次多一点警觉。", "说人话": "除了逐条核实，还有几个\"可疑信号\"能帮你早点警觉：① 给不出出处，或者你要求给出处时它开始含糊；② 细节异常具体但你怎么查都查不到（具体的编号、精确到小数点的数字）；③ 引用格式很规整，但按它给的题名或 DOI 检索，查不到；④ 你追问，它的口径来回改；⑤ 同一个问题换个问法，它前后矛盾。发现这些信号就提高警惕。两个\"让 AI 自证\"的提问法：一是\"请列出你这段结论的信息来源，具体到文件名或文献题名\"；二是\"这段里哪些是你确定的、哪些是你不确定的，请分开说\"。它答得越具体、越愿意承认不确定，越可信；答得越空、越坚持什么都确定，越要小心。", "收益": "上述信号对应生成式 AI\"幻觉\"的公开特征（高置信语气、编造细节与引用、对同一问题前后不一致）；要求模型标注不确定性与来源，是降低误用风险的通行做法。", "证据等级": "B", "来源": "生成式 AI 事实性错误与\"幻觉\"的公开能力说明与评测（各模型表现不同，无单一文件口径）；事实核查的通行做法。", "备注": "受益人是自己。最实用的习惯：把\"请标注你不确定的部分\"这句话，加进你常用的提示词里。"}, "extra": []}, {"n": 26, "title": "做一个小项目，把前面学的串起来：有交付物才算学会", "tag": {"money": "0", "time": "多", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "不花钱或低。花的是把一个东西做完的时间。", "说人话": "前面学了一堆方法，只有做出来一个\"东西\"才算真的学会。给三个具体项目示例：① 把班级成绩表做成自动分析脚本——输入原始表格，输出平均分、排名、分数段分布，顺带练了第 22 条；② 给一门课的复习资料建一个可问答的笔记库——把你自己的笔记和教材要点整理进去，用自然语言提问，练了第 15 条；③ 写一个小工具处理你每天重复做的一件事——批量改文件名、自动整理下载文件夹、把散落的截图按日期归档，练了第 10、16 条。判断标准只有一条：**有交付物才算学会。** 做不完就缩小范围，做完了才算数。", "收益": "产出与技能学习中的\"输出\"环节对应——一个能跑的小工具、一份能交给别人的分析，比\"我学过 AI\"这句话更能说明问题；它也把第 2 条的\"第四层：会搭\"落到了具体动作上。", "证据等级": "C", "来源": "以可交付物检验学习效果的通行做法（属本书作者的整理，无单一文件依据）。", "备注": "受益人是自己。工具与功能迭代很快，本书写作时点为 2026 年 10 月，请以各工具官方文档为准。三个项目里挑最小的那个先做完，别三个一起开。"}, "extra": []}, {"n": 27, "title": "想往深走：值得投入的三个方向", "tag": {"money": "低", "time": "多", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "花钱不多（多为免费文档与公开数据），花的是持续投入的时间。", "说人话": "如果你打算把 AI 变成长期能力，而不是\"会用几个 App\"，三个方向值得投入。① 数据处理与自动化：学 Python 加 API，把重复劳动交给脚本，这是最通用、最容易见效的方向；② 检索增强与知识库：把你自己的资料（笔记、文献、课程材料）接给模型做问答，让它回答\"基于我这份资料\"而不是泛泛而谈；③ 本专业 + AI 的交叉点：这是你相对别人有优势的地方——懂法律的人做法律 AI 助手、懂医学的人做医学问答、懂会计的人做财务自动化，比\"只会 AI 的人\"更值钱。三个方向里，前两个是通用技能，第三个是你的差异化。选的时候想清楚：你想做\"会 AI 的人\"，还是\"懂某个领域又会 AI 的人\"。", "收益": "这三个方向分别对应第 2 条的\"第四层：会搭\"、第 15 条的\"个人知识库\"，以及第 3 条\"把 AI 用在自己专业上\"的延伸；其中\"本专业 + AI\"的交叉点之所以是差异化方向，正因为它站在第 1 条所说\"跨领域整合\"这一升值能力上。", "证据等级": "C", "来源": "由本章第 1、2、3、15 条依据汇总的方向建议（属本书作者的整理，无单一文件依据）。", "备注": "受益人是自己。工具与功能迭代很快，本书写作时点为 2026 年 10 月，请以各工具官方文档为准。"}, "extra": []}, {"n": 28, "title": "学术诚信的边界：AI 用来解释是合规，生成后直接交就是代写", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。花的是交之前想清楚\"这一步该不该交给 AI\"的一分钟。", "说人话": "边界其实不难分。**AI 用来解释概念、出练习题、检查逻辑漏洞、改语法，是合规的；让 AI 生成后直接交上去，就是代写。** 这不只是校规问题，而是法律问题。《中华人民共和国学位法》（2025 年 1 月 1 日施行）第三十七条规定，学位申请人在攻读学位期间存在代写、剽窃、伪造等学术不端行为的，经学位评定委员会决议，学位授予单位不授予学位或者撤销学位。另外，多数高校已要求作业中声明是否使用 AI 及使用方式，各校规定不同，以你本校的要求为准（属各校差异，标 C）——但\"不确定就先声明\"永远比\"不声明被发现\"划算。", "收益": "《中华人民共和国学位法》（2025 年 1 月 1 日施行）第三十七条规定：学位申请人在攻读学位期间存在代写、剽窃、伪造等学术不端行为的，经学位评定委员会决议，学位授予单位不授予学位或者撤销学位。《普通高等学校学生管理规定》（教育部令第 41 号）第二十条规定：学校应当开展学生诚信教育，以适当方式记录学生学业、学术、品行等方面的诚信信息；对违背学术诚信的，可以对其获得学位及学术称号、荣誉等作出限制。判断线：AI 用来解释概念、出练习题、检查逻辑漏洞、改语法是合规的；让 AI 生成后直接交上去，就是代写。", "证据等级": "A", "来源": "全国人大常委会 (2024). 中华人民共和国学位法（第三十七条）；教育部 (2017). 普通高等学校学生管理规定（教育部令第 41 号，第二十条）。", "备注": "各校差异。多数高校已要求作业中声明是否使用 AI 及使用方式，以本校规定为准。这一条与第 16 章\"用 AI 写作业的边界\"讲的是同一件事：那边放在数字安全语境，这里放在能力养成语境，配合着看。可执行的自查：交之前问自己\"如果老师问我这部分是怎么写出来的，我能不能如实说\"——能就交，不能就重写。"}, "extra": []}, {"n": 29, "title": "数据边界：哪些东西不要上传给 AI", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。改一次输入习惯。", "说人话": "有五类东西不要往对话式 AI 里贴：① 身份证号、银行卡号等个人敏感信息；② 他人的隐私信息（同学的身份证、联系方式、成绩）；③ 未公开的研究数据、实验原始数据和导师未发表的成果；④ 涉密或明确标注不能外传的材料；⑤ 学校内部文件。原因不是\"一上传就违法\"这种过头话，而是两点：一是**上传后你的数据就脱离了你的控制**，会不会被用于训练、留多久、谁能看到，都由平台规则决定；二是**把别人的信息传上去，可能构成对他人个人信息的违规处理**。不确定能不能传，就别传，或者先做去标识处理。", "收益": "《中华人民共和国个人信息保护法》对个人信息处理确立\"告知—同意\"与\"最小必要\"原则，处理个人信息应当有合法依据并在必要范围内进行。《生成式人工智能服务管理暂行办法》（2023 年 8 月 15 日施行）对服务提供者与使用者的相关义务作出规定。因此，向第三方 AI 服务输入他人个人信息或未公开材料，需要先想清楚：有没有处理依据、有没有超出必要范围。措辞要准确：不是\"上传就违法\"，而是上传后数据脱离你的控制，且若涉及他人信息，可能构成违规处理个人信息。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国个人信息保护法》（告知同意、最小必要相关条款）；国家互联网信息办公室等《生成式人工智能服务管理暂行办法》（2023 年 8 月 15 日施行）。", "备注": "受益人是自己。可操作做法：上传前先做\"最小化处理\"——用\"某同学\"\"A 公司\"\"某型号\"代替真名，用示例数据替代真实数据；确需处理敏感信息时，用不将输入用于训练的设置，或干脆不在线处理。"}, "extra": []}, {"n": 30, "title": "AI 生成内容要标识：显式与隐式两种，发布时应当主动声明", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。发布时多勾一个选项。", "说人话": "2025 年 9 月 1 日之后，在国内平台发布 AI 生成或合成的图文、音视频，不是\"可声明可不声明\"，而是\"应当声明\"。规则把标识分两种：一种是你能看见的**显式标识**（文字、声音、图形等用户可明显感知的提示）；另一种是写在文件里的**隐式标识**（元数据里的来源信息，肉眼看不见）。**用户通过平台发布生成合成内容时，应当主动声明并使用平台提供的标识功能；任何组织和个人不得恶意删除、篡改、伪造、隐匿这些标识。** 对大学生最现实的影响是投稿、比赛作品、公众号与短视频——凡有 AI 生成成分，先声明、先打标。", "收益": "《人工智能生成合成内容标识办法》（国家互联网信息办公室、工业和信息化部、公安部、国家广播电视总局 2025 年 3 月 7 日印发，自 2025 年 9 月 1 日起施行）规定：标识分为显式标识（以文字、声音、图形等用户可明显感知的形式提示）和隐式标识（在生成合成内容文件元数据中写入来源信息，含生成合成内容属性信息、服务提供者名称或编码、内容编号等）；用户使用网络信息内容传播服务发布生成合成内容的，应当主动声明并使用服务提供者提供的标识功能进行标识；任何组织和个人不得恶意删除、篡改、伪造、隐匿标识。配套强制性国家标准《网络安全技术 人工智能生成合成内容标识方法》（GB 45438—2025）同日施行。", "证据等级": "A", "来源": "国家互联网信息办公室、工业和信息化部、公安部、国家广播电视总局 (2025). 人工智能生成合成内容标识办法；全国网络安全标准化技术委员会. 网络安全技术 人工智能生成合成内容标识方法（GB 45438—2025）。<https://www.cac.gov.cn/2025-03/14/c_1743654684782215.htm>", "备注": "受益人是自己（也避免事后被平台处理）。这一条和第 28 条是一对：第 28 条管\"作业和论文\"（对着学校），这一条管\"你对外发布的内容\"（对着平台）。"}, "extra": []}, {"n": 31, "title": "和 AI 相关的国家职业与证书：先查备案，再决定报不报", "tag": {"money": "中", "time": "中", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "培训加考证从数百到数千元，差别很大。", "说人话": "\"人工智能训练师\"是正规的国家新职业，不是培训机构造的词：2020 年 2 月正式成为新职业并纳入国家职业分类目录；2021 年人社部与工信部共同发布《人工智能训练师国家职业技能标准》，设五级/初级工至一级/高级技师共五个等级，含数据标注员、人工智能算法测试员两个工种。据人社部门公开信息，全国已有超过 20 个与人工智能相关的新职业纳入国家职业分类目录。这类证书值不值，仍然由第 6 章那套逻辑决定：**发证机构有没有在人社部门备案、证书能不能联网查到。** 报考前先去\"技能人才评价证书全国联网查询\"核验（详见第 6 章第 3、4 条），查不到的先别交钱。", "收益": "人工智能训练师于 2020 年 2 月成为新职业并纳入国家职业分类目录；2021 年人力资源社会保障部、工业和信息化部共同颁布《人工智能训练师国家职业技能标准》，设五级/初级工至一级/高级技师共五个等级，包括数据标注员、人工智能算法测试员两个工种。据人社部门公开信息，全国已有超过 20 个与人工智能相关的新职业纳入国家职业分类目录。", "证据等级": "A", "来源": "人力资源社会保障部、工业和信息化部《人工智能训练师国家职业技能标准》（2021）；人力资源社会保障部技能人才评价工作网公开信息。", "备注": "地区差异。判断法沿用第 6 章第 3、4 条：① 发证机构是否已在人社部门备案；② 证书能否在\"技能人才评价证书全国联网查询\"里查到。查不到，就当它是一张培训结业证明。还要想清楚：用人单位要的是\"会做数据标注和算法测试的人\"，证只是佐证。"}, "extra": []}, {"n": 32, "title": "高校的 AI 教育已经在制度化：先翻自己的培养方案，再考虑校外付费课", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，半小时看培养方案。", "说人话": "你可能不需要额外花钱学 AI 基础——它已经被写进高校的课程规划里。教育部《高等学校人工智能创新行动计划》（教技〔2018〕3 号，2018 年 4 月 2 日印发）明确\"将人工智能纳入大学计算机基础教学内容\"，并提出\"人工智能 + X\"复合专业培养模式。这意味着：你的专业培养方案里，很可能已经有 AI 相关的必修课、选修课或实践环节。**先把自己的培养方案翻一遍**，看清楚学校已经安排了什么，再决定要不要花几千元买校外课。多数情况下，先把学校给的上完，比再买一套课更划算。", "收益": "教育部《高等学校人工智能创新行动计划》（教技〔2018〕3 号，2018 年 4 月 2 日印发）提出\"将人工智能纳入大学计算机基础教学内容\"，并明确\"人工智能 + X\"复合专业培养模式，推动人工智能与相关专业交叉融合。各校据此在本科培养方案中增设人工智能相关课程与实践环节（具体课程设置逐校不同，以本校当前培养方案为准）。", "证据等级": "A", "来源": "教育部 (2018). 高等学校人工智能创新行动计划（教技〔2018〕3 号）。<https://www.gov.cn/zhengce/zhengceku/2018-12/31/content_5443346.htm>", "备注": "各校差异。翻培养方案时找三类课：① 计算机基础/程序设计里的 AI 内容；② 与专业结合的\"AI + X\"课程；③ 带实践或项目环节的课。这三类都是\"已经付过学费\"的资源。"}, "extra": []}, {"n": 33, "title": "用 AI 的成本账：免费额度、订阅费、API 按量计费各适合谁", "tag": {"money": "低", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "以免费额度为主，需要时再考虑付费。", "说人话": "AI 工具的花钱方式有三档：免费额度（多数对话模型有免费的每日或每月用量）、订阅费（按月或按年，换更高的用量和更强的功能）、API 按量计费（用了多少算多少，适合接入程序的批量任务）。分别适合什么人：只是偶尔问问题、写作业、查资料，免费额度基本够；每天高频使用、且依赖高级功能的，订阅才划算；要批量处理或接进程序的，用 API。**判断标准只有一条：你用它省下的时间值不值这个钱。** 另外，学生优先用完免费额度和学校资源——不少高校已采购正版 AI 工具或提供校内大模型服务，去信息中心或图书馆官网查一次，可能省下一笔月费。", "收益": "主流生成式 AI 服务普遍提供免费额度与付费订阅并存的计费方式，以及按调用量计费的 API（据各服务官方计费页面）；具体价格与额度随服务商与时间变化，由各服务商自定，说不出一份全国统一的原文。部分高校通过信息化部门采购或自建方式向在校生提供 AI 工具或大模型服务（各校情况不同）。", "证据等级": "B", "来源": "各 AI 服务的官方计费说明（以官方页面为准）；各高校信息化中心与图书馆的服务说明（属通行做法，逐校不同）。", "备注": "工具与功能迭代很快，本书写作时点为 2026 年 10 月，请以各工具官方文档为准。别为了\"用某个付费功能\"办一张长期用不上的订阅。"}, "extra": []}, {"n": 34, "title": "AI 时代最抗贬值的四样东西", "tag": {"money": "0", "time": "多", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。花的是长期把时间投在这四样上。", "说人话": "工具会一直换，能力不会。四样东西在 AI 时代反而更值钱：① 判断力——在看起来都对的答案里挑出对的，并能说出为什么；② 写作与表达——把复杂的事讲清楚，这件事的难度不在措辞，在想明白；③ 真实的人际信任——导师愿意带你、同伴愿意和你共事，靠的是你这个人靠不靠谱；④ 把一件事做完的能力——从起念到交付，中间不烂尾。这四样都不是靠买课买来的，是靠一件件事做出来的。回到全书的总口径：你把时间和钱投在哪，决定了四年后你手里有多少\"选择权\"。工具是放大器，放大器后面那个\"你\"才是决定性的。", "收益": "这一条是本章的收束，返回全书\"选择权\"口径：判断力、表达、信任与完成度四类能力，与本章第 1 条\"升值的能力\"、第 2 条\"四层阶梯\"、第 6 条\"AI 不能替你做的那几件事\"相互呼应，构成一套完整的判断框架。", "证据等级": "C", "来源": "由本章第 1、2、6 条依据汇总的判断（属本书作者的整理，无单一文件依据）。", "备注": "受益人是自己。挑一件事，从今天起做到交付——这件小事本身就是这四样能力里的第一样。"}, "extra": []}]}, {"file": "08-竞赛科研与导师.md", "title": "8. 竞赛、科研与导师：把经历换成硬通货", "entries": [{"n": 1, "title": "大创（国创计划）：三类项目、经费标准、一学年一个", "tag": {"money": "0", "time": "中", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "国家级、省级项目通常有经费支持，学生自筹部分少；时间是一学年到两年。", "说人话": "大创（大学生创新创业训练计划）是本科生门槛最低的\"科研/创新入门项目\"：组队、找导师、写申报书、立项、中期检查、结题。国家级项目叫\"国创计划\"，由教育部主管，分三类——创新训练项目、创业训练项目、创业实践项目，分别对应做研究、做商业计划、真去做企业。它的价值不在证书本身，而在于能写进简历的一段完整项目经历，以及\"我做过研究\"这个标签。", "收益": "教育部《国家级大学生创新创业训练计划管理办法》（教高函〔2019〕13 号）规定：国创计划实行项目式管理，分为创新训练项目、创业训练项目和创业实践项目三类；项目团队成员原则上为全日制普通本科在读学生，每位学生同一学年原则上只能参与一个项目；创新训练项目和创业训练项目获得经费支持平均不低于 2 万元/项，创业实践项目获得经费支持平均不低于 10 万元/项。项目结题验收由所在高校组织，验收结果报省级教育行政部门审核备案、教育部审核公布。", "证据等级": "A", "来源": "教育部 (2019). 国家级大学生创新创业训练计划管理办法（教高函〔2019〕13 号，第四条、第九条、第十八条）. <https://www.moe.gov.cn/srcsite/A08/s5672/201907/t20190724_392132.html>", "备注": "各校差异。国家级、省级、校级三个层次的申报时间和名额由各校教务处安排，立项后\"一学年一个项目\"的限制要记住，别同时挂两个。"}, "extra": []}, {"n": 2, "title": "大创的价值在\"结题\"，不在\"立项\"", "tag": {"money": "0", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "时间主要花在中期检查与结题材料上。", "说人话": "立项时一屋子人举手，结题时往往只剩两三个。拉开差距的正是后半程：中期检查、结题报告、答辩、成果材料。而且结题才带来真收益——通过结题验收的团队成员可以按实际贡献获得学分认定，导师也有工作量认定。所以选题宁可小：一学年内能拿出一个具体成果（调研报告、原型、论文、软著）就够，别写一个三年也做不完的大题目。", "收益": "教高函〔2019〕13 号第二十一条规定：高校对通过结题验收的项目团队成员可根据实际贡献给予学分认定，对导师给予相应工作量认定；第二十条规定结题信息通过相关网站向公众提供。项目执行期一般为 1—2 年，创业实践项目一般不超过 2 年、最长可延至 4 年，且项目完成时间原则上必须在项目负责人毕业离校前；第十九条规定团队与导师对结题验收结论有异议的，可向高校有关部门提出。", "证据等级": "A", "来源": "教育部 (2019). 国家级大学生创新创业训练计划管理办法（教高函〔2019〕13 号，第十八、十九、二十、二十一条）.", "备注": "受益人是自己。常见亏法：挂名立项但从不参加组会，结题答辩被问到说不出自己做了什么，学分和经历都拿不到。"}, "extra": []}, {"n": 3, "title": "竞赛\"白名单\"：看中国高等教育学会的竞赛目录与观察目录", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，查一次目录。", "说人话": "大学生竞赛没有一份\"行政白名单\"（教育部公布的是面向中小学生的全国性竞赛活动名单，与大学无关）。目前高校综测、推免引用最多的是中国高等教育学会发布的《全国普通高校大学生竞赛分析报告》所附的竞赛目录——2023 年该清单列入 84 项赛事，另有 34 项列入观察目录。多数高校的加分目录与之高度重合。所以判断一个比赛\"算不算数\"，最快的办法是先在学会目录里搜它的名字。", "收益": "《2023 全国普通高校大学生竞赛分析报告》由中国高等教育学会高校竞赛评估与管理体系研究专家工作组发布，列入竞赛清单 84 项（其中 79 项纳入本科组排行榜），观察目录 34 项；榜单在学会官网（www.cahe.edu.cn）与全国高校学生竞赛与教师发展数据平台（rank.moocollege.com）同步发布，全国 1218 所本科院校纳入统计。目录内赛事包括中国国际\"互联网+\"大学生创新创业大赛（现名中国国际大学生创新大赛）、\"挑战杯\"系列、ACM-ICPC 国际大学生程序设计竞赛、全国大学生数学建模竞赛、全国大学生电子设计竞赛、全国大学生智能汽车竞赛、蓝桥杯等；目录实行动态调整，新增赛事需经主办单位申报、专家工作组形式审查、网络初审与会议复审。", "证据等级": "A", "来源": "中国高等教育学会 (2024-03-22). 2023 全国普通高校大学生竞赛分析报告发布（附竞赛目录与观察目录）. <https://www.cahe.edu.cn/site/content/17082.html>", "备注": "各校差异。\"在目录里\"只说明这个比赛被统计，不等于你所在学校一定加分；最终以本校综测/推免办法里的加分目录为准（见第 8 条）。"}, "extra": []}, {"n": 4, "title": "企业\"买奖\"的四个识别信号", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "花钱就能拿的奖，简历上会减分而不是加分。四个信号：① 报名/参赛要交\"评审费\"\"证书工本费\"，且金额偏高；② 主办方是某家教育科技公司或\"XX 国际研究院\"，查不到实体；③ 获奖比例高得反常（\"凡参赛均获奖\"\"金奖占三成\"）；④ 承诺\"获奖后可用于综测加分\"——这恰恰说明它不是靠含金量吸引人的。对照信号：在学会竞赛目录或观察目录里查不到，本校加分目录里也没有。", "收益": "正规学科竞赛通常由学会、行业协会或高校主办，报名费很低（或只收必要的参赛成本），评审有公开章程与获奖比例约束；且被中国高等教育学会纳入竞赛目录/观察目录的赛事有主办单位申报与专家审查程序。凡是以\"收费—发证\"为主要商业模式的比赛，其证书在高校综测认定与用人单位评估中通常不被采信。", "证据等级": "B", "来源": "中国高等教育学会《全国普通高校大学生竞赛分析报告》竞赛目录与观察目录（用于对照赛事是否被统计）；各高校综测加分办法对可加分竞赛的限定（各校差异）。", "备注": "受益人是自己。判断法：一个比赛如果\"交钱就能参加、参加就有奖、宣传里反复出现'加分'\"，基本可以直接排除。"}, "extra": []}, {"n": 5, "title": "\"挑战杯\"与\"中国国际大学生创新大赛\"：名字先分清", "tag": {"money": "低", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "报名费不高，但要投入团队大量时间。", "说人话": "这两个名字经常被混着说。\"挑战杯\"实际是两项交替举办的赛事：单数年办\"挑战杯\"全国大学生课外学术科技作品竞赛（俗称\"大挑\"，偏学术作品），双数年办\"挑战杯\"中国大学生创业计划竞赛（俗称\"小挑\"，偏创业计划）。\"互联网+\"大学生创新创业大赛已更名为\"中国国际大学生创新大赛\"。它们都是多层级赛事（校赛—省赛—国赛），含金量按层级递减：国奖与校奖相差好几档。评委真正看的是\"项目有没有真做过\"，所以要么认真做，要么别报。", "收益": "上述赛事由共青团中央、教育部、中国科协、全国学联等分别或共同主办，均设校级、省级、国家级多级赛制；获奖情况在多数高校被纳入综合素质测评加分或推免综合测评，部分省份对获奖学生在升学、创业扶持方面有倾斜政策。由于层级差异大，同一张证书在不同学校的价值可能相差数倍。", "证据等级": "B", "来源": "赛事主办方章程与各高校推免、综合素质测评办法（各校差异，具体政策以当年文件为准）。", "备注": "受益人是自己。判断投入量：先看本校\"校赛—省赛—国赛\"的晋级比例，再看你的项目有没有真实数据或产品。"}, "extra": []}, {"n": 6, "title": "数学建模（国赛/美赛）：96 小时出一篇论文，性价比高但别迷信", "tag": {"money": "低", "time": "中", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "国内赛报名费低；美国赛为 100 美元/队（约数百元人民币），集中备战两三周。", "说人话": "数模的特点是\"短平快\"：参赛队在 96 小时内解决一个实际问题、写出一篇英文或中文论文，能同时体现建模、编程、写作三样能力。国内赛（全国大学生数学建模竞赛）一般在每年 9 月，国际赛（MCM/ICM）在每年 1—2 月。组队的关键是三个人能力互补（建模手、编程手、写作手），不是三个最强的人。", "收益": "美国大学生数学建模竞赛（MCM/ICM）由 COMAP 主办，每队由 1—3 名同一学校本科生组成，竞赛时长为 96 小时，报名费为 100 美元/队，2026 年起解决方案（含摘要、正文、参考文献、附录、代码）总页数上限为 25 页；COMAP 明确允许使用大语言模型与生成式 AI 工具，但要求在文中透明标注使用方式并遵守其 AI 使用指南。全国大学生数学建模竞赛为国内规模最大的学科竞赛之一，两项赛事均被纳入中国高等教育学会竞赛目录。", "证据等级": "A", "来源": "COMAP. MCM/ICM 竞赛规则、报名与参赛说明. <https://www.contest.comap.org/undergraduate/contests/mcm/register.php>；COMAP. MCM/ICM Information Session: Recording, Resources, and FAQs. <https://comap.org/>", "备注": "受益人是自己。常见误区：把\"参加\"当\"获奖\"；美赛的 Successful Participant（成功参赛）与 Outstanding Winner 之间差了十几个档次，写简历时要说清等级。"}, "extra": []}, {"n": 7, "title": "ACM-ICPC 与程序设计类竞赛：门槛高、信号强、回报集中", "tag": {"money": "低", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "报名费低，但需要长期刷题（几百到上千小时）。", "说人话": "程序设计类竞赛（ACM-ICPC 国际大学生程序设计竞赛、蓝桥杯、中国高校计算机大赛、CCPC 等）的特点是：门槛最高、但信号也最强——因为你没法靠包装拿奖，评判标准是\"现场限时解题\"。它的回报也很集中：真正决定收益的是你的解题能力，而这个能力在求职笔试和技术面试里可以直接变现。缺点是投入巨大，且不适合\"临时抱佛脚\"。", "收益": "ACM-ICPC 为国际大学生程序设计竞赛，三人一队、赛时 5 小时、现场解题并按题数与罚时排名，已被纳入中国高等教育学会《全国普通高校大学生竞赛分析报告》竞赛目录；蓝桥杯全国软件和信息技术专业人才大赛、中国高校计算机大赛等亦在目录内。此类竞赛的成绩在保研综测与互联网/软件岗位求职中被普遍认可，但认可度依赖赛项层级（国赛/区域赛/省赛）与排名。", "证据等级": "B", "来源": "中国高等教育学会《全国普通高校大学生竞赛分析报告》竞赛目录（2023）；ICPC 官方赛事规则 <https://icpc.global/>；各高校推免与综测办法（各校差异）。", "备注": "受益人是自己。判断法：如果你想投互联网/软件岗，刷题能力是通用货币，竞赛与笔试准备高度重合；如果目标岗位不看代码，性价比就一般。"}, "extra": []}, {"n": 8, "title": "竞赛与保研/评奖怎么挂钩：去查本院那一份文件", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱。查一次本院的推免与综测办法。", "说人话": "同一张竞赛证书，在不同学校的价值能差十倍：有的学校\"省一直接加分\"，有的\"只有国奖才算\"，有的只看面试时能不能讲清你做了什么。所以下手之前先查两件事：① 本院推免/综测办法里的\"可加分竞赛目录\"；② 每个奖项等级对应多少分、有没有上限。这两个数字决定了这件事值不值得做。", "收益": "各高校推免工作办法与综合素质测评办法通常列出可加分的竞赛目录、获奖等级与对应分值，并需经公示；部分高校规定在省级以上学科竞赛获奖者、在高水平刊物发表论文者，在其他条件相近时优先接收推免。竞赛加分的具体清单与分值由各校自定，不存在全国统一标准。", "证据等级": "B", "来源": "教育部推免有关文件（如教学〔2006〕14 号《全国普通高等学校推荐优秀应届本科毕业生免试攻读硕士学位研究生工作管理办法（试行）》）；各高校推免与综合素质测评办法（各校差异，每年公示）。", "备注": "受益人是自己。查文件时注意三个限定词：\"只计前几名\"\"只计国家级\"\"同一赛事只计最高奖\"——它们决定你是\"加分\"还是\"白干\"。"}, "extra": []}, {"n": 9, "title": "竞赛的边际收益递减：选一个做深，别五个都浅浅沾一下", "tag": {"money": "0", "time": "多", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "时间是零和的：报五个比赛，等于五个都只准备一半。", "说人话": "竞赛的收益不是线性的：第一个奖的价值最大（证明\"我能做成事\"），第二个同类奖开始递减，第五个基本只是\"我参加过很多\"。更划算的策略是：选一个方向、连做一两年、做出一个能讲十分钟的具体成果（一个模型、一个作品、一份报告），并且把它写进简历的\"成果\"而不是\"经历\"。判断法：如果你的简历上五个奖项都只能写一行\"XX 奖\"，说明深度不够。", "收益": "简历评估与面试中，深入的一项经历通常比浅尝辄止的多项更受认可；成果需要能被具体描述（做了什么、遇到什么困难、怎么解决、结果如何）。竞赛的加分在多数高校设\"上限\"（每年或累计封顶），超过上限的部分不再计分，这也是边际收益递减的制度体现。", "证据等级": "C", "来源": "由本节以上各条汇总的判断方法（属本书作者的整理）。", "备注": "受益人是自己。一个自检问题：这个经历，我能不看稿讲十分钟吗？不能，就还没做深。"}, "extra": []}, {"n": 10, "title": "进实验室：大二找比大四找有用", "tag": {"money": "0", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，占的是每周几小时到十几小时。", "说人话": "想读研、想走科研路，早点进组的意义不在于\"发论文\"，而在于三件事：你会不会用仪器/跑通实验、读不读得懂文献、能不能跟导师顺畅沟通——这些才是研究生阶段的真正门槛。大四才进组，基本只能\"体验一个月就毕业\"。进组渠道一般有四条：导师双选、本科生科研训练计划、实验室开放项目、直接给老师发邮件。", "收益": "多数高校设有本科生科研训练计划、实验室开放基金或\"科研导师制\"，鼓励本科生进入课题组；参与科研的经历可作为保研综合素质测评、留学申请与研究生复试的材料。由于各校渠道与学分认定办法不同，应以本校教务处或科研管理部门的办法为准。", "证据等级": "B", "来源": "各高校本科生科研训练管理办法与实验室开放项目规定（各校差异）。", "备注": "受益人是自己。别一进组就问\"能不能挂名发论文\"，先做三个月杂活再看：这三件事（用仪器、读文献、沟通）里，你至少学会一件了吗？"}, "extra": []}, {"n": 11, "title": "进组前该问清的六个问题", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，一次面谈。", "说人话": "决定进一个组之前，把六个问题问出来（问导师，也问在读的师兄师姐）：① 这个方向在做什么、我大概做哪一块？② 每周要投入多少时间、有没有固定组会？③ 我做的事能不能出现在论文/专利的署名里？④ 有没有报酬或补贴？⑤ 组里对毕业/结题有什么要求？⑥ 如果我以后想出国，愿不愿意给我写推荐信？六个问题问完，你会发现很多\"看起来很牛\"的组并不适合本科生。", "收益": "这六个问题分别对应本科阶段最容易被隐瞒的四类成本：时间投入、产出归属、经济回报、未来背书。科研经历的价值往往不在\"进过组\"，而在\"有没有持续参与、有没有明确的任务与产出\"；提前问清，可避免\"进组半年只是打杂且无署名\"的常见情况。", "证据等级": "C", "来源": "属通行做法与本书作者的整理（无单一文件依据；问法可结合本校科研训练管理办法调整）。", "备注": "受益人是自己。特别要问第 ③ 条：署名规则要在做事之前说清，事后争署名是最伤关系也最没用的做法。"}, "extra": []}, {"n": 12, "title": "给导师发邮件：四行讲完，附一页简历", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。十分钟。", "说人话": "导师每天收到几十封邮件，能被读完的只有一种：短、具体、有礼貌。四行就够——第一行\"我是谁\"（年级、专业、绩点或排名）；第二行\"我为什么找你\"（对你哪个方向感兴趣，最好提一句你看过的那篇工作或那个项目）；第三行\"我想做什么\"（希望能进组做本科生科研，或旁听组会）；第四行\"我提供什么\"（每周可投入的时间、我会的技能、什么时候方便见面）。附件只放一页简历。别写\"老师您好，我对科研很感兴趣\"这种没有信息量的话。", "收益": "学术沟通的通行规范是简明、具体、有礼貌，并说明来意与可提供的价值；冗长、群发、只写寒暄的邮件通常得不到回复，因为它无法让收件人判断\"这个人要什么、值不值得花时间\"。邮件标题也应写清身份与诉求（如\"XX 学院大二本科生 X 关于加入课题组的咨询\"）。", "证据等级": "C", "来源": "学术沟通通行规范（属通行做法与本书作者的整理）。", "备注": "受益人是自己。发之前检查两件事：对方名字写对了没有、附件能不能打开。发出去一周没回复，可以礼貌跟进一次，不要连发。"}, "extra": []}, {"n": 13, "title": "怎么判断一个课题组值不值得进：三个信息源", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，两三次聊天。", "说人话": "导师主页只写\"发了什么、拿了什么项目\"，看不出\"待着舒不舒服\"。三个更靠谱的信息源：① 该组在读的师兄师姐（问\"组会一周几次、导师多久见一次学生、有没有人半年不上线\"）；② 该组的毕业去向（近三年学生去了哪儿，是继续读博还是转行）；③ 组会氛围（旁听一次组会，看提问是讨论还是挨骂）。三个信息源交叉，你就能判断这个组是\"高压力高产出\"还是\"放养\"或\"黑洞\"。", "收益": "导师方向、经费、对学生的时间投入与毕业去向，对研究生的培养体验和产出影响很大，是学术圈内公认的关键决策；对本科生而言，判断标准更简单：这个组有没有给你具体任务、有没有人带你、产出归不归你。在读学生的口碑与毕业去向是比导师主页更可靠的信息源。", "证据等级": "C", "来源": "属通行做法与本书作者的整理（无单一文件依据）。", "备注": "受益人是自己。警惕两种极端：完全放养（半年见不到人）和高强度无产出（做了很多但署名没你）。两者都不适合本科生。"}, "extra": []}, {"n": 14, "title": "读论文的三遍法：先判断要不要读，再决定读多深", "tag": {"money": "0", "time": "中", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱。", "说人话": "一开始读不懂论文是正常的。有效的方法是\"三遍读\"：第一遍只看标题、摘要、图表和结论，用五分钟判断这篇要不要继续读；第二遍看方法和主要结果，用一小时理解它做了什么；第三遍再抠细节、数学推导和参考文献，只在你要复现或引用它时才做。另一个顺序也很重要：先读综述（review），再读具体论文，因为综述会告诉你这个领域的骨架。", "收益": "文献阅读的三遍法（three-pass approach）由 S. Keshav 在《How to Read a Paper》中系统提出，是科研入门的通行方法；\"先综述后原文\"的阅读顺序亦被广泛采用。配合机构订阅的数据库与文献管理工具（Zotero、EndNote），可显著降低找文献与整理文献的成本。", "证据等级": "B", "来源": "Keshav, S. (2007). How to Read a Paper. *ACM SIGCOMM Computer Communication Review*, 37(3), 83–84.", "备注": "受益人是自己。学校图书馆通常已订阅大量数据库，别去盗版网站下载（涉版权与安全风险）。"}, "extra": []}, {"n": 15, "title": "组会发言：先讲\"我做了什么\"，再讲\"我卡在哪\"", "tag": {"money": "0", "time": "中", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，但每次要花一两个小时准备。", "说人话": "本科生在组会上的最大问题是\"讲了三分钟还没进入正题\"。有效的结构是三段：① 上次到现在我做了什么（具体到\"跑了三组实验、读完两篇文献\"）；② 结果是什么（哪怕结果是\"没做出来\"）；③ 我卡在哪里、需要什么帮助。这样导师和师兄师姐才能给你有用的反馈。\"我这周还在看文献\"是最没用的一句话。", "收益": "组会的作用是获取反馈，而反馈的质量取决于你提供的信息是否具体。科研训练的核心是\"提出问题—做—汇报—修正\"的循环，能在组会上把问题说清楚的学生，通常也是最快上手科研的。这也与\"刻意练习需要即时反馈\"的机制一致（见第 6 章第 21 条）。", "证据等级": "C", "来源": "属通行做法与本书作者的整理。", "备注": "受益人是自己。准备组会发言的方法：提前写三行字（做了什么/结果/卡点），照着讲。"}, "extra": []}, {"n": 16, "title": "论文署名不是\"人情\"：没有实质贡献的署名是科研失信", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，但要在一开始就谈清。", "说人话": "署名顺序和\"谁该署\"是科研里最敏感的事。有一条底线要知道：无实质学术贡献而署名，本身属于\"违反论文、奖励、专利等署名规范的行为\"，被《科研失信行为调查处理规则》列为科研失信行为之一。也就是说，\"给同学挂个名\"\"老师把我加进去\"这类操作是有制度风险的。反过来说，如果你确实做了工作（设计了实验、写了代码、分析了数据），就该在开始前把署名规则谈清楚。", "收益": "《科研失信行为调查处理规则》（国科发监〔2022〕221 号，科技部等二十二部门印发）第二条第（六）项将\"无实质学术贡献署名等违反论文、奖励、专利等署名规范的行为\"列为科研失信行为；第二十九条规定处理措施包括\"暂缓授予学位\"\"不授予学位或撤销学位\"\"记入科研诚信严重失信行为数据库\"等。规范的作者贡献声明（如 CRediT 分类）有助于界定每位作者的贡献。", "证据等级": "A", "来源": "科技部等二十二部门 (2022). 科研失信行为调查处理规则（国科发监〔2022〕221 号，第二条、第二十九条）. <https://www.most.gov.cn/xxgk/xinxifenlei/fdzdgknr/fgzc/gfxwj/gfxwj2022/202209/t20220907_182313.html>", "备注": "受益人是自己。谈署名的时机是\"做事之前\"，不是\"投稿之前\"。第 1 章第 16 条讲过：代写还会涉及撤销学位的后果。"}, "extra": []}, {"n": 17, "title": "科研诚信与数据留存：原始数据要留，编造篡改是硬红线", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，但要有留痕习惯。", "说人话": "科研里最容易踩的坑不是\"做不出结果\"，而是\"结果不好看，于是改一改\"。制度对这件事的定义很明确：编造研究过程、伪造研究成果、买卖实验研究数据、伪造篡改数据图表结论等，都属于科研失信行为。而且调查时是要核对原始记录的——所以要养成留痕习惯：实验记录本、代码与数据版本、图表生成脚本，都存好。另外，调查期间伪造、篡改、隐匿、销毁证据材料本身也是被禁止的行为。", "收益": "《科研失信行为调查处理规则》第二条规定，科研失信行为包括\"编造研究过程、伪造研究成果，买卖实验研究数据，伪造、篡改实验研究数据、图表、结论、检测报告或用户使用报告等\"；第三条规定任何单位和个人不得阻挠、干扰调查处理；第四条规定当事人及证人应配合调查，\"不得伪造、篡改、隐匿、销毁证据材料\"；第十七条规定调查应包括行政调查（对相关原始实验数据、协议、发票等证明材料和研究过程进行核对验证）与学术评议。", "证据等级": "A", "来源": "科技部等二十二部门 (2022). 科研失信行为调查处理规则（国科发监〔2022〕221 号，第二、三、四、十七条）.", "备注": "受益人是自己。留痕的最低标准：能证明\"这个图是从这份数据、用这段代码生成的\"。数据混乱到说不清来源，出了争议吃亏的是你。"}, "extra": []}, {"n": 18, "title": "\"水刊\"与掠夺性期刊：四个信号把它认出来", "tag": {"money": "低", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。投稿前查十分钟。", "说人话": "本科生独立发高水平论文很难（这很正常），更现实的是参与导师课题、做二作或三作。但要小心一种陷阱：把钱花在\"掠夺性期刊\"（predatory journals）上——它们以收取版面费为营利模式、缺乏实质同行评审，发出来的东西在真正的学术评审面前是减分项。四个信号：主动反复邮件约稿、承诺\"快速发表\"（几周内）、版面费很高且可以讲价、期刊在正规学术索引里查不到。", "收益": "正规学术期刊有同行评审流程，通常不向作者收取版面费或只收合理的发表费用；掠夺性期刊以版面费为营利模式、审稿形同虚设，被多国科研机构与学者列入警示名单（相关讨论以 Beall 名单为代表）。判断期刊是否正规，可查其是否被权威索引收录、编委会是否真实可查、是否在期刊官网公布明确的审稿流程。", "证据等级": "B", "来源": "关于掠夺性期刊的通行界定与各国科研机构指引（如 Beall's List 相关讨论）；各高校科研管理部门对论文发表的诚信要求（各校差异）。", "备注": "争议。什么算\"水刊\"确有争议，但一条比较稳的判断法：如果一个期刊主动、反复地邮件约稿并承诺快速发表，就很可疑。"}, "extra": []}, {"n": 19, "title": "投稿与学术会议：基本流程其实很固定", "tag": {"money": "低", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "会议注册费与差旅费（部分可申请学校资助或项目经费）。", "说人话": "一篇论文从投出去到发表，流程基本固定：选定期刊/会议 → 按其模板写作 → 在线投稿 → 编辑初审 → 送同行评审（peer review）→ 大修/小修/拒稿 → 修回再审 → 接收 → 校样 → 见刊。会议则多一轮\"投稿—评审—现场报告—论文集\"。本科生的现实路径通常是：跟着导师做一个完整的小题目，在导师指导下投一个会议或期刊，亲身走一遍这个流程。", "收益": "学术出版有通行的同行评审流程与出版伦理规范（如 COPE《Committee on Publication Ethics》发布的各类指南），其中要求作者声明贡献、披露利益冲突、遵守数据与图像规范；虚构同行评议专家及评议意见被《科研失信行为调查处理规则》第二条明确列为科研失信行为。学术会议提供同行交流机会，会议论文通常有明确的截稿日期与评审标准。", "证据等级": "B", "来源": "COPE（Committee on Publication Ethics）出版伦理指南 <https://publicationethics.org/>；科技部等二十二部门 (2022). 科研失信行为调查处理规则（第二条关于\"虚构同行评议专家及评议意见\"的规定）.", "备注": "受益人是自己。开会不一定要\"去很多地方\"：一年参加一次本领域会议、认真听完并提问，比凑三次会的价值高。"}, "extra": []}, {"n": 20, "title": "专利与软件著作权：本科生也能申请，先算清费用和用途", "tag": {"money": "低", "time": "中", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "实用新型、外观设计专利费用较低，发明专利较高且周期长；软著登记费通常几百元。", "说人话": "专利分三类——发明、实用新型、外观设计，它们的审查严格程度和周期差别很大（发明专利要实质审查，通常要一两年；实用新型和外观设计相对快）。软件著作权可以登记，办理较快、成本低。它们在保研综测、创新创业评审里常能加分，但\"加分\"和\"有价值\"是两回事：一个没人用的实用新型专利，在求职面试里几乎不提分。所以做法是：先查本校加分目录认不认，再决定要不要花钱办。", "收益": "《中华人民共和国专利法》第二条将专利分为发明、实用新型和外观设计三种；专利申请向国家知识产权局提出，软件著作权可向中国版权保护中心登记。各高校在综合素质测评、推免、学分认定中对专利与软件著作权设有相应加分规定（多为校级差异）。专利与软著的价值高度依赖是否被实际使用或转化。", "证据等级": "B", "来源": "《中华人民共和国专利法》（第二条）；国家知识产权局专利申请流程与国家版权保护中心软件著作权登记流程；各高校综测加分办法（各校差异）。", "备注": "受益人是自己。判断法：如果办它的唯一目的是\"综测加几分\"，先确认那几分值不值你花的时间和几百块钱；如果是真想保护一个作品，再去做。"}, "extra": []}, {"n": 21, "title": "推荐信怎么攒：从\"教过你\"到\"能具体写你\"", "tag": {"money": "0", "time": "中", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，但要提前一两年布局。", "说人话": "推荐信不是毕业前临时找老师写的，而是提前\"攒\"出来的：一封有分量的推荐信，要求写的人能说出你的具体表现（\"他在我的课上做的项目是……\"\"他在组里负责……\"）。所以策略是：选两三位跟你关系深、你在他那儿有具体产出的老师（任课老师、导师、项目负责人），持续打交道；到需要的时候，把你做过的项目清单、成绩单、申请方向发给对方，帮对方回忆起你。", "收益": "推荐信的可信度取决于推荐人对被推荐人的了解程度与具体描述，而非推荐人的头衔大小；留学申请、夏令营/推免申请、部分奖学金申请通常要求 1—3 封推荐信。提前建立\"有具体产出的师生关系\"是提高推荐信质量的关键，临时找不熟悉的\"大牌\"老师代写，效果通常更差。", "证据等级": "C", "来源": "属通行做法与本书作者的整理。", "备注": "受益人是自己。两条纪律：① 提前至少两周提出请求，并附上你的材料包；② 不要给老师发送\"已经写好的推荐信\"让其照样签——这既失礼，也可能触及诚信问题。"}, "extra": []}, {"n": 22, "title": "找导师前先问自己三件事", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "① 我是想做研究，还是想找个\"靠山\"（挂名、拿推荐信）？② 我每周能真正拿出多少时间？③ 我打算读研还是就业？三个答案不同，选的导师和组也不同：想读研的，选论文多、组会密、有师兄带人的组；想就业的，选与产业联系多、项目落地的组；只想拿背书的，不如直接找一个愿意见你的任课老师做小课题。选错方向的代价，是半年后发现\"这不是我要的\"。", "收益": "导师选择（研究方向、经费、对学生的时间投入、毕业去向）对学生的培养体验和产出影响很大，是学术圈内公认的关键决策；对本科生而言，判断标准应回到自身目标：读研看学术训练，就业看项目与技能，短期目标看能否拿到具体产出。三个问题能把模糊的\"想跟个好导师\"变成可执行的筛选条件。", "证据等级": "C", "来源": "属通行做法与本书作者的整理。", "备注": "受益人是自己。找该组在读的学长学姐聊十分钟，比看导师主页一小时有用（见第 13 条）。"}, "extra": []}, {"n": 23, "title": "竞赛和科研别两头都要：选一个做深", "tag": {"money": "0", "time": "多", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "时间是零和的：两边都投入，两边都不深。", "说人话": "同时打三场比赛、进两个实验室、还做学生工作，结果是每件事都只有三成深度。更划算的是：选一个方向做一年到两年，做出一个能讲十分钟的具体成果。这不是\"少做事\"，而是把有限时间压在一处，让简历上出现一个真正扎实的条目——招聘和推免看的是后者。", "收益": "简历评估与面试中，深入的一项经历通常比多个浅尝辄止的经历更受认可；成果需要能被具体描述（做了什么、解决了什么、结果如何）。竞赛加分与科研产出在保研综测中往往各有上限，同时铺开并不叠加收益，反而增加\"每件都做不完\"的风险。", "证据等级": "C", "来源": "由本节以上各条汇总的判断方法（属本书作者的整理）。", "备注": "受益人是自己。如果实在要并行，就\"一主一辅\"：主线投入七成时间，辅线三成，且辅线必须是低成本、不占大块时间的。"}, "extra": []}, {"n": 24, "title": "本科生科研性价比排序：一张四行的判断清单", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，一个下午。", "说人话": "把可选的经历列出来，逐项问四件事：① 成本（要花多少钱、多少时间、要不要毅力）；② 产出（一学年后我能拿出什么：成果、技能、署名、推荐信）；③ 认定（本校综测/推免认不认，目标岗位看不看）；④ 可迁移（这件事练到的能力，离开这个场景还能用吗）。四行填完，你会发现\"大创 + 一段实验室经历\"通常性价比最高，\"一堆小比赛 + 几个挂名\"最差。", "收益": "这套方法把竞赛科研当成投资决策：比较成本与可验证产出，再看制度是否认定（第 8 条）与能力是否可迁移。本科生阶段真正稀缺的不是奖项数量，而是\"完整做完一件事\"的经验与随之而来的可展示成果。", "证据等级": "C", "来源": "由本节以上各条汇总的判断方法（属本书作者的整理）。", "备注": "受益人是自己。最后提醒一句：如果你做完一件事只留下了\"去过\"这个词，那它多半不是经历，只是日程。"}, "extra": []}]}, {"file": "09-奖学金助学金与贷款.md", "title": "9. 奖学金、助学金与贷款：把能领的钱都领了", "entries": [{"n": 1, "title": "第一件事是\"家庭经济困难学生认定\"：不做这一步，后面全落空", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，填一份认定申请表、交一组证明材料。", "说人话": "国家助学金、国家励志奖学金、勤工助学岗位、学费减免、临时困难补助，统统以\"家庭经济困难学生认定\"为前提，没做认定，条件符合也申请不了。认定一般每学年做一次，通常在秋季学期开学后一两个月内截止。很多学生条件明明够了，就因为不知道要主动申请、或者不好意思交证明，白白错过一整年的资助。", "收益": "依据教育部等六部门《关于做好家庭经济困难学生认定工作的指导意见》（教财〔2018〕16 号），认定工作原则上每学年进行一次，认定等级一般分为\"一般困难、困难、特别困难\"三档，其结果是国家助学金、国家励志奖学金、勤工助学、学费减免等项目的直接依据；认定过程应保护学生隐私，不得让学生公开\"演讲式\"讲述贫困。", "证据等级": "B", "来源": "教育部等六部门 (2018). 关于做好家庭经济困难学生认定工作的指导意见（教财〔2018〕16 号）；全国学生资助管理中心政策简介。<https://www.xszz.edu.cn/>", "备注": "认定不只看收入。家庭突发重病、失业、灾害、多子女同时上学，都属于要主动写进去的情形。低保证、残疾证、诊断书、受灾证明这类材料，回户籍地开最快，别在学校临时凑。"}, "extra": []}, {"n": 2, "title": "学费凑不齐就\"绿色通道\"先入学：不能因为钱不上学", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，报到时走一次专门窗口。", "说人话": "所有高校都必须为家庭经济困难的新生开\"绿色通道\"：先办入学和注册，学费住宿费可以缓缴，入学之后再通过国家助学贷款、助学金、学费减免、临时困难补助这些方式补齐。因为\"学费还没凑齐\"就放弃报到，是完全没必要吃的亏，而且第二年未必还能补回来。", "收益": "教育部要求各高校建立新生入学\"绿色通道\"，对家庭经济困难新生一律先办理入学手续，再根据核实后的情况分别采取不同措施予以资助。走绿色通道办理入学，不影响学籍注册，学生正常享有在校生的全部权利。", "证据等级": "B", "来源": "教育部关于做好高校家庭经济困难新生入学\"绿色通道\"工作的历年通知；全国学生资助管理中心政策简介。<https://www.xszz.edu.cn/>", "备注": "走绿色通道前先联系学校学生资助中心或辅导员报备，报到当天带好录取通知书、身份证和家庭经济困难相关材料，现场填表即可。受益人是自己和家庭。"}, "extra": []}, {"n": 3, "title": "国家奖学金：本专科每生每年 10000 元，名额已翻倍到 12 万名", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，填一张申请审批表，成绩与成果要够硬。", "说人话": "这是本专科阶段金额最高的国家级奖学金，每生每年 1 万元，一年评一次，二年级以上才能申请。2024 年名额从全国每年 6 万名翻倍到 12 万名，标准从 8000 元提到 1 万元，相当于门槛实打实降了一档；但竞争看的仍是年级排名和竞赛科研产出，不是\"表现不错\"。", "收益": "财政部、教育部《关于调整高等教育阶段和高中阶段国家奖助学金政策的通知》（财教〔2024〕181 号）明确：本专科国家奖学金奖励名额由每年 6 万名增加到 12 万名，奖励标准由每生每年 8000 元提高到 10000 元；对象为二年级以上（含二年级）全日制本专科在校生中特别优秀的学生。同一学年内不能与国家励志奖学金同时获得，但可以同时申请国家助学金。", "证据等级": "A", "来源": "财政部、教育部 (2024). 关于调整高等教育阶段和高中阶段国家奖助学金政策的通知（财教〔2024〕181 号）；全国学生资助管理中心。<https://www.xszz.edu.cn/>", "备注": "评审在每年秋季学期进行，一般要求 9 月底前提交材料、校内公示不少于 5 个工作日，12 月 31 日前一次性发放到本人银行卡。想拿它，往前倒推一年就得把名次和成果做出来。"}, "extra": []}, {"n": 4, "title": "国家励志奖学金：每生每年 6000 元，\"困难\"和\"成绩好\"两条都要", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，先做完家庭经济困难认定再申请。", "说人话": "这一条比国家奖学金多一道门槛：必须是已经通过家庭经济困难认定的学生，同时成绩要优秀。所以\"家里困难 + 成绩靠前\"的人一年最多能拿 6000 元。往年不少成绩很好、但嫌麻烦没做困难认定的学生，就是因为少交了一张表而申请不了，很可惜。", "收益": "财教〔2024〕181 号将本专科国家励志奖学金标准由每生每年 5000 元提高到 6000 元；资助对象为品学兼优、家庭经济困难的二年级以上（含二年级）全日制本专科在校生，覆盖面约为本科在校生总数的 3%、高职在校生总数的 3.3%。同一学年内不能与国家奖学金同时获得。", "证据等级": "A", "来源": "财政部、教育部 (2024). 关于调整高等教育阶段和高中阶段国家奖助学金政策的通知（财教〔2024〕181 号）。<https://www.xszz.edu.cn/>", "备注": "顺序不能反：先认定（第 1 条），再评奖。认定材料一般秋季开学就收，别等评奖通知下来才想起来办。"}, "extra": []}, {"n": 5, "title": "国家助学金：平均每生每年 3700 元，按困难程度分 2 到 3 档", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，前提是完成家庭经济困难认定。", "说人话": "只要通过困难认定，绝大多数人每年都能领到助学金，不需要靠成绩排名去抢。2024 年标准从平均 3300 元提高到 3700 元，高校可以在 2500 到 5000 元的区间内自己分 2 到 3 档。这是最\"普惠\"的一档资助，金额不算高，但胜在稳定、覆盖广。", "收益": "财教〔2024〕181 号规定：自 2024 年秋季学期起，本专科国家助学金平均资助标准由每生每年 3300 元提高到 3700 元，具体标准由高校在每生每年 2500 至 5000 元范围内自主确定，可分为 2 至 3 档；全日制在校退役士兵学生全部享受本专科国家助学金。助学金通常按学年评定、分月或分学期发放到学生资助卡。", "证据等级": "A", "来源": "财政部、教育部 (2024). 关于调整高等教育阶段和高中阶段国家奖助学金政策的通知（财教〔2024〕181 号）。<https://www.xszz.edu.cn/>", "备注": "助学金与国家奖学金可以同时获得（国家奖学金和国家励志奖学金则是二选一）。困难认定的等级越高，助学金档次通常越高，所以困难情况要如实、完整地写。"}, "extra": []}, {"n": 6, "title": "研究生国家奖学金：硕士 2 万元、博士 3 万元，名额也翻倍了", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，靠科研产出和导师推荐。", "说人话": "打算读研、读博，先搞清楚研究生的钱从哪来。国家层面有三块：研究生国家奖学金（硕士 2 万元/年、博士 3 万元/年，竞争最激烈）、学业奖学金（覆盖面广，很多学校全日制硕士人人有份）、国家助学金（按月发），再叠加导师课题补助，基本能覆盖生活费。报考前就把目标院校的奖助办法查清楚。", "收益": "研究生国家奖学金标准为硕士每生每年 2 万元、博士每生每年 3 万元；名额自 2024 年起由全国每年 4.5 万名增加到 9 万名。全日制研究生普遍享受研究生国家助学金，学业奖学金按各校办法评定、覆盖面较广，部分省份还提高了省属高校研究生学业奖学金的支持标准。", "证据等级": "B", "来源": "财政部、教育部关于调整国家奖助学金政策的通知（财教〔2024〕181 号）；研究生奖助相关政策；全国学生资助管理中心。<https://www.xszz.edu.cn/>", "备注": "地区差异。研究生国家助学金和学业奖学金的具体标准由中央和地方分别确定，差异较大，必须以目标院校当年的奖助办法为准。"}, "extra": []}, {"n": 7, "title": "校级、院级、企业冠名奖学金：门槛低、名额多，最容易漏领", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱，集中交一次申请材料。", "说人话": "国家奖学金名额少，校级、院级和企业冠名奖学金数量多得多，很多只要\"绩点进专业前 30%、没有挂科和违纪\"就能申请，金额从几百到几千元不等。麻烦的是通知分散在教务处、学院、基金会几个渠道，你不主动盯，往往根本不知道它已经开放申报了。", "收益": "各高校普遍设校级奖学金（常分一、二、三等）、院级奖学金、企业冠名奖学金和专业奖学金，评定依据为学年学业成绩与综合表现，评定时间多集中在每学年秋季学期。各项奖学金能否叠加获得，规则各校不同，需以本校评审办法为准。", "证据等级": "C", "来源": "各高校奖学金评审办法（属通行做法，具体奖项、金额、时间逐校差异）。", "备注": "申请材料每一句都要落到具体成果上：\"主持大创项目 1 项\"\"获省级竞赛二等奖\"\"学年绩点 3.8\"，别写\"学习认真、态度端正\"这种没法被验证的空话。"}, "extra": []}, {"n": 8, "title": "社会奖助学金与定向培养资助：多在本院，问得到的才能申", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱，可能要求面谈或写一段自我介绍。", "说人话": "很多学院有校友、企业、基金会设的专项资金，金额从几千到上万，评的是\"专业 + 家庭情况 + 发展潜力\"的组合，通常只在本院内部通知，外院学生看不到。这类名额的竞争比国家级小得多，与其干等通知，不如直接去问辅导员有没有正在评的项目。", "收益": "社会奖助学金通常由设奖单位与学校签订协议，明确名额、金额、评选条件以及是否定向（如限定某专业、某籍贯）。部分定向资助（如师范生公费教育、定向医学生）以毕业后履约服务为条件，需签署协议，违约要退还并支付违约金。", "证据等级": "C", "来源": "各高校基金会、校友会与学院资助办法（属通行做法，逐校差异）。", "备注": "有履约条件的定向资助，签字前一定看清\"毕业后要去哪、服务几年、违约怎么赔\"。把附带条件当成\"钱\"的一部分一起权衡，别只看金额。"}, "extra": []}, {"n": 9, "title": "国家助学贷款：本专科每年最高 2 万、研究生 2.5 万，在校利息财政全付", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱办，借的是本金、毕业后要还。", "说人话": "这是能领到手的额度最大的一笔资助。2024 年秋季学期起，本专科每年最高 2 万元、研究生每年最高 2.5 万元；在校期间利息全部由财政补贴，毕业后利率是同期同档次 LPR 减 70 个基点，还款期限最长 22 年、毕业后还有还本宽限期。它解决的是\"当下没钱\"，不是\"以后不用还\"。", "收益": "财政部、教育部、中国人民银行、金融监管总局《关于调整完善国家助学贷款有关政策的通知》（财教〔2024〕188 号）规定：自 2024 年秋季学期起，全日制本专科生每人每年申请贷款额度由不超过 16000 元提高至不超过 20000 元，全日制研究生由不超过 20000 元提高至不超过 25000 元；贷款利率由同期同档次 LPR 减 60 个基点调整为减 70 个基点；学生在校期间利息全部由财政补贴。还款期限为学制加 15 年、最长不超过 22 年，毕业后可享最长 5 年还本宽限期。", "证据等级": "A", "来源": "财政部、教育部、中国人民银行、金融监管总局 (2024). 关于调整完善国家助学贷款有关政策的通知（财教〔2024〕188 号）。<https://www.xszz.edu.cn/n39/n53/c11911/content.html>", "备注": "额度要按实际需要申请，不要\"能借多少借多少\"——毕业后的每一分本金都要还。贷款优先用于学费和住宿费，超出部分可用于生活费。"}, "extra": []}, {"n": 10, "title": "生源地贷款和校园地贷款只能二选一，九成的人该选生源地", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱，一般在暑假办理。", "说人话": "两种贷款的性质完全一样，区别在办理地点和维护方式：生源地信用助学贷款在户籍所在县（市、区）的学生资助管理中心办，暑假就能一次办完；校园地国家助学贷款则是入学以后在学校办。生源地这条路流程更成熟、续贷能线上远程办理，所以选的人多得多。", "收益": "按国家助学贷款政策，生源地信用助学贷款由学生和共同借款人（通常是父母或其他法定监护人）与县级学生资助管理中心、经办银行共同签订合同，双方共同承担还款责任；同一学年内学生不得重复申请两种贷款，只能选择其一。首次办理一般需学生与共同借款人携带身份证、户口本、录取通知书到县级资助中心现场签约。", "证据等级": "B", "来源": "财政部、教育部等 (2024). 财教〔2024〕188 号；全国学生资助管理中心助学贷款办理指南。<https://www.xszz.edu.cn/>", "备注": "生源地贷款窗口一般在 7—9 月，错过就得等下一年。首次签合同要共同借款人到场，别等到开学前几天才办，那时候人最多。"}, "extra": []}, {"n": 11, "title": "毕业后怎么还：宽限期只还息、提前还款通常不收违约金", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，但要按合同还款。", "说人话": "助学贷款毕业后一般有还本宽限期，宽限期内只还利息、不还本金；手头宽裕也可以提前还款，经办银行通常不收违约金。真正要小心的是逾期——一旦连续或长期不还，不但要付罚息，还会被报送进个人征信，影响以后的房贷、信用卡，甚至部分岗位的背景审查。", "收益": "按国家助学贷款政策，学生毕业后进入还本宽限期（一般最长 5 年），宽限期内只付利息；毕业后利息由个人承担，提前还款一般不收取违约金。根据《征信业管理条例》，未按合同约定还款形成的逾期信息会报送金融信用信息基础数据库，不良信息自不良行为或者事件终止之日起保存 5 年。", "证据等级": "B", "来源": "《征信业管理条例》（国务院令第 631 号）；财政部、教育部等 (2024). 财教〔2024〕188 号；中国人民银行征信中心。<https://www.pbccrc.org.cn/>", "备注": "毕业前一年就留意还款渠道（经办银行 App、支付宝/云闪付等），把还款日和金额记进手机日历。换了手机号一定要在系统里更新，否则扣款通知收不到，也会算逾期。"}, "extra": []}, {"n": 12, "title": "基层就业学费补偿与贷款代偿：去中西部基层可以少还或不用还", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，但要履约服务一定年限。", "说人话": "到中西部地区和艰苦边远地区基层单位就业、服务满一定年限的毕业生，中央财政可以补偿学费或代偿助学贷款；应征入伍服义务兵役也有同类的补偿和代偿。本质是\"用几年基层服务换一笔钱\"，代价是工作地点和年限被锁定，签字之前一定要想清楚。", "收益": "国家对中央部门所属高校应届毕业生到中西部地区、艰苦边远地区和老工业基地县以下基层单位就业、服务期达到 3 年以上（含 3 年）的，实行学费补偿或国家助学贷款代偿；对应征入伍服义务兵役的高校学生，实行学费补偿、国家助学贷款代偿和退役复学学费减免。两类政策的金额上限与助学贷款额度一致（2024 年起本专科每年最高 2 万元、研究生每年最高 2.5 万元）。", "证据等级": "B", "来源": "财政部、教育部《高等学校毕业生学费和国家助学贷款代偿暂行办法》；《高等学校学生应征入伍服义务兵役国家资助办法》；全国学生资助管理中心。<https://www.xszz.edu.cn/>", "备注": "地区差异。补偿代偿分中央和地方两条线，具体覆盖范围、服务年限、申报流程以就业地省级学生资助管理部门当年通知为准。"}, "extra": []}, {"n": 13, "title": "应征入伍：学费补偿/贷款代偿本专科每年最高 2 万，退役复学还减免", "tag": {"money": "0", "time": "多", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "服役两年，另有体检政审门槛。", "说人话": "大学生服义务兵役，入伍的时候在校期间缴的学费可以一次性补偿，或者代偿国家助学贷款；退役复学或者入学时再减免一部分学费。2024 年 9 月起，本专科每生每年最高 2 万元、研究生每生每年最高 2.5 万元。此外，全日制在校退役士兵学生全部享受本专科国家助学金。", "收益": "财政部、教育部等部门政策规定：对应征入伍服义务兵役的高校学生，入伍时对其在校期间缴纳的学费实行一次性补偿，或对国家助学贷款实行代偿；退役后自愿复学或入学的实行学费减免，标准均为本专科每生每年最高 20000 元、研究生每生每年最高 25000 元（2024 年 9 月起）。全日制在校退役士兵学生全部享受本专科国家助学金，平均每生每年 3700 元。", "证据等级": "A", "来源": "财政部、教育部《高等学校学生应征入伍服义务兵役国家资助办法》；全国征兵网。<https://www.gfbzb.gov.cn/>", "备注": "地区差异。地方还另有家庭优待金、一次性奖励金（部分省份对本科毕业生一次性奖励数千至上万元）、退役安置等政策，以入伍地当年公告为准。报名只走全国征兵网，不经过任何第三方中介。"}, "extra": []}, {"n": 14, "title": "勤工助学有两条硬上限：每周不超过 8 小时、每月不超过 40 小时", "tag": {"money": "0", "time": "中", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱，占的是课余时间。", "说人话": "校内勤工助学（图书馆、行政助理、科研助理、宿舍助理）是\"时间换钱\"里最安全的一档：地点就在校内、优先给家庭经济困难学生、有书面协议、工时受保护。但学校对它有两条硬上限，不能当全职干；酬金也有底线，不能低于当地最低工资或居民最低生活保障标准。", "收益": "《高等学校学生勤工助学管理办法（2018 年修订）》规定：安排勤工助学岗位应优先考虑家庭经济困难学生；学生参加勤工助学时间原则上每周不超过 8 小时、每月不超过 40 小时。校内固定岗位按月计酬，以每月 40 个工时的酬金原则上不低于当地最低工资标准或居民最低生活保障标准为基准；校内临时岗位按小时计酬，原则上不低于每小时 12 元；校外勤工助学酬金不应低于当地最低工资标准。", "证据等级": "A", "来源": "教育部、财政部 (2018). 高等学校学生勤工助学管理办法（2018 年修订）。<https://www.moe.gov.cn/jyb_xwfb/s5147/201809/t20180905_347280.html>", "备注": "校内岗位要与学校勤工助学组织签协议；校外岗位要由学校、用人单位、学生三方签协议。任何\"绕过学校\"的校外用工，出了纠纷保障差很多。"}, "extra": []}, {"n": 15, "title": "学费减免与临时困难补助：家里突发变故，这笔钱最快能到", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱，找辅导员说明情况。", "说人话": "家里突然遭遇重病、失业、自然灾害或者意外事故，收入一下子掉下来，可以申请学费减免、临时困难补助、生活物资帮扶等紧急救助。这笔钱通常不多，但审批快、到账快，而且不影响你已经拿到的助学贷款和助学金，是应急
