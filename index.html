注": "受益人是自己。\"再玩一把就能回本\"是庄家最希望你相信的一句话。"}, "extra": []}, {"n": 11, "title": "炒币、\"老师带单\"、境外理财群", "tag": {"money": "高", "time": "多", "will": "是", "gain": "小", "scope": "金钱"}, "fields": {"成本": "本金可能全部损失，外加被\"带单\"反复收割。", "说人话": "\"老师带你做单\"\"内幕消息\"\"稳赚不赔\"是典型的投资骗局话术，套路是先让你小赚、再让你加仓、最后平台跑路或爆仓。虚拟货币相关业务活动在我国属于非法金融活动，不受法律保护；一旦平台在境外，维权几乎没有渠道。学生群体正是被重点盯上的目标。", "收益": "中国人民银行等部门明确，虚拟货币不具有与法定货币等同的法律地位，虚拟货币相关业务活动属于非法金融活动，参与交易炒作不受法律保护。", "证据等级": "B", "来源": "中国人民银行、中央网信办等十部门 (2021). 关于进一步防范和处置虚拟货币交易炒作风险的通知。", "备注": "受益人是自己。凡是\"先教你赚钱、再让你交学费或加仓\"的群，退群就是止损。"}, "extra": []}, {"n": 12, "title": "追高消费、跟人攀比", "tag": {"money": "高", "time": "少", "will": "否", "gain": "小", "scope": "金钱"}, "fields": {"成本": "账面上多花的钱，以及看不见的长期预算错位。", "说人话": "大学里消费攀比最坑的地方不是\"这一笔贵\"，而是它会重置你的\"正常生活标准\"：一旦换过更贵的手机、更频繁的外卖、更多的出行，之后很难降回去。而且你攀比的对象，往往只是家里条件不同的同学，并不是同一起跑线。把钱花在\"能被看见\"的地方，回报最低。", "收益": "消费习惯具有\"由俭入奢易、由奢入俭难\"的不可逆倾向，大学阶段的支出结构会显著影响毕业时的经济起点（属通行观察，无单一权威量化来源）。", "证据等级": "C", "来源": "属通行做法/生活常识判断，无可核查的单一权威文献；各高校资助与财商教育材料中普遍有类似提醒。", "备注": "受益人是自己。替代方案：给自己设一条规则——\"超过一定金额的非必需消费，先放三天再决定\"。"}, "extra": []}, {"n": 13, "title": "一口气报五六个社团、揽一堆学生职务", "tag": {"money": "低", "time": "多", "will": "是", "gain": "小", "scope": "时间精力"}, "fields": {"成本": "时间被切成碎片，还有看不见的\"随叫随到\"。", "说人话": "社团和学生工作不是不能做，问题在\"数量\"。报五六个的典型结局是每个都只混个脸熟、一个都没做出事，同时把晚上的时间切成碎片，绩点和实习都受影响。而综测里学生工作的加分通常有上限。留一到两个能真正负责一件事的，比撒网式报名有用得多。", "收益": "多数高校综合素质测评办法对学生工作、社团活动的加分设有上限；时间投入与加分、与能力增长均不成正比。", "证据等级": "C", "来源": "各高校学生综合素质测评办法（各校差异较大，以本校文件为准）。", "备注": "受益人是自己。硬规则：大一社团不超过 2 个，且至少 1 个与专业或技能相关。"}, "extra": []}, {"n": 14, "title": "只看网课、不复盘、不动手", "tag": {"money": "低", "time": "多", "will": "是", "gain": "小", "scope": "成绩"}, "fields": {"成本": "看得很多，记住的很少。", "说人话": "看视频有一种\"我学过了\"的错觉，因为画面和讲解让过程很顺畅，但顺畅是被讲出来的，不是你会的。学习科学的结论很清楚：看讲解、划重点、重复阅读都属于\"低效策略\"；真正有效的是合上材料自己回忆（自测）、把学习分散到多天（分散练习）以及动手做题。网课不是问题，\"看完就当学会\"才是问题。", "收益": "在对十种常见学习技巧的系统评估中，自测（practice testing）与分散练习被评为\"高效\"，而划重点、重读、观看讲解被评为\"低效\"。", "证据等级": "B", "来源": "Dunlosky J, Rawson KA, Marsh EJ, Nathan MJ, Willingham DT (2013). Improving Students' Learning With Effective Learning Techniques. Psychological Science in the Public Interest 14(1): 4-58.", "备注": "受益人是自己。每看完一节课，合上视频，凭记忆写三句话总结，再对照看有没有漏。"}, "extra": []}, {"n": 15, "title": "只收藏、只囤课，不动手", "tag": {"money": "低", "time": "多", "will": "否", "gain": "小", "scope": "时间精力"}, "fields": {"成本": "收藏不花钱，但它给你一种\"已经处理过\"的假安心。", "说人话": "\"先收藏，以后再看\"是最容易上瘾的假动作，因为收藏这个动作本身就会释放完成感。但收藏夹越厚，你越不会打开它。真正推进事情的，不是\"存下来\"，而是\"接下来 30 分钟做什么\"。收藏和行动之间隔着一道坎，跨过去才算数。", "收益": "\"想做\"到\"做到\"之间存在稳定的意图—行为差距；把目标写成\"何时、何地、做什么\"的具体计划（执行意图），能显著提高完成率（属通行心理学结论）。", "证据等级": "C", "来源": "属通行做法；Gollwitzer PM (1999). Implementation Intentions: Strong Effects of Simple Plans. American Psychologist 54(7): 493-503（执行意图的原始文献）。", "备注": "受益人是自己。改一个习惯：把\"收藏\"换成\"现在先做 10 分钟\"，做不完再收藏。"}, "extra": []}, {"n": 16, "title": "\"考证上瘾\"", "tag": {"money": "高", "time": "多", "will": "是", "gain": "小", "scope": "金钱"}, "fields": {"成本": "每个证少则几百、多则几千，加上大量备考时间。", "说人话": "证书的价值主要来自两个功能——\"准入\"（没证不能执业或上岗）和\"筛选\"（招聘明确要求）。超出这两个功能的证书，价值大多是培训机构制造的溢价。真正稀缺的是\"能做出东西\"：一份作品、一段能讲清楚的实习、一个别人能验证的项目。考证上瘾的深层原因，往往是做题比做项目更容易获得即时成就感。", "收益": "招聘中的能力评估通常通过笔试、机试、作品集或面试完成；只有准入类职业资格，以及明确列出证书要求的岗位，证书才是硬门槛。", "证据等级": "C", "来源": "属通行做法；具体证书的准入与认可范围以人力资源社会保障部《国家职业资格目录》为准。", "备注": "受益人是自己。替代方案：把一个考证的时间，换成做一个小项目并写成可展示的文档。"}, "extra": []}, {"n": 17, "title": "把读研当\"逃避就业\"", "tag": {"money": "中", "time": "多", "will": "是", "gain": "小", "scope": "选择权"}, "fields": {"成本": "三年时间，加上一个可能更强的迷茫。", "说人话": "\"不想找工作，那就读个研吧\"——如果读研只是因为恐惧就业，三年后你会带着同样的恐惧、更高的年龄和更高的期望值，再面对同一道题。读研本身是好选择，但它的理由应该是\"我想在这个方向做更深的事\"\"这个行业的研究生是我入行的必要条件\"，而不是\"我先躲三年\"。", "收益": "升学决策的成本收益取决于专业、行业与个人目标；研究生毕业后同样要面对就业，且部分行业对学历的溢价有限（属通行判断，无单一权威量化来源）。", "证据等级": "B", "来源": "各高校年度毕业生就业质量报告（教育部要求高校编制发布）；目标行业招聘要求。", "备注": "受益人是自己。做决定前先做一件事：看本专业近三年的就业质量报告，看清\"读研\"和\"直接就业\"两条路的真实去向。"}, "extra": []}, {"n": 18, "title": "在\"绩点不重要\"和\"绩点唯一重要\"之间走极端", "tag": {"money": "0", "time": "多", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不走极端的成本最低。", "说人话": "说\"绩点不重要\"的人，多半已经拿到了不错的绩点；说\"绩点是唯一\"的人，往往把大学读成了高中。事实是：绩点决定你能不能进保研、转专业、交换、部分实习的候选名单，是\"门槛型\"指标——过了线以后，它就不再是最重要的东西；没过线，别的能力再强也进不了门。正确姿态是先把绩点做到安全线以上，再把精力投到作品和实习上。", "收益": "推免资格通常按前若干学期成绩排名确定，并对无不及格课程、外语水平设有硬性要求；多数岗位的简历筛选也会参考成绩（绩点作为门槛型指标的通行做法）。", "证据等级": "B", "来源": "各高校推荐优秀应届本科毕业生免试攻读研究生工作办法；教育部 (2017). 普通高等学校学生管理规定（考核与成绩记载）。", "备注": "受益人是自己。判断标准：查一下本校保研、交换、评奖的绩点线，那才是你的\"安全线\"。"}, "extra": []}, {"n": 19, "title": "误读\"关系比努力重要\"", "tag": {"money": "0", "time": "多", "will": "否", "gain": "小", "scope": "选择权"}, "fields": {"成本": "把时间花在\"混脸熟\"上，而不是练本事。", "说人话": "\"人脉\"经常被理解成\"我认识谁\"。但真实的人脉是双向的：别人愿意帮你，前提是你身上有他需要的东西——信息、能力、靠谱。所以更准确的版本是\"关系是努力的放大器，不是努力的替代品\"。你手上没有筹码时，认识再多厉害的人，也只是通讯录里的一个名字。", "收益": "社会网络研究有两条互相咬合的结论。一是互惠性：社会交换理论把人际关系的维持解释为双方都在交换各自的资源（信息、能力、情感支持），单方面索取的关系难以持续。二是弱关系的价值：\"大多数人在找工作时，用得最多的信息来自只见过几面的人，而不是最亲近的家人和朋友\"——这是 Granovetter 对波士顿郊区换工作者的调查结论（弱关系在信息传递上处于\"桥\"的位置，因为强关系圈子里的信息高度重复）。两条合起来说明：关系确实有用，但你得先有能交换的东西。", "证据等级": "B", "来源": "Granovetter, M. S. (1973). The Strength of Weak Ties. *American Journal of Sociology*, 78(6): 1360–1380；Blau, P. M. (1964). *Exchange and Power in Social Life*（社会交换理论的原始文献）。", "备注": "受益人是自己。把\"混人脉\"换成\"做好一件能被人看见的事\"，人脉会自己找过来。"}, "extra": []}, {"n": 20, "title": "\"大一先放松，大二再努力\"", "tag": {"money": "0", "time": "多", "will": "否", "gain": "小", "scope": "成绩"}, "fields": {"成本": "用四年里权重最高的一年，换\"一年放松\"。", "说人话": "绩点通常是学分加权平均，而大一的课学分密度最大、给分相对宽松——这两点叠起来，意味着大一绩点对总绩点的影响最重，而且低绩点往后很难拉回来（分母已经变大）。再加上保研看的是前几个学期排名，\"大二再努力\"往往等于\"已经出局\"。放松可以，但要放松在周末和假期，不是放松在第一个学期。", "收益": "绩点为学分加权平均，大一学分占比高；多数高校推免按前若干学期成绩排名确定，起点在大一即已形成。", "证据等级": "B", "来源": "各高校推荐优秀应届本科毕业生免试攻读研究生工作办法；各高校学籍与成绩管理办法（学分加权与绩点算法，以本校文件为准）。", "备注": "受益人是自己。\"放松额度\"应该分配在周末、假期和考完试之后，而不是整个大一。"}, "extra": []}, {"n": 21, "title": "把睡眠当成\"可压缩的成本\"", "tag": {"money": "0", "time": "多", "will": "否", "gain": "小", "scope": "时间精力"}, "fields": {"成本": "每天多出来的两小时，从记忆、情绪和免疫力里扣。", "说人话": "睡眠是少数几件\"省下来一定会还回去\"的事。长期睡不够会影响记忆巩固、情绪稳定和免疫状态，也会让第二天的学习效率大打折扣——你以为多学了两小时，其实是从后面几天借来的。把熬夜当勤奋，很多时候只是效率低下的遮羞布。", "收益": "睡眠参与记忆巩固这一点有明确的机制研究支撑：Walker 与 Stickgold 的综述指出，睡眠期间的慢波活动与海马—新皮质的信息重放过程，是把短期记忆转成长期记忆的关键环节。在全因死亡率方向，Cappuccio 等对 16 项前瞻性研究的元分析发现，短睡（不足 7 小时）与长睡（超过 8—9 小时）人群的死亡风险都高于睡 7—8 小时者。Rasch 与 Born 的综述进一步梳理了睡眠阶段与记忆类型（陈述性／程序性）之间的对应关系。", "证据等级": "B", "来源": "Walker, M. P. & Stickgold, R. (2006). Sleep, Memory, and Plasticity. *Annual Review of Psychology*, 57: 139–166；Cappuccio, F. P. et al. (2010). Sleep duration and all-cause mortality: a systematic review and meta-analysis of prospective studies. *Sleep*, 33(5): 585–592；Rasch, B. & Born, J. (2013). About sleep's role in memory. *Physiological Reviews*, 93(2): 681–766。", "备注": "受益人是自己。如果长期睡不着或白天极度困倦，别硬扛，去校医院或睡眠门诊看看——这可能是病，不是\"你不努力\"。"}, "extra": []}, {"n": 22, "title": "无效社交：把\"合群\"当任务", "tag": {"money": "低", "time": "多", "will": "否", "gain": "小", "scope": "时间精力"}, "fields": {"成本": "饭局、酒局、随大流的聚会，时间是隐性成本。", "说人话": "\"不合群\"在这件事上的代价被严重高估了。很多社交之所以感觉消耗，是因为它既没有信息交换，也没有情感支持，只是\"大家都去了所以我也去\"。真正值得维系的社交，是有共同在做的事（一起做项目、一起运动、一起准备比赛），而不是纯粹的陪坐。", "收益": "关于\"社交质量比数量重要\"，可以参考两条研究线索。一是 Baumeister 与 Leary 的综述：人归属感的核心是\"少量稳定、有互惠的亲密关系\"，而不是认识的人数；当关系缺乏支持性时，关系数量本身并不提升幸福感。二是 Putnam 在《独自打保龄》中对美国社会资本的观察：真正产生信任与合作的社交形式是\"有共同活动的、重复见面的群体\"（保龄球队、读书会），而不是一次性的聚会。", "证据等级": "C", "来源": "Baumeister, R. F. & Leary, M. R. (1995). The need to belong. *Psychological Bulletin*, 117(3): 497–529；Putnam, R. D. (2000). *Bowling Alone: The Collapse and Revival of American Community*。以上为解释性文献，社交投入的\"值不值\"仍需自己判断，故标 C。", "备注": "受益人是自己。给自己一个尺度：这场聚会结束后，我是更有能量还是更空？"}, "extra": []}, {"n": 23, "title": "假性勤奋：在图书馆刷一天手机", "tag": {"money": "0", "time": "多", "will": "否", "gain": "小", "scope": "成绩"}, "fields": {"成本": "占满了时间，消耗了负罪感额度，成绩却没动。", "说人话": "\"人在图书馆\"是一种很容易自我说服的勤奋，因为场景到位了。但学习时长和学习产出并不成正比，关键在\"有没有反馈\"。有效的做法是把时间切成块，每块给一个具体产出（做完 10 道题、写完 300 字、背完一个 list），做完打勾。没有产出的时段，坐着也是在耗时间。", "收益": "Dunlosky 等对 10 种学习方法的评估里，被列为\"高效用\"的两种（练习测验、分散练习）都不是靠\"坐着的时间长\"，而是靠\"是否发生了主动提取\"和\"是否拉开间隔\"。Carroll 关于学校学习时间与成绩的研究也指出，学习时长只有在\"有效投入时间\"这一层才转化为成绩——同一段时间里做没做题、有没有反馈，比坐了多久重要得多。", "证据等级": "B", "来源": "Dunlosky, J. et al. (2013). Improving Students' Learning With Effective Learning Techniques. *Psychological Science in the Public Interest*, 14(1): 4–58；Carroll, J. B. (1963). A model of school learning. *Teachers College Record*, 64(8): 723–733。", "备注": "受益人是自己。规则：进图书馆前写下\"今天这三件产出\"，出馆前打勾；一件都没勾掉，不算学了一天。"}, "extra": []}, {"n": 24, "title": "只用短视频\"学习\"，越看越窄", "tag": {"money": "0", "time": "多", "will": "否", "gain": "小", "scope": "时间精力"}, "fields": {"成本": "看的时候很充实，回头看什么都没留下。", "说人话": "短视频擅长\"给你一个爽点\"，不擅长\"带你建立体系\"。而且推荐算法会把你的注意力越推越窄：你越看某类内容，它越只给你某类内容，最后你以为自己在学习，其实是在一个回音壁里反复接收同一种观点。系统性的知识需要教材、课程和长文，需要你能\"自己复述出来\"，而不是眼熟。", "收益": "推荐系统按\"互动行为\"排序内容这一机制本身，意味着你越点某类内容，它越会给你同类内容。围绕这一机制的公开讨论中，\"过滤气泡\"（filter bubble，Pariser 提出）与\"回音室效应\"是两个常被引用的说法；也有研究指出这两个词在实证上被使用得过于宽泛、效果大小依赖平台与内容类型。比较稳妥的表述是：算法会放大你已有的偏好，因此它不适合承担\"建立知识体系\"这件事——体系的建立需要你知道自己缺什么，而算法只负责让你更想看下去。", "证据等级": "C", "来源": "Pariser, E. (2011). *The Filter Bubble*；关于算法推荐与信息窄化的实证争议，见 Bruns, A. (2019). *Are Filter Bubbles Real?*。公开讨论多于统一结论，故标 C。", "备注": "受益人是自己。给\"学习\"配一个出口：看完一个短视频教学，去翻一本对应的教材，把同一个小节真正读一遍。"}, "extra": []}]}, {"file": "20-校园紧急情况与安全.md", "title": "20. 校园紧急情况与安全：出事的第一分钟做什么", "entries": [{"n": 1, "title": "有人倒地没反应、没正常呼吸：先呼救，再按压，尽快取 AED", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，学一次按压几十分钟。", "说人话": "顺序是：① 轻拍双肩、大声呼叫，确认没有反应；② 观察呼吸，若没有呼吸或只有濒死喘息，立即让人拨打 120 并去取 AED（自动体外除颤器）；③ 以每分钟 100—120 次的频率用力按压胸口中央，深度 5—6 厘米，按压与人工呼吸按 30:2 进行（不愿或不会做人工呼吸时，可只做持续胸外按压）；④ 不要中途停手，直到 AED 到、专业救护到或人恢复。AED 开机会用语音一步步教你，要不要电击由它自己判断。", "收益": "对院外心脏骤停，尽早开始胸外按压并尽早使用 AED 除颤，是提高生存率的关键；国际复苏联络委员会（ILCOR）与美国心脏协会（AHA）的通行口径为：按压频率 100—120 次/分、深度 5—6 厘米、按压通气比 30:2、每次按压后让胸廓充分回弹。", "证据等级": "B", "来源": "中国红十字会《救护员》培训教材与《红十字应急救护培训标准化手册》；ILCOR/AHA 心肺复苏与心血管急救指南通行口径。<https://www.redcross.org.cn/>", "备注": "受益人是自己身边的人。AED 在公共场所的配置点通常在校医院、体育馆、图书馆、地铁站。大一是学急救成本最低的时机。"}, "extra": []}, {"n": 2, "title": "有人噎住、不能说话：立即做气道异物梗阻急救", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，学一次几分钟。", "说人话": "识别最重要——如果一个人突然说不出话、双手掐脖子、脸憋红或发紫，这是完全性气道梗阻。对清醒的成人：让他弯腰，你用掌根在他两肩胛之间用力拍背 5 次；无效则从背后环抱，双手在他肚脐上方快速向内向上冲击（腹部冲击，即\"海姆立克\"），反复交替拍背与冲击直到异物排出。如果人已经昏迷，立即放平开始心肺复苏并打 120。", "收益": "拍背与腹部冲击是成人气道异物梗阻的通行现场急救法；对孕妇和肥胖者改用胸部冲击。独自呛噎且周围无人时，可借助椅背等硬物顶压上腹部自救。", "证据等级": "B", "来源": "中国红十字会《救护员》培训教材；ILCOR/AHA 关于气道异物梗阻急救的通行口径。", "备注": "受益人是自己。食堂、聚餐时边吃边说最容易发生。1 岁以下婴儿的处置不同（拍背＋胸部冲击），不要对婴儿做腹部冲击。"}, "extra": []}, {"n": 3, "title": "大量出血：直接压住，别松手", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "四肢大出血时，用干净的布、纱布甚至手直接压住出血点，持续加压、不要反复松开查看——一松手，刚形成的血凝块就被破坏，等于重新开始出血。压住之后可以加压包扎固定。如果直接压迫仍止不住四肢的致命出血，可在伤口近心端使用止血带，并记下绑扎时间（写在手上或拍照），交给医护人员。同时立刻叫救护车。", "收益": "直接压迫止血是现场止血的基本方法；止血带用于直接压迫无效的四肢致命性出血，必须记录时间并交班给专业人员，以免造成肢体缺血坏死。", "证据等级": "B", "来源": "中国红十字会《救护员》培训教材（止血、包扎、固定相关章节）；创伤急救通行规范。", "备注": "受益人是自己。实验室、运动场、宿舍是校园里最容易发生割伤和撞伤的地方。纱布被血浸透时不要揭掉，直接在上面再加一层继续压。"}, "extra": []}, {"n": 4, "title": "烧烫伤：冲凉水 20 分钟，别抹牙膏酱油", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "烧烫伤的第一处理是\"冲\"：用流动的凉水（不是冰水）持续冲洗 20 分钟以上降温，同时脱去或剪开覆盖伤处的衣物（粘住的不要硬撕），然后用干净敷料覆盖、就医。不要抹牙膏、酱油、香灰、紫药水——它们既不能降温，还会污染伤口、影响医生判断烧伤深度。起水泡的、面积较大的、位于脸手关节处的，都要去医院。", "收益": "烧烫伤现场处理以尽早、持续的局部降温（凉水冲洗）为基本措施，可减轻组织损伤与疼痛；外涂牙膏、酱油等民间做法会增加感染风险并妨碍评估。", "证据等级": "B", "来源": "中国红十字会《救护员》培训教材；烧烫伤现场处理通行规范（降温冲洗 20 分钟以上）。", "备注": "受益人是自己。实验室的酒精灯、热油、开水是校园常见致伤源；化学品灼伤处理不同，见本节第 13 条。"}, "extra": []}, {"n": 5, "title": "过敏性休克：肾上腺素是第一选择，同时叫救护车", "tag": {"money": "低", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "有过敏史的人随身备药的成本。", "说人话": "接触或吃下过敏原后，出现嘴唇舌头肿、喉咙发紧、呼吸困难、声音嘶哑、全身皮疹、头晕要倒地，这是过敏性休克，几分钟内就可能致命。有肾上腺素自动注射笔的，立即在大腿外侧肌肉注射，同时拨打 120。抗组胺药（如氯雷他定）和激素都不能替代肾上腺素，只能作为后续用药。有严重过敏史的人，应随身带药，并让室友、同学知道药放在哪。", "收益": "肾上腺素肌注是过敏性休克的首选现场用药，抗组胺药不能替代；延迟使用肾上腺素与不良结局相关（世界过敏组织 WAO / 欧洲过敏与临床免疫学会 EAACI 过敏反应指南通行口径）。", "证据等级": "B", "来源": "WAO 与 EAACI 关于过敏反应（anaphylaxis）诊断与管理的指南通行口径；中国红十字会《救护员》培训教材。", "备注": "受益人是自己。食堂和聚餐是校园里最可能发生的场景；和有严重过敏史的人同桌吃饭，先问一句\"你过敏什么、药在哪\"。"}, "extra": []}, {"n": 6, "title": "癫痫发作：护住头、别塞东西、别按住", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "看到同学突然倒地抽搐，正确做法是：移开周围的硬物尖物，在头下垫软的东西，让他侧卧、松开领口，并记录发作开始时间；不要往他嘴里塞任何东西（塞手指、勺子既伤人也伤己），不要用力按住他的四肢，也不要掐人中。绝大多数发作在几分钟内自行停止。如果发作超过 5 分钟、连续发作、发作后长时间不醒，或是第一次发作，立即打 120。", "收益": "癫痫发作时强行约束或往口中塞物会造成损伤（牙齿折断、误吸、施救者被咬伤）；发作后置于侧卧位有助于防止分泌物误吸（属急救通行规范）。", "证据等级": "C", "来源": "属急救通行规范；中国红十字会《救护员》培训教材（抽搐发作处置相关章节）。", "备注": "受益人是自己。发作结束后人会有一段时间迷糊和疲惫，陪着、安慰、帮忙收拾，比围观更重要。"}, "extra": []}, {"n": 7, "title": "溺水：不下水去救，用东西拉", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，学一次施救方法。", "说人话": "看到有人溺水，自己下水是最容易变成第二个溺水者的做法，尤其是没受过救生训练的人。正确做法是：大声呼救、拨打 120、抛投漂浮物（救生圈、空桶、密封塑料袋、绳子、长杆），让对方抓住后从岸上或船上拉。救上岸后如果没有呼吸，立即开始心肺复苏（先给 2 次人工呼吸再按压，即使只做胸外按压也远好于不做），不要先控水——倒挂、压肚子挤水既耽误时间，又可能造成呕吐误吸。", "收益": "世界卫生组织关于溺水预防的文件强调旁观者应以\"抛投救援\"而非入水救援为主；现代复苏指南不推荐常规控水操作，应优先开放气道与人工呼吸/胸外按压。", "证据等级": "A", "来源": "世界卫生组织 (2014). Global Report on Drowning: Preventing a Leading Killer；ILCOR/AHA 关于溺水的复苏通行口径。", "备注": "受益人是自己。野外水域（水库、河、湖、工地水坑）风险远高于泳池；酒后、独自、夜间下水是三种最危险的情形。"}, "extra": []}, {"n": 8, "title": "中暑与热射病：先降温，热射病是急症", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "高温下出现头晕、头痛、恶心、大汗、乏力，是热衰竭的先兆，要立刻到阴凉处、解开衣物、补充含盐饮料、用湿毛巾擦身降温。如果出现高热、意识模糊、抽搐、皮肤发红发烫且可能不出汗，这是热射病——最危重的中暑类型，死亡率高，必须立即打 120，并在等待时持续用一切办法降温（转移到阴凉处、脱去衣物、冷水喷洒、冰敷颈部腋下大腿根）。", "收益": "热射病是需立即抢救的急症，快速降温是降低死亡率的关键；军训、体育课、长跑是高发场景。", "证据等级": "B", "来源": "国家卫生健康委高温中暑健康提示与《职业性中暑的诊断》中的分级处置原则；中国红十字会《救护员》培训教材（中暑相关章节）。", "备注": "地区差异。军训期间学校通常有防暑预案，出现不适要主动报告，不要为了\"扛住\"硬撑——热射病可以致命。"}, "extra": []}, {"n": 9, "title": "急性酒精中毒：别让人\"睡一觉就好\"", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "同学喝到叫不醒、呼吸变慢、呕吐、面色苍白、皮肤湿冷、体温下降，这不是\"睡一觉就好\"，是急性酒精中毒，要送医院。送医前若他呕吐，让他侧卧（恢复体位），防止呕吐物误吸窒息；不要让他平躺仰卧，也不要让他\"再喝点水醒酒\"。不要把人单独留在宿舍\"睡一会儿\"。另外，向未成年人售酒是违法的；共同饮酒、劝酒导致他人损害的，在司法实践中可能需要承担相应责任。", "收益": "急性酒精中毒可导致呼吸抑制、误吸、低体温与低血糖，昏迷与呼吸抑制是需立即就医的危险信号；侧卧位用于防止呕吐物误吸。《未成年人保护法》禁止向未成年人售酒；《民法典》侵权责任编及司法实践中，共同饮酒者对醉酒者负有一定安全注意义务，强行劝酒或未尽护送义务的可能承担侵权责任。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国未成年人保护法》（禁止向未成年人销售烟酒）；《中华人民共和国民法典》侵权责任编相关条款与共同饮酒责任司法实践；中华医学会急诊医学分会《急性酒精中毒诊治共识》。", "备注": "受益人是自己和同伴。真实发生过的事故里，不少是因为\"怕扫兴\"\"怕被说小题大做\"而没及时送医。"}, "extra": []}, {"n": 10, "title": "食物中毒：留样本、补水、及时就医", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "多人同时出现呕吐、腹痛、腹泻，尤其是吃过同一批食物后，要高度怀疑食物中毒。处置顺序：① 症状重的、出现意识改变或便血的立即送医；② 保留可疑食物和呕吐物样本（用干净容器装好），供检验和追责；③ 清醒者少量多次补充口服补液盐，防止脱水；④ 报告校医院和学校后勤或食品安全负责人。多人同时发病，一定要报告——这关系到能不能及时溯源。", "收益": "食物中毒处置以对症补液、保留可疑食物样本、及时报告为通行做法；学校对集中供餐负有食品安全管理责任。", "证据等级": "B", "来源": "《中华人民共和国食品安全法》及学校食品安全管理相关规定；食物中毒现场处置通行规范。", "备注": "受益人是自己。校园里集体用餐多，一旦怀疑食物中毒，别等\"自己缓过来\"，先报告。"}, "extra": []}, {"n": 11, "title": "一氧化碳中毒：开窗、离开、打 120", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "一氧化碳无色无味，中毒时人往往在睡梦中失去意识。识别线索：头痛、头晕、恶心、乏力、面色口唇呈\"樱桃红\"，且同处一室的多人同时出现类似症状。发现后：立刻打开门窗通风，把人转移到空气新鲜处，松解衣领、保持呼吸道通畅，拨打 120；如果心跳呼吸停止立即心肺复苏。不要在现场开灯、打电话、按门铃（可能引燃泄漏气体），也不要给昏迷者喂水。", "收益": "一氧化碳与血红蛋白结合导致组织缺氧，尽快转至新鲜空气处并送医（有条件时吸氧）是关键；现场严禁明火与易产生火花的操作。", "证据等级": "B", "来源": "一氧化碳中毒现场处置通行规范（卫生与应急管理部门科普口径一致）；中国红十字会《救护员》培训教材。", "备注": "受益人是自己。校外租房用燃气热水器、烧炭取暖，是典型的中毒场景；租住前检查通风与热水器类型。"}, "extra": []}, {"n": 12, "title": "触电：先断电，再靠近", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "有人触电，第一步是切断电源（拉闸、拔插头），而不是冲上去拉人——否则你也会触电。无法断电时，用干燥的木棍、塑料板等绝缘物把电线挑开。脱离电源后检查呼吸心跳，没有呼吸立即心肺复苏并打 120。宿舍里私拉电线、湿手插拔插头、充电器进水，都是常见诱因。", "收益": "触电急救的第一原则是使伤者尽快、安全地脱离电源；施救者徒手接触触电者会造成连带触电（属急救通行规范）。", "证据等级": "C", "来源": "属急救通行规范；中国红十字会《救护员》培训教材（电击伤处置相关章节）。", "备注": "受益人是自己。学校宿舍对违规电器的管理规定不是形式主义，多数火灾和触电事故都能追溯到\"多用了一个大功率电器\"。"}, "extra": []}, {"n": 13, "title": "化学品溅到眼睛：马上冲洗 15 分钟以上", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "化学品入眼，第一件事不是去找老师、不是先判断伤得多重，而是立即用大量清水持续冲洗——就近用洗眼器、水龙头或瓶装水，冲洗时把眼睑翻开，让水从内眼角向外流，至少 15 分钟，然后尽快就医。冲洗越早、越充分，角膜损伤越轻。化学灼伤的损伤是持续进行的，早冲一分钟就少一分损失。", "收益": "化学性眼损伤的现场处理以立即、充分冲洗为关键，冲洗时间不足是常见错误；冲洗后仍需眼科专科处理。", "证据等级": "C", "来源": "属急诊通行处理规范；各高校实验室安全规程中均有\"洗眼器使用与化学灼伤应急\"条款。", "备注": "受益人是自己。进实验室前先找到洗眼器和紧急淋浴的位置——和记消防通道一样，用不上最好，用上就是几分钟的事。"}, "extra": []}, {"n": 14, "title": "崴脚、拉伤：记住 RICE，48 小时内别揉别热敷", "tag": {"money": "低", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱或只花一点冰袋钱。", "说人话": "急性软组织损伤（崴脚、拉伤）的早期处理通行原则是 RICE：休息（Rest，别继续运动）、冰敷（Ice，每次 15—20 分钟，垫毛巾别直接贴皮肤，隔 1—2 小时可重复）、加压包扎（Compression）、抬高患肢（Elevation）。受伤后 48 小时内不要热敷、不要用力揉、不要\"活动开\"——这些都会加重出血肿胀。如果关节明显变形、无法承重、剧烈疼痛，要拍片排除骨折。", "收益": "RICE 是急性软组织损伤早期处理的通行原则；热敷与揉搓会加重急性期出血与肿胀。", "证据等级": "C", "来源": "运动损伤急救通行规范；中国红十字会《救护员》培训教材（扭伤与固定相关章节）。", "备注": "受益人是自己。体育课、篮球场、操场是最常见的崴脚场景；\"能走就没事\"不成立，有些骨折也能勉强走路。"}, "extra": []}, {"n": 15, "title": "尖锐物扎进身体：不要拔出来", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "被玻璃、钉子、钢筋、刀具等尖锐物扎入身体，不要拔出异物——它可能正堵着破裂的血管，拔出来会引发大出血。正确做法是：固定异物（用敷料、衣物在异物周围垫高并固定，避免它晃动），尽快就医、叫救护车。如果是腹部扎入且异物已拔出、肠管外露，不要塞回去，用干净的湿敷料覆盖并立即送医。", "收益": "刺入性异物在体内可能起堵塞作用，现场拔出会加重出血；应原位固定后由专业医疗处理（属创伤急救通行规范）。", "证据等级": "C", "来源": "创伤急救通行规范；中国红十字会《救护员》培训教材。", "备注": "受益人是自己。工地、实验室、宿舍意外是校园里较常见的刺伤场景。"}, "extra": []}, {"n": 16, "title": "运动场上的猝死：现场呼救要有分工", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "有人在操场倒地，最怕的是\"所有人围观、没人动手\"。正确做法是现场立刻分工：一个人打 120 并说清地点，一个人去取 AED，一个人立刻开始胸外按压，其他人清出空间、疏散围观。指挥分工的人往往不在场，所以事先记住两件事：最近一台 AED 在哪、救护车怎么报位置（说清校区、场馆名称、最近的校门）。", "收益": "院外心脏骤停的生存率高度依赖\"目击者立即按压＋尽快除颤\"；分工明确可显著缩短从倒地到开始按压的时间（属通行急救规范）。", "证据等级": "B", "来源": "中国红十字会《救护员》培训教材与《红十字应急救护培训标准化手册》；ILCOR/AHA 心肺复苏指南通行口径。", "备注": "地区差异。不少高校已在体育场馆配置 AED 并组织培训，入学时值得确认\"我们学校的 AED 在哪几个点\"。"}, "extra": []}, {"n": 17, "title": "正确拨打 120/110/119：三句话把关键信息说清", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "报警求助电话最忌慌乱中说不清位置。开口就说三件事：① 在哪（精确到校区、楼栋、楼层、场馆名称、明显标志物，或附近的校门）；② 发生了什么、几个人受伤（有人倒地无呼吸／大出血／着火……）；③ 你的联系方式，然后等对方挂电话——接线员会追问关键问题，中途挂断可能让救援找不到人。打完别关机，保持畅通；条件允许时去路口迎接救护车。", "收益": "《人民警察法》规定，人民警察遇到公民人身、财产安全受到侵犯或者处于其他危难情形，应当立即救助；对公民的报警案件应当及时查处。急救、消防与公安机关均要求报警人保持通话、提供可核实的位置与联系方式。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国人民警察法》（第二十一条）；《公安机关办理行政案件程序规定》关于受案登记的规定；急救调度通行规范。", "备注": "受益人是自己。养一个习惯：到任何一个陌生场所（教室、场馆、民宿），先看清门牌号或楼名。"}, "extra": []}, {"n": 18, "title": "宿舍火灾：先跑、关门、别回头拿东西", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "宿舍起火，顺序是：① 迅速撤离，走楼梯、不进电梯；② 如果门把手发烫或门外已有浓烟，别开门，用湿毛巾、衣物堵住门缝，到窗口呼救、打 119 报位置；③ 撤离时低姿、贴地，用湿毛巾捂住口鼻（有条件时），顺手把自己房间的门带上，延缓火势蔓延；④ 绝不返回火场拿电脑、手机和证件。会用灭火器的前提是火还很小、你有退路——火已经大起来，撤离优先。", "收益": "火灾逃生通行原则为低姿避烟、不用电梯、不返回火场、无法逃离时封堵门缝等待救援；初期小火可用\"提、拔、握、压\"使用干粉灭火器（对准火焰根部）。", "证据等级": "B", "来源": "全国人大常委会《中华人民共和国消防法》；教育部、公安部《高等学校消防安全管理规定》；灭火器使用与火场逃生通行规范。", "备注": "受益人是自己。入学时做一件事：数一遍从你宿舍门到最近安全出口的步数，记住最近两个灭火器的位置。"}, "extra": []}, {"n": 19, "title": "地震与极端天气：先避险，再撤离", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "地震发生时，如果人在楼上且来不及跑出去，就近躲到结实的桌子下、承重墙墙角，护住头和颈，远离窗户、玻璃和悬挂物；震感停止后再有序撤离，走楼梯、别坐电梯，到空旷处后远离建筑物和广告牌。暴雨、台风、雷电天气尽量待在室内，避开大树、广告牌、临时建筑和积水路段，别在雷雨天到空旷地\"看风景\"。", "收益": "地震避险通行原则为\"就近躲避、护住头颈、震后有序撤离、不乘电梯\"；极端天气期间应关注官方预警并减少外出（属通行做法）。", "证据等级": "C", "来源": "属通行做法；中国地震局、应急管理部与气象部门发布的防震减灾与气象预警科普口径。", "备注": "地区差异。多震省份的高校通常有演练，参加一次比自己在脑子里想象有用；关注学校官方的应急通知渠道。"}, "extra": []}, {"n": 20, "title": "夜间出行与网约车：把行程发给一个人", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "夜间独自出行，做三件小事：① 上车前把车牌号、车型、路线截图发给一个室友或家人；② 坐后排、保持手机有电，上车后使用网约车平台的\"行程分享\"给紧急联系人；③ 走人多有灯的路，不图近抄小巷、工地、荒地。感觉不对就提前下车到人多处，不用不好意思。这几件事加起来不到一分钟，但把你的行踪留在了别人那里。", "收益": "网约车平台普遍提供行程分享、紧急联系人与一键报警功能；夜间独行的风险主要来自\"失联\"而非\"距离\"（属通行做法）。", "证据等级": "C", "来源": "网约车平台行程分享与紧急联系人功能说明（通行做法）。", "备注": "受益人是自己。加一条：和不太熟的人单独见面，选白天的公共场所。"}, "extra": []}, {"n": 21, "title": "校外租房与独居：门锁、用电用气、消防通道三件事", "tag": {"money": "中", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "押金、房租，可能还有换锁芯和报警器的小钱。", "说人话": "校外租房前先看三件事：① 门锁——能否自己换锁芯、有无防盗门和猫眼，合租要问清室友情况和退租条款；② 用电用气——热水器类型（强排式相对安全）、有无漏电保护、有无违规改造，燃气报警器有条件就装；③ 消防——楼道是否堆物堵死、安全出口是否锁闭、有无灭火器。入住后陌生人敲门先确认身份再开，快递外卖放门口。高层住宅的疏散通道、电动车进楼充电，都是明令禁止的。", "收益": "《高层民用建筑消防安全管理规定》（应急管理部令第 5 号）明确禁止在高层民用建筑的公共门厅、疏散走道、楼梯间、安全出口停放电动自行车或充电；《中华人民共和国消防法》对占用、堵塞疏散通道等行为设定了处罚。", "证据等级": "A", "来源": "应急管理部 (2021). 高层民用建筑消防安全管理规定（应急管理部令第 5 号）；全国人大常委会《中华人民共和国消防法》（第二十八条等）。", "备注": "地区差异。各地对群租房、隔断房有专门规定，签约前确认房屋是否合规；押金和退租条款一定写进合同。"}, "extra": []}, {"n": 22, "title": "被跟踪、被骚扰：先脱身，再留证，及时报警", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "感觉自己被跟踪，不要直接回住处暴露住址，往人多、有监控、有店员的地方走，可以走进便利店、商场、派出所暂避，同时打电话给朋友（哪怕假装通话）说明位置。被反复骚扰（电话、短信、尾随、纠缠）时：保存证据（截图、录音、时间地点记录），告诉辅导员或宿管，并报警。多次发送骚扰信息、偷窥跟踪等行为，可能构成违反治安管理的违法行为。", "收益": "《中华人民共和国治安管理处罚法》规定，写恐吓信或以其他方法威胁他人人身安全，多次发送侮辱、恐吓或其他信息干扰他人正常生活，或偷窥、偷拍、窃听、散布他人隐私的，均可受治安处罚；情节严重构成犯罪的依法追究刑责。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国治安管理处罚法》（第四十二条）。", "备注": "受益人是自己。学校和警方都能介入，不要因为\"怕麻烦\"\"怕对方报复\"而选择忍——多数骚扰在被记录和报警后会得到有效制止。"}, "extra": []}, {"n": 23, "title": "遇到打架与治安事件：不劝架，先脱离，再报警", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "街头或校园里有人动手打架，最不需要做的是冲上去拉架——拉架的人被误伤、被当成同伙、甚至被追究责任的案例并不少见。正确做法是：迅速离开冲突区域到安全距离，立即拨打 110，说清地点、人数、是否有人受伤、是否有凶器；不要近距离拍摄挑衅，不要围观起哄。如果自己被打，优先脱离、呼救、保留证据（监控、证人、伤情），然后报警并就医、验伤。", "收益": "《治安管理处罚法》第四十三条规定，殴打他人或故意伤害他人身体的，处拘留并处罚款；《刑法》第二百三十四条规定故意伤害他人身体构成犯罪的追究刑事责任。《刑法》第二十条规定正当防卫：为使本人或他人的人身、财产等免受正在进行的不法侵害而采取的制止行为，不负刑事责任；防卫的边界是\"制止正在进行的侵害\"，不是事后报复。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国治安管理处罚法》（第四十三条）；全国人大常委会《中华人民共和国刑法》（第二十条、第二百三十四条）。", "备注": "受益人是自己。真要帮人，帮的方式是报警和叫救护车，不是动手。"}, "extra": []}, {"n": 24, "title": "被性骚扰或性侵后：保安全—就医—留证—报警—心理支持", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "请记住这个顺序，它比\"该不该忍\"重要得多：① 先到安全的地方，脱离侵害人，联系可信赖的人陪同；② 尽快就医，说明情况，进行身体检查与必要的医学处理（包括紧急避孕与性传播疾病预防的医学评估），医生的记录本身就是证据；③ 尽量保留证据，不要立刻洗澡、换洗衣物，保存衣物、聊天记录、监控线索；④ 报警，向公安机关报案；⑤ 寻求心理支持，可拨打全国统一心理援助热线 12356、共青团 12355，或联系学校心理咨询中心。责任在加害人，不在被害人。", "收益": "《刑法》第二百三十六条对强奸罪、第二百三十七条对强制猥亵、侮辱罪作出规定；《未成年人保护法》与《关于建立侵害未成年人案件强制报告制度的意见》要求学校等密切接触未成年人的单位及其工作人员，发现侵害未成年人的情形必须报告。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国刑法》（第二百三十六条、第二百三十七条）；全国人大常委会《中华人民共和国未成年人保护法》；最高人民检察院等九部门 (2020). 关于建立侵害未成年人案件强制报告制度的意见（试行）；国家卫生健康委 2024 年通知（国卫医政函〔2024〕259 号，全国统一心理援助热线 12356，2025 年 5 月 1 日起开通）。", "备注": "受益人是自己。保安全第一；报警不设期限，但证据会随时间流失。拨打 12356 或 12355 都能获得支持，不必独自扛。"}, "extra": []}, {"n": 25, "title": "证件和银行卡丢了：按\"先止付、后补办\"的顺序处理", "tag": {"money": "低", "time": "多", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "补办工本费与跑腿时间。", "说人话": "丢了东西，先分清\"能不能被冒用\"。顺序是：① 银行卡／手机／SIM 卡——先打银行客服冻结卡片、通过运营商挂失补卡，防止被用作转账或诈骗通道；② 身份证——尽快到公安机关挂失、补办；③ 学生证／校园卡——到学生处、卡务中心挂失补办；④ 护照——到出入境管理部门报失补办。别在朋友圈直接晒证件照片和完整号码。", "收益": "身份证被冒用办卡、办贷款是常见风险；对银行卡、电话卡及时挂失，可切断被用于帮助信息网络犯罪的通道（属通行做法，相关规定见反电信网络诈骗法）。", "证据等级": "C", "来源": "属通行做法；各高校学生证与校园卡挂失补办流程、公安机关身份证挂失申报说明。", "备注": "受益人是自己。留一手：把证件号、银行卡号、各客服电话存在加密的云笔记里，丢了就不用到处翻。"}, "extra": []}, {"n": 26, "title": "外出旅行与境外安全：存好 12308 和大使馆电话", "tag": {"money": "低", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，花十分钟做备份。", "说人话": "出境前做四件事：① 复印件与电子版分开存（护照、签证、机票）；② 记下中国外交部全球领事保护与服务应急热线 12308，以及中国驻当地使领馆电话；③ 手机开通国际漫游或确保落地能上网（出事时能联系上人才有救）；④ 把行程和紧急联系人发给家人。护照在境外丢失，先到当地警局报案取得证明，再联系中国使领馆补办旅行证件。国内旅行同样：独行、野外徒步、无资质\"探险\"都要慎重。", "收益": "12308 是中国外交部设立的全球领事保护与服务应急热线，为中国公民提供 24 小时领事保护咨询与应急求助；使领馆可在证件补办、突发协助等方面提供帮助。", "证据等级": "C", "来源": "中国外交部全球领事保护与服务应急热线（12308）与\"中国领事服务网\"官方说明（通行做法）。", "备注": "地区差异。赴境外交流、交换、实习的学生，出国前应到学校国际交流部门登记备案，遇到问题学校也能介入。"}, "extra": []}]}];

function tier(e){
  const t = e.tag || {};
  const costZero = t.money === '0' && t.time === '少' && t.will === '否';
  if (t.gain === '大' && costZero) return '极高';
  if ((t.gain === '大' && (t.money === '0' || t.money === '低') && (t.time === '少' || t.time === '中'))
      || (t.gain === '中' && costZero)) return '高';
  return '一般';
}
const GAIN_RANK = {'大':3,'中':2,'小':1};
const TIER_RANK = {'极高':3,'高':2,'一般':1};

const flat = [];
DATA.forEach((c, ci) => c.entries.forEach((e, ei) => {
  flat.push(Object.assign({}, e, {ci, ei, ch: c.title, file: c.file, tier: tier(e)}));
}));

const chSel = document.getElementById('ch');
DATA.forEach((c, i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = c.title;
  chSel.appendChild(o);
});

const esc = s => (s || '').replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function linkify(s){
  s = esc(s);
  return s.replace(/(https?:\/\/[^\s<>）)]+)/g, u => '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>');
}
function tagHtml(e){
  const t = e.tag || {};
  const parts = [];
  if (e.tier) parts.push('<span class="tag gx">性价比 ' + e.tier + '</span>');
  parts.push('<span class="tag g' + (e.fields['证据等级'] || 'C') + '">证据 ' + (e.fields['证据等级'] || '?') + '</span>');
  if (t.scope) parts.push('<span class="tag">换回 ' + t.scope + '</span>');
  if (t.gain) parts.push('<span class="tag">收益 ' + t.gain + '</span>');
  const cost = [];
  if (t.money) cost.push('钱:' + t.money);
  if (t.time) cost.push('时间:' + t.time);
  if (t.will) cost.push('毅力:' + t.will);
  if (cost.length) parts.push('<span class="tag">' + cost.join(' · ') + '</span>');
  const warn = /争议|地区差异|各校差异/.test(e.fields['备注'] || '');
  if (warn) parts.push('<span class="tag warn">看备注</span>');
  return '<div class="tags">' + parts.join('') + '</div>';
}
function card(e){
  const f = e.fields || {};
  const rows = ['成本','收益','来源','备注'].filter(k => f[k])
    .map(k => '<dt>' + k + '</dt><dd>' + linkify(f[k]) + '</dd>').join('');
  const plain = f['说人话'] ? '<div class="plain">' + linkify(f['说人话']) + '</div>' : '';
  const extra = (e.extra && e.extra.length) ? '<div class="plain" style="color:var(--ink2);font-size:13px">' + e.extra.map(linkify).join('<br>') + '</div>' : '';
  return '<div class="card"><div class="ch">' + esc(e.ch) + '</div>'
    + '<h3><span class="num">' + e.n + '.</span>' + esc(e.title) + '</h3>'
    + plain + tagHtml(e)
    + '<details><summary>展开：成本 / 收益 / 来源 / 备注</summary><dl class="cost">' + rows + '</dl></details>'
    + extra + '</div>';
}

function apply(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const chv = chSel.value;
  const gs = [...document.querySelectorAll('.g:checked')].map(x => x.value);
  const ss = [...document.querySelectorAll('.s:checked')].map(x => x.value);
  const free = document.getElementById('free').checked;
  const quick = document.getElementById('quick').checked;
  const easy = document.getElementById('easy').checked;
  const big = document.getElementById('big').checked;
  const sort = document.getElementById('sort').value;

  document.querySelectorAll('label.chk').forEach(l => {
    const i = l.querySelector('input');
    l.classList.toggle('on', i && i.checked);
  });

  let out = flat.filter(e => {
    const t = e.tag || {}; const f = e.fields || {};
    if (chv !== '' && String(e.ci) !== chv) return false;
    if (gs.length && !gs.includes(f['证据等级'])) return false;
    if (ss.length && !ss.includes(t.scope)) return false;
    if (free && t.money !== '0') return false;
    if (quick && t.time !== '少') return false;
    if (easy && t.will !== '否') return false;
    if (big && t.gain !== '大') return false;
    if (q){
      const hay = [e.title, e.ch, f['说人话'], f['收益'], f['备注'], f['来源'], t.scope, t.gain].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  if (sort === 'cost') out.sort((a,b) => (TIER_RANK[b.tier]-TIER_RANK[a.tier]) || (GAIN_RANK[b.tag?.gain||''] - GAIN_RANK[a.tag?.gain||'']) || a.ci - b.ci || a.n - b.n);
  else if (sort === 'book') out.sort((a,b) => a.ci - b.ci || a.n - b.n);
  else out.sort((a,b) => (GAIN_RANK[b.tag?.gain||''] - GAIN_RANK[a.tag?.gain||'']) || a.ci - b.ci || a.n - b.n);

  document.getElementById('count').textContent = '共 ' + out.length + ' 条' + (out.length !== flat.length ? '（全库 ' + flat.length + ' 条）' : '');
  document.getElementById('list').innerHTML = out.length ? out.map(card).join('') : '<div class="empty">没有匹配的条目，换个关键词或清掉筛选条件。</div>';
}

document.getElementById('q').addEventListener('input', apply);
chSel.addEventListener('change', apply);
document.getElementById('sort').addEventListener('change', apply);
document.querySelectorAll('.g,.s,#free,#quick,#easy,#big').forEach(x => x.addEventListener('change', apply));
apply();
</script>
</body>
</html>
