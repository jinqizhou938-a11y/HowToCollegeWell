常委会《中华人民共和国刑法》第二百七十四条、第三百六十四条。", "备注": "受益人是自己。已经发生泄露时，别删证据、别单独谈判、别支付任何款项——先报警，再考虑向平台投诉要求下架。"}, "extra": []}, {"n": 15, "title": "恋爱中的暴力：按顺序处置，先保安全再谈其他", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，花的是把顺序走完的力气。", "说人话": "动手、砸东西、摔门、以自伤自杀相威胁，都属于需要认真对待的暴力信号，不是\"他脾气就这样\"。处置有先后顺序，别打乱：① 先保安全——离开现场，到有人的、安全的地方，必要时先找同学、宿管、辅导员；② 就医留证——有伤就去看，保留病历、伤情照片、验伤记录，这些是后续处理的基础；③ 报警——拨 110，要求做记录，情节较轻的，公安机关可以对加害人批评教育或者出具告诫书；④ 告知可信任的人——家人、朋友、老师，让你不是一个人面对；⑤ 心理支持——校心理咨询中心或 12356。别把\"他事后道歉了\"当成可以跳过前四步的理由。", "收益": "处置身体暴力与威胁的通行顺序是\"保障安全→固定证据→报警→寻求社会支持→心理干预\"；《中华人民共和国反家庭暴力法》第十六条规定，家庭暴力情节较轻、依法不给予治安管理处罚的，由公安机关对加害人给予批评教育或者出具告诫书，告诫书可作为后续处理的证据；同居情形依该法第三十七条参照适用。", "证据等级": "B", "来源": "全国人大常委会《中华人民共和国反家庭暴力法》（第十六条、第三十七条）；家庭暴力处置\"保安全—留证—报警—支持—干预\"的通行口径。", "备注": "受益人是自己。\"以死相逼\"是危险信号，不是深情；遇到这种情况先保证自己安全，并及时告诉可信任的人。"}, "extra": []}, {"n": 16, "title": "网络交友：杀猪盘、裸聊敲诈、以恋爱为名的借贷", "tag": {"money": "高", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "一旦上钩，损失可能是全部积蓄甚至网贷。", "说人话": "交友软件上认识、\"很快确定关系\"、然后开始谈钱——这是三类骗局的共同开头。① 杀猪盘：对方嘘寒问暖一阵，带你\"投资\"\"理财\"\"博彩\"，先让你小赚，再诱导你加大投入，最后提现失败、人消失；② 裸聊敲诈：诱导你视频裸聊并录屏，再拿视频威胁你转账，注意——转账之后通常还会继续要，因为对方根本没打算删；③ 恋爱借贷：以\"家人住院\"\"一起创业\"等理由借钱，金额越滚越大；④ 以\"见面打车费\"\"保证金\"为由反复小额索要。三条铁律：不向没见过面的人转账、不点对方发的\"投资、理财\"链接、不裸露。已经发生就立即报警，别再相信\"再转一点就能拿回来\"。", "收益": "上述形态属于网络交友诈骗的常见类型，共同特征是\"先建立情感信任、再引导转账或裸露\"；公安机关反诈宣传明确，凡是以恋爱交友为名诱导投资、博彩、转账的，均应视为诈骗。转账前可通过国家反诈中心 App 或 96110 咨询核实；报案、紧急止付与追赃的具体流程见第 16 章。", "证据等级": "B", "来源": "公安部反电信网络诈骗公开宣传口径（以恋爱交友为名诱导投资、转账属诈骗）；具体处置与报案流程见第 16 章。", "备注": "受益人是自己。\"先谈感情再谈钱\"不是关心你，是脚本；真正在乎你的人，不会让你去投资、去转账、去裸聊。"}, "extra": []}, {"n": 17, "title": "避孕方式的可靠性排序：别把\"体外\"和\"安全期\"当方法", "tag": {"money": "低", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "正规渠道药具费用不高，部分在校医院可及。", "说人话": "按\"一年内实际使用下的失败率\"从低到高排，大致是：宫内节育器、皮下埋植等长效方法最低；短效口服避孕药（规律服用）其次，典型使用下年失败率约 7%—9%；安全套典型使用约 18%（但它是唯一同时能预防性传播感染的方法，见第 18 条）；而\"体外射精\"\"计算安全期\"这两类，典型使用失败率都在 20% 以上，可靠性明显更低，不应作为主要手段。\"完美使用\"和\"典型使用\"的差距说明一件事：方法再好，用不对也白搭。选方法时把\"我能不能坚持正确使用\"一起考虑进去，比只看理论有效率更重要。", "收益": "公共卫生通行数据以\"典型使用\"与\"完美使用\"下的一年失败率作为比较口径：短效口服避孕药典型使用年失败率约 7%—9%、安全套约 18%、体外射精约 22%、周期性禁欲（\"安全期\"）约 23%（不同机构的估算略有差异）。长效可逆方法（宫内节育器、皮下埋植）年失败率通常低于 1%，是可靠性最高的可逆方法（属公共卫生通行口径）。", "证据等级": "B", "来源": "避孕方法有效性的公共卫生通行数据（典型使用与完美使用年失败率的比较口径，具体数值各机构略有差异）；具体方法需由校医院或正规医疗机构依个体情况评估。", "备注": "受益人是自己。任何\"别人说很准\"的偏方（事后冲洗、剧烈运动等）都不属于有效避孕。"}, "extra": []}, {"n": 18, "title": "安全套的双重作用：避孕 + 预防性传播感染", "tag": {"money": "低", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "单价很低，正规渠道或校医院可获取。", "说人话": "在常见方法里，安全套是唯一同时具备两种作用的一种：避孕，以及降低性传播感染（含艾滋病）的传播风险。这个\"双重作用\"意味着它的价值不能只用避孕失败率来衡量——即使采用了其他高效避孕方法，在存在感染风险的关系里仍建议使用安全套。使用要点很实在：全程使用、只用水基润滑剂（油性润滑剂会损坏乳胶）、注意有效期与保存、一次性使用。这不是\"信不信得过对方\"的问题，而是把风险降到最低的常规操作；把它当成像系安全带一样的流程，而不是需要鼓起勇气才提的要求。", "收益": "安全套被公共卫生机构同时推荐用于避孕和预防性传播感染（包括 HIV）；乳胶安全套对相关病原体的屏障作用已被广泛证实。使用乳胶安全套时应避免油性润滑剂（会破坏乳胶），并全程、正确使用（属公共卫生通行口径）。", "证据等级": "B", "来源": "世界卫生组织及各国公共卫生机构关于安全套用于避孕与预防性传播感染的通行口径。", "备注": "受益人是自己。在异地、临时、情况不明的关系里，主动准备安全套不是\"想得多\"，是最基本的自我保护。"}, "extra": []}, {"n": 19, "title": "紧急避孕：有时间窗，但不能当常规手段", "tag": {"money": "低", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "药物费用不高，但需要尽快获取。", "说人话": "紧急避孕药是\"补救\"，不是\"方法\"。常用的口服紧急避孕药有两种：左炔诺孕酮，通常需在无保护性行为后 72 小时内服用，越早效果越好；醋酸乌利司他，时间窗可到 120 小时，但同样越早越好。它的效果明显低于常规避孕方法，而且用一次只对一次负责，不能反复当常规手段——频繁使用会让月经紊乱，也会让你一直处在高风险里。正确做法是：发生无保护性行为后尽快处理，同时评估性传播感染风险；如果反复需要紧急避孕，说明该换一种能坚持的正确方法了。此外，紧急避孕药不能终止已经发生的妊娠。", "收益": "口服紧急避孕药的有效性与服药时间密切相关，通常以无保护性行为后越早服用效果越好为原则，左炔诺孕酮一般不超过 72 小时、醋酸乌利司他可延长至 120 小时；紧急避孕药不适合作为常规避孕方法（属公共卫生通行口径）。具体用药与是否适用需咨询医师或药师。", "证据等级": "B", "来源": "紧急避孕药物使用的公共卫生通行口径（服药时间窗与有效性随时间的下降关系）；具体用药指导以正规医疗机构和药品说明书为准。", "备注": "受益人是自己。紧急避孕与常规避孕是两回事：前者救急，后者才是日常。"}, "extra": []}, {"n": 20, "title": "校医院和校心理咨询中心：有保密义务", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "看病挂号费用通常很低，心理咨询免费。", "说人话": "很多人不敢去校医院或心理咨询中心，怕\"被记录、被通知辅导员、被传出去\"。事实是：医疗机构和心理咨询有明确的保密要求，除涉及依法必须报告的情形（如法定传染病报告、自伤或伤人等高危情况）外，医务人员和咨询师不得泄露你的信息。这意味着避孕咨询、性传播感染相关的检测与咨询、情绪问题，都可以在校内先问、先查。校医院医生做的是分诊与转介，不是\"替你通报\"。把\"去问一问\"的门槛降下来，很多问题能在早期解决，而不是拖到不得不处理。", "收益": "医疗机构及其医务人员对患者隐私负有保密义务，依法需要报告的传染病等属于法定例外；高校心理健康教育与咨询中心对学生信息遵循保密原则，除自伤、伤人等依法需报告或干预的情形外不得泄露（《高等学校学生心理健康教育指导纲要》教思政〔2018〕41 号等文件对咨询服务的保密与危机干预作出要求）。心理求助渠道见第 15 章。", "证据等级": "C", "来源": "《高等学校学生心理健康教育指导纲要》（教思政〔2018〕41 号）；医疗机构与心理咨询保密义务的通行口径。心理求助渠道详见第 15 章。", "备注": "受益人是自己。保密有例外（法定报告与危机干预），咨询师通常第一次就会说明——这是规范，不是针对你。"}, "extra": []}, {"n": 21, "title": "艾滋病自愿咨询检测（VCT）：自愿、保密，12320 可查检测点", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "多地免费或低费，咨询保密。", "说人话": "担心感染，最不用做的一件事就是自己吓自己。正确做法是做检测。国家实行艾滋病自愿咨询和自愿检测制度（VCT）：你可以自愿去疾控中心、指定医疗机构或部分校医院咨询并检测，全程保密，检测前有咨询、检测后有结果告知与支持。检测存在\"窗口期\"——意味着刚发生高危行为当天就查，可能查不出来；具体何时检测、用什么方法，问医生最准。想查当地检测点，可以拨 12320 卫生健康热线或在疾控中心官网查询。检测不是\"承认自己有毛病\"，是把不确定变成确定、把恐慌变成一件可以处理的事。越早弄清楚，越能早做安排。", "收益": "《艾滋病防治条例》（国务院令第 457 号，2006 年 3 月 1 日施行）确立国家实行艾滋病自愿咨询和自愿检测制度，并要求对检测者相关信息予以保密；艾滋病病毒抗体检测存在窗口期，具体检测时机与方法应遵循医疗卫生机构指导；12320 是全国统一的卫生健康热线，可用于查询当地自愿咨询检测点。", "证据等级": "A", "来源": "国务院 (2006). 艾滋病防治条例（国务院令第 457 号）. <https://www.gov.cn/>；全国 12320 卫生健康热线服务说明。", "备注": "受益人是自己。检测结果无论阴性阳性，都有对应的支持：阴性给你安心与后续防护指导，阳性可及时进入治疗与管理，越早越好。"}, "extra": []}, {"n": 22, "title": "暴露后预防（PEP）：越早越好，通常以 72 小时为上限", "tag": {"money": "中", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "药费因地区和政策不同，需尽快到指定机构评估。", "说人话": "发生了可能暴露于艾滋病病毒的高危行为后，存在一种\"事后阻断\"的手段，叫暴露后预防（PEP）：在医生评估后尽早开始服用抗病毒药物，通常是 28 天一个疗程。关键是时间——越早开始效果越好，一般以 72 小时为上限，超过 72 小时通常不再推荐启动。所以真遇到情况，第一件事不是上网查、不是等，是尽快到指定的传染病医院或疾控中心就诊评估。\"过了时限\"也不等于\"没救了\"——后续仍应做检测并接受随访。把这条记成一句话：高危之后，72 小时内去找医生。", "收益": "艾滋病病毒暴露后预防（PEP）指在可能暴露后尽早启动抗病毒药物以降低感染风险，通常需尽早（一般在 72 小时内）开始并完成约 28 天疗程，是否需要用药与具体方案须由专业医生评估决定（属诊疗通行口径）；后续仍需按医嘱进行检测与随访。", "证据等级": "B", "来源": "艾滋病暴露后预防的诊疗通行口径；国家卫生健康部门发布的相关技术指南（具体用药与就诊机构以当地疾控与指定医院为准）。", "备注": "受益人是自己。先打电话问清就近的指定机构与就诊时间，别在犹豫中耗掉最关键的几十个小时。"}, "extra": []}, {"n": 23, "title": "在校生能不能结婚：可以，规定里已经没有禁止条款", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，只是了解一条事实。", "说人话": "很多学生以为\"在校生不许结婚\"，这是停留在二十年前的说法。2005 年 3 月教育部公布新版《普通高等学校学生管理规定》时，删除了原规定中\"在校学习期间擅自结婚而未办理退学手续的学生，作退学处理\"的条文；现行《普通高等学校学生管理规定》（教育部令第 41 号，2017 年 9 月 1 日施行）对在校生结婚未作禁止性规定。也就是说，能否结婚看的是法定婚龄，不是\"是不是学生\"。法定婚龄见《中华人民共和国民法典》第一千零四十七条：结婚年龄，男不得早于二十二周岁，女不得早于二十周岁。了解这条的意义不在\"鼓励结婚\"，而在于：涉及财产、债务、医疗签字这些事时，你清楚自己有没有法律上配偶的身份。", "收益": "《普通高等学校学生管理规定》（教育部令第 41 号，2017 年 9 月 1 日施行）未对在校学生结婚作出禁止性规定；教育部 2005 年 3 月公布新版《普通高等学校学生管理规定》时删除了原\"在校学习期间擅自结婚而未办理退学手续的，作退学处理\"的条文。《中华人民共和国民法典》第一千零四十七条规定法定婚龄：男不得早于二十二周岁，女不得早于二十周岁。各校对在校生婚育事务的具体管理要求以本校规定为准。", "证据等级": "A", "来源": "教育部 (2017). 普通高等学校学生管理规定（教育部令第 41 号）. <https://hudong.moe.gov.cn/jyb_xxgk/xxgk/zhengce/guizhang/202112/P020211208551013106022.pdf>；全国人大《中华人民共和国民法典》第一千零四十七条。", "备注": "受益人是自己。制度上\"没禁止\"不等于\"没有实际影响\"——学业安排、住宿、学籍事务仍可能受影响，具体问本校学生管理部门。"}, "extra": []}, {"n": 24, "title": "彩礼：恋爱期间的转账和礼物，与\"彩礼\"不是一回事", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "恋爱期间你给对方转的 520 红包、节日礼物、日常吃饭买单，在法律上通常不算\"彩礼\"。这一点有明确规定：《最高人民法院关于审理涉彩礼纠纷案件适用法律若干问题的规定》（法释〔2024〕1 号，自 2024 年 2 月 1 日起施行）第二条明确，禁止借婚姻索取财物；一方以彩礼为名借婚姻索取财物，另一方要求返还的，人民法院应予支持。第三条进一步明确，以下情形给付的财物不属于彩礼：① 一方在节日、生日等有特殊纪念意义时点给付的价值不大的礼物、礼金；② 一方为表达或者增进感情的日常消费性支出；③ 其他价值不大的财物。对大学生来说，这条最实用的地方是：日常的转账、红包、礼物，和以结婚为目的给付的\"彩礼\"，在返还规则上根本不是同一回事——别把恋爱花销自动换算成\"以后能要回来\"。", "收益": "《最高人民法院关于审理涉彩礼纠纷案件适用法律若干问题的规定》（法释〔2024〕1 号，2024 年 2 月 1 日起施行）第二条明确禁止借婚姻索取财物，一方以彩礼为名借婚姻索取财物、另一方要求返还的，人民法院应予支持；第三条明确节日、生日等特殊纪念时点给付的价值不大的礼物与礼金、为表达或增进感情的日常消费性支出、其他价值不大的财物，不属于彩礼。", "证据等级": "A", "来源": "最高人民法院 (2024). 关于审理涉彩礼纠纷案件适用法律若干问题的规定（法释〔2024〕1 号）. <https://www.court.gov.cn/>", "备注": "受益人是自己。反过来也要注意：金额巨大、明显以结婚为条件的给付，可能被认定为彩礼并涉及返还——大额给付前想清楚性质。"}, "extra": []}, {"n": 25, "title": "隐瞒重大疾病结婚：另一方可以请求撤销婚姻", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "《中华人民共和国民法典》第一千零五十三条规定：一方患有重大疾病的，应当在结婚登记前如实告知另一方；不如实告知的，另一方可以向人民法院请求撤销婚姻；请求撤销婚姻的，应当自知道或者应当知道撤销事由之日起一年内提出。这条讲的是\"知情权\"——结婚这件事上，对方有重大疾病却隐瞒，你有权在知道后通过法律途径撤销这桩婚姻，而不是只能认。它不是\"歧视患者\"，而是把选择建立在知情的基础上：重大疾病可能影响共同生活、生育与经济安排，法律把决定权交还给不知情的一方，同时给出时限。知道这条，是为了在需要时知道有这条路可走。", "收益": "《中华人民共和国民法典》第一千零五十三条：一方患有重大疾病的，应当在结婚登记前如实告知另一方；不如实告知的，另一方可以向人民法院请求撤销婚姻；请求撤销婚姻的，应当自知道或者应当知道撤销事由之日起一年内提出。被撤销的婚姻自始没有法律约束力。", "证据等级": "A", "来源": "全国人大《中华人民共和国民法典》婚姻家庭编第一千零五十三条。", "备注": "受益人是自己。\"重大疾病\"的具体范围与举证方式，涉及诉讼时以法院认定和专业律师意见为准。"}, "extra": []}, {"n": 26, "title": "婚后共同债务与财产约定：两件事先弄清楚", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "如果关系走到婚姻这一步，两条规则越早知道越省事。第一，\"夫妻共同债务\"的认定：一方在婚姻关系存续期间以个人名义超出家庭日常生活需要所负的债务，原则上不属于夫妻共同债务；但债权人能证明该债务用于夫妻共同生活、共同生产经营，或者基于双方共同意思表示的除外。翻译成人话：对方在你不知情时借的一大笔钱，未必是你一起还。第二，\"夫妻财产约定\"：法律允许夫妻书面约定婚前财产和婚后财产归各自所有、共同所有或部分各自所有、部分共同所有，约定对双方有约束力。这两条不是\"不信任\"，是把\"钱和债\"的规则提前定好，避免日后扯不清。", "收益": "《中华人民共和国民法典》第一千零六十四条规定夫妻共同债务的认定：夫妻双方共同签名或者夫妻一方事后追认等共同意思表示所负的债务，以及夫妻一方在婚姻关系存续期间以个人名义为家庭日常生活需要所负的债务，属于夫妻共同债务；一方以个人名义超出家庭日常生活需要所负的债务，不属于夫妻共同债务，但债权人能够证明该债务用于夫妻共同生活、共同生产经营或者基于夫妻双方共同意思表示的除外。第一千零六十五条规定，男女双方可以约定婚姻关系存续期间所得的财产以及婚前财产归各自所有、共同所有或者部分各自所有、部分共同所有，约定应当采用书面形式，对双方具有法律约束力。", "证据等级": "B", "来源": "全国人大《中华人民共和国民法典》婚姻家庭编第一千零六十四条、第一千零六十五条。", "备注": "受益人是自己。财产约定要采用书面形式；具体条款的效力与执行，涉及纠纷时以法院认定为准。"}, "extra": []}, {"n": 27, "title": "想分手就当面说清楚：别拖着，也别冷暴力消失", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，花的是开口那一次的难受。", "说人话": "分手最消耗人的方式，是\"慢慢冷掉\"——不回消息、不见面、让对方在猜疑里耗着。这看似\"不伤人\"，实际是把伤害拉长，还常常把对方推向反复纠缠。更体面的做法是：想清楚了就直接、当面说，讲清\"这是我的决定\"（不是\"再看吧\"），不翻旧账、不列举对方的缺点清单，也别给对方虚假的希望。如果担心见面不安全，就选公共场合、让朋友在附近。说完之后，减少接触、把交接（共同物品、共同账户）处理清楚，是对双方都负责的收尾。拖着不说的成本，往往由两个人一起付，而且拖得越久越贵。", "收益": "明确、直接的分手沟通（说清决定、避免模糊承诺、减少后续接触）比回避式消失更少引发长期纠缠，是关系结束处理的通行做法（无统一数据）。在存在安全顾虑时选择公共场所并让人知情，是降低风险的通行做法。", "证据等级": "C", "来源": "关系结束沟通的通行做法（属通行做法，无统一数据）；安全顾虑下的处置参见第 12—15 条。", "备注": "受益人是自己。\"我怕当面说会伤到他\"和\"我拖着不说\"是两回事——后者往往更伤，也更危险。"}, "extra": []}, {"n": 28, "title": "分手后的难受是正常的：那是哀伤，不是你坏了", "tag": {"money": "0", "time": "中", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，花的是一段时间的难受。", "说人话": "分手之后睡不好、吃不下、反复回想、忍不住去看对方动态，这些都是常见的哀伤反应——它和亲人离世后的反应在机制上有相似之处：你失去了一段重要关系和一部分对未来的想象。它不代表你脆弱，也不代表\"你这个人有问题\"。多数人的情绪会随时间逐渐回落，通常在几周到几个月内明显缓解。有用的做法是维持基本作息、规律吃饭睡觉、保持和朋友的连接、把注意力放回具体的事上；没用的做法是反复复盘\"我到底哪里做错了\"。如果长期不见好转，就找人帮忙（见第 30 条），别自己硬扛。", "收益": "失恋引发的情绪、睡眠与注意力的变化属于对重要关系丧失的哀伤反应，多数随时间缓解，个体差异较大；维持基本作息与社会连接、限制反复查看对方动态，是常见的应对做法（属通行做法，无统一数据）。", "证据等级": "C", "来源": "丧失与哀伤反应的通行做法（属通行做法，无统一数据）；情绪问题长期不缓解时的求助渠道见第 15 章。", "备注": "受益人是自己。把\"三个月内先不给自己下结论\"当成一条规则，会好过很多。"}, "extra": []}, {"n": 29, "title": "失恋后的高风险期：不做不可逆的决定", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "分手后的一段时间里，情绪波动会直接影响判断力。这个阶段最值得记的一条是：别做不可逆的决定。具体包括——退学、休学、转专业、注销账号把资料全删、把积蓄大额转给谁、冲动之下再去找对方或对方身边的人闹。这些决定的共同点是\"做起来痛快、收回很难\"。给自己设一个缓冲期（比如一个月到三个月），把想做的事写在纸上但先不做，等情绪回落到能正常吃饭睡觉上课的水平，再回头看这些决定。多数时候，你会庆幸自己当时没有立刻动手。", "收益": "重大丧失后的应激期，个体的情绪与决策能力可能受影响，此后一段时间内做重大、不可逆决定的风险较高；设置\"决策缓冲期\"、延后可逆性低的选择，是危机后自我管理的通行做法（属通行做法，无统一数据）。", "证据等级": "C", "来源": "应激期决策的通行做法（属通行做法，无统一数据）；相关心理支持见第 15 章。", "备注": "受益人是自己。缓冲期内照常生活：该上课上课、按时吃饭睡觉，把大决定先放进\"以后再说\"的盒子。"}, "extra": []}, {"n": 30, "title": "什么时候该去找心理咨询：超过两周、影响吃饭睡觉上课", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，校内咨询通常免费。", "说人话": "分手或感情困扰到什么程度该找人？给三条可操作的线：① 情绪低落、失眠或食欲变化持续超过两周；② 已经影响到上课、考试、吃饭睡觉这些基本功能；③ 出现\"活着没意思\"\"想消失\"这类念头。踩到任意一条，就别再自己扛，去学校心理健康教育与咨询中心约一次，或者拨打 24 小时热线 12356、12355。和\"熬过去就好了\"相比，主动求助是更省时间的路。一个参考数据：多数大学生知道学校有免费心理咨询，但真正用过的人很少——不是不需要，是没人告诉他们\"可以现在就去\"。", "收益": "《高等学校学生心理健康教育指导纲要》（教思政〔2018〕41 号）要求高校为学生提供心理咨询服务，咨询遵循保密原则；中国科学院心理研究所《2024 年大学生心理健康状况调查报告》显示，80.0% 的大学生知道学校提供免费心理咨询服务，但仅 2.8% 实际使用过。更完整的识别、就诊与求助内容见第 15 章。", "证据等级": "B", "来源": "教育部 (2018). 高等学校学生心理健康教育指导纲要（教思政〔2018〕41 号）；中国科学院心理研究所 (2024). 2024 年大学生心理健康状况调查报告。详见第 15 章。", "备注": "受益人是自己。咨询不需要\"理由充分\"，第一次去可以先只说\"我最近睡不好\"。"}, "extra": []}, {"n": 31, "title": "有数据说：无恋人者的抑郁风险比例更高", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，读一段数据。", "说人话": "中国科学院心理研究所《2024 年大学生心理健康状况调查报告》（心理健康蓝皮书，2024 年 3 月至 6 月调查 60782 名 16 至 28 岁大学生）给出了一组数据：男生中无恋人者的抑郁风险比例为 4.2%，高于有恋人者的 2.1%；女生中无恋人者 3.1%，有恋人者 2.8%。报告指出，积极、稳定的亲密关系可能在一定程度上起到缓冲作用。需要说明的是，这是相关关系，不是因果——也可能是有恋人者本身的社交条件更好。所以这组数据的正确读法是：单身不是问题，但如果你正因单身而持续低落，那这份低落本身值得被认真对待。", "收益": "中国科学院心理研究所《2024 年大学生心理健康状况调查报告》显示：男生中无恋人者的抑郁风险比例为 4.2%、有恋人者为 2.1%；女生中无恋人者为 3.1%、有恋人者为 2.8%。报告指出，积极、稳定的亲密关系可能在一定程度上起到缓冲作用（属相关关系，不构成因果结论）。", "证据等级": "A", "来源": "中国科学院心理研究所 (2024). 2024 年大学生心理健康状况调查报告（心理健康蓝皮书，样本为全国 60782 名 16—28 岁大学生）。", "备注": "受益人是自己。数据说的是\"群体差异很小、方向一致\"，不是\"恋爱能治病\"——把关系当药吃，反而容易出问题。"}, "extra": []}, {"n": 32, "title": "\"只有我单身\"是错觉：数据说明大多数人的真实位置", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "中国科学院心理研究所《2022 年大学生心理健康状况调查报告》（覆盖 31 个省区市近 8 万名 15 至 26 岁大学生）显示：27.61% 的大学生处于恋爱状态，41.93% 单身且不想脱单，25.40% 单身想脱单。也就是说，超过六成的大学生是单身。2024 年的同一系列调查显示，大学生单身群体中，12.2% 表示\"非常希望脱单\"，46.6% \"比较希望脱单\"，30.1% \"不太希望脱单\"，11.1% \"完全不想脱单\"；其中男生\"非常希望脱单\"的比例（21.9%）高于女生（7.2%）。把这两组数放在一起看，\"大家都在谈恋爱、只有我单身\"基本可以确认是错觉——你所在的那一半人，其实很多。", "收益": "中国科学院心理研究所《2022 年大学生心理健康状况调查报告》（覆盖 31 个省区市近 8 万名 15—26 岁大学生）显示：27.61% 处于恋爱状态，41.93% 单身且不想脱单，25.40% 单身想脱单；《2024 年大学生心理健康状况调查报告》显示，单身大学生中 12.2% \"非常希望脱单\"、46.6% \"比较希望脱单\"、30.1% \"不太希望脱单\"、11.1% \"完全不想脱单\"，男生\"非常希望脱单\"比例 21.9% 高于女生 7.2%。", "证据等级": "B", "来源": "中国科学院心理研究所 (2022). 2022 年大学生心理健康状况调查报告；中国科学院心理研究所 (2024). 2024 年大学生心理健康状况调查报告。", "备注": "受益人是自己。知道\"你所在的这一半人很多\"，能少掉一些\"我怎么这么失败\"的内耗。"}, "extra": []}, {"n": 33, "title": "婚育观数据：将近一半的大学生认为\"爱情不重要\"", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "中国科学院心理研究所《心理健康蓝皮书：中国国民心理健康发展报告（2023—2024）》中的《2024 年成年人与在校大学生婚育观调查报告》（基于全国 55781 名在校大学生及 7366 名成年人的问卷）显示：大学生中选择\"拥有爱情不重要\"的占 45.4%，\"拥有婚姻不重要\"占 51.8%，\"生育子女不重要\"占 59.4%。这说明在同龄人里，\"不把恋爱结婚当必选项\"是相当大的一股声音。从心理学角度看，这也符合埃里克森人格发展阶段理论——大学阶段大致对应\"亲密对孤独\"的冲突期，人开始认真面对\"要不要建立深度亲密关系\"这个问题。所以无论你选哪一边，都不算异类；重要的是你自己想清楚，而不是被\"大家怎样\"推着走。", "收益": "中国科学院心理研究所《心理健康蓝皮书：中国国民心理健康发展报告（2023—2024）》中《2024 年成年人与在校大学生婚育观调查报告》（基于全国 55781 名在校大学生及 7366 名成年人）显示：大学生中选择\"拥有爱情不重要\"的占 45.4%、\"拥有婚姻不重要\"占 51.8%、\"生育子女不重要\"占 59.4%。埃里克森人格发展阶段理论认为，成年早期（约对应大学阶段）的核心冲突是\"亲密对孤独\"。", "证据等级": "A", "来源": "中国科学院心理研究所 (2024). 心理健康蓝皮书：中国国民心理健康发展报告（2023—2024）·2024 年成年人与在校大学生婚育观调查报告；Erikson EH 的人格发展八阶段理论（亲密对孤独阶段）。", "备注": "受益人是自己。数据只说明\"选择多元\"，不说明哪种选择更对——这条留给每个人自己判断。"}, "extra": []}, {"n": 34, "title": "把这一章压成几句话", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，读一分钟。", "说人话": "把前面三十三条压成几句能记住的话：恋爱是可选项，不是必修课，谈不谈都正常（第 31—33 条有数据）；先算清时间和钱，再决定投多少（第 1—3 条）；把需求说清楚、就事论事地吵、守住时间和隐私的边界，比一味付出管用（第 6—8 条）；出现贬低、隔离、查手机、忽冷忽热，先当成\"红旗\"而不是\"我的错\"（第 11 条）；被纠缠、被跟踪、被威胁，法律给了你人身安全保护令，同居情形参照反家庭暴力法，证明标准只要求\"较大可能性\"（第 12—13 条）；不拍、不存私密影像（第 14 条）；高危行为后 72 小时内去评估 PEP，担心感染就做自愿咨询检测（第 21—22 条）；分手当面说清、别冷暴力，失恋后先别做不可逆的决定（第 27、29 条）。这章的核心只有两个词：选择权，和时间精力——把账算清楚，把安全边界守住，剩下的，你自己定。", "收益": "本章为操作性汇总（依据见第 1—33 条各自的来源，部分为通行做法，非单一文献结论）。核心口径：把信息与规则讲清楚，由个人判断是否、以及如何进入或退出一段关系。", "证据等级": "C", "来源": "本章汇总（依据见第 1—33 条各自的来源；属操作提示，非文献结论）。", "备注": "受益人是自己。真遇到危险或危机，先保安全，再走法律与求助渠道：110、120、12356。"}, "extra": []}]}, {"file": "15-心理健康.md", "title": "15. 心理健康：什么时候别硬扛", "entries": [{"n": 1, "title": "校心理咨询中心：免费，而且有保密义务", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "不花钱。多数学校每学期提供若干次免费个体咨询。", "说人话": "绝大多数高校设有心理健康教育与咨询中心，面向本校学生提供免费心理咨询，内容保密（除涉及自伤、伤人等依法需要报告的情形外）。不用先\"确诊\"才能去，也不用等到撑不住再去——聊学业压力、人际困扰、想家、迷茫都可以。把\"去咨询\"当成和\"去校医院\"一样平常的事，别把它当承认自己有毛病。", "收益": "《高等学校学生心理健康教育指导纲要》（教思政〔2018〕41 号）要求高校加强心理健康教育与咨询服务体系建设，配备专职心理健康教育教师，为学生提供心理咨询服务；咨询遵循保密原则，来访者信息属隐私，除法定例外情形外不得泄露。教育部等十七部门《全面加强和改进新时代学生心理健康工作专项行动计划（2023—2025 年）》进一步要求健全监测预警与咨询服务机制。", "证据等级": "A", "来源": "教育部 (2018). 高等学校学生心理健康教育指导纲要（教思政〔2018〕41 号）. <http://www.moe.gov.cn/srcsite/A12/moe_1407/s3020/201807/t20180713_342992.html>；教育部等十七部门 (2023). 全面加强和改进新时代学生心理健康工作专项行动计划（2023—2025 年）. <https://www.moe.gov.cn/srcsite/A17/moe_943/moe_946/202305/t20230511_1059219.html>", "备注": "受益人是自己。保密有例外（如涉及自伤、伤人、法定报告义务），咨询师通常会在第一次就向你说明——这是规范做法，不是不信任你。"}, "extra": []}, {"n": 2, "title": "12356：全国统一心理援助热线，24 小时", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "不花钱，打一个电话。", "说人话": "2025 年 5 月 1 日起，全国统一心理援助热线 12356 在各省（区、市）开通，提供全天候心理支持，可以匿名拨打。深夜情绪崩了、找不到人说话、或者只是想先有人听你说完，都可以打这个号码。它不是\"病情很重才能打\"的专线，情绪缓冲、信息咨询、危机干预它都承接。", "收益": "国家卫生健康委《关于应用\"12356\"全国统一心理援助热线电话号码的通知》（国卫医政函〔2024〕259 号）要求各地在 2025 年 5 月 1 日 0 时前实现拨打 12356 接通心理援助热线；原则上每个设区的市至少开通 1 条热线、每条至少 2 个坐席，每日提供不少于 18 小时服务，并推进与 110、119、120 等热线建立联动机制。热线提供心理健康教育、心理咨询、心理疏导、心理危机干预等服务。", "证据等级": "A", "来源": "国家卫生健康委 (2024). 关于应用\"12356\"全国统一心理援助热线电话号码的通知（国卫医政函〔2024〕259 号）. <https://www.gov.cn/zhengce/zhengceku/202412/content_6994470.htm>", "备注": "受益人是自己。不同地区接通时长可能不同，打不通就再打，或改用 12355、学校咨询中心、急诊。"}, "extra": []}, {"n": 3, "title": "12355、110、120：另外几条要记住的线", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "不花钱。", "说人话": "除 12356 外还有几条：共青团 12355 青少年服务台，提供心理与法律等方面的咨询；出现人身安全风险（自伤、伤人的紧急情况）直接拨 110 或 120，或送最近医院急诊——急救不受\"要不要预约\"的限制。把这三四个号码存进手机通讯录并置顶，别等出事那天现搜。", "收益": "12355 是共青团中央设立的青少年服务台，长期提供心理咨询与权益服务；110（公安报警）、120（医疗急救）为全国统一紧急呼叫号码，对危及生命安全的紧急情况应当直接拨打并说明位置与情况（属通行应急做法）。", "证据等级": "A", "来源": "共青团中央 12355 青少年服务台（官方服务说明）；公安部、国家卫生健康委关于 110、120 紧急呼叫的通行规定。", "备注": "受益人是自己。打 110/120 时说清三件事：在哪、发生了什么、需要什么帮助。"}, "extra": []}, {"n": 4, "title": "什么信号说明该去看：持续两周这条线", "tag": {"money": "低", "time": "少", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "挂号费，几元到几十元。", "说人话": "以下情况持续两周以上，就该去评估：几乎每天情绪低落、对以前喜欢的事失去兴趣、睡不好或睡太多、吃不下或暴食、注意力没法集中、莫名地累、觉得自己没用。判断的关键不是\"有没有\"，而是\"多久、多严重、有没有影响吃饭睡觉和上课\"。如果出现\"活着没意思\"\"想消失\"这类念头，不叫想不开，是需要马上处理的医疗问题。", "收益": "抑郁障碍的诊断通常要求核心症状（情绪低落、兴趣减退）持续至少两周，并伴有睡眠、食欲、精力、注意力等方面的改变，且造成社会功能损害（DSM-5、ICD-11 的通行诊断要点）；达到诊断标准后，心理治疗与药物治疗都有明确疗效，早期干预效果更好。", "证据等级": "B", "来源": "抑郁障碍诊断要点（DSM-5、ICD-11 通行口径）；抑郁障碍治疗指南中关于早期干预的通行口径。", "备注": "受益人是自己。\"两周\"是筛查参考线，不是自我诊断标准——到底算不算，交给专业人员判断。"}, "extra": []}, {"n": 5, "title": "抑郁障碍：不是\"心情不好\"，也不是\"想开点\"能解决", "tag": {"money": "低", "time": "少", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "挂号加治疗费用，部分在医保范围内。", "说人话": "抑郁障碍是一种常见疾病，不是性格缺陷，也不是\"矫情\"。它影响的是情绪、睡眠、食欲、精力和认知，靠\"想开点\"解决不了，就像骨折靠\"想开点\"接不上。它是可以被治疗的，多数人经过规范治疗后明显改善。所以最重要的一步是——别把它当道德问题，把它当健康问题去处理。", "收益": "世界卫生组织指出，全球约有 2.8 亿人患有抑郁症（depressive disorder）；抑郁症是常见的可治疗疾病，心理治疗与药物治疗均有效。早识别、早干预有助于改善结局。", "证据等级": "A", "来源": "World Health Organization. Depressive disorder (depression) — Fact sheet. <https://www.who.int/news-room/fact-sheets/detail/depression>", "备注": "受益人是自己。身边有人说\"你就是想太多\"，不代表事实如此——评价情绪问题的话，交给专业人员。"}, "extra": []}, {"n": 6, "title": "焦虑障碍：身体先报警，别当成\"心脏有问题\"", "tag": {"money": "低", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "挂号费。", "说人话": "焦虑障碍常常先以躯体症状出现：心慌、胸闷、手抖、出汗、头晕、肠胃不适、总觉得要出事。很多人先在综合医院查心脏、查胃，哪都查不出问题，最后才想到情绪。如果这类不适反复出现、又没有器质性问题，同时伴随持续紧张或回避某些场合，值得去精神科或心理科评估。", "收益": "焦虑障碍常伴有心悸、出汗、震颤、胸闷等自主神经症状，且常与其他疾病相互影响；在排除器质性疾病后，由精神/心理专科评估是通行路径（属诊疗通行做法）。规范的药物与心理治疗（如认知行为治疗）对焦虑障碍有明确疗效。", "证据等级": "B", "来源": "焦虑障碍的临床识别与治疗通行口径（ICD-11、DSM-5 分类与相关治疗指南）。", "备注": "受益人是自己。身体检查排除器质性问题是必要的，但别停在\"查不出毛病就没事\"，那往往是更需要看情绪的时候。"}, "extra": []}, {"n": 7, "title": "失眠障碍：每周三次、持续三个月才算跨过门槛", "tag": {"money": "低", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "挂号费。", "说人话": "偶尔睡不着不用紧张。但如果\"入睡难、睡不稳、早醒\"每周出现三次以上、持续三个月以上，并已影响白天状态（困、注意力差、情绪差），就可能达到失眠障碍的判断标准，该去精神科或睡眠门诊看，而不是靠数绵羊、加量咖啡因硬撑。失眠是能治的，认知行为治疗对它是公认的一线方法。", "收益": "失眠障碍的通行诊断标准（DSM-5、ICD-11）通常要求入睡困难/维持睡眠困难/早醒每周至少 3 次、持续至少 3 个月，并伴日间功能损害；失眠认知行为治疗（CBT-I）是公认的一线非药物治疗。", "证据等级": "B", "来源": "失眠障碍诊断要点（DSM-5、ICD-11 通行口径）；失眠认知行为治疗（CBT-I）作为一线治疗的专业共识。", "备注": "受益人是自己。就诊时如实说咖啡因、酒精和作息情况，这些直接影响判断和治疗方案。"}, "extra": []}, {"n": 8, "title": "适应问题：大一\"水土不服\"很常见，不等于你有病", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，或一次咨询。", "说人话": "刚入学时感到孤独、想家、跟谁都不熟、怀疑自己\"是不是选错了\"，是非常普遍的一段。这类由环境变化引起的情绪与行为反应，在精神障碍分类中甚至单列了一类\"适应障碍\"——说明它是被承认的、真实的，而不是你脆弱。多数人几周到几个月内会缓解，如果迟迟不好转或明显影响功能，找咨询中心聊一次就好。", "收益": "ICD-11 等分类体系将\"适应障碍\"（adjustment disorder）列为与应激事件相关的独立类别，指对可识别的应激源产生的情绪与行为反应；多数为自限性，若持续或加重则需要专业评估。", "证据等级": "B", "来源": "ICD-11 中\"与应激相关的问题\"分类（适应障碍）；大学生入学适应问题的研究方向。", "备注": "受益人是自己。别把\"适应需要时间\"当拖延借口——给自己设一个时间点，比如一个月还没好转，就去找人。"}, "extra": []}, {"n": 9, "title": "三项自评：睡眠、食欲、兴趣", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱。", "说人话": "不想做量表的话，用三项自查：最近两周睡得好吗？吃饭有胃口吗？还有让你期待的事吗？三项里坏了两项且持续两周，就值得找咨询中心聊一次。这不是诊断，是给自己一个\"该不该去\"的提醒器——很多人不是不知道难受，只是想不到可以去求助。", "收益": "睡眠紊乱、食欲改变、兴趣丧失是抑郁与焦虑障碍常见的前驱或伴随症状，将其作为低成本自查指标可提示是否需要专业评估（属筛查思路，非独立量表，不构成诊断）。", "证据等级": "C", "来源": "情绪障碍前驱症状的通行筛查思路（属通行做法，非独立量表）。", "备注": "受益人是自己。自查只用来决定\"要不要找人\"，不要用它来给自己下结论。"}, "extra": []}, {"n": 10, "title": "精神科就诊与用药：别自己停药", "tag": {"money": "低", "time": "少", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "挂号加药费，很多药物在医保范围内。", "说人话": "抗抑郁药起效通常要 2 到 4 周，中途觉得\"没用\"就停药，反而可能更难受；突然停药还可能出现撤药反应，症状反弹。用药的加减、换药、停药都交给医生，别自己来。记两个动作：按时复诊，把\"吃了之后有什么变化\"如实反馈给医生。药不是意志的替代品，它是把你的状态拉回能用力气的水平。", "收益": "抗抑郁药通常需持续服用数周才显现疗效，症状缓解后一般还需巩固治疗一段时间以防复发；自行停药可能引起撤药反应并升高复发风险，这是精神科治疗的通行原则（属诊疗通行做法）。", "证据等级": "B", "来源": "抑郁障碍药物治疗的通行指南口径（疗程与停药建议）；《中华人民共和国精神卫生法》关于精神障碍治疗的相关规定。", "备注": "受益人是自己。部分药物可能影响注意力，如影响考试，可凭医院证明向学校申请合理便利。"}, "extra": []}, {"n": 11, "title": "吃药会\"上瘾\"或\"伤脑子\"吗：给个理性期待", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，花的是问清楚的时间。", "说人话": "\"吃药会不会上瘾\"\"会不会变傻\"是最常见的两个顾虑。答案是：不同药物不一样，副作用也因人而异，但绝大多数都可以和医生讨论、调整方案；真正危险的是因为怕副作用而硬扛。正确做法是：拿药时直接问医生\"要吃多久、可能有什么反应、什么情况必须马上联系你\"，把这些问题问明白再决定，比在网上看别人经历靠谱。", "收益": "精神科药物的作用机制、起效时间与不良反应存在个体差异，需由医生评估并随访；抗抑郁药并非普遍意义上的\"成瘾性\"药物，停药的撤药反应与成瘾是不同概念（属诊疗通行做法）。用药决策应由医生与患者共同商定。", "证据等级": "B", "来源": "精神科药物使用的通行诊疗口径（起效、不良反应与随访）；《中华人民共和国精神卫生法》关于自愿原则与知情同意的相关规定。", "备注": "受益人是自己。任何\"我吃这个药感觉不对\"的情况，都值得在下次复诊时说出来，而不是自己处理。"}, "extra": []}, {"n": 12, "title": "心理健康档案与保密边界：测评是为了帮你", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "很多学校在新生入学后安排心理健康测评。你要知道它是什么：用来筛查和提供支持，不是给你贴标签、更不是拿来评价你。测评结果属于隐私，学校对它有保密要求。但保密有边界——涉及自伤、伤人等高危情形时，学校会依规启动干预、联系家长或转介，这是为了安全，不是\"打小报告\"。", "收益": "《高等学校学生心理健康教育指导纲要》（教思政〔2018〕41 号）等文件要求高校开展心理健康测评、建立心理档案并做好保密与危机预警；《中华人民共和国精神卫生法》规定心理咨询人员应当尊重来访者隐私，不得从事心理治疗或精神障碍的诊断、治疗（第 23 条），精神障碍的诊断、治疗应由医疗机构精神科执业医师进行。", "证据等级": "B", "来源": "教育部 (2018). 高等学校学生心理健康教育指导纲要（教思政〔2018〕41 号）；全国人大常委会《中华人民共和国精神卫生法》（第四、五章相关条款）。", "备注": "受益人是自己。测评时如实作答对自己最有利；学校心理咨询中心的咨询记录与院系之间通常有保密边界，具体以学校规定为准。"}, "extra": []}, {"n": 13, "title": "撑不住就休学：这是正式、可逆的选项", "tag": {"money": "0", "time": "中", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "可能延后半年到一年毕业。", "说人话": "状态实在撑不住时，休学是一个正式的、可逆的选项，不是失败。关键是把这几件事先问清：休学最长多久、学费住宿费怎么算、医保怎么办、复学时怎么衔接课程、会不会影响保研和评奖资格。问清楚再决定。硬撑着把学业和身体一起拖垮，往往比休半年代价更大。", "收益": "《普通高等学校学生管理规定》（教育部令第 41 号）规定，学生可以分阶段完成学业，应当在最长学习年限（含休学和保留学籍）内完成学业；学生申请休学或学校认为应当休学的，经学校批准可以休学；因病休学的须提交医院证明；在校学生休学一般以一年为限，累计不得超过两年（具体以本校规定为准）。", "证据等级": "A", "来源": "教育部 (2017). 普通高等学校学生管理规定（第四章\"休学与复学\"）. <https://hudong.moe.gov.cn/jyb_xxgk/xxgk/zhengce/guizhang/202112/P020211208551013106022.pdf>", "备注": "受益人是自己。休学通常影响推免资格和评奖，务必先算清再办；相关规则见第 1 章第 2 条。"}, "extra": []}, {"n": 14, "title": "延毕、降级不是世界末日", "tag": {"money": "中", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "多一年学费和生活费，可能影响当年的就业时间线。", "说人话": "延毕、降级、休学在高校里是常见操作，处理得当不会毁掉你的履历。简历上写\"因健康原因调整修业年限\"，多数雇主不会追问；真正毁履历的，是硬撑着不处理、最后学业和身体一起崩。把修业年限当成可以调整的参数，而不是必须按点完成的任务，你就多了一个可选项。", "收益": "各高校对延毕、休学有明确流程与备案方式；因病延毕的学生在求职中可作合理说明（属通行做法）。相比\"因长期身心问题导致成绩全面崩盘\"，主动调整修业年限对长期结果更有利（属经验判断）。", "证据等级": "C", "来源": "各高校学籍管理规定（通行做法）；属经验判断，非文献结论。", "备注": "受益人是自己。做决定前把\"晚一年毕业\"和\"拖着不处理\"两条路各写一遍，多数时候答案会很清晰。"}, "extra": []}, {"n": 15, "title": "帮朋友：直接问\"你有没有想过自杀\"，不会害了他", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "不花钱，花的是开口的勇气。", "说人话": "很多人不敢问，怕\"一提就点醒他\"。事实相反：以平静、直接、不评判的方式询问自杀意念，不会诱发自杀行为，反而常让当事人感到被看见、愿意说出真实想法。可以这样开口：\"你最近状态很不好，我很担心你。你有没有想过结束自己的生命？\"问之前深呼吸，问完之后听，别急着讲道理、也别急着保证\"一切都会好\"。", "收益": "自杀风险筛查的专业实践主张对高风险个体直接、平静地询问自杀意念，直接提问本身不会诱发自杀行为；常用筛查工具包括 ASQ（Ask Suicide-Screening Questions，美国国立精神卫生研究所开发）和 C-SSRS（哥伦比亚自杀严重程度评定量表），均以直接询问为核心（属危机干预通行做法）。", "证据等级": "B", "来源": "自杀风险筛查的通行做法与工具（ASQ、C-SSRS）；危机干预中\"直接询问不增加风险\"的专业口径。", "备注": "受益人是你的朋友。你能做的是陪伴和转介，不是独自解决问题——把专业的事交给专业的人。"}, "extra": []}, {"n": 16, "title": "高风险时的操作步骤：不独处、移开、转介", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "不花钱，可能需要搭进去一段时间和精力。", "说人话": "如果对方已经说出具体计划、时间、方式，或最近有过尝试，这就属于急症级别的风险。此时不要承诺保密，也不要一个人扛。按这个顺序做：① 尽量不让他独处；② 把可能有危险性的物品移开或减少其可及性；③ 立即联系他信任的人、辅导员以及学校心理健康教育与咨询中心；④ 情况紧急直接拨 120 或 110，或送医院急诊；⑤ 陪同他完成转介。你不需要\"治好\"他，只需要把他交到能帮他的系统里。", "收益": "危机干预的基本原则是保障即时安全、减少危险手段的可及性、并尽快转入专业医疗与支持系统；《中华人民共和国精神卫生法》确立精神障碍诊疗的自愿原则，同时规定了依法必须采取的处置情形。拨打 12356 可获得危机干预支持（国家卫生健康委 国卫医政函〔2024〕259 号）。", "证据等级": "B", "来源": "危机干预通行原则（保障安全、减少手段可及性、转介）；全国人大常委会《中华人民共和国精神卫生法》；国家卫生健康委 (2024). 国卫医政函〔2024〕259 号. <https://www.gov.cn/zhengce/zhengceku/202412/content_6994470.htm>", "备注": "受益人是你的朋友。事后你可能会很累、很怕——你也需要找人说说，这不是多事。"}, "extra": []}, {"n": 17, "title": "陪一个抑郁的朋友：陪伴有边界", "tag": {"money": "0", "time": "中", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，花的是持续的时间与心力。", "说人话": "陪伴不等于当治疗师。能做的：定期问候、约他出来走走、听他讲而不急着给建议、在他愿意时陪他去看医生。不该做的：替医生判断他该不该吃药、承诺\"我永远在\"、把他的情绪全揽到自己身上。如果陪伴已经让你也开始失眠、情绪低落，你同样有权去咨询中心——帮人之前，先别把自己拖下水。", "收益": "社会支持对情绪障碍的恢复有积极作用；支持者需注意自身边界与耗竭，这是心理援助与照护领域的通行做法（属通行做法，无统一数字）。", "证据等级": "C", "来源": "社会支持与照护者边界的通行做法（属通行做法）。", "备注": "受益人是自己，也是朋友。你无法替代专业治疗，也不必因此自责。"}, "extra": []}, {"n": 18, "title": "丧失与哀伤：应激期别做不可逆的决定", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱。", "说人话": "亲人去世、分手、重大失败之后，人的判断力和情绪都在剧烈波动。这个阶段最有用的一条建议是：别做不可逆的决定——退学、转专业、辞职、结婚、借一大笔钱、把东西全删了。给自己设一个缓冲期（比如三个月），能往后放的决定就往后再放。哀伤本身不是病，但如果长期无法缓解、严重影响功能，就该找人。", "收益": "丧亲与重大丧失后的一段时间里，抑郁、焦虑与躯体症状风险上升，决策能力也可能受影响；哀伤反应存在个体差异，多数随时间缓解，持续或加重时需专业评估（属通行做法与研究共识方向）。", "证据等级": "C", "来源": "哀伤反应与应激期决策的通行做法（属通行做法，不作定量结论）。", "备注": "受益人是自己。缓冲期内照常吃饭睡觉、该上课上、把大决定记在本子上但先不做。"}, "extra": []}, {"n": 19, "title": "家庭变故或经济困难：这是求助的理由，不是羞耻", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "家里出事、交不起学费、突然断供，都可以直接找辅导员：家庭经济困难认定、临时困难补助、学费减免、绿色通道、勤工助学，以及心理支持，这些都是现成的渠道。开口一次，能解决的不只是钱。憋着不说，问题不会自己消失，只会和别人嘴里的\"这个人怎么突然变了\"一起发酵。经济困难需要帮助，不丢人。", "收益": "《教育部等六部门关于做好家庭经济困难学生认定工作的指导意见》（教财〔2018〕16 号）规定家庭经济困难学生认定原则上每学年进行一次，认定结果是国家助学金、国家励志奖学金、勤工助学、校内资助等的重要依据；全日制普通高校对被录取入学、家庭经济确实困难无法缴纳学费的新生，先办理入学手续（\"绿色通道\"），再采取不同措施予以资助。", "证据等级": "A", "来源": "教育部等六部门 (2018). 关于做好家庭经济困难学生认定工作的指导意见（教财〔2018〕16 号）；全国学生资助管理中心学生资助政策简介. <https://www.xszz.edu.cn/>", "备注": "受益人是自己。认定材料的办理方法与时间窗口见第 1 章第 18 条；这些材料回老家办最方便。"}, "extra": []}, {"n": 20, "title": "游戏障碍：ICD-11 已经把它列为需要关注的问题", "tag": {"money": "低", "time": "多", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，代价是时间与作息。", "说人话": "\"玩游戏\"本身不是问题，\"控制不住地玩、并且已经明显损害学业健康生活、还停不下来\"才是。世界卫生组织的国际疾病分类（ICD-11）已经把\"游戏障碍\"（gaming disorder）列为一类需要关注的行为障碍。判断的关键是\"失控 + 损害 + 持续\"。如果它已经吃掉你的课、睡眠和人际，把它当健康问题去看，比一遍遍立 flag 再破功管用。", "收益": "世界卫生组织《国际疾病分类第十一次修订本》（ICD-11）将\"游戏障碍\"（gaming disorder，编号 6C51）列入\"由物质使用或成瘾行为引起的障碍\"一类，其识别特征是游戏行为控制受损、游戏优先于其他生活兴趣与日常活动、且尽管出现负面后果仍持续或升级并造成显著损害（通常需持续约 12 个月）。这为评估与求助提供了国际标准依据。", "证据等级": "A", "来源": "World Health Organization. International Classification of Diseases 11th Revision (ICD-11), 6C51 Gaming disorder. <https://icd.who.int/>；WHO. Gaming disorder — Q&A. <https://www.who.int/news-room/questions-and-answers/item/gaming-disorder>", "备注": "受益人是自己。分类不是给你定罪，而是说明\"这确实是个值得认真处理的问题\"，且可以求助。"}, "extra": []}, {"n": 21, "title": "酒精与药物滥用：它们会让情绪问题更糟", "tag": {"money": "中", "time": "中", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "持续支出，可能不止金钱。", "说人话": "心情差的时候喝酒、或用别人的\"助眠药\"\"解压药\"顶一顶，看起来是解法，实际上常让问题更重：酒精会干扰睡眠、加重抑郁、增加冲动。用酒精去缓解焦虑，时间久了容易形成依赖，原本一个能治的问题变成两个。如果你发现\"不喝就睡不着\"\"不喝就撑不住\"，这本身就是该去看医生的信号。", "收益": "酒精使用障碍与抑郁、焦虑存在双向关联，饮酒和物质滥用会干扰睡眠、影响治疗、升高风险；酒精与药物的相互作用可能导致危险后果（属公共卫生通行口径）。识别早期依赖是干预的关键。", "证据等级": "B", "来源": "WHO 关于酒精与物质使用障碍的通行口径；酒精使用与情绪障碍双向关联的通行研究结论。", "备注": "受益人是自己。任何\"助眠\"\"解压\"类处方药，都不要未经医生处方和指导使用或与他人共享。"}, "extra": []}, {"n": 22, "title": "拖延与完美主义：它们经常绑在一起", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，花的是调整标准的那点心理落差。", "说人话": "很多人以为拖延是懒，其实完美主义常是主因——因为怕做不好，所以迟迟不动手。\"要么做到最好，要么别开始\"这个念头，本身就是卡死你的东西。对症的解法不是加码自责，而是把标准从\"做好\"降成\"先做完这一小块\"。允许初稿很烂，是往前走的前提。如果拖延已经长期伴随情绪低落和功能受损，那就不只是习惯问题，值得去看一看。", "收益": "拖延与冲动性、任务厌恶等因素相关，元分析（Steel, 2007）估计拖延与尽责性呈中等负相关，且与焦虑等情绪问题存在关联；完美主义与拖延的关系也被广泛讨论。将任务拆小、降低启动标准是常用干预思路。", "证据等级": "B", "来源": "Steel P (2007). The nature of procrastination: A meta-analytic and theoretical review of self-regulated behavior. *Psychological Bulletin*, 133(1): 65–94.", "备注": "受益人是自己。写下\"最晚什么时候必须开始\"，比写下\"我要提前完成\"务实得多。"}, "extra": []}, {"n": 23, "title": "降低求助羞耻感：找专业帮助是能力，不是丢人", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱。", "说人话": "很多人不去心理咨询，不是因为找不到门，是觉得\"去了就说明我脆弱\"。换个角度想：感冒会去校医院，牙疼会去口腔科，情绪和睡眠出了问题去看心理咨询，是同一类事——找专业的人处理专业的麻烦，是效率最高、也最省事的做法。能把\"我需要帮忙\"说出口，是一种能力，不是缺陷。", "收益": "减少求助的心理障碍有助于更早获得支持，从而改善结局（属通行做法）。学校心理咨询中心免费、保密的设置，本身就是为了降低求助门槛。", "证据等级": "C", "来源": "降低求助障碍的通行做法（属通行做法，无统一数据）。", "备注": "受益人是自己。第一次去可以先只聊\"我最近睡不好\"，不必一次说清所有事。"}, "extra": []}, {"n": 24, "title": "如果你自己正在想\"要不要活下去\"", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "打一个电话，或者走进一扇门。", "说人话": "先把今晚过完。打 12356（24 小时）或者 12355，告诉一个你信得过的人，或者直接去医院急诊。把身边能伤到自己的东西先放远一点、放到不容易拿到的地方。你现在觉得没有出路，但这种感受本身就是状态的一部分，它会变，专业的人有办法帮你度过这段。此刻最重要的事只有一件——先让自己安全地过完这一天。", "收益": "全国统一心理援助热线 12356 自 2025 年 5 月 1 日起全国开通，提供全天候心理支持与危机干预（国家卫生健康委 国卫医政函〔2024〕259 号）；危机干预的基本原则是保障即时安全、减少危险手段可及性、尽快转入专业医疗与支持系统。", "证据等级": "A", "来源": "国家卫生健康委 (2024). 关于应用\"12356\"全国统一心理援助热线电话号码的通知（国卫医政函〔2024〕259 号）. <https://www.gov.cn/zhengce/zhengceku/202412/content_6994470.htm>；共青团中央 12355 青少年服务台。", "备注": "受益人是自己。这条放在后段，是因为它是最需要被看见的一条——如果这正是你的处境，请现在就拨出去，或者走向离你最近的人。"}, "extra": []}, {"n": 25, "title": "把咨询用出效果：不是聊一次就好", "tag": {"money": "0", "time": "中", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，但需要持续几次的投入。", "说人话": "心理咨询的作用来得慢，通常需要连续几次建立关系和梳理问题，不是一次就\"开药方\"。想让咨询更有效，可以提前想好这次想聊什么，结束时和咨询师确认下一次的方向；如果觉得和这位咨询师不匹配，可以申请更换，这不失礼。把咨询当成一个\"持续使用\"的资源，就像健身，一次两次看不出效果。", "收益": "心理咨询的疗效与咨询关系质量、来访者投入程度相关，通常需要一定次数才显现（属通行做法与研究共识方向，无统一数字）。学校咨询中心一般对每位学生每学期提供若干次免费咨询，具体次数以本校规定为准。", "证据等级": "C", "来源": "心理咨询疗效与咨询关系的通行做法（属通行做法）；各高校心理健康教育与咨询中心服务说明。", "备注": "受益人是自己。觉得咨询师不合适，就换一个或说清楚——这和你去看病可以选择医生是一个道理。"}, "extra": []}]}, {"file": "16-电脑账号与数字安全.md", "title": "16. 电脑、账号与数字安全", "entries": [{"n": 1, "title": "用一个密码管理器，把\"重复密码\"这个习惯删掉", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "浏览器自带和手机系统自带的多免费，独立软件有免费额度；实际花的是十分钟设置时间。", "说人话": "账号被盗最常见的路径不是被\"破解\"，而是你在 A 网站的密码在 A 网站泄露了，攻击者拿它去挨个试 B、C、D 网站。你记不住五十个不同的密码，但工具能记住。做法是设一个足够长的主密码，剩下所有网站的密码全部交给密码管理器生成和填充，你只需要记住这一个。", "收益": "把\"每个网站独立随机密码\"从一件靠记性的事变成一件靠工具的事。撞库之所以有效，前提就是大量用户在多个网站重复使用同一个密码；密码管理器的核心价值就是消除这种复用。", "证据等级": "C", "来源": "账号防护通行做法，无全国统一强制文献。", "备注": "主密码由四五个互不相关的词拼成，既长又好记；并且给主密码本身也加上二次验证，别让\"钥匙串\"变成新的单点。"}, "extra": []}, {"n": 2, "title": "账号分三级：邮箱最贵，钱账号次之，普通账号最便宜", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，梳理一次约半小时。", "说人话": "把账号按价值分三级：① 根账号——邮箱（尤其是\"找回密码\"用的那个邮箱）和学信网；② 钱账号——微信支付、支付宝、银行卡、校园卡；③ 普通账号——外卖、购物、论坛、各种 App。规则是：根账号和钱账号用最强防护（独立强密码加二次验证），普通网站一律不许用\"邮箱一键登录\"去接管前两级。", "收益": "\"用邮箱注册、再用邮箱找回密码\"是绝大多数网站的默认机制，所以谁控制了你的邮箱，谁就能接管你其余账号。分级之后，一次低价值网站的泄露只影响一个低价值账号，而不是全线失守。", "证据等级": "B", "来源": "《中华人民共和国个人信息保护法》（2021 年 11 月 1 日起施行）第二条规定自然人的个人信息受法律保护；分级操作方式属通行做法。", "备注": "特别提醒：别拿校园邮箱当\"根账号\"。校园邮箱通常毕业即回收，很多平台的学生身份每年还要重新核验，拿它绑重要账号等于给未来埋雷。"}, "extra": []}, {"n": 3, "title": "二次验证优先用\"验证器 App\"或硬件密钥，短信是备选", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱；硬件密钥几十到一百多元。", "说人话": "二次验证（也叫多因素认证）就是\"密码之外再加一道锁\"。形式有三种：短信验证码、验证器 App 生成的动态码、硬件密钥，安全性由低到高。短信验证码可能被拦截、被\"补卡\"顶掉；验证器 App 生成的码不经过短信，更安全。凡能开二次验证的（邮箱、微信、支付、教务系统），都开。", "收益": "多因素认证被列为账号防护的第一优先措施，原因是它把\"知道密码\"和\"持有设备\"拆成两把钥匙，攻击者即便拿到密码也进不去。美国国家标准与技术研究院《数字身份指南》（NIST SP 800-63B）专门规定了多因素认证与验证器、硬件密钥的安全强度分级，其中明确把短信（受限的一次性码）列为安全性最低的一档；美国网络安全和基础设施安全局（CISA）也把\"开启多因素认证\"列在防钓鱼建议的首位。《中华人民共和国网络安全法》第二十一条要求网络运营者采取技术措施保障网络安全。", "证据等级": "A", "来源": "NIST (2017, 更新版). Special Publication 800-63B: Digital Identity Guidelines（多因素认证与验证器分级）；CISA. Phishing Guidance / More than a Password 建议清单；《中华人民共和国网络安全法》第二十一条。", "备注": "设置完成后，务必把\"恢复码/备用码\"抄在纸上或存进离线笔记。恢复码是丢了手机之后唯一的救生艇，别只存在手机里。"}, "extra": []}, {"n": 4, "title": "校园网和统一身份认证账号：不要借给别人用", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "校园网、教务、图书馆的账号都是实名绑定、一人一号。把它借给同学\"登一下\"\"刷点流量\"，一旦对方拿去发帖、下载违规内容甚至从事违法活动，追责的第一顺位是有实名信息的人——也就是你。学校的网络日志一般会留存，事后是能对上人的。", "收益": "《中华人民共和国网络安全法》第二十四条规定，网络运营者为用户办理网络接入、固定电话与移动电话入网，或者提供信息发布、即时通讯等服务时，应当要求用户提供真实身份信息，不提供的不得提供服务。实名之下，账号行为可追溯到个人；同法第二十七条还禁止任何个人从事非法侵入网络、窃取网络数据等危害网络安全的活动。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国网络安全法》第二十四条、第二十七条。<https://www.cac.gov.cn/2016-11/07/c_1119867116_2.htm>", "备注": "代刷网课、代刷流量、代发帖，本质上都是把实名身份交出去。别为几十块钱的好处，把处分风险留给自己。"}, "extra": []}, {"n": 5, "title": "App 索要权限要\"最小必要\"：通讯录、相册、定位逐项关掉", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，二十分钟。", "说人话": "装完一个新 App，先花一分钟看它要了哪些权限：一个修图软件要通讯录、一个手电筒要读短信，都不合理。原则是\"用不到的权限一律关掉\"，尤其这六项：通讯录、短信、通话记录、相册、麦克风、精确位置。需要时临时开，用完再关。", "收益": "《中华人民共和国个人信息保护法》第六条规定，处理个人信息应当具有明确、合理的目的，与处理目的直接相关，并采取对个人权益影响最小的方式；收集个人信息应当限于实现处理目的的最小范围，不得过度收集。这就是\"最小必要\"原则，也是你拒绝不合理权限要求的法律依据。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国个人信息保护法》第六条。", "备注": "很多 App 有\"仅在使用期间允许定位\"\"仅本次允许访问相册\"的选项，优先选这类最小授权；权限关了 App 还能用，说明它本来就不该要。"}, "extra": []}, {"n": 6, "title": "人脸、指纹、身份证号、行踪属于\"敏感个人信息\"：要单独同意", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "有些信息一旦泄露，危害不只是\"被骚扰\"，而是直接威胁人身和财产安全，法律把它们单列为\"敏感个人信息\"：生物识别（人脸、指纹、声纹）、宗教信仰、特定身份、医疗健康、金融账户、行踪轨迹，以及不满十四周岁未成年人的信息。采集这些信息，必须单独取得你的同意，不能混在\"一键同意全部协议\"里。", "收益": "《中华人民共和国个人信息保护法》第二十八条界定敏感个人信息，并要求只有在具有特定目的、充分的必要性并采取严格保护措施时才能处理；第二十九条规定处理敏感个人信息应当取得个人的单独同意，法律法规要求书面同意的从其规定。遇到\"必须上传手持身份证照片或人脸视频\"才能用基础功能，你有权询问用途、范围与保存期限。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国个人信息保护法》第二十八条、第二十九条、第三十条。", "备注": "实务中，\"实名\"通常手机号即可满足；要求\"人证合一\"多出现在开户、大额交易等少数场景，普通 App 的基础功能没有这个必要性。"}, "extra": []}, {"n": 7, "title": "手机丢了：先挂失手机号，再冻结支付，最后改密码", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "顺序错了会扩大损失。正确顺序：① 用别人的手机打运营商客服挂失、停用这张 SIM 卡；② 冻结微信支付、支付宝，或远程下线所有登录设备；③ 用一台可信设备修改邮箱、支付、教务等重要账号的密码；④ 通知家人和常联系的人，防冒充你借钱；⑤ 必要时报警。别用可能已被控制的设备去改密码。", "收益": "手机丢失的主要风险不是\"没了这台机器\"，而是\"验证码被接收\"和\"通讯录被拿去做诈骗\"。手机号一旦挂失，短信验证码这条通道就断了，攻击者拿不到你的第二把钥匙。主流支付平台都支持远程下线设备与账户冻结。", "证据等级": "B", "来源": "《中华人民共和国反电信网络诈骗法》（2022 年 12 月 1 日起施行）关于电话卡与支付账户风险防控的规定；运营商与支付平台的通行安全操作。", "备注": "平时就把运营商客服电话（移动 10086、联通 10010、电信 10000）和微信/支付宝的冻结入口存进云笔记，别等丢了手机才发现查不了。"}, "extra": []}, {"n": 8, "title": "别把\"手机号 + 短信验证码\"当唯一保险：小心补卡攻击", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "攻击者只要伪造身份去运营商\"补办一张同号 SIM 卡\"，你原来的卡就会失效，而所有发给\"你\"的短信验证码都会进到攻击者手里。这就是\"补卡攻击\"，专用来绕过短信二次验证。对策：能用验证器 App 的就不用短信；给运营商账号设服务密码；手机突然无信号且不是欠费，立刻联系运营商确认是否有人补卡。", "收益": "预防补卡攻击的核心是提高身份核验门槛（服务密码、密码保护问题）并减少对短信验证的依赖。运营商的实名登记与\"换补卡需本人核验\"是基础防线。", "证据等级": "B", "来源": "《中华人民共和国反电信网络诈骗法》关于电话卡实名与风险防控的规定；运营商换补卡业务的通行核验流程。", "备注": "这类攻击多发生在\"你的身份证信息已经泄露\"之后，所以把身份证照片往外发要格外克制。"}, "extra": []}, {"n": 9, "title": "公共 Wi-Fi：可以上网，别在上面输支付密码和网银密码", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "商场、车站、奶茶店的免费 Wi-Fi 未必安全，存在被\"钓鱼热点\"仿冒、被同网设备嗅探的风险。用它刷视频可以，但登录网银、输入支付密码、修改重要账号密码时，最好改用手机流量热点。公用电脑同理：不要勾\"记住密码\"，用完记得退出账号并清除记录。", "收益": "《中华人民共和国个人信息保护法》第六条要求处理个人信息\"采取对个人权益影响最小的方式\"；公共网络环境下数据暴露面更大，选更安全的通道本身就是把泄露概率降到最低。支付类操作通常还有设备指纹加二次验证，换陌生设备登录会触发额外核验。", "证据等级": "C", "来源": "公共网络安全使用的通行做法，无全国统一强制文献。", "备注": "判断热点真假的笨办法：直接问店员\"Wi-Fi 的准确名称是什么\"，别连名字相像但从没被告知过的那个。"}, "extra": []}, {"n": 10, "title": "记住 96110：这是公安反诈预警劝阻专线，务必接", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "96110 是全国统一的公安反诈预警劝阻专线。接到这个号码来电，说明系统监测到你或你的家人可能正在被诈骗，接就对了——它的作用是在你转账之前拦住你。配套的还有工信部的涉诈预警短信 12381，以及各地推广的\"国家反诈中心\"App。报警和咨询可拨 110 或到就近派出所。", "收益": "《中华人民共和国反电信网络诈骗法》（2022 年 12 月 1 日起施行）建立了电信网络诈骗的预警劝阻、紧急止付与快速冻结等反制制度，96110 专线与预警短信就是这套机制的落点。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国反电信网络诈骗法》（2022 年 12 月 1 日起施行）；公安部反诈预警宣传。", "备注": "真警察不会让你\"把钱转到安全账户\"。任何自称公检法、要求你转账或提供验证码的，一律是诈骗。"}, "extra": []}, {"n": 11, "title": "已经转了钱：抓住\"紧急止付\"的黄金时间", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "被骗转账后，钱不会立刻消失，而是顺着账户层层分流。时间越短，止付冻结成功的可能性越大。动作是：立刻拨 110 或去最近派出所报案，同时联系开户银行或支付平台申请紧急止付。把转账时间、金额、对方账户、聊天记录、通话录音尽量完整地提供给警方，越具体越好。", "收益": "《中华人民共和国反电信网络诈骗法》确立了紧急止付、快速冻结的制度安排，公安机关可依程序对涉案账户采取止付冻结措施。资金拦截的效果与报案速度强相关，这正是\"第一时间报警\"的现实意义。", "证据等级": "B", "来源": "《中华人民共和国反电信网络诈骗法》关于紧急止付、快速冻结的规定；公安机关反诈办案宣传。", "备注": "不要因为\"觉得丢人\"而拖延或隐瞒。报案越早、信息越全，追回的概率越高；拖延的每一小时都是在给骗子转账的时间。"}, "extra": []}, {"n": 12, "title": "杀猪盘与裸聊敲诈：不转账、不妥协、留证据报警", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，真正的代价是被敲诈的恐惧。", "说人话": "两种针对年轻人的高频诈骗。杀猪盘是\"先谈恋爱再带你投资/博彩\"，前期让你小赚，等你大额投入就跑路；裸聊敲诈是诱导视频后录屏，用不雅影像反复勒索。共同点是：对方只要钱，而且只会越要越多。正确做法是立刻停止转账、截图保存全部记录、报警，不要为\"息事宁人\"继续给钱。", "收益": "这类行为触犯《中华人民共和国刑法》第二百六十六条诈骗罪，以散布隐私相威胁还可能构成敲诈勒索等犯罪，属于可追诉的刑事犯罪。最高人民法院、最高人民检察院、公安部《关于办理电信网络诈骗等刑事案件适用法律若干问题的意见》对电信网络诈骗及其关联犯罪的认定与办理作出了规定，报警是有法可依的处理路径。", "证据等级": "B", "来源": "全国人大常委会《中华人民共和国刑法》第二百六十六条；最高人民法院、最高人民检察院、公安部《关于办理电信网络诈骗等刑事案件适用法律若干问题的意见》。", "备注": "被勒索不丢人，给钱才是往无底洞里填。多数裸聊敲诈团伙跨境作案，第一次给钱几乎必然招来第二次。"}, "extra": []}, {"n": 13, "title": "银行卡、电话卡、微信与支付宝账户：出租、出借、出售都是违法", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。有人会出几百元\"租\"你的卡，那不是收益，是诱饵。", "说人话": "有人说\"借你卡走个流水\"\"帮收一笔钱给你几百块\"，这就是把你变成诈骗链条上的收款工具。一旦这些账户被用于诈骗收付款，你要承担法律责任，还可能被记入信用记录、限制开卡与网上支付。卡丢了要立刻挂失，不用的卡要注销，别随手卖或扔。", "收益": "《中华人民共和国反电信网络诈骗法》第三十一条规定，任何单位和个人不得非法买卖、出租、出借电话卡、物联网卡、电信线路、短信端口、银行账户、支付账户、互联网账号等，不得提供实名核验帮助；第四十四条规定，违反者没收违法所得，由公安机关处违法所得一倍以上十倍以下罚款，没有违法所得或者不足二万元的处二十万元以下罚款，情节严重的并处十五日以下拘留。若明知他人利用信息网络犯罪而提供支付结算帮助，还可能构成《中华人民共和国刑法》第二百八十七条之二帮助信息网络犯罪活动罪，处三年以下有期徒刑或者拘役，并处或者单处罚金。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国反电信网络诈骗法》第三十一条、第四十四条；全国人大常委会《中华人民共和国刑法》第二百八十七条之二。", "备注": "\"断卡行动\"查处的对象里，在校学生是被拉下水最多的人群之一。天上不会掉\"走个流水赚几百\"的好事。"}, "extra": []}, {"n": 14, "title": "木马与勒索软件：别点陌生附件，装正规杀软、及时打补丁", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "正规杀毒软件多有免费版；真正花的是保持更新的习惯。", "说人话": "论文、简历、课程表是钓鱼附件最喜欢伪装的名字。凡是陌生邮件或群文件里要求你\"启用宏\"\"双击打开\"的，先怀疑。加固三件事：装正规来源的杀毒软件并保持开启；操作系统和浏览器及时更新补丁；不在来路不明的网站下载\"破解版\"\"绿色版\"。勒索软件一旦加密文件，通常没有后悔药，唯一指望是备份。", "收益": "恶意软件的主要传播渠道就是盗版软件、钓鱼附件和非官方下载站；保持系统更新能修补已公开的安全漏洞。这是信息安全领域的通行共识，也是\"盗版软件是安全风险\"这一判断的依据。", "证据等级": "C", "来源": "恶意软件防护的通行做法，无全国统一强制文献。", "备注": "电脑突然变慢、弹出不明窗口、杀软被强行关闭，先断网再做全盘查杀，别急着登录网银。"}, "extra": []}, {"n": 15, "title": "备份遵守 3-2-1：三份副本、两种介质、一份异地", "tag": {"money": "低", "time": "中", "will": "是", "gain": "大", "scope": "时间精力"}, "fields": {"成本": "U 盘、移动硬盘或云空间，学生可用学校网盘或免费额度。", "说人话": "硬盘会坏、电脑会丢、系统会崩，都是一句话的事。3-2-1 原则是：保留三份数据副本，用两种不同介质存放（例如本机硬盘加移动硬盘），其中至少一份放在异地（云盘或另一个物理地点）。论文、毕业设计、重要证件扫描件，必须落在这个规则里。", "收益": "多副本加异地这一机制能同时抵御硬件故障、误删、勒索软件加密和物理丢失四类事故，是数据备份领域被广泛采用的行业原则。", "证据等级": "C", "来源": "数据备份 3-2-1 原则，属通行做法，非强制文献。", "备注": "备份的关键不是\"备份了\"，而是\"验证过能恢复\"。每隔一两个月随机打开一个云盘文件，确认它没坏、能下载。"}, "extra": []}, {"n": 16, "title": "论文和作业做版本管理：Git，或者\"日期 + 版本号\"命名", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱；学习成本约半天。", "说人话": "把\"论文终稿.doc\"\"论文终稿-改.doc\"\"论文终稿-真终稿.doc\"这套混乱命名，换成两件事之一：① 用 Git 管理（尤其适合代码和反复修改的文稿，每一步都能回退、能对比）；② 老老实实按\"日期_版本_备注\"命名，例如\"20260410_毕业论文_v3_导师批注版\"。系统的版本管理能让你在\"改坏了\"的时候一键回到昨天。", "收益": "版本控制解决的核心问题是\"可回溯、可对比、可回退\"。对毕业论文和课程项目而言，它既避免\"改错无法还原\"，也是向导师、答辩组证明工作过程的有力佐证。", "证据等级": "C", "来源": "版本管理的通行做法，无全国统一强制文献。", "备注": "如果你担心\"用 AI 代写\"的边界，良好的版本记录反而能证明你的独立写作过程——这是\"透明比隐藏安全\"的具体体现。"}, "extra": []}, {"n": 17, "title": "电脑省心配置：正版系统、自动更新、开防火墙、开磁盘加密", "tag": {"money": "低", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "正版系统多为新机自带，或由学校正版软件平台提供。", "说人话": "四件一次做完、四年省心的事：① 用正版系统（新机自带，或用学校正版软件平台的授权）；② 打开系统和浏览器的自动更新；③ 打开防火墙；④ 打开磁盘/整盘加密（Windows 用 BitLocker，macOS 用 FileVault），这样电脑丢了数据也读不出来。另外设好开机密码和锁屏超时。", "收益": "这四项分别对应\"拒绝盗版木马入口\"\"堵住已公开漏洞\"\"控制网络访问\"\"降低设备丢失后的数据暴露\"。多数高校通过正版化平台向学生提供操作系统与办公软件授权，可免费获取，具体清单以本校信息化中心为准。", "证据等级": "C", "来源": "个人终端安全加固的通行做法；各高校正版软件平台说明。", "备注": "开磁盘加密前务必确认记住了恢复密钥，并抄一份放在别处——否则加密反而可能把你自己锁在门外。"}, "extra": []}, {"n": 18, "title": "二手设备出手前：退出所有账号、彻底擦除数据", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，半小时。", "说人话": "卖掉或送人前，顺序是：① 退出所有云账号（尤其\"查找我的设备\"）并关闭激活锁；② 备份要留的数据；③ 恢复出厂设置/格式化并重装系统。只删照片不格式化是没用的，数据能被恢复软件捡回来。手机平板尤其要退出 Apple ID、华为/小米/OPPO/vivo 账号，否则买家也用不了，交易会扯皮。", "收益": "设备转让后残留的原机主数据（照片、聊天记录、登录状态）是个人信息泄露的常见切口。《中华人民共和国个人信息保护法》第四十七条规定，在处理目的已实现、保存期限届满等情形下，个人信息处理者应当主动删除，个人也有权请求删除；转让设备前彻底清除，正是这一原则的落地。", "证据等级": "B", "来源": "全国人大常委会《中华人民共和国个人信息保护法》第四十七条；设备转卖的通行清除流程。", "备注": "拿不准清没清干净，就再走一遍恢复出厂设置。别把还登着你账号的设备，随手交给陌生人。"}, "extra": []}, {"n": 19, "title": "买二手电脑/手机：验机四步，坚决走平台担保", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱，花时间验。", "说人话": "四步：① 当面交易，不接受\"快递寄出就确认收货\"；② 查序列号（到官网查激活时间、保修状态、有无维修记录、是否在丢失/被盗名单）；③ 现场实测（电池健康与循环次数、屏幕坏点、键盘每个键、摄像头、充电、扬声器、指纹/人脸）；④ 通过平台担保交易支付，不私下微信转账。低于市场价一大截的\"全新未拆\"，基本都有问题。", "收益": "厂商官网通常提供序列号查询，可核验激活状态与是否处于丢失/被盗名单；主流二手平台提供担保交易与验机服务。校园二手骗局的典型特征正是\"加微信、私下转账、急催确认\"。", "证据等级": "C", "来源": "二手数码交易的通行验机流程，属通行做法。", "备注": "交易前后都截图保留聊天记录和商品链接。出问题时，这些是唯一的凭证。"}, "extra": []}, {"n": 20, "title": "知网和图书馆数据库：合法使用，批量下载会封 IP 甚至侵权", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "校内使用通常免费。", "说人话": "学校买的数据库是授权给在校师生在\"教学科研\"范围内使用的，不是给你批量下载倒卖的。用下载器一次性抓几百篇，学校出口 IP 可能被数据库商封禁，全校跟着遭殃，学校还可能被索赔。正常用法是按主题检索、逐篇下载、需要多少下多少；文献管理软件（Zotero、EndNote）用来整理和引用，不是用来批量囤积。", "收益": "数据库的授权协议通常明确限定使用范围与并发数量，超范围批量下载属于违约，还可能触及《中华人民共和国著作权法》关于未经许可复制、传播作品的限制。各校图书馆一般会专门在使用指南中写明禁止使用下载工具批量下载。", "证据等级": "B", "来源": "《中华人民共和国著作权法》（2020 年修正）；各高校图书馆数据库使用指南与授权协议。", "备注": "被认定恶意下载的，轻则个人账号被停、学校 IP 被封，重则被追究责任。别为了\"存一份以后看\"，把自己和全校用户一起搭进去。"}, "extra": []}, {"n": 21, "title": "用 AI 写作业的边界：能用什么、不能用什么、要标注", "tag": {"money": "低", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "工具费每月几十元，很多有免费额度。", "说人话": "可以用 AI 做：解释概念、梳理思路、检查语法、生成练习题、润色表达、帮你查漏。不能拿它做：把生成内容当自己的原创提交（尤其课程明确禁止时）、编造数据或参考文献、代写论文正文、用于考试。另外两件事要留心：一是别把未公开的研究数据、他人隐私上传给 AI；二是 AI 会\"一本正经地胡说\"，它给的每个事实、法条、数字都必须自己核实。", "收益": "《中华人民共和国学位法》第三十七条把\"代写、剽窃、伪造\"列为可不授予或撤销学位的情形；《普通高等学校学生管理规定》要求学校记录学生在学业、学术、品行方面的诚信信息。多所高校已出台生成式人工智能使用规范，普遍要求\"允许使用但须标注使用范围\"。安全做法是：用了就注明用在哪一步。", "证据等级": "B", "来源": "全国人大常委会《中华人民共和国学位法》第三十七条；教育部《普通高等学校学生管理规定》（教育部令第 41 号）学术诚信相关条款；各高校生成式人工智能使用规范。", "备注": "把 AI 当\"随叫随到的助教\"，而不是\"代笔枪手\"。它对错误同样自信，核查这件事还是得你自己做。"}, "extra": []}, {"n": 22, "title": "论文代写：花几千元，买一个随时可能被撤销的学位", "tag": {"money": "高", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "几千到上万元，真正的代价是学位。", "说人话": "2025 年 1 月 1 日起施行的《中华人民共和国学位法》把\"代写\"明确写进可以不授予或撤销学位的情形。也就是说，代写不再是\"违反校规\"这么简单，而是法律层面直接指向撤销学位。学位论文有检测手段和举报渠道，撤销不因\"已经毕业\"而失效。", "收益": "《中华人民共和国学位法》第三十七条规定：学位申请人、学位获得者在攻读该学位过程中，学位论文或者实践成果被认定存在代写、剽窃、伪造等学术不端行为，或者盗用、冒用他人身份、以其他非法手段取得入学资格、毕业证书，或者存在依法不应当授予学位的其他严重违法行为的，经学位评定委员会决议，学位授予单位不授予学位或者撤销学位。《学位条例》同时废止。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国学位法》第三十七条（2025 年 1 月 1 日起施行）。<https://www.moe.gov.cn/jyb_sjzl/sjzl_zcfg/zcfg_jyfl/202404/t20240426_1127804.html>", "备注": "撤销学位的记录会长期跟着你，影响考公、考编、职称、出国。为省几周押上一辈子，这笔账怎么算都不划算。"}, "extra": []}, {"n": 23, "title": "用未经批准的渠道访问境外网络：可能招来行政处罚", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "看似不花钱，代价可能是警告、罚款与纪律处分。", "说人话": "在我国，接入国际网络必须走国家批准的国际出入口信道，自行搭建或购买使用未经批准的跨境代理，属于违规行为，可被责令停止、警告、罚款；在校园网里做这类操作，还会同时违反校规，面临处分。查文献要用学校图书馆订阅的数据库和文献传递，不要为了\"随便看看\"把自己的账号和学籍搭进去。", "收益": "《中华人民共和国计算机信息网络国际联网管理暂行规定》明确，计算机信息网络直接进行国际联网，必须使用国家公用电信网提供的国际出入口信道，任何单位和个人不得自行建立或者使用其他信道进行国际联网；违反的，由公安机关责令停止联网、给予警告，可以并处罚款，有违法所得的没收违法所得。", "证据等级": "A", "来源": "国务院《中华人民共和国计算机信息网络国际联网管理暂行规定》第六条、第十四条；各高校校园网使用管理规定。", "备注": "学术上需要境外文献时，优先用图书馆的数据库、文献传递与馆际互借服务，这是合法且通常免费的路径。"}, "extra": []}, {"n": 24, "title": "身份证复印件和证件照：加水印、限用途、别乱发", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "把身份证正反面照片、手持身份证照片、银行卡照片直接发给\"兼职客服\"\"助学金客服\"，是个人信息泄露的高危动作。必须提供时做三件事：① 给图片加文字水印，写明\"仅供办理 XX 业务使用，他用无效\"，让水印压住证件关键信息；② 用照片编辑工具标注用途和日期；③ 上传到有权限控制的链接，别用\"提取码随便写\"的公开分享。", "收益": "身份证号、人脸、手持证件照属于《中华人民共和国个人信息保护法》第二十八条所列的敏感个人信息，一旦泄露，容易被用于冒名开户、贷款、注册账号。《中华人民共和国刑法》第二百五十三条之一规定，违反国家有关规定向他人出售或者提供公民个人信息，情节严重的处三年以下有期徒刑或者拘役，并处或者单处罚金；情节特别严重的处三年以上七年以下有期徒刑，并处罚金。", "证据等级": "B", "来源": "全国人大常委会《中华人民共和国个人信息保护法》第二十八条；全国人大常委会《中华人民共和国刑法》第二百五十三条之一。", "备注": "判断标准很简单：对方是不是真的需要这张证件？正规机构办业务会说明用途，含糊其辞、急催你发照片的，基本可以直接拒绝。"}, "extra": []}, {"n": 25, "title": "打印店和公共电脑：文件会残留在机器里", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "打印店老板的电脑、机房公用电脑、宿舍楼下的自助打印终端，都可能残留你的文件——本地硬盘上的副本、打印队列里的临时文件，以及登录过的微信、网盘账号。对策：优先用 U 盘现场打印，打完拔走并检查有没有留在对方电脑上；在公共电脑上不要勾\"记住密码\"，用完主动退出账号、清除浏览记录和下载文件。", "收益": "简历、论文、身份证扫描件本身就是个人信息集合，残留文件是身份信息被批量收集的常见来源。《中华人民共和国个人信息保护法》第四十七条赋予个人在保存期限届满、处理目的已实现等情形下请求删除个人信息的权利；对他人设备上残留的你的信息，你当然有权要求删除。", "证据等级": "C", "来源": "《中华人民共和国个人信息保护法》第四十七条；公共设备使用的通行做法。", "备注": "打印\"简历 + 证书 + 身份证\"这类材料时，尽量自己用手机在线下单上传，或直接用 U 盘，减少在公用电脑上登录账号。"}, "extra": []}]}, {"file": "17-升学分岔口.md", "title": "17. 升学分岔口：保研、考研、留学、考公、就业怎么选", "entries": [{"n": 1, "title": "先把几条路摆在一张表上，别先问\"哪条好\"", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，一张纸、一小时。", "说人话": "先做一张四列的表，每行一条路（保研、考研、留学、考公、就业、基层项目）：要花几年、要花多少钱、门槛是什么（绩点、外语、考试、关系）、走完能去哪。填完这张表，\"别人都在考研\"这种焦虑会自动变成一道算术题。你会发现，很多纠结不是\"选不出来\"，而是\"信息不全\"。", "收益": "把选择拆成\"时间、金钱、门槛、出路\"四个维度，是升学与职业规划中通行的比较框架；它的作用是把\"感觉选不出来\"转成\"用四项可核对的条件去比较\"，减少因信息不全造成的决策偏差。", "证据等级": "C", "来源": "升学与职业选择的比较方法，属通行做法。", "备注": "这张表建议保留一整年，每学期更新一次。你会看到自己的判断是怎么被新信息修正的。"}, "extra": []}, {"n": 2, "title": "保研（推免）：门槛通常就三条，但每条都很硬", "tag": {"money": "0", "time": "多", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，花的是前几学期的成绩和准备材料的时间。", "说人话": "推免（推荐免试）不看一次考试，看你前几年的累计排名。门槛通常写得很直白：① 专业成绩排名（常见在前 20% 到 30%，各校不同）；② 外语（常见六级 425 分以上，或托福 85、雅思 6.0 以上）；③ 无违纪、无学术不端。这三条里任何一条不合格，后面的夏令营、复试都没有意义。", "收益": "推免工作依据教育部《全国普通高等学校推荐优秀应届本科毕业生免试攻读硕士学位研究生工作管理办法（试行）》（教学〔2006〕14 号）及后续招生管理规定执行。各招生单位的接收办法会对成绩排名、外语水平、无考试作弊与学术不端记录等提出明确条件，接收推免生的数量一般不超过本单位全日制硕士研究生招生计划的一定比例。", "证据等级": "A", "来源": "教育部《全国普通高等学校推荐优秀应届本科毕业生免试攻读硕士学位研究生工作管理办法（试行）》（教学〔2006〕14 号）；各招生单位当年接收推免生办法。<https://yz.chsi.com.cn/>", "备注": "想走这条路，大一第一学期就要开始算排名，而不是大三。排名不是\"考好一次\"，是\"每次都不掉队\"。"}, "extra": []}, {"n": 3, "title": "推免的时间线：夏令营、预推免、9 月底系统填报", "tag": {"money": "低", "time": "多", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "报名费与差旅费（部分线下夏令营需自费往返）。", "说人话": "传统节奏是\"6—7 月夏令营、9 月预推免、9 月底全国推免系统填报\"。近年夏令营普遍缩水，有的改成\"参观营/校园开放日\"不再直接选拔，表述也从\"优先接收为推免生\"变成\"优先进入推免复试名单\"。所以别把全部希望押在一个夏令营上，预推免和\"拿到本校推免资格\"同样关键。", "收益": "全国推免服务系统一般于每年 9 月底至 10 月开通，考生在系统内填报志愿、接收并确认复试与待录取通知；一名考生最终只能接受一个招生单位的待录取通知。招生单位一般按学业成绩、科研潜质与复试表现综合排序录取，复试在总成绩中通常占相当权重。", "证据等级": "B", "来源": "中国研究生招生信息网推免服务系统说明 <https://yz.chsi.com.cn/>；各高校接收推免生办法。", "备注": "把\"优秀营员\"理解成\"优先进入复试名单\"，不等于录取。拿到本校推免资格，才是真正的入场券。"}, "extra": []}, {"n": 4, "title": "推免系统里两条硬规则：只能接受一个待录取、确认后难反悔", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "推免系统里有两条必须记住的规则：① 一个人最终只能接受一个学校的\"待录取\"通知；② 一旦确认接受，通常不能随意撤销，想反悔只能联系招生单位按流程处理。所以\"先占个坑再说\"不是策略——占坑容易，退出很难，还可能影响诚信记录。", "收益": "全国推免服务系统的志愿与待录取机制，决定了\"多手准备\"必须在确认环节之前完成；招生单位对推免生的录取以系统内流程为准，放弃已确认的待录取可能触发招生单位的处理程序。", "证据等级": "B", "来源": "中国研究生招生信息网推免服务系统使用说明 <https://yz.chsi.com.cn/>；各招生单位推免生接收办法。", "备注": "确认之前想清楚：这个学校、这个专业，你愿不愿意真的去。系统不是草稿箱，别拿它试手。"}, "extra": []}, {"n": 5, "title": "考研：2026 年报名 343 万，时间线要背下来", "tag": {"money": "低", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "报名费一两百元，加上一年左右备考时间。", "说人话": "2026 年全国硕士研究生招生考试报名人数为 343 万，初试一般在 12 月下旬举行，初试成绩多在次年 2 月中下旬公布，国家复试分数线一般在次年 3 月公布，复试与调剂随后展开。也就是说，从大三下学期开始准备到录取结束，大约一年半。把这几个时间点记进日历，比背一百条经验贴管用。", "收益": "2026 年考研报名人数为 343 万，较前几年有所回落，被多方解读为升学选择趋于理性。初试由国家统一组织，复试由招生单位自行组织；招生单位在国家线基础上划定本单位复试分数线并公布复试名单。", "证据等级": "A", "来源": "教育部、中国研究生招生信息网公布的 2026 年全国硕士研究生招生考试报名数据。<https://yz.chsi.com.cn/>", "备注": "报名人数下降不等于难度下降。热门院校和热门专业的报录比依然很高，\"总人数\"和\"你要考的那个专业\"是两件事。"}, "extra": []}, {"n": 6, "title": "考研报名条件与学硕/专硕的区别：先对招生简章，再谈复习", "tag": {"money": "0", "time": "中", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，查资料一两天。", "说人话": "报考的基本条件是\"国家承认学历的应届本科毕业生，或已毕业的本科/同等学力人员\"。多数专业对本科专业不设硬性限制，但部分专业（如临床医学、法律硕士等）有报考限制，必须看当年招生简章。学术学位（学硕）偏理论、通常学制 3 年；专业学位（专硕）偏实践、学制常为 2 至 3 年，不少专业学费更高、可能不提供宿舍。", "收益": "报考条件、考试科目、参考书目、学制与学费，均以招生单位当年发布的招生简章和专业目录为准；学硕与专硕在培养目标、学制、学费、住宿安排、读博路径上存在差异，选择前应对着简章逐项核对。", "证据等级": "B", "来源": "教育部《全国硕士研究生招生工作管理规定》；各招生单位当年招生简章与专业目录。<https://yz.chsi.com.cn/>", "备注": "一个常见误区：以为\"专硕一定比学硕好考\"。热门专硕的分数线与竞争烈度可能高于同校学硕，别想当然。"}, "extra": []}, {"n": 7, "title": "考研的账：把\"二战\"的机会成本算进去", "tag": {"money": "中", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "备考一年；如果二战，再加一年，还叠加\"应届生身份\"流失与生活费支出。", "说人话": "把考研算成一道题：成功概率 × 上岸后的收益 + 失败概率 ×（二战的一年时间 + 生活费 + 错过秋招的机会成本）。很多人的算法里漏掉了后半项。更稳的做法是\"一手准备初试、一手抓住秋招\"——初试在 12 月，秋招在 9 至 11 月，时间上有重叠也有空档，可以投一部分。", "收益": "考研失败后，\"应届毕业生\"身份的价值与秋招窗口是真实的机会成本，而应届生身份在公务员、选调生、部分国企岗位的报考资格中具有作用。因此并行准备的价值在于把\"全有或全无\"改成\"有保底\"。", "证据等级": "B", "来源": "教育部关于高校毕业生就业创业工作的相关通知中对应届毕业生身份的界定；国家公务员局及各省招考公告对应届生身份的界定。<https://scs.gov.cn/>", "备注": "二战不是不行，但要在预算里写清\"第二年由谁出钱、住哪、心态怎么保\"。想清楚再决定，比闷头再来一年更负责任。"}, "extra": []}, {"n": 8, "title": "调剂：初试过线后的第二次机会", "tag": {"money": "低", "time": "中", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，花的是盯信息的精力。", "说人话": "初试过国家线但没进一志愿复试，或复试被刷，还可以走调剂。调剂在\"中国研究生招生信息网\"的调剂服务系统上操作，基本规则是：专业相同或相近、初试科目相同或相近，且满足调入专业的报考条件。调剂是\"有窗口期、先到先得、信息差极大\"的过程，提前关注目标院校的调剂公告非常关键。", "收益": "调剂服务系统一般于每年 3 至 4 月开放，考生填报调剂志愿、招生单位审核并发出复试通知，复试通过后在系统内确认待录取，同样遵循\"接受一个待录取\"的规则。", "证据等级": "B", "来源": "中国研究生招生信息网调剂服务系统说明 <https://yz.chsi.com.cn/>；各招生单位调剂公告。", "备注": "调剂拼的不只是分数，是信息与反应速度。分数出来后第一时间列目标院校清单，比等通知更主动。"}, "extra": []}, {"n": 9, "title": "留学第一步：先到涉外监管信息网查院校名单", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "选校之前，先确认\"这所学校回国认不认\"。两步：① 到教育部教育涉外监管信息网（jsj.moe.gov.cn）查该国的院校名单，看你要申请的学校是否在列；② 想清楚回国后是否需要办理国（境）外学历学位认证。学校不在名单、或就读项目不被认可的，学历回国可能无法认证，那几年时间和钱就白花了。", "收益": "教育部教育涉外监管信息网向社会公布主要留学目的国的学校名单，供留学人员查询核验；教育部留学服务中心负责国（境）外学历学位认证。选校前核对名单，是避免\"野鸡大学\"风险最直接的动作。", "证据等级": "A", "来源": "教育部教育涉外监管信息网。<https://jsj.moe.gov.cn/>", "备注": "\"学校在名单里\"只是必要条件，不等于回国一定能认证；就读方式（全日制、远程、中外合作）也影响认证结果，务必按留服中心要求核实。"}, "extra": []}, {"n": 10, "title": "留服认证：把境外学历变成国内认的凭证", "tag": {"money": "低", "time": "中", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "认证需缴纳认证费。", "说人话": "回国后，把境外学历变成国内能用（考公、考编、落户、进国企）的凭证，靠的是教育部留学服务中心的\"国（境）外学历学位认证\"。它是在线申请、提交材料、缴费后出具认证结果。很多国内单位只认这份认证，不认国外那张毕业证原件本身。毕业前就要弄清楚材料清单，别等要用时才发现缺东西。", "收益": "教育部留学服务中心（cscse.edu.cn）为留学回国人员提供国（境）外学历学位认证服务，认证结果是国内用人单位、落户、考公等环节核验境外学历的重要依据。具体申请材料、流程与时限以留服中心公布为准。", "证据等级": "A", "来源": "教育部留学服务中心国（境）外学历学位认证服务。<https://www.cscse.edu.cn/>", "备注": "认证通常需要学历证书、成绩单、护照与签证记录、出入境记录等材料。在校期间就把这些原件和电子版归好档，能省掉毕业时的一大堆麻烦。"}, "extra": []}, {"n": 11, "title": "留学的成本账与语言成绩有效期", "tag": {"money": "高", "time": "多", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "学费加生活费，从每年十几万到几十万元不等；申请费、语言考试费、签证费另计。", "说人话": "留学是这几条路里花钱最多的一条，必须算\"总账\"：学费 + 生活费 + 保险 + 机票 + 申请费 + 语言考试费 + 签证费，再乘上学制年限。同时注意两点：雅思、托福成绩一般有 2 年有效期，别考太早；资金证明通常要求存款提前几个月\"在账上躺够时间\"，临时凑钱可能过不了签证审核。", "收益": "语言考试成绩的有效期通常为自考试之日起 2 年（以考试机构规定为准），过期需重考；多数留学目的国在签证阶段会要求提供资金证明，并核对资金的存期与来源。这些属于申请国签证与院校录取规则的通行要求。", "证据等级": "B", "来源": "雅思、托福考试机构关于成绩有效期的规定；主要留学目的国签证资金证明要求（各国不同）。", "备注": "地区差异。各国学费、生活费、打工政策、毕业后工签政策差别很大，一定要以目标国官方最新规定为准。"}, "extra": []}, {"n": 12, "title": "\"全日制在读是身份的根\"：留学和升学期间别断学籍", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "一句实操提醒：只要你还在\"全日制在读\"状态，学籍就在，学生身份、应届生身份、学生票、学生保险、部分考试资格也都在。这句话的意思是——如果你打算边工作边读、中途休学去创业、或者\"先 gap 一年\"，先搞清楚这么做会不会让你失去在读/应届身份。身份一旦断了，很多向应届生开放的门就关了。", "收益": "应届毕业生身份的界定通常以是否\"落实工作单位\"、是否处于择业期为核心，在读学生保留学籍期间一般仍具备学生身份；休学、退学、转非全日制等会改变身份状态。具体界定以教育部门规定和当年招考公告为准。", "证据等级": "C", "来源": "应届毕业生身份的通行界定，属实操提醒（各地与各招考公告口径不一）。", "备注": "这一条和\"要不要 gap 一年\"\"要不要休学创业\"直接相关。做决定前先问清楚：这一步会不会让你失去在读者身份。"}, "extra": []}, {"n": 13, "title": "考公与选调生：应届生身份是这张门票的有效期", "tag": {"money": "低", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "报名费几十元，备考几个月到一年。", "说人话": "公务员考试分国考（中央机关及其直属机构）和省考（地方）。国考一般每年 10 月发布公告并报名，11 月至 12 月笔试；省考多在次年春季，部分省份参加联考。选调生一般面向应届优秀毕业生，门槛包括党员、学生干部经历、成绩等，录取后多安排到基层锻炼。这些考试都对应届毕业生有专门岗位或倾斜——身份越\"新鲜\"，能报的岗位越多。", "收益": "国家公务员局统一组织中央机关及其直属机构考试录用公务员，职位表中部分职位限\"应届毕业生\"报考；选调生一般由省级党委组织部门面向应届优秀毕业生招录。按现行做法，毕业两年内未落实工作单位的可保留应届毕业生身份（具体以当年招考公告为准）。", "证据等级": "B", "来源": "国家公务员局及各省公务员考试公告 <https://scs.gov.cn/>；各地选调生招录公告。", "备注": "地区差异。应届生身份与择业期的具体口径各省不同，报名前一定逐字看目标省份当年的招考公告。"}, "extra": []}, {"n": 14, "title": "事业单位与基层项目：三支一扶、西部计划、特岗教师", "tag": {"money": "0", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，服务期通常 1 至 3 年，花的是时间。", "说人话": "除了考进编制，还有几条\"先到基层、再谋发展\"的路：① 三支一扶（支教、支农、支医、帮扶乡村振兴，服务期通常 2 年）；② 大学生志愿服务西部计划（服务期 1 至 3 年）；③ 特岗教师（面向农村义务教育阶段学校，服务期 3 年）。这些项目多数有服务期满后的优惠政策，比如考公定向岗位、考研加分、学费补偿代偿。", "收益": "三支一扶由人力资源社会保障部门组织实施，大学生志愿服务西部计划由共青团中央、教育部等组织实施，特岗教师计划由教育部、财政部实施。服务期满考核合格的人员，按规定可享受报考公务员定向岗位、考研加分或免试推荐等政策，具体以当年文件为准。", "证据等级": "A", "来源": "人力资源和社会保障部 <https://www.mohrss.gov.cn/>；教育部关于特岗教师计划与大学生志愿服务西部计划的相关文件。", "备注": "报名前看清两件事：服务地点与期限、期满后的政策是否写进正式文件。口头承诺不算数。"}, "extra": []}, {"n": 15, "title": "基层就业学费补偿：本专科每年最高 2 万、研究生 2.5 万", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，但要在规定地区和岗位干满年限。", "说人话": "到中西部地区、艰苦边远地区和基层单位就业，符合条件的可以申请学费补偿或国家助学贷款代偿。按现行标准，本专科生每年最高 2 万元、研究生每年最高 2.5 万元。这等于把你在校期间交的学费、办的贷款\"补回来一部分\"。关键卡在\"定向、在岗、年限\"三个条件上，必须在规定的地方和岗位上干满足够年限。", "收益": "基层就业学费补偿、国家助学贷款代偿的标准，与服兵役学生学费补偿代偿标准同步（参见财政部、教育部等《关于调整完善国家助学贷款有关政策的通知》，财教〔2024〕188 号）：本专科每年最高 2 万元、研究生每年最高 2.5 万元。能否申请以就业地、单位性质、服务年限等条件为准。", "证据等级": "A", "来源": "财政部、教育部、中国人民银行、金融监管总局《关于调整完善国家助学贷款有关政策的通知》（财教〔2024〕188 号）；全国学生资助管理中心政策介绍 <https://www.xszz.edu.cn/>。", "备注": "地区差异。哪些地区、哪些单位、干满几年才能申请，各省文件不同；和用人单位签协议前，先把补偿资格问清楚并写进书面约定。"}, "extra": []}, {"n": 16, "title": "教师资格与教师编：先考证，再看编制", "tag": {"money": "低", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "考试费、认定体检费等几百元；备考数月。", "说人话": "想当老师要分两步看：① 教师资格证——中小学教师资格考试（笔试 + 面试）+ 普通话水平测试 + 认定；② 教师编制——由地方教育、人事部门统一公开招聘，有的岗位要求师范类、有的要求专业对口。有证不等于有编，编制要单独考，且不少地区对\"应届\"有倾斜。", "收益": "中小学教师资格考试由教育部教育考试院组织，分为笔试和面试，笔试单科成绩有 2 年有效期，教师资格考试合格证明有效期为 3 年（以官方规定为准）；教师招聘（入编）由各地组织，条件与名额以当地招聘公告为准。", "证据等级": "B", "来源": "教育部教育考试院中小学教师资格考试说明；各地教师招聘公告。", "备注": "笔试成绩和合格证明都有有效期。别想着\"慢慢来\"，卡在有效期上重考的人很多。"}, "extra": []}, {"n": 17, "title": "军队文职：另一条稳定但门槛明确的路", "tag": {"money": "低", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "报名费与备考时间。", "说人话": "军队面向社会公开招考文职人员，也是高校毕业生的一条稳定出路。一般有统一的报名、笔试、面试、体检、政治考核流程，专业目录覆盖较广。它的特点是稳定、待遇透明，但对政治条件、体检标准、服从分配的要求较严。符合条件的话，值得把它列进备选项。", "收益": "军队文职人员招考通过军队人才网统一组织，报考条件、岗位计划、考试安排以当年招考公告为准；文职人员在待遇、社会保险、晋升等方面按军队有关规定执行。", "证据等级": "B", "来源": "军队人才网军队文职人员公开招考公告。", "备注": "体检与政治考核是硬门槛。报考前对照标准自查一遍，别走到最后一步再被卡。"}, "extra": []}, {"n": 18, "title": "直接就业：秋招在毕业前一年的 9 至 11 月，不是毕业那年", "tag": {"money": "低", "time": "多", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，花的是准备简历和面试的时间。", "说人话": "校园招聘有固定节奏：暑期实习（大三下）→ 秋季校园招聘（毕业前一年的 9 至 11 月，岗位最多）→ 春季招聘（次年 3 至 4 月，多为补录）。所以\"大四开学第一件事就是投简历\"，而不是\"等课程轻松了再说\"。等你反应过来，秋招最好的窗口已经关了。", "收益": "秋招岗位数量通常多于春招，很多企业的管培生、技术岗只在秋招开放；实习转正是应届生进入企业的主要路径之一。这是校园招聘领域的通行节奏。", "证据等级": "C", "来源": "校园招聘时间安排属通行做法。", "备注": "大三暑期没有实习，秋招会很被动。有条件的话，大二暑期就开始找一段相关经历。"}, "extra": []}, {"n": 19, "title": "简历和面试：只有三件事能改写结果", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，花一个月打磨。", "说人话": "简历筛选用不了 30 秒，能改变结果的就三件事：① 有没有一件具体的、能讲十分钟的经历（实习、项目、竞赛、社团操盘过的事）；② 有没有用数字说话（\"把流程从 5 步减到 3 步\"\"覆盖 12 家门店的数据\"\"转化率从 3% 提到 6%\"）；③ 能不能把这件事清楚讲出来。这三件事都能在一个学期内补上。", "收益": "招聘中的评估普遍关注\"具体成果 + 可迁移技能 + 岗位匹配\"，常用 STAR 结构（情境、任务、行动、结果）来考察；笼统的自我评价（\"认真负责、学习能力强\"）几乎没有区分度。这是招聘实践的通行标准。", "证据等级": "C", "来源": "招聘与面试评估的通行做法。", "备注": "写完简历找个不认识你的人看 30 秒，然后问\"你记住了什么\"。如果对方记不住任何一条，回去改。"}, "extra": []}, {"n": 20, "title": "校园招聘\"三严禁\"：明确禁止\"第一学历\"等歧视", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "校园招聘有明确的\"三严禁\"：严禁发布含有限定 985、211 高校等字样的招聘信息；严禁发布违反国家规定的性别、户籍、学历等歧视性条款；严禁发布虚假和欺诈性就业信息。也就是说，\"仅限 985/211\"\"限本地户籍\"\"不要专升本\"这类写法，本身就是违规的。遇到明确的学历歧视、性别歧视，可以向学校就业部门或人力资源社会保障部门反映。", "收益": "教育部在做好毕业生就业创业工作的相关通知中要求严格落实校园招聘\"三严禁\"，明确不得发布含有限定 985、211 高校等字样、违反国家规定的性别、户籍、学历等歧视性条款，以及虚假和欺诈性就业信息。这为举报招聘歧视提供了政策依据。", "证据等级": "A", "来源": "教育部关于做好全国普通高校毕业生就业创业工作的通知（校园招聘\"三严禁\"要求）。<https://www.moe.gov.cn/>", "备注": "现实中\"隐形门槛\"确实存在。这条的意义不是\"消灭门槛\"，而是当你被明显违规的条件挡在门外时，你知道这不是你的问题，也有地方可以说。"}, "extra": []}, {"n": 21, "title": "四条路能并行到什么程度：说清哪一条是主", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，花的是精力分配。", "说人话": "常见的可行并行：\"保研 + 秋招\"（保研结果 9 月底出，正好赶上秋招）、\"考研 + 秋招\"（12 月初试，秋招 9 至 11 月，能投一部分）、\"留学 + 秋招\"。不可行的是\"考研 + 保研 + 留学 + 考公\"全上——那不是策略，是拖延决定。原则是：一条主线占七成精力，一条备线占三成。", "收益": "保研（9 至 10 月确定）、考研（12 月初试）、留学（前一年 10 月至当年 3 月申请）、国考（10 至 12 月）在时间上确有重叠与互补窗口，因此\"主 + 备\"的并行是可行的；而多线全押会导致每条线都达不到门槛。", "证据等级": "C", "来源": "各路径时间线的对比汇总，属通行做法。", "备注": "并行不是\"不专注\"，是给自己留退路。真正要避免的是\"哪条都没认真开始\"。"}, "extra": []}, {"n": 22, "title": "考研和考公同时准备：两场都重，冲突也重", "tag": {"money": "0", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，但两边都要长时间投入。", "说人话": "考研和考公都吃时间和专注度，重合度高（都要长期系统复习），难度也都不低，同时准备的风险是\"两边都差一点\"。如果一定要两手抓，建议错开时间：先集中备考国考/省考，利用考完到考研初试之间的空档转考研，或者反过来。更常见的合理搭配是\"考研 + 秋招\"或\"考公 + 秋招\"。", "收益": "国考笔试（11 至 12 月）与考研初试（12 月）时间接近甚至重叠，两个大型考试的复习内容与节奏差异大，同时冲两场会显著摊薄每场的投入；相比之下，考试与找工作的冲突更容易通过时间管理化解。", "证据等级": "B", "来源": "国家公务员局及各省公务员考试公告 <https://scs.gov.cn/>；教育部硕士研究生招生考试安排 <https://yz.chsi.com.cn/>。", "备注": "如果家里要求\"必须考上公务员\"，而你更想读研，先把这笔账摊开来讲。选择要自己做，但信息要摆到桌面上。"}, "extra": []}, {"n": 23, "title": "家庭期待与\"沉没成本\"：别让已经花掉的时间替你做决定", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "两条要分清：① 父母的期待是真实约束，要听、要讨论，但填志愿、选路的是你，未来几年也是你在过；② \"沉没成本\"不该进入决策——\"我都准备考研一年了\"不能成为\"必须继续考\"的理由，一年时间已经花掉，真正要问的是\"从现在起，哪条路更值得走\"。", "收益": "决策理论中的通行原则是，沉没成本（已发生、不可收回的投入）不应影响未来决策；职业规划领域同样主张以\"未来的边际收益与边际成本\"来比较选项，而不是以\"已经投入了多少\"来决定是否坚持。", "证据等级": "C", "来源": "决策与职业规划通行原则，属通行做法。", "备注": "真正该和家人谈的不是\"选哪条路\"，而是\"如果这条走不通，我们的备选和底线是什么\"。把底线说清楚，压力会小很多。"}, "extra": []}, {"n": 24, "title": "用\"退出成本\"做决策：先给每条路写下退路", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，半小时。", "说人话": "选路时最有用的口径不是\"哪条更厉害\"，而是\"这条路的退出成本有多高\"。给每条路先写下三个答案：① 走到一半发现不适合，要付出什么才能退出？② 退出后还能不能回到别的路上？③ 最坏结果是什么，我能不能接受？退出成本低、还能保留再选择能力的路，就是更稳的路。", "收益": "以\"保留选择权\"为核心的决策框架，本质是把\"不可逆程度\"纳入成本核算：退出成本越低、越能保留后续选择的方案，风险越小。这也是本节使用\"选择权\"作为回报口径的原因。", "证据等级": "C", "来源": "以选择权为核心的决策方法，属通行做法。", "备注": "这条不花钱、不花时间，却决定后面五年的方向，是本节性价比最高的一条。"}, "extra": []}]}, {"file": "18-毕业前后.md", "title": "18. 毕业前后：论文、档案、三方、劳动合同与社保", "entries": [{"n": 1, "title": "毕业学分和学位条件，大四上学期最后核查一次", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱，半小时。", "说人话": "大四上学期就把学分核对表打出来，逐项对培养方案：总学分够不够、每一类（必修/限选/任选/实践）够不够、有没有挂科未过、体质测试是否达标。这时候发现问题还有一学期能补；拖到毕业审核再发现，就只剩延期一条路。", "收益": "《中华人民共和国学位法》第十九条规定，接受本科教育，通过规定的课程考核或者修满相应学分，通过毕业论文或者毕业设计等毕业环节审查，达到相应水平的，授予学士学位。教育部《高等学校体育工作基本标准》规定，学生毕业时体质测试成绩达不到 50 分者按结业处理（因病或残疾经申请核准者可准予毕业）。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国学位法》第十九条（2025 年 1 月 1 日起施行）；教育部《高等学校体育工作基本标准》。<https://www.moe.gov.cn/srcsite/A17/moe_938/s3273/201406/t20140612_171180.html>", "备注": "体测这条每年都有人栽。毕业前最后一次体测务必参加，有伤病就走免测或缓测流程，别缺席。"}, "extra": []}, {"n": 2, "title": "毕业论文的流程：开题、中期、查重、答辩，一个都别跳", "tag": {"money": "低", "time": "多", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "查重可能收费（多数学校给免费次数），打印装订几十元。", "说人话": "本科毕业论文一般要走：选题与开题报告 → 中期检查 → 初稿 → 查重 → 修改 → 答辩 → 定稿归档。每一步都有截止日期，任何一步卡住都可能\"赶不上答辩\"从而延期。开题之后就按周跟导师对齐进度，别攒到最后一个月再突击。", "收益": "各高校对本科毕业论文（设计）普遍设立开题、中期检查、学术不端检测（查重）与答辩等环节并规定时间节点；《中华人民共和国学位法》第二十四条规定，申请学士学位的由学位评定委员会组织审查并作出是否授予的决定。答辩环节与学术不端检测结果，直接关系能否按期毕业。", "证据等级": "B", "来源": "各高校本科毕业论文（设计）管理办法；全国人大常委会《中华人民共和国学位法》第二十四条。", "备注": "不少学校有\"盲审/外审\"环节，送审稿要隐去姓名和导师信息。别自己把名字留在页眉、致谢或文件属性里。"}, "extra": []}, {"n": 3, "title": "盲审和答辩没过，还有两条法定救济通道", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "论文可能被\"盲审\"（送校外专家匿名评审），也可能只做校内答辩。盲审没过，通常有一次修改重送的机会；答辩没过，处理方式要看学校规定。关键是：《中华人民共和国学位法》专门给了两条救济通道——对\"专家评阅、答辩、成果认定\"等学术评价结论有异议，可以申请学术复核；对不受理学位申请、不授予学位、撤销学位等决定不服，可以申请学位复核。", "收益": "《中华人民共和国学位法》第四十条规定，学位申请人对专家评阅、答辩、成果认定等过程中相关学术组织或者人员作出的学术评价结论有异议的，可以向学位授予单位申请学术复核，学位授予单位应当自受理之日起三十日内重新组织专家复核并作出复核决定，该复核决定为最终决定；第四十一条规定，对不受理学位申请、不授予学位或者撤销学位等行为不服的，可以向学位授予单位申请复核，或者请求有关机关依法处理。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国学位法》第四十条、第四十一条。<https://www.moe.gov.cn/jyb_sjzl/sjzl_zcfg/zcfg_jyfl/202404/t20240426_1127804.html>", "备注": "注意时限。学术复核的\"三十日\"是自受理之日起算的硬规定，程序问题别拖。"}, "extra": []}, {"n": 4, "title": "学术不端与代写：吊销的不是\"这次成绩\"，是学位", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，花的是自律。", "说人话": "查重只是最表面的检测。抄、代写、伪造数据、篡改实验记录，都属于学术不端，后果不是\"这次论文不算\"，而是可能撤销学位。2025 年 1 月 1 日起施行的《中华人民共和国学位法》把\"代写、剽窃、伪造\"明确写进可撤销学位的情形。已经毕业的人，如果事后被认定在读期间存在这些行为，学位同样可能被撤销。", "收益": "《中华人民共和国学位法》第三十七条规定：学位申请人、学位获得者在攻读该学位过程中，学位论文或者实践成果被认定存在代写、剽窃、伪造等学术不端行为，或者盗用、冒用他人身份、以其他非法手段取得入学资格、毕业证书，或者存在依法不应当授予学位的其他严重违法行为的，经学位评定委员会决议，学位授予单位不授予学位或者撤销学位。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国学位法》第三十七条。<https://www.moe.gov.cn/jyb_sjzl/sjzl_zcfg/zcfg_jyfl/202404/t20240426_1127804.html>", "备注": "所谓\"降重\"应落在\"用自己的话重述并加上自己的分析\"上，而不是换几个同义词——后者既没降风险，也把论文改坏了。"}, "extra": []}, {"n": 5, "title": "毕业去向登记：报到证已经取消，现在办的是这个", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，填一次表。", "说人话": "2023 年起，国家取消《全国普通高等学校毕业生就业报到证》，不再发放，也不再把它作为招聘录用、落户、档案转递的必需材料。取而代之的是\"毕业去向登记\"：无论你是就业、升学、出国、入伍、创业还是暂未就业，都要在学校系统里登记去向信息和档案转递信息——这是学校给你办离校手续的必要环节，不办会卡住毕业流程。", "收益": "中共中央组织部等五部门 2023 年通知明确：自 2023 年起不再发放《全国普通高等学校本专科毕业生就业报到证》和《全国毕业研究生就业报到证》，取消报到证补办、改派手续；教育部门建立高校毕业生毕业去向登记制度，作为高校为毕业生办理离校手续的必要环节；毕业生可通过全国高校毕业生毕业去向登记系统查询离校时的毕业去向信息。", "证据等级": "A", "来源": "中共中央组织部、人力资源社会保障部、教育部、公安部、国务院国资委 2023 年《关于做好取消普通高等学校毕业生就业报到证有关衔接工作的通知》。<https://www.mohrss.gov.cn/SYrlzyhshbzb/jiuye/zcwj/202305/t20230512_499929.html>", "备注": "别再向外单位要\"报到证\"了，这东西已经没有了。办入职用劳动合同或就业协议书，加学历证书。"}, "extra": []}, {"n": 6, "title": "档案去哪：三种去向，严禁个人自带和保管", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "档案里装着高考材料、成绩单、体检表、奖惩记录、党团材料，考公政审、职称评定、算工龄、退休都会用到。毕业时它有三个去向：① 去机关、国企、事业单位的，转到单位；② 去私企、外企、灵活就业、自主创业的，转到就业地或户籍地的公共就业人才服务机构；③ 暂未就业的，按本人意愿转到户籍地公共就业人才服务机构，或按规定在学校保留两年。核心红线是：严禁个人自带和保管档案。", "收益": "按现行规定，高校毕业生档案由高校归集后按规定有序转递，\"严禁个人自带和保管\"。到机关、国有企事业单位就业或定向招生就业的，转递至就业单位或定向单位；到非公单位就业、灵活就业及自主创业的，转递至就业创业地或户籍地公共就业人才服务机构；暂未就业的，可根据本人意愿转递至户籍地公共就业人才服务机构，或按规定在高校保留两年。", "证据等级": "A", "来源": "中共中央组织部等五部门 2023 年《关于做好取消普通高等学校毕业生就业报到证有关衔接工作的通知》（档案转递衔接）。<https://www.mohrss.gov.cn/SYrlzyhshbzb/jiuye/zcwj/202305/t20230512_499929.html>", "备注": "判断档案在哪的标准动作，是问学校档案馆或学生工作部：\"我毕业时的档案转递单寄到哪个单位、快递单号多少？\"毕业后第一年主动确认一次，比十年后着急找便宜得多。"}, "extra": []}, {"n": 7, "title": "户口迁移：可以迁到就业地，也可以迁回原籍", "tag": {"money": "低", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "户口迁移证工本费很低。", "说人话": "毕业时户口有两个去向：迁往就业创业地，或者迁回入学前的户籍所在地。超大城市按现行落户规定执行。需要落户的，一般凭劳动合同或就业协议书加学历证书办理。要留意的坑是：户口落在学校集体户是有时间上限的（各校不一），\"毕业了但户口忘了迁\"会变成麻烦事。", "收益": "五部门 2023 年通知明确，高校毕业生户籍可以迁往就业创业地（超大城市按现行规定执行），也可以迁往入学前户籍所在地；迁入地公安机关要根据毕业生就业情况、本人意愿和迁入地落户政策要求，办理户口迁移手续。", "证据等级": "C", "来源": "中共中央组织部等五部门 2023 年通知（户口迁移衔接）；各地公安机关户籍办理指南。", "备注": "地区差异。迁回原籍的时限和所需材料各地不同，提前打电话问户籍所在地派出所，别等集体户被清理了才想起来。"}, "extra": []}, {"n": 8, "title": "应届生身份与择业期：两年窗口，别用得太随便", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "\"应届毕业生\"不是一个固定身份，而是一个和时间、就业状态挂钩的窗口。很多岗位（公务员、事业单位、国企、选调）专门面向应届生或对它倾斜。按现行做法，毕业两年内未落实工作单位的，通常可按应届生对待。这意味着：第一份工作签得太随便，可能提前把这个身份用掉。", "收益": "按现行做法，高校毕业生在一定期限（通常为两年）内未落实工作单位的，可保留应届毕业生身份（具体以当年招考公告口径为准）；暂未就业毕业生的档案可按规定在高校保留两年。是否\"落实工作单位\"通常以社保缴纳、劳动合同签订等为依据。", "证据等级": "B", "来源": "中共中央组织部等五部门 2023 年通知（档案保留两年）；国家公务员局及各省招考公告对应届生身份的界定 <https://scs.gov.cn/>。", "备注": "地区差异。各省对\"应届生\"\"择业期\"的口径不一样，有的看社保、有的看档案。签工作前，查一遍你目标岗位的要求。"}, "extra": []}, {"n": 9, "title": "三方协议和劳动合同不是一回事，签之前看清违约金", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "三方协议（就业协议书）是你、学校、用人单位三方签的就业意向协议，本质是民事合同，通常带违约金条款；劳动合同是你和用人单位之间确立劳动关系的法律文件，受《中华人民共和国劳动合同法》保护。区别是：三方约束的是\"去不去上班\"，劳动合同约束的是\"上班之后的权利义务\"。签三方前看清违约金；入职后一个月内必须签劳动合同。", "收益": "《中华人民共和国劳动合同法》第十条规定，建立劳动关系应当订立书面劳动合同；已建立劳动关系未同时订立的，应当自用工之日起一个月内订立。三方协议作为民事合同，其违约金条款对签约方有约束力；网签后想毁约，应走正规解约流程（由用人单位出具解约函），而非直接不去报到。", "证据等级": "B", "来源": "全国人大常委会《中华人民共和国劳动合同法》第十条；中共中央组织部等五部门 2023 年通知（就业协议书可用于办理报到入职）。", "备注": "违约金常见约定为一个月工资或固定金额，一定看你手里那份协议怎么写的。签约前问清三件事：违约金多少、什么算违约、解约流程是什么。"}, "extra": []}, {"n": 10, "title": "实习协议：在校生实习也要签书面文件", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "实习和正式工作不一样，在校生实习一般不构成劳动关系，但依然要签书面文件（实习协议），写清楚：实习内容、时长、报酬、是否包食宿、发生意外的责任划分。尤其\"实习期间受伤怎么办\"这一条，很多实习协议含糊处理，真出事时维权很难。别嫌麻烦，白纸黑字比口头承诺可靠。", "收益": "实习生与实习单位之间的法律关系通常按民事关系而非劳动关系处理，权利义务以实习协议约定为准；部分高校要求实习前签署三方实习协议或购买实习责任保险。约定越具体，发生纠纷时越好处理。", "证据等级": "C", "来源": "在校生实习的通行做法（各地与各校实习管理规定不同）。", "备注": "警惕\"付费实习\"\"实习内推收费\"——正规单位的实习不会向你收费。遇到要先交钱的，基本可以直接排除。"}, "extra": []}, {"n": 11, "title": "试用期与书面合同：法律给了上限，也给了双倍工资的兜底", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "试用期不是\"随便试\"，法律给了上限：劳动合同期限三个月以上不满一年的，试用期不得超过一个月；一年以上不满三年的，不得超过二个月；三年以上固定期限和无固定期限的，不得超过六个月；同一用人单位与同一劳动者只能约定一次试用期。试用期工资不得低于本单位相同岗位最低档工资或劳动合同约定工资的 80%，且不得低于当地最低工资标准。另外，用人单位自用工之日起一个月内必须与你签书面劳动合同。", "收益": "《中华人民共和国劳动合同法》第十九条规定试用期的上限与\"只能约定一次\"；第二十条规定试用期工资不得低于本单位相同岗位最低档工资或者劳动合同约定工资的百分之八十，并不得低于用人单位所在地的最低工资标准；第十条、第八十二条规定，用人单位自用工之日起超过一个月不满一年未与劳动者订立书面劳动合同的，应当向劳动者每月支付二倍的工资。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国劳动合同法》第十条、第十九条、第二十条、第八十二条。", "备注": "\"先干着，转正再签合同\"是最常见的坑。没合同、没社保，一旦发生工伤或欠薪，你连\"我在这上过班\"都难以证明。"}, "extra": []}, {"n": 12, "title": "劳动合同该看哪几项：工资、工时、地点、违约金、竞业限制", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，读半小时。", "说人话": "签合同重点看六项：① 工资（数额、发放时间、构成）；② 工时与休假；③ 工作地点（写\"全国\"\"随公司安排\"的要警惕）；④ 社保；⑤ 违约金条款；⑥ 竞业限制条款。法律对违约金有严格限制：除了\"服务期\"和\"竞业限制\"两种情形，用人单位不得约定由你承担违约金。也就是说，\"提前离职罚三万\"这种条款，很可能无效。", "收益": "《中华人民共和国劳动合同法》第十七条规定劳动合同应当具备用人单位信息、劳动者信息、合同期限、工作内容与地点、工时与休假、劳动报酬、社会保险、劳动保护等必备条款；第二十二条规定服务期违约金不得超过用人单位提供的培训费用；第二十五条规定除服务期和竞业限制两种情形外，用人单位不得与劳动者约定由劳动者承担违约金。", "证据等级": "B", "来源": "全国人大常委会《中华人民共和国劳动合同法》第十七条、第二十二条、第二十五条。", "备注": "签之前把合同拍照留底。公司只让你签、不给你留存合同文本，本身就不规范。"}, "extra": []}, {"n": 13, "title": "竞业限制：期限不超两年，且必须按月给补偿", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "竞业限制是\"离职后一段时间内，不去竞争对手那里上班\"的约定。它不适用于所有人——只限于高级管理人员、高级技术人员和其他负有保密义务的人员。而且它有对价：约定竞业限制的，用人单位应在竞业限制期限内按月给你经济补偿；期限最长不得超过二年。只让你承担义务、不给补偿的竞业条款，是站不住脚的。", "收益": "《中华人民共和国劳动合同法》第二十三条规定，对负有保密义务的劳动者，用人单位可以在劳动合同或保密协议中约定竞业限制条款，并约定在解除或终止劳动合同后，在竞业限制期限内按月给予劳动者经济补偿；第二十四条规定竞业限制人员限于高级管理人员、高级技术人员和其他负有保密义务的人员，竞业限制期限不得超过二年。", "证据等级": "B", "来源": "全国人大常委会《中华人民共和国劳动合同法》第二十三条、第二十四条。", "备注": "刚毕业的普通岗位通常不涉及竞业限制。如果 HR 让你签，先问清楚：期限多长、每月补偿多少、范围包括哪些公司。"}, "extra": []}, {"n": 14, "title": "试用期被辞退：先问理由，别急着签\"自愿离职\"", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "试用期被辞退，不是\"公司说了算\"。合法辞退只有几种情形：你在试用期被证明不符合录用条件、严重违反规章制度、严重失职等（过失性辞退），或者你患病、不能胜任工作等（需提前三十日通知或额外支付一个月工资）。如果公司既没有合法理由、又不给补偿，那就是违法解除，你可以要求继续履行合同，或要求支付赔偿金（通常是经济补偿标准的两倍）。", "收益": "《中华人民共和国劳动合同法》第三十九条规定了用人单位可以解除劳动合同的过失性情形；第四十条规定了需提前三十日书面通知或额外支付一个月工资的情形；第四十七条规定经济补偿按劳动者在本单位工作年限，每满一年支付一个月工资；第八十七条规定，用人单位违反本法规定解除或终止劳动合同的，应当依照第四十七条经济补偿标准的二倍向劳动者支付赔偿金。", "证据等级": "B", "来源": "全国人大常委会《中华人民共和国劳动合同法》第三十九条、第四十条、第四十七条、第八十七条。", "备注": "一旦签了\"自愿离职\"，性质就从\"公司解除\"变成\"你主动走\"，补偿和赔偿金基本就没了。先问理由，要书面通知。"}, "extra": []}, {"n": 15, "title": "劳动仲裁时效一年：维权要趁早", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "劳动仲裁不收费。", "说人话": "和公司有劳动争议（欠薪、违法辞退、不缴社保），走的是\"劳动仲裁前置\"——要先申请劳动仲裁，不服裁决再起诉。关键时限是：申请仲裁的时效期间为一年，从你知道或者应当知道权利被侵害之日起算。拖过一年，理由再充分也可能要不回来。劳动关系存续期间因拖欠报酬有争议的，不受一年限制，但劳动关系终止的，应当自终止之日起一年内提出。", "收益": "《中华人民共和国劳动争议调解仲裁法》第二十七条规定，劳动争议申请仲裁的时效期间为一年，自当事人知道或者应当知道其权利被侵害之日起计算；时效因主张权利、请求救济或对方同意履行义务而中断，因不可抗力等正当理由而中止。劳动关系存续期间因拖欠劳动报酬发生争议的，申请仲裁不受一年时效限制；劳动关系终止的，应当自终止之日起一年内提出。", "证据等级": "B", "来源": "全国人大常委会《中华人民共和国劳动争议调解仲裁法》第二十七条。", "备注": "证据比情绪重要。入职通知、劳动合同、工资流水、考勤记录、工作群聊天、辞退通知，平时就存好，别等到翻脸才找。"}, "extra": []}, {"n": 16, "title": "五险一金：从入职就缴，别接受\"转正后再补\"", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不需额外花钱，个人部分从工资代扣。", "说人话": "\"五险\"是养老保险、医疗保险、失业保险、工伤保险、生育保险；\"一金\"是住房公积金。要点：① 单位必须依法为你缴纳，费用由单位和个人按比例分担，个人部分从工资里代扣；② 从入职起就应开始缴，别接受\"转正后再补缴\"的说法；③ 社保是\"连续缴纳\"才有用的东西——断缴会影响医保待遇、购房资格、落户，甚至将来养老金。", "收益": "《中华人民共和国社会保险法》规定，用人单位应当依法为职工办理社会保险登记并缴纳社会保险费，职工应当参加基本养老保险、基本医疗保险等，由用人单位和职工共同缴纳；住房公积金的缴存依《住房公积金管理条例》执行。社保缴费记录可在国家社会保险公共服务平台或各地人社 App 查询。", "证据等级": "B", "来源": "《中华人民共和国社会保险法》；《住房公积金管理条例》；各地社保与公积金经办规定。", "备注": "地区差异。各险种缴费比例、基数上下限、公积金比例由地方规定，差别较大，以就业地当年政策为准。"}, "extra": []}, {"n": 17, "title": "工资到手怎么算：起征点 5000 元，别忘了填专项附加扣除", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "offer 上的\"月薪\"不是到手金额。到手 = 应发工资 − 个人缴纳的五险一金 − 个人所得税。个税的基本减除费用是每月 5000 元（全年 6 万元）；在此基础上还可以享受\"专项附加扣除\"，能扣的项目越多，交的税越少：子女教育、继续教育、大病医疗、住房贷款利息、住房租金、赡养老人、3 岁以下婴幼儿照护，共七项。刚毕业的常见可扣项是\"住房租金\"和\"赡养老人\"。", "收益": "按现行个税法，居民个人综合所得的基本减除费用为每年 6 万元（每月 5000 元）；专项附加扣除包括子女教育、继续教育、大病医疗、住房贷款利息、住房租金、赡养老人、3 岁以下婴幼儿照护七项。其中住房租金按城市分为每月 1500 元、1100 元、800 元三档；赡养老人独生子女每月 3000 元，非独生子女分摊且每人不超过 1500 元。专项附加扣除在\"个人所得税\"App 填报，由单位按月预扣。", "证据等级": "C", "来源": "《中华人民共和国个人所得税法》；国务院《个人所得税专项附加扣除暂行办法》（国发〔2018〕41 号）；国家税务总局办税指引。", "备注": "入职后第一件事，就是在\"个人所得税\"App 里填报专项附加扣除，别让本该少交的税白白交掉。填错了，第二年汇算清缴可以更正。"}, "extra": []}, {"n": 18, "title": "公积金与买房资格：别轻易断缴", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "住房公积金是\"你和单位各出一部分、都进你账户\"的钱，买房、租房、还贷时可以按当地规则提取。它的隐藏价值在\"连续缴存\"：很多城市把公积金、社保的连续缴存月数作为购房资格、贷款额度甚至落户的门槛。所以刚工作时，哪怕工资不高，也别轻易断缴，更别为了多拿一点现金和公司约定\"不缴公积金\"。", "收益": "住房公积金的缴存、提取、贷款按《住房公积金管理条例》与各城市公积金管理规定执行；多数城市对公积金贷款额度与缴存余额、缴存年限挂钩，购房资格也与社保、个税的连续缴纳年限绑定。", "证据等级": "C", "来源": "《住房公积金管理条例》；各城市公积金与购房资格管理规定。", "备注": "地区差异极大。同样一份工作在不同城市\"值多少钱\"，很大一部分差别就在购房、落户、公积金额度这些规则上。"}, "extra": []}, {"n": 19, "title": "社保缴纳基数与应届生落户：都是地方政策", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "社保缴费基数通常按你上一年度的月平均工资确定，有上下限。对刚毕业的人来说，要留意两件事：① 有些公司按最低基数给你缴（而不是按实际工资），短期到手多一点，长期养老金、公积金、贷款额度都吃亏；② 一些城市的应届生落户、人才引进，会要求\"社保连续缴纳 N 个月\"\"缴费基数达到某档\"。落户政策是地方定的，差异很大。", "收益": "社保缴费基数按职工本人上年度月平均工资核定，并设上下限（以当地公布为准）；各地应届毕业生落户、人才引进政策通常与社保连续缴纳月数、缴费基数、学历、年龄等条件挂钩。", "证据等级": "C", "来源": "各地人力资源和社会保障部门关于社会保险缴费基数与毕业生落户的规定。", "备注": "地区差异。落户是典型的\"一城一策\"。打定主意去哪发展，就去该市人社局官网查当年的应届生落户条件。"}, "extra": []}, {"n": 20, "title": "毕业生租房避坑：押金、二房东、中介费", "tag": {"money": "高", "time": "中", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "押金通常押一付三或押一付一，是一笔不小的流动资金。", "说人话": "第一次租房，三条最容易被坑：① 押金——写清楚押几付几、什么情况扣押金、退租时多久退；② 二房东——如果你不是跟产权人签，一定要看到产权人同意转租的书面证明，否则大房东一解除合同，你就得搬走；③ 中介费——通过中介成交的，按约定付报酬，但\"看房费\"\"信息费\"这类名目要警惕。签合同前核对房产证和房东身份证，把水电燃气物业费谁承担写清楚。", "收益": "《中华人民共和国民法典》第七百一十六条规定，承租人经出租人同意可以将租赁物转租给第三人，未经出租人同意转租的，出租人可以解除合同；第七百二十五条规定\"买卖不破租赁\"，租赁物在承租人占有期限内所有权发生变动不影响租赁合同效力；第九百六十四条规定中介人未促成合同成立的不得请求支付报酬。这些条款是租房纠纷中最直接的依据。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国民法典》第七百一十六条、第七百二十五条、第九百六十三条、第九百六十四条。", "备注": "入住前给房间和家电拍照、记录水电表底数，退租时这是要回押金的关键证据。房东口头承诺的\"随时可退\"，一律写进合同。"}, "extra": []}, {"n": 21, "title": "离职的体面做法：交接、离职证明、社保转移", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "离职不是\"不来了\"。规范做法是：① 正式员工提前三十日以书面形式通知单位，试用期内提前三日通知；② 做好工作交接，留下交接清单；③ 离职时要求单位出具解除或终止劳动合同的证明（离职证明），并在十五日内办理档案和社会保险关系转移手续。离职证明是你下一份工作入职要用的东西，也是社保接续的凭证，一定要拿到。", "收益": "《中华人民共和国劳动合同法》第三十七条规定，劳动者提前三十日以书面形式通知用人单位可以解除劳动合同，试用期内提前三日通知；第五十条规定，用人单位应当在解除或者终止劳动合同时出具解除或者终止劳动合同的证明，并在十五日内为劳动者办理档案和社会保险关系转移手续。", "证据等级": "B", "来源": "全国人大常委会《中华人民共和国劳动合同法》第三十七条、第五十条。", "备注": "别把离职搞成吵架。行业圈子比你想的小，交接干净、说明清楚、拿到离职证明，比\"出一口气\"重要得多。"}, "extra": []}, {"n": 22, "title": "第一份工作怎么选：成长速度常常比起薪重要", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，花的是想清楚的时间。", "说人话": "第一份工作别只比月薪，比四样：① 成长速度（有没有人带你、能不能接触完整业务）；② 平台与行业（这份经历三年后还值不值钱）；③ 城市与落户、社保（影响你能不能在这座城留下来）；④ 起薪与生活成本。起薪差一两千，通常一两轮涨薪就抹平了；而\"三年后你的简历上能写什么\"，差距会越拉越大。", "收益": "职业发展领域普遍认为，早期职业阶段的技能与经验积累速度，对长期收入的贡献大于起薪差异；同时，城市、行业与岗位的可迁移性决定后续跳槽的议价空间。把这几项与起薪放进同一张表里比较，比只看工资数更理性。", "证据等级": "C", "来源": "职业发展与薪酬研究的通行观点，属通行做法。", "备注": "一个实用判断法：问自己\"如果两年后我要跳槽，这份经历能帮我讲出什么故事\"。讲不出故事的岗位，要谨慎。"}, "extra": []}, {"n": 23, "title": "入职前的背景调查与材料清单：提前准备，别造假", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "入职前用人单位通常要做背景调查、要一堆材料。常见清单：身份证、学历学位证书、学信网《教育部学历证书电子注册备案表》与学位在线验证报告、成绩单、离职证明（社招）、体检报告、银行卡（发工资用）、照片、社保与公积金信息。部分岗位（金融、国企、公务员）还会政审。提前把这些准备好、扫描存档，入职当天就不会手忙脚乱。", "收益": "用人单位核验学历学位普遍通过学信网进行，《教育部学历证书电子注册备案表》与学位在线验证报告可在学信网在线申请下载。背景调查通常核查学历、工作经历、有无竞业限制与违法记录；简历造假一旦被查出，可能构成入职欺诈，用人单位可据此解除劳动合同。", "证据等级": "C", "来源": "中国高等教育学生信息网（学信网）服务说明 <https://www.chsi.com.cn/>；用人单位入职材料的通行要求。", "备注": "别在简历上虚构学历或工作经历。用人单位核查渠道成熟，且《中华人民共和国劳动合同法》第二十六条规定，以欺诈手段订立的劳动合同无效。"}, "extra": []}, {"n": 24, "title": "离校清单：图书馆、宿舍、退卡、退费、退票", "tag": {"money": "低", "time": "少", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "离校前把这几件事办完：还清图书馆借书（没还往往扣毕业证）、宿舍验收退宿（核对设施、拿回押金）、注销或退掉校园卡余额、处理火车票学生优惠区间、结清学费住宿费、打印并留存成绩单和各类证明。这些事都有截止日期，拖到最后一天一定办不完。", "收益": "多数高校实行离校手续清单制，未完成会影响毕业证书发放或档案转递；宿舍退宿通常需要验收单；校园卡余额一般可退或转出。成绩单、学位证明等材料毕业后再办理往往更麻烦，离校前一次性打印盖章最省事。", "证据等级": "C", "来源": "各高校毕业离校手续办理规定，属通行做法。", "备注": "退宿舍前把房间和设施拍照留证；离校时把成绩单（中英文各几份）、毕业证学位证的扫描件一起存进云盘。"}, "extra": []}]}, {"file": "19-反面清单.md", "title": "19. 反面清单：看起来有用其实没用的东西", "entries": [{"n": 1, "title": "用\"熬夜刷手机\"当放松", "tag": {"money": "0", "time": "多", "will": "否", "gain": "小", "scope": "时间精力"}, "fields": {"成本": "看起来零成本，实际按小时计息的是第二天的注意力和当晚的睡眠。", "说人话": "刷手机之所以被当成放松，是因为它门槛最低——躺下就能开始。但被动刷屏（一直往下滑、看别人的生活）恢复精力的效果，比散步、运动、和人聊天、正念呼吸差得多，还挤掉了本该用来睡觉的时间，结果第二天更累，晚上更想刷，形成闭环。放松不等于\"不动脑子地持续接收信息\"。", "收益": "多项研究观察到被动使用社交媒体与主观幸福感下降、孤独感上升相关；主动型休闲（运动、面对面社交、户外活动）对情绪恢复更有效。", "证据等级": "B", "来源": "Kross E, et al. (2013). Facebook Use Predicts Declines in Subjective Well-Being in Young Adults. PLoS ONE 8(8): e69841；Hunt MG, et al. (2018). No More FOMO: Limiting Social Media Decreases Loneliness and Depression. Journal of Social and Clinical Psychology 37(10): 751-768.", "备注": "受益人是自己。替代方案：把\"躺床上刷\"换成\"下楼走 20 分钟\"，两者花的钱一样多。"}, "extra": []}, {"n": 2, "title": "把\"意志力会用完，所以别指望自律\"当借口", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，代价是继续停在原地。", "说人话": "\"意志力像电池会用完\"这个说法（心理学里叫\"自我损耗\"）在近年的重复实验中并没有被稳定复现，所以拿它当\"我今天就是没自制力，算了\"的理由并不成立。更可靠的结论是：别把环境问题当成意志力问题。把手机挪出首屏、给任务固定一个地点、把目标写成\"几点做什么\"的具体动作，这些都不需要毅力，却比硬扛有效。", "收益": "自我损耗效应的大规模预注册重复实验未能稳定重现原始效应量，学界对其稳健性存在实质争议；而改变环境线索与默认选项对行为的影响，证据相对稳定。", "证据等级": "B", "来源": "Hagger MS, et al. (2016). A Multilab Preregistered Replication of the Ego-Depletion Effect. Perspectives on Psychological Science 11(4): 546-573.", "备注": "受益人是自己。判断标准：如果一条\"心理学结论\"正好和你现在的懒一致，先查它有没有被重复验证过。"}, "extra": []}, {"n": 3, "title": "期末周通宵复习", "tag": {"money": "0", "time": "多", "will": "是", "gain": "小", "scope": "成绩"}, "fields": {"成本": "一晚睡眠，加考试当天的效率。", "说人话": "通宵复习是用\"最需要清醒的那一天\"去换\"前一晚多背的一点内容\"。睡眠对记忆巩固有明确作用，缺觉会损害注意力、工作记忆和信息提取——这三样恰好是考场最吃紧的能力。更划算的做法是把同样的内容摊到考前三天，每天固定时段过一遍，而不是最后一晚连轴转。", "收益": "睡眠剥夺对注意力、工作记忆与认知表现有可测量的负面影响；睡眠参与记忆的巩固过程。", "证据等级": "B", "来源": "Pilcher JJ, Huffcutt AI (1996). Effects of Sleep Deprivation on Performance: A Meta-Analytic Review. Sleep 19(4): 318-326；Walker MP, Stickgold R (2006). Sleep, Memory, and Plasticity. Annual Review of Psychology 57: 139-166.", "备注": "受益人是自己。真熬到了，第二天别靠咖啡硬撑，考试间隙补 20 分钟短觉比继续刷手机更能恢复。"}, "extra": []}, {"n": 4, "title": "逃早八，觉得\"反正能看回放、能抄笔记\"", "tag": {"money": "0", "time": "少", "will": "否", "gain": "小", "scope": "成绩"}, "fields": {"成本": "省下一小时睡眠，赔上整门课的跟进。", "说人话": "出勤和成绩的相关性，在多项元分析里是大学阶段最强的单一预测因素之一——关键不是\"点名分\"，而是缺课会让你错过老师临场强调的重点、作业口径和考点范围的调整。早八课往往还是高数、大物、专业基础这类\"后面全靠它\"的课。逃一次不会出事，逃成习惯就会。", "收益": "课堂出勤率与课程成绩之间存在稳定的正相关；在多项研究中，出勤对成绩的解释力高于标准化考试分数等常见预测指标。", "证据等级": "B", "来源": "Credé M, Roch SG, Kieszczynka UM (2010). Class Attendance in College: A Meta-Analytic Review of the Relationship of Class Attendance With Grades and Student Characteristics. Review of Educational Research 80(2): 272-295.", "备注": "受益人是自己。如果早八确实起不来，就把它当作息问题处理（前一晚断网、把闹钟放远），而不是当\"这门课可以放弃\"处理。"}, "extra": []}, {"n": 5, "title": "找人代写、抄袭、买论文、买竞赛挂名", "tag": {"money": "高", "time": "少", "will": "否", "gain": "小", "scope": "选择权"}, "fields": {"成本": "几百到几万元，外加可能被撤销学位的风险。", "说人话": "这四样本质是同一件事——把别人的成果签上自己的名字。《中华人民共和国学位法》（2025 年 1 月 1 日施行）把代写、剽窃、伪造列为可以不授予或撤销学位的情形；求职时的背景调查也会核验实习与竞赛经历。你买到的是一时的省事，押上的是已经到手的学位。", "收益": "《学位法》第三十七条规定：学位申请人在攻读学位期间存在代写、剽窃、伪造等学术不端行为的，经学位评定委员会决议，学位授予单位不授予学位或者撤销学位。", "证据等级": "A", "来源": "全国人大常委会 (2024). 中华人民共和国学位法（第三十七条）。<https://www.moe.gov.cn/jyb_sjzl/sjzl_zcfg/zcfg_jyfl/202404/t20240426_1127804.html>", "备注": "受益人是自己。校内层面另有《高等学校预防与处理学术不端行为办法》（教育部令第 40 号）与各校学生手册：作弊该课成绩记无效，并视情节给予纪律处分。"}, "extra": []}, {"n": 6, "title": "兼职刷单、\"跑分\"、\"帮人走账\"", "tag": {"money": "中", "time": "多", "will": "否", "gain": "小", "scope": "选择权"}, "fields": {"成本": "看似日结几百，代价可能是刑事责任。", "说人话": "刷单（假交易刷好评）、跑分（帮人转账洗钱）、走账（用你的账户过一遍钱）这三类\"兼职\"，几乎都是电信网络诈骗链条的一环——你提供的银行卡、收款码会被用来收骗来的钱。哪怕你只是\"帮忙转个账、拿点提成\"，也可能构成帮助信息网络犯罪活动罪。所谓\"先垫付本金、完成任务返佣金\"，最后被套住的往往就是找兼职的人。", "收益": "《刑法》第二百八十七条之二规定，明知他人利用信息网络实施犯罪，为其提供支付结算等帮助，情节严重的，构成帮助信息网络犯罪活动罪。任何要求先垫钱、再承诺高额返利的兼职都符合诈骗结构。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国刑法》第二百八十七条之二。", "备注": "受益人是自己。记住一句硬话：正规兼职不会让你先掏钱，也不会借用你的账户。"}, "extra": []}, {"n": 7, "title": "帮人代考、替考，或者\"帮考个证\"", "tag": {"money": "中", "time": "少", "will": "否", "gain": "小", "scope": "选择权"}, "fields": {"成本": "一次人情，换一个刑事记录。", "说人话": "\"就帮我考个四级\"\"替我去考个证\"听起来像帮朋友的忙，但在法律规定的国家考试里，替考者和被替考者都要被追究刑责，组织作弊的刑罚更重。而且这类考试普遍有人脸识别与身份核验，出事不是小概率。人情是小事，案底是大事。", "收益": "《刑法》第二百八十四条之一规定：在法律规定的国家考试中，组织作弊的，处三年以下有期徒刑或者拘役，并处或者单处罚金；情节严重的，处三年以上七年以下有期徒刑，并处罚金。代替他人或者让他人代替自己参加该类考试的，处拘役或者管制，并处或者单处罚金。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国刑法》第二百八十四条之一。", "备注": "受益人是自己。真被朋友开口，学会直接拒绝——拒绝一次，比背个案底划算得多。"}, "extra": []}, {"n": 8, "title": "把银行卡、电话卡、收款码出租或\"借\"给别人", "tag": {"money": "中", "time": "少", "will": "否", "gain": "小", "scope": "选择权"}, "fields": {"成本": "几百元\"租金\"，可能换来征信污点或刑事记录。", "说人话": "\"借张卡给我走笔钱，给你两千\"是典型话术。你的实名银行卡、手机卡一旦落到诈骗团伙手里，流水会记在你名下，涉案账户会被冻结，严重的会按帮助信息网络犯罪活动罪处理；被冻结的账户可能在很长时间内影响你办卡、贷款甚至入职。别为了几百块，把自己的\"金融身份\"借出去。", "收益": "《中华人民共和国反电信网络诈骗法》规定，任何单位和个人不得非法买卖、出租、出借电话卡、物联网卡、银行账户、支付账户等；对涉诈异常账户可采取限制或暂停服务措施。", "证据等级": "A", "来源": "全国人大常委会 (2022). 中华人民共和国反电信网络诈骗法（第三十一条等）；全国人大常委会《中华人民共和国刑法》第二百八十七条之二。", "备注": "受益人是自己。如果卡已经借出，尽快挂失，并到银行、派出所说明情况，别继续用同一账户收钱。"}, "extra": []}, {"n": 9, "title": "一口气办一堆信用卡、把非必需品分期", "tag": {"money": "高", "time": "少", "will": "否", "gain": "小", "scope": "金钱"}, "fields": {"成本": "手机、球鞋、游戏充值、旅游的分期月供，加上可能明显高于名义费率的年化成本。", "说人话": "\"月供看起来不贵\"是把一笔大额消费拆成三十份的心理错觉——分期的实际年化成本通常远高于它标出来的\"手续费率\"。更要紧的是：分期会让你在收入还没稳定的年纪，先背上固定的还款义务。而监管明确规定，小额贷款公司不得向在校大学生发放互联网消费贷款。", "收益": "分期付款的真实年化利率通常显著高于名义手续费率；2021 年五部门通知明确小额贷款公司不得向在校大学生发放互联网消费贷款，未经批准不得为大学生提供信贷服务。", "证据等级": "A", "来源": "中国银保监会、中央网信办、公安部、人民银行、市场监管总局 (2021). 关于进一步规范大学生互联网消费贷款监督管理工作的通知。", "备注": "受益人是自己。判断标准：如果一件东西\"必须分期才买得起\"，说明它现在不在你的价格区间里。"}, "extra": []}, {"n": 10, "title": "赌球、抽卡式网络赌博", "tag": {"money": "高", "time": "多", "will": "是", "gain": "小", "scope": "金钱"}, "fields": {"成本": "起步看着是小额，上瘾之后是无底洞。", "说人话": "赌球、时时彩、各种\"竞猜返利\"，本质都是赌博，而且在网络上几乎无法验证公平性——它的设计就是让人在\"差点赢\"里持续投入。除了钱，赌债带来的连锁反应（借同学钱、网贷、向家里要钱、情绪崩溃）才是真正的代价。参与赌博、开设赌场，在我国都属违法犯罪。", "收益": "《刑法》第三百零三条规定，以营利为目的聚众赌博或者以赌博为业的，或开设赌场的，处相应刑罚。赌债属于非法债务，不受法律保护。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国刑法》第三百零三条。", "备
