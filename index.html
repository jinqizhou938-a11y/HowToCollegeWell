<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高性价比大学指南 · 在线检索</title>
<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --line:#e3e3df; --ink:#1d1d1b; --ink2:#4b4b47;
  --muted:#8a8a83; --accent:#2f5d8a; --accent2:#3a7d55; --warn:#a8541f;
  --chip:#eef1f4; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:26px 20px 20px}
.wrap{max-width:1080px;margin:0 auto}
h1{font-size:23px;margin:0 0 6px;letter-spacing:.5px}
.sub{color:var(--ink2);font-size:13.5px;margin-bottom:14px}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.stats b{color:var(--ink);font-weight:600}
main{max-width:1080px;margin:0 auto;padding:18px 20px 80px}
.controls{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.row:last-child{margin-bottom:0}
input[type=text],select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
input[type=text]{flex:1;min-width:200px}
label.chk{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink2);
  background:var(--chip);border:1px solid var(--line);border-radius:20px;padding:4px 11px;cursor:pointer;user-select:none}
label.chk input{margin:0}
label.chk.on{background:#e2ebf4;border-color:#b8cde0;color:var(--accent)}
.grp{font-size:12px;color:var(--muted);margin-right:2px}
#count{color:var(--muted);font-size:12.5px;margin:2px 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px 17px;margin-bottom:11px;box-shadow:var(--shadow)}
.card h3{font-size:15.5px;margin:0 0 8px;line-height:1.5}
.card h3 .num{color:var(--muted);font-weight:400;margin-right:6px}
.card .plain{color:var(--ink);font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 4px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--chip);color:var(--ink2);border:1px solid var(--line)}
.tag.gA{background:#e4f0e6;border-color:#bfdcc5;color:var(--accent2)}
.tag.gB{background:#f3efe3;border-color:#e0d7bd;color:#8a6a1f}
.tag.gC{background:#f0eeee;border-color:#ded8d8;color:#7a6a6a}
.tag.gx{background:#e6eef5;border-color:#c3d5e4;color:var(--accent)}
.tag.warn{background:#f7e9de;border-color:#e8cbb4;color:var(--warn)}
.cost{display:grid;grid-template-columns:56px 1fr;gap:4px 10px;font-size:13.5px;margin-top:9px}
.cost dt{color:var(--muted);text-align:right}
.cost dd{margin:0;color:var(--ink2);word-break:break-word}
.cost dd a{word-break:break-all}
details{margin-top:8px}
summary{cursor:pointer;font-size:12.5px;color:var(--accent);list-style:none;display:inline-block;padding:2px 0}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ "}
details[open] summary::before{content:"▾ "}
.ch{font-size:11.5px;color:var(--muted);margin-bottom:7px}
.empty{color:var(--muted);padding:30px;text-align:center}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding:0 20px 50px}
@media(max-width:600px){ .cost{grid-template-columns:1fr } .cost dt{text-align:left} }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>高性价比大学指南 · 在线检索</h1>
  <div class="sub">用最少的钱、时间和精力，换回最多的成绩、能力、钱和选择权。</div>
  <div class="stats">
    <span>条目 <b>512</b> 条</span>
    <span>章节 <b>20</b> 节</span>
    <span>引用来源 <b>79</b> 个官方链接</span>
    <span>数据来自 <code>book/*.md</code>，与正文同步</span>
  </div>
</div></header>

<main>
  <div class="controls">
    <div class="row">
      <input type="text" id="q" placeholder="搜索关键词：绩点、保研、助学贷款、刷单、体测、档案、试用期、AED、帮信罪、12356……">
      <select id="ch"><option value="">全部章节</option></select>
    </div>
    <div class="row">
      <span class="grp">证据等级</span>
      <label class="chk"><input type="checkbox" class="g" value="A">A 有原文（法条／文号／文献）</label>
      <label class="chk"><input type="checkbox" class="g" value="B">B 有官方依据</label>
      <label class="chk"><input type="checkbox" class="g" value="C">C 通行做法</label>
    </div>
    <div class="row">
      <span class="grp">换回什么</span>
      <label class="chk"><input type="checkbox" class="s" value="成绩">成绩</label>
      <label class="chk"><input type="checkbox" class="s" value="时间精力">时间精力</label>
      <label class="chk"><input type="checkbox" class="s" value="金钱">金钱</label>
      <label class="chk"><input type="checkbox" class="s" value="选择权">选择权</label>
    </div>
    <div class="row">
      <span class="grp">成本</span>
      <label class="chk"><input type="checkbox" id="free">不花钱</label>
      <label class="chk"><input type="checkbox" id="quick">不花时间</label>
      <label class="chk"><input type="checkbox" id="easy">不需要毅力</label>
      <label class="chk"><input type="checkbox" id="big">收益大</label>
      <span class="grp" style="margin-left:6px">排序</span>
      <select id="sort">
        <option value="cost">按性价比</option>
        <option value="book">按章节顺序</option>
        <option value="gain">按收益量级</option>
      </select>
    </div>
  </div>
  <div id="count"></div>
  <div id="list"></div>
</main>

<footer>《高性价比大学指南》· 条目化、可筛选 · 正文在 book/ 目录，法律条文、部委文件与文献的来源链接都在每条里 · 重新运行 tools/build_index.py 即可更新本页</footer>

<script>
const DATA = [{"file": "01-进门第一个月.md", "title": "1. 进门第一个月：把学籍、制度和地图弄清楚", "entries": [{"n": 1, "title": "报到当天把\"注册\"办完：不注册，学籍就不成立", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，排队一小时。", "说人话": "录取通知书只是\"你被选中了\"。报到、交材料、注册、领学生证这一串办完，学籍才算真正落在学校名下。没注册，选课系统打不开、宿舍进不去、图书馆进不去；真出了事，学校还有可能因为\"你不是在册学生\"而没法给你兜。", "收益": "《普通高等学校学生管理规定》（教育部令第 41 号，2017 年 9 月 1 日施行）规定：新生应当按学校规定的时间和有关要求办理入学手续；因故不能按期入学的应当向学校请假，请假期限一般不超过两周；除因不可抗力等正当事由以外，未请假或者请假逾期的，视为放弃入学资格。每学期开学时，学生应当按学校规定办理注册手续；不能如期注册的应当履行暂缓注册手续；未按学校规定缴纳学费或者有其他不符合注册条件的，不予注册。", "证据等级": "A", "来源": "教育部 (2017). 普通高等学校学生管理规定（教育部令第 41 号）第三章\"入学与注册\"。<https://hudong.moe.gov.cn/jyb_xxgk/xxgk/zhengce/guizhang/202112/P020211208551013106022.pdf>", "备注": "受益人是自己。报到当天三件事按顺序办：① 报到注册、交验录取通知书与身份证；② 领学生证、校园卡，办宿舍入住；③ 交体检表、办理党团组织关系转接。当场能办的当场办完——补办的手续往往要多跑三四个部门，还要等学期中才能受理。"}, "extra": []}, {"n": 2, "title": "想晚一年上学、或中间去当兵：走\"保留入学资格/保留学籍\"这条正路", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。要提前申请、拿批复。", "说人话": "考上但想先工作一年、生病要休学、或者想去当兵，都不要\"先不去报到\"。正确做法是申请保留入学资格（新生）或休学、保留学籍（在校生），拿到学校书面批准，学籍才不会断。很多人以为\"不去就等于自动保留\"，结果第二年回来发现已经被按\"放弃入学资格\"处理了。", "收益": "按教育部令第 41 号，新生可以申请保留入学资格，保留入学资格期间不具有学籍，期限一般到次年新生报到时止；在校学生休学一般以一年为限，累计不得超过两年；应征参加中国人民解放军（含中国人民武装警察部队）的，学校保留其入学资格或者学籍至退役后两年。《高等学校学生应征入伍服义务兵役国家资助办法》同时规定，对应征入伍服义务兵役的高校学生在入伍时对其在校期间缴纳的学费实行一次性补偿，或对国家助学贷款实行代偿。", "证据等级": "A", "来源": "教育部 (2017). 普通高等学校学生管理规定（第三章、第二章第二节\"考核与成绩记载\"、第五节\"休学与复学\"）；财政部、教育部等《高等学校学生应征入伍服义务兵役国家资助办法》。<https://hudong.moe.gov.cn/jyb_xxgk/xxgk/zhengce/guizhang/202112/P020211208551013106022.pdf>", "备注": "受益人是自己。当兵一年至少带来四项账面收益：学费补偿（2024 年 9 月起本专科每年最高 2 万元、研究生 2.5 万元）、保留学籍、退役后复学的转专业便利、以及退役士兵考研专项计划。具体标准见第 9 章第 4 条。"}, "extra": []}, {"n": 3, "title": "把《学生手册》和《培养方案》各读一遍：保研、评奖、转专业的规则全在里面", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱。两个晚上，加起来两三小时。", "说人话": "想保研，先看绩点门槛和外语门槛；想评奖，先看综合素质测评怎么加分；想转专业，先看绩点线和名额。《学生手册》管纪律与奖惩，《培养方案》管你该修哪些课、修多少分。这两本写清楚了后面四年的全部游戏规则，可惜大多数人到大三才翻。", "收益": "各校在新生入学时发放《学生手册》（含学生管理规定、学籍管理办法、奖惩办法）和本科人才培养方案，电子版在教务处、学生工作部网站公布。学分构成（必修、限选、任选、实践环节各占多少）、绩点算法、转专业办法、评奖评优条件、违纪处分的种类与后果，全部在其中。教育部令第 41 号要求学校依法依规建立并公开学籍管理制度，学生有权查阅。", "证据等级": "A", "来源": "教育部 (2017). 普通高等学校学生管理规定（第一至四章）；各高校学生手册与本科人才培养方案（以本校教务处公布版本为准，逐校差异）。", "备注": "常见误区：把《学生手册》当成\"军训期间发的一本废纸\"。它决定的是\"你出事时按哪一条处理\"，也决定你四年能拿到什么。"}, "extra": []}, {"n": 4, "title": "把《规定》里最该记住的六条抄在备忘录里", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，十分钟。", "说人话": "教育部令第 41 号是全国高校学生管理的母文件，各校《学生手册》都是它的加细版。与其通读，不如记住这六条最容易踩的：① 未请假逾期不报到→视为放弃入学资格；② 未注册或不符合注册条件→不予注册；③ 考核成绩记入档案，补考、重修成绩要标注；④ 严重违反考核纪律或作弊→成绩无效并给处分；⑤ 休学一般一年、累计不超两年；⑥ 对处理或处分决定不服，可以在接到决定书之日起 10 日内向学校\"学生申诉处理委员会\"提出书面申诉。", "收益": "上述六条均为教育部令第 41 号明文规定。其中申诉权（第六十条及\"学生申诉\"一章）是学生最容易被忽略的救济渠道：学校对学生作出取消入学资格、退学、开除学籍或其他涉及学生重大利益的处理或者处分决定，应当提交校长办公会或者校长授权的专门会议研究决定，并事先进行合法性审查；学生申诉处理委员会受理申诉后应在规定期限内作出复查结论。", "证据等级": "A", "来源": "教育部 (2017). 普通高等学校学生管理规定（第五章\"奖励与处分\"、第六章\"学生申诉\"）。<https://hudong.moe.gov.cn/jyb_xxgk/xxgk/zhengce/guizhang/202112/P020211208551013106022.pdf>", "备注": "受益人是自己。真被处分了，先别慌、先别丢决定书——申诉是有时限的，超期通常不予受理。"}, "extra": []}, {"n": 5, "title": "教务系统记住四个入口，把它加到手机桌面", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，五分钟。", "说人话": "四年里你只会反复用四个功能：选课（抢课、退课）、成绩（查分、查绩点与排名）、学籍（在读证明、学籍信息）、考试安排（时间与地点）。把路径记住，比收藏一堆公众号有用得多。", "收益": "多数高校教务系统由学校统一部署，账号为学号，初始密码由学校发放；统一身份认证（CAS）通常同时打通教务、图书馆、校园网、邮箱、一网通办。考试时间、补考安排、成绩公布、选课开放与关闭时间，只在这个系统里公告；错过窗口往往要等一年。", "证据等级": "C", "来源": "各高校教务处系统使用说明与选课须知（通行做法，无全国统一文献）。", "备注": "受益人是自己。把\"成绩查询\"和\"考试安排\"设成浏览器书签，期末前每周看一眼，能避免\"错过补考通知\"这类低级事故。"}, "extra": []}, {"n": 6, "title": "存好四类人的联系方式，再混一个学长学姐群", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，十分钟。", "说人话": "辅导员（管奖惩、资助、突发情况）、班主任或专业导师（管学业与选课建议）、教务员（管成绩、学籍、选课故障）、宿管（管宿舍与维修）。遇到问题先问对的人，能省掉一整天来回跑。", "收益": "按各校学生工作与教务管理分工，辅导员负责思想政治教育和日常管理、奖助学金评定、突发情况处置；教务员负责本学院教务事务；宿管负责宿舍安全与维修；专业导师负责学业指导。诉求不同，对应的人不同：成绩问题是教务，困难补助是辅导员，宿舍是宿管，选课建议是导师。", "证据等级": "C", "来源": "各高校学生工作部与教务处职责分工（通行做法）。", "备注": "受益人是自己。除了班级群、年级群，务必加一个本专业高年级群——往年真题、选课经验、保研信息、实习内推，基本都在里面，而且没人会主动告诉你。"}, "extra": []}, {"n": 7, "title": "校园邮箱和统一身份认证：正版软件和云资源的入口", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "学号 + 校园邮箱通常是你领取\"学生专属福利\"的钥匙：微软 Microsoft 365 教育版、部分学校的 Adobe、MATLAB、统计软件、正版杀毒、云盘空间，以及各大平台的\"学生认证优惠\"。这些东西单独买一年要几百到上千元，在校期间免费或极低价。", "收益": "多数高校为在校生提供校园邮箱（@学校域名），并将其作为统一身份认证与第三方教育认证的凭据。Microsoft、JetBrains、Notion、GitHub 等厂商长期提供凭校园邮箱或学信网学籍信息申请的教育版/学生包。图书馆购买的数据库（中国知网、万方、Web of Science 等）也通过校园网 IP 或统一身份认证开放。", "证据等级": "C", "来源": "各高校信息化中心账号说明；各软件厂商教育版申请页面（通行做法，具体清单逐校不同）。", "备注": "受益人是自己。注意：学生优惠通常需要每年重新核验学籍，毕业后会自动失效；校园邮箱也常是毕业后被回收的，重要账号不要只绑它。"}, "extra": []}, {"n": 8, "title": "火车票学生优惠：每学年 4 次，且要先做资质核验", "tag": {"money": "低", "time": "少", "will": "否", "gain": "中", "scope": "金钱"}, "fields": {"成本": "一次核验，几分钟。", "说人话": "学生票不是\"自动打折\"，而是要在 12306 上完成\"学生优惠资质核验\"，绑定优惠区间（家庭所在地—学校所在地），每学年可享受 4 次单程优惠。区间填错、没核验，买票时就会原价。现在多数城市支持线上核验或车站自助机核验，不必再跑学校盖章。", "收益": "铁路部门规定，普通大专院校、本科院校在校学生凭学生证（或录取通知书）和加盖院校公章的减价优待凭证，每年可购买 4 次家庭至院校（实习地点）之间的火车票（硬座半价、动车二等座 7.5 折等）。近年新规取消了寒暑假集中使用的限制，改为每学年 4 次单程，并推行线上学生优惠资质核验。", "证据等级": "B", "来源": "中国国家铁路集团有限公司关于学生优惠票的规定及铁路 12306 学生优惠资质核验流程（2023 年起施行）。", "备注": "受益人是自己。入学第一个月就把\"优惠区间\"填对：填户籍地或父母实际居住地，而不是\"随便填一个\"——区间不符区间票价部分要补差价。"}, "extra": []}, {"n": 9, "title": "学信网账号 +《教育部学籍在线验证报告》", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，十分钟。", "说人话": "学信网（中国高等教育学生信息网）是查学籍学历的官方平台，也是国家唯一指定的学历学籍核验渠道。实习、求职、考研报名、参军、出国材料，都要这份在线验证报告。提前注册好，用的时候一分钟就能下载。", "收益": "学信网（www.chsi.com.cn）由教育部主管，提供《教育部学籍在线验证报告》《教育部学历证书电子注册备案表》《中国高等教育学位在线验证报告》的在线申请与二维码核验。用人单位、档案管理机构、留学服务机构可通过学信网核验学历学位信息。学信网同时是研究生招生信息（研招网）和阳光高考平台的入口。", "证据等级": "A", "来源": "教育部学生服务与素质发展中心（原全国高等学校学生信息咨询与就业指导中心）学信网服务说明。<https://www.chsi.com.cn/>", "备注": "受益人是自己。注册时手机号、身份证号务必填对（错一位后续改起来很麻烦）；密码不要和其他网站共用，这个账号关联的是你唯一的一份学历。"}, "extra": []}, {"n": 10, "title": "军训可以免训、缓训：有病史的别硬撑", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。提前交一次医院证明。", "说人话": "军训和体育课一样，身体不允许是可以申请免训或缓训的，不影响毕业。程序通常是医院证明 + 本人申请 + 学院同意 + 学校审批。硬撑着倒下的代价，比交一张证明大得多。", "收益": "《普通高等学校学生管理规定》要求学校对学生进行健康管理，建立学生健康档案。各校军训与体育课均设有因病因残免训、缓训通道，一般需二级甲等以上医院诊断证明。因病或残疾不能参加体质健康测试的学生，可申请免予执行《国家学生体质健康标准》，需医疗单位证明、体育教学部门核准，并填写免予执行申请表存入档案。", "证据等级": "A", "来源": "教育部 (2017). 普通高等学校学生管理规定（第二章第二节）；教育部、国家体育总局《国家学生体质健康标准（2014 年修订）》及标准应用问答。<https://www.moe.gov.cn/moe_879/moe_1252/s8447/201412/t20141204_179589.html>", "备注": "受益人是自己。别为了\"合群\"隐瞒哮喘、心脏病、癫痫、严重过敏、脊柱问题这些病史——军训和体测恰恰是高危场景，且现场往往没有准备针对你的急救方案。"}, "extra": []}, {"n": 11, "title": "入学体检与结核筛查：顺便把基线数据存下来", "tag": {"money": "低", "time": "少", "will": "否", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "多数学校统一安排、含在入学费用里。", "说人话": "新生入学体检通常含身高、体重、血压、视力、内科、外科、胸片（结核筛查）、肝功能。别把结论单随手扔——它是你未来四年的\"健康基线\"。之后每年对一下：体重有没有明显变化、血压有没有升高、视力有没有退。发现\"趋势\"比发现\"异常\"早得多。", "收益": "《学校结核病防控工作规范》要求将结核病检查项目作为新生入学体检和教职员工常规体检的必查内容；《普通高等学校学生管理规定》要求学校建立学生健康档案。国家卫健委《学生常见病和健康影响因素监测与干预工作方案》将视力、龋齿、肥胖、脊柱弯曲异常等列为学生重点监测项目。", "证据等级": "A", "来源": "国家卫生计生委、教育部 (2017). 学校结核病防控工作规范（2017 版）；教育部 (2017). 普通高等学校学生管理规定（健康管理相关条款）。", "备注": "受益人是自己。大学新生是结核病防控的重点人群（集体宿舍、熬夜、免疫力下降三者叠加），出现持续咳嗽咳痰超过两周、低热盗汗，别当成\"感冒没好\"。"}, "extra": []}, {"n": 12, "title": "户口迁不迁到学校：先想清楚这三件事再落笔", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。办手续花半天。", "说人话": "迁户口主要是为了方便在校期间办证、考驾照、办护照。但农村户口一旦迁出，再迁回去通常只能落\"居民户口\"，宅基地资格和集体收益分配可能受影响；而一些城市的购房、摇号、子女入学资格又和户籍挂钩。先问清老家和学校所在地的政策，再决定。", "收益": "现行政策允许新生自愿选择是否将户口迁入学校集体户，也可以留在原籍。公安部已取消农业户口与非农业户口性质区分，统一登记为居民户口；但土地承包经营权、宅基地使用权、集体收益分配权等仍与集体成员身份相关。毕业生毕业后，户籍可迁往就业创业地（超大城市按现行规定执行），也可迁往入学前户籍所在地。", "证据等级": "A", "来源": "中共中央组织部、人力资源社会保障部、教育部、公安部、国务院国资委 (2023). 关于做好取消普通高等学校毕业生就业报到证有关衔接工作的通知（户口迁移衔接部分）。<https://www.mohrss.gov.cn/SYrlzyhshbzb/jiuye/zcwj/202305/t20230512_499929.html>", "备注": "地区差异。农村户口、有宅基地或集体分红的，迁出前务必把老家政策问清楚；只是想方便办证的话，居住证明加学生证多数情况也能办。"}, "extra": []}, {"n": 13, "title": "你的档案在哪：不能自己拆，不能自己拿", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。问一句就行。", "说人话": "学籍档案里有你的高考材料、体检表、成绩单、奖惩记录、党团材料。在校期间由学校保管，毕业后转去用人单位或户籍地的公共就业人才服务机构。档案不能自己拿着，更不能自己拆封——拆了就可能失效，且补起来非常麻烦。", "收益": "按现行规定，高校毕业生档案由高校归集后按规定有序转递，\"严禁个人自带和保管\"。到机关、国有企事业单位就业或定向招生就业的，转递至就业单位或定向单位；到非公单位就业、灵活就业及自主创业的，转递至就业创业地或户籍地公共就业人才服务机构；暂未就业的，可根据本人意愿转递至户籍地公共就业人才服务机构，或按规定在高校保留两年。", "证据等级": "A", "来源": "中共中央组织部等五部门 (2023). 关于做好取消普通高等学校毕业生就业报到证有关衔接工作的通知（档案转递衔接）。<https://www.mohrss.gov.cn/SYrlzyhshbzb/jiuye/zcwj/202305/t20230512_499929.html>", "备注": "受益人是自己（以及未来考公、政审、评职称、算工龄时）。判断档案在哪的标准动作：问学校档案馆或学生工作部\"我毕业时的档案转递单寄到了哪个单位、快递单号多少\"。"}, "extra": []}, {"n": 14, "title": "入学就参保：大学生医保怎么用、寒暑假怎么备案", "tag": {"money": "低", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "个人缴费一年几百元（2025 年度多地标准为每人每年 400 元左右），大头由财政补助。", "说人话": "大学生在校期间参加城乡居民基本医疗保险，门诊和住院能按比例报销。但寒暑假回老家、或去外地实习时看病，如果没做异地就医备案，报销比例会下降，甚至要自己先垫全款再回去手工报销。很多学校的流程是\"校内先到校医院，需要转诊的开转诊单再去定点医院\"。", "收益": "大学生一般随学校所在地参加城乡居民基本医疗保险，个人缴费标准由各地确定（2025 年度全国多数地区为 400 元/人/年，财政补助标准高于个人缴费）。城乡居民医保实行\"就医地目录、参保地政策\"，异地就医需按规定备案（可通过国家医保服务平台 App 线上办理）；未备案或自行前往非定点机构就医，报销比例通常显著降低。学生在校期间发生的符合规定的医疗费用，由基本医保按规定支付。", "证据等级": "B", "来源": "国家医保局、财政部、税务总局关于做好城乡居民基本医疗保障工作的通知（2024 年）及各地实施细则；国家医保服务平台异地就医备案办事指南。", "备注": "地区差异。个人缴费标准、报销比例、起付线、封顶线、备案方式各省差异很大，必须以学校所在地当年文件为准。受益人是自己。开学第一件事：把校医院的位置、门诊时间、电话、报销流程存进手机。"}, "extra": []}, {"n": 15, "title": "校园卡丢了先挂失：它往往还是门禁、借书证和钱包", "tag": {"money": "低", "time": "少", "will": "否", "gain": "中", "scope": "金钱"}, "fields": {"成本": "补卡工本费一般十几到几十元。", "说人话": "校园卡通常同时是饭卡、门禁卡、借书证、热水卡、洗衣卡，有的还绑着银行卡或校内电子钱包。丢了先线上挂失、再补办。挂失前被人刷掉的钱，基本追不回来。", "收益": "各校校园卡系统一般提供线上自助挂失（校园卡 App、微信公众号或一网通办），挂失后原卡即失效；补办新卡需到卡务中心，可能收取工本费。部分学校校园卡绑定银行账户，丢失后应同时联系银行冻结关联账户。校园卡消费记录也可作为在校生活的凭证。", "证据等级": "C", "来源": "各高校校园卡管理办法与卡务中心说明（通行做法）。", "备注": "受益人是自己。丢卡的第一分钟就挂失，别想着\"先回宿舍找找\"——从丢卡到挂失之间被刷掉的金额，学校通常不承担。"}, "extra": []}, {"n": 16, "title": "三条进不了\"补考\"的线：作弊、代考、代写", "tag": {"money": "0", "time": "多", "will": "否", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，花的是自律。", "说人话": "校内考试作弊是记过以上处分，成绩作废、可能不给学位；在国家考试里作弊是犯罪，组织作弊最高判七年，替考和被替考都要判刑；毕业论文找人代写，2025 年起可以依法撤销已授予的学位。", "收益": "《刑法》第二百八十四条之一规定：在法律规定的国家考试中，组织作弊的，处三年以下有期徒刑或者拘役，并处或者单处罚金；情节严重的，处三年以上七年以下有期徒刑，并处罚金。代替他人或者让他人代替自己参加该类考试的，处拘役或者管制，并处或者单处罚金。《中华人民共和国学位法》（2025 年 1 月 1 日施行）第三十七条规定：学位申请人在攻读学位期间存在代写、剽窃、伪造等学术不端行为的，经学位评定委员会决议，学位授予单位不授予学位或者撤销学位。《高等学校预防与处理学术不端行为办法》（教育部令第 40 号）对学术不端行为的调查与处理程序作出规定。", "证据等级": "A", "来源": "全国人大常委会《中华人民共和国刑法》第二百八十四条之一；全国人大常委会 (2024). 中华人民共和国学位法（第三十七条）。<https://www.moe.gov.cn/jyb_sjzl/sjzl_zcfg/zcfg_jyfl/202404/t20240426_1127804.html>；教育部 (2016). 高等学校预防与处理学术不端行为办法（教育部令第 40 号）。", "备注": "受益人是自己。校内层面的依据是教育部令第 41 号第五章与各校学生手册：严重违反考核纪律或者作弊的，该课程考核成绩记为无效，并视情节给予相应纪律处分。一次侥幸可能换掉四年。"}, "extra": []}, {"n": 17, "title": "图书馆不只是自习室：查重、文献传递、馆际互借、研讨间", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱（校内服务多为免费或补贴价）。", "说人话": "图书馆真正的价值不在座位，在\"钱买不到的东西\"：学校买的数据库（知网、万方、Web of Science、EBSCO、SciFinder 等）、论文查重额度、文献传递与馆际互借（本校没买的文献，帮你从别的馆调来）、研讨间预约、学科馆员咨询。这些服务毕业后一年要花几千元也未必买得到。", "收益": "高校图书馆通过校园网 IP 或统一身份认证向在校生开放购买的中外文数据库；多数图书馆提供参考咨询、查收查引、文献传递、馆际互借、信息素养培训等服务。中国高等教育文献保障系统（CALIS）和国家科技图书文献中心（NSTL）为高校提供全国范围的文献传递支撑。", "证据等级": "C", "来源": "各高校图书馆服务指南；CALIS（中国高等教育文献保障系统）与 NSTL 服务说明（通行做法，各校服务范围不同）。", "备注": "受益人是自己。大一就学会用\"数据库高级检索 + 文献管理软件（Zotero / EndNote）\"，到大四写毕业论文会省下几十个小时。"}, "extra": []}, {"n": 18, "title": "家庭经济困难认定：入学就申请，别等缺钱才想起", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，填一份表、开一次证明。", "说人话": "助学金、勤工助学岗位、临时困难补助、学费减免、国家励志奖学金（面向家庭经济困难且品学兼优的学生），几乎都以\"家庭经济困难学生认定\"为前提。这个认定每年做一次，入学时最容易办；等大三缺钱了再补，往往已经错过当年名额。", "收益": "按《教育部等六部门关于做好家庭经济困难学生认定工作的指导意见》（教财〔2018〕16 号），家庭经济困难学生认定工作原则上每学年进行一次，坚持实事求是、客观公平；认定结果作为学生申请国家助学金、国家励志奖学金、勤工助学、校内资助等项目的重要依据。全日制普通高校对被录取入学、家庭经济确实困难无法缴纳学费的新生，一律先办理入学手续，即\"绿色通道\"，然后再根据核实情况分别采取不同措施予以资助。", "证据等级": "A", "来源": "教育部等六部门 (2018). 关于做好家庭经济困难学生认定工作的指导意见（教财〔2018〕16 号）；全国学生资助管理中心学生资助政策简介。<https://www.xszz.edu.cn/>", "备注": "受益人是自己。认定材料一般包括家庭经济情况说明、低保证/脱贫户证明/残疾证/重大疾病诊断书等。这些证明回老家办最方便，别在学校临时凑。"}, "extra": []}, {"n": 19, "title": "助学贷款在开学前办好：生源地在老家，校园地在学校", "tag": {"money": "低", "time": "少", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "在校期间财政贴息，毕业后才计息。", "说人话": "国家助学贷款有两个入口：生源地信用助学贷款（在户籍所在地的县级学生资助管理中心办理，最常用）和校园地国家助学贷款（入学后在学校办理）。额度：2024 年秋季学期起，全日制本专科生每人每年最高 20000 元，研究生每人每年最高 25000 元；利率为同期同档次 LPR 减 70 个基点；在校期间利息由财政全额补贴。", "收益": "财政部、教育部、人民银行、金融监管总局《关于调整完善国家助学贷款有关政策的通知》（财教〔2024〕188 号）规定：自 2024 年秋季学期起，全日制普通本专科学生每人每年申请贷款额度由不超过 16000 元提高至不超过 20000 元；全日制研究生由不超过 20000 元提高至不超过 25000 元；贷款利率由同期同档次 LPR 减 60 个基点调整为减 70 个基点。贷款优先用于支付学费和住宿费，超出部分用于弥补日常生活费。服兵役学生的学费补偿、国家助学贷款代偿标准同步调整为本专科每年最高 2 万元、研究生每年最高 2.5 万元。", "证据等级": "A", "来源": "财政部、教育部、中国人民银行、金融监管总局 (2024). 关于调整完善国家助学贷款有关政策的通知（财教〔2024〕188 号）。<https://www.xszz.edu.cn/n39/n53/c11911/content.html>", "备注": "受益人是自己。生源地贷款一般在暑假期间办理（7—9 月），需要共同借款人（通常为父母）到场签合同；错过窗口就只能等下一年。毕业后有最长 5 年还本宽限期，具体以合同为准。"}, "extra": []}, {"n": 20, "title": "建立一个\"毕业前一直用\"的文件夹结构", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱。建一次，用四年。", "说人话": "退费争议、重修申诉、出国材料、奖学金复核、意外索赔，都要用凭证。建一个云盘目录，按\"学年/事由\"命名，把学费住宿费电子票据、宿舍验收单、体检报告、成绩单、获奖证书扫描件、实习证明全部丢进去。四年后你会感谢现在的自己。", "收益": "多数高校学费、住宿费已实行电子票据，可在学校财务系统或缴费平台下载；宿舍入住与退宿验收单用于核对设施损坏、确定押金退还；出国申请、考研复试、企业背调常要求历年成绩单原件或盖章件（学校一般可申请打印中英文成绩单、绩点证明）。奖学金复核对获奖材料有留存要求。", "证据等级": "C", "来源": "各高校财务处电子票据说明、成绩单与证明办理流程、宿舍管理规定（通行做法）。", "备注": "受益人是自己。建议目录：`01-学籍与证件`、`02-成绩与学分`、`03-奖助与缴费`、`04-证书与证明`、`05-健康与保险`、`06-实习与项目`。"}, "extra": []}, {"n": 21, "title": "第一学期最容易犯的三个错：社团进太多、逃早八、办一堆卡", "tag": {"money": "低", "time": "多", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "看起来不花钱，实际花的是绩点和睡眠。", "说人话": "第一学期的绩点是后面保研、转专业、评奖的起点，而且\"低绩点很难补回来\"（加权平均的分母已经变大了）。三个高频错误：① 一口气报五六个社团，时间全被割碎；② 觉得\"大一先放松\"，逃掉早八，结果大一一年就定下了保研排名；③ 被推销办一堆信用卡、分期、校园贷产品，征信上先留一笔。", "收益": "绩点通常是学分加权平均，大一大二学分密度最高，因此对总绩点的影响也最大；多数高校的保研（推免）资格按前几学期（常见为前 3—5 学期）成绩排名确定，且对\"无不及格课程\"\"外语达标\"有硬性要求。征信方面，监管部门明确要求小额贷款公司不得向在校大学生发放互联网消费贷款（见第 11 章）。", "证据等级": "B", "来源": "教育部 (2017). 普通高等学校学生管理规定（考核与成绩记载）；各高校推荐优秀应届本科毕业生免试攻读研究生工作办法；中国银保监会等五部门 (2021). 关于进一步规范大学生互联网消费贷款监督管理工作的通知。", "备注": "受益人是自己。第一学期给自己定一条硬规则：社团不超过 2 个，且至少 1 个和专业或技能相关。"}, "extra": []}, {"n": 22, "title": "手机里的四个官方入口：一网通办、企业微信、学生资助、校医院", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，五分钟。", "说人话": "除了教务系统，还有四个入口要用：学校\"一网通办\"/办事大厅（开证明、报修、请假）、学校的企业微信或官方 App（通知与打卡）、全国学生资助管理中心官网与\"中国学生资助\"公众号（政策与贷款）、校医院预约挂号（多数学校已线上化）。把它们都装好、登录好，需要时不用现找。", "收益": "多数高校已建成\"一网通办\"或线上办事大厅，在读证明、成绩单打印、场地借用、宿舍报修、请假审批等均可线上办理或预约。全国学生资助管理中心通过官网（www.xszz.edu.cn）发布国家资助政策、贷款政策与征信知识。", "证据等级": "C", "来源": "各高校信息化建设与线上办事大厅说明（通行做法）；全国学生资助管理中心官网。<https://www.xszz.edu.cn/>", "备注": "受益人是自己。把所有账号的初始密码改成独立的高强度密码，别用\"学号 + 生日\"——这类组合是最先被试出来的。"}, "extra": []}, {"n": 23, "title": "记住三条校内维权路径：申诉、复议、投诉", "tag": {"money": "0", "time": "中", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。花的是把材料整理清楚的那两三个小时。", "说人话": "对成绩认定、学籍处理、纪律处分有异议，是有渠道的，而且有先后顺序：先向学校的\"学生申诉处理委员会\"书面申诉；不服复查结论，可向学校所在地省级教育行政部门申诉；涉及学术评价的（比如论文不通过），学位法另有\"学术复核\"和\"学位复核\"程序。渠道用对了，很多问题能在校内解决。", "收益": "《普通高等学校学生管理规定》设专章规定\"学生申诉\"制度，明确学生对处理或处分决定不服，可在接到决定书之日起 10 日内向学校学生申诉处理委员会提出书面申诉；学生申诉处理委员会应当在规定期限内作出复查结论并告知申诉人；学生对复查决定有异议的，可向学校所在地省级教育行政部门提出书面申诉。《中华人民共和国学位法》规定，学位申请人对专家评阅、答辩、成果认定等学术评价结论有异议，或对不受理学位申请、不授予学位等决定不服的，可以申请学术复核或学位复核。", "证据等级": "A", "来源": "教育部 (2017). 普通高等学校学生管理规定（第六章\"学生申诉\"）；全国人大常委会 (2024). 中华人民共和国学位法（学位复核相关条款）。", "备注": "受益人是自己。两条纪律：① 一切决定书、通知、聊天记录都截图存档；② 注意时限，申诉、复核都有\"自收到之日起 10 日内\"这类硬规定，错过基本不可挽。"}, "extra": []}, {"n": 24, "title": "这张单子打印出来，贴在衣柜门内侧", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，一张 A4。", "说人话": "把这一节的 24 条压成一张清单，第一周逐条打勾，打完就把纸贴起来，学期末再看一眼。手续类的事，只有\"办完\"和\"没办\"两种状态，\"以后再办\"等于没办。", "收益": "清单一（第一周必办）：注册报到 / 学分与培养方案抄成表 / 教务系统四个入口 / 四类人联系方式 / 校园邮箱与统一认证 / 学生证与火车票优惠核验 / 学信网账号 / 医保参保 / 校园卡与一卡通 / 家庭经济困难认定（如需要）。清单二（第一个月内）：军训免训或缓训（如需要）/ 体检报告存档 / 户口迁移（如需要）/ 助学贷款（如需要）/ 图书馆数据库上手 / 云盘文件夹 / 手机四个官方入口。", "证据等级": "C", "来源": "本节的汇总（依据见第 1—23 条各自的来源；属操作清单，非文献结论）。", "备注": "受益人是自己。清单里凡是带\"如需要\"的（免训、迁户、贷款、困难认定），判断依据是\"你家和你的身体情况\"，不是\"别人办没办\"。"}, "extra": []}]}, {"file": "02-选课与培养方案.md", "title": "2. 选课、培养方案与学分：怎么修得又省力又有用", "entries": [{"n": 1, "title": "把培养方案抄成一张表：四类学分各要多少，一门课对应哪一类", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱。一个晚上，约两小时。", "说人话": "培养方案里的学分分成必修、限选、任选、实践环节四块，每块都有最低学分要求，缺一块就毕不了业。多数人到大四下才第一次认真看它。把它抄成一张表——左边课程名，右边学分和类别，每修完一门划掉一个——你四年里所有\"要不要上这门课\"的问题就都变成了算术题。", "收益": "教育部《关于深化本科教育教学改革全面提高人才培养质量的意见》（教高〔2019〕6号）第 10 条明确\"支持高校进一步完善学分制……以学分积累作为学生毕业标准\"，并要求\"学生在基本修业年限内修满毕业要求的学分，应准予毕业\"。《中华人民共和国学位法》第十九条规定，接受本科教育，通过规定的课程考核或者修满相应学分，通过毕业论文或者毕业设计等毕业环节审查，方可授予学士学位。", "证据等级": "A", "来源": "教育部 (2019). 关于深化本科教育教学改革全面提高人才培养质量的意见（教高〔2019〕6号）. <https://www.moe.gov.cn/srcsite/A08/s7056/201910/t20191011_402759.html>；《中华人民共和国学位法》（2024 年 4 月 26 日通过，2025 年 1 月 1 日施行）第十九条。", "备注": "受益人是自己。培养方案在教务系统里能下载，文件名叫\"XX 级 XX 专业本科人才培养方案\"。抄的时候顺手记下每门课的学分，后面所有取舍都要用到这个数字。"}, "extra": []}, {"n": 2, "title": "先算毕业学分，再决定这学期选什么：别到大四才发现差 2 学分", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱。每学期开学前半小时。", "说人话": "大四因为差 2 个任选学分延毕，是每年真实发生的事。正确顺序是：先看培养方案里各类别要多少分，再查教务系统里已修多少分，两类一减就知道还差多少。最容易漏的是任选、通识和实践环节（实习、社会实践、创新创业学分）——必修课教务处会盯着，这几类没人提醒你。", "收益": "教高〔2019〕6号第 10 条同时规定：\"学生在基本修业年限内修满毕业要求的学分，应准予毕业；未修满学分，可根据学校修业年限延长学习时间，通过缴费注册继续学习。\"也就是说差学分不是\"通融一下\"，而是要么延长学制、继续缴费注册，要么拿不到毕业证。延长学习时间意味着多交一学期学费和住宿费，并晚半年到一年进入考研或求职。", "证据等级": "A", "来源": "教育部 (2019). 关于深化本科教育教学改革全面提高人才培养质量的意见（教高〔2019〕6号）第 10 条. <https://www.moe.gov.cn/srcsite/A08/s7056/201910/t20191011_402759.html>", "备注": "受益人是自己。判断方法：把\"已修/要求\"写成\"任选 18/30、必修 12/12、实践 2/6\"，一眼能看出哪个类别最危险。"}, "extra": []}, {"n": 3, "title": "每学期学分有上限，多修不一定划算", "tag": {"money": "0", "time": "多", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱。多修换的是精力和成绩风险。", "说人话": "为了\"早点修完\"一学期报八九门课，结果是每门都只拿 70 分，绩点反而被拉下来。学分的边际收益是递减的：多修一门换来的几个学分，抵不过绩点下降带来的保研和评奖损失。判断标准很简单——这门多出来的课，会不会让其他课的分数往下掉。", "收益": "各校通常在选课办法中设每学期选课学分上限（含必修），超修需专门申请。绩点一般是学分加权平均，即每门课成绩乘以其学分数再求和，除以总学分数；学分越大的课对总绩点影响越大。保研排名、评奖通常以加权成绩或排名为准。因此在总学分固定的前提下，把精力集中在高学分课上，比多选几门低学分课更能拉高排名。", "证据等级": "B", "来源": "各高校选课与学分上限管理办法（各校差异大）；教育部 (2019). 教高〔2019〕6号第 10 条关于学分制的规定。", "备注": "受益人是自己。四年的总学分是固定的，提前修完的唯一好处是腾出后面的时间；如果你打算用后面时间去实习或考研，那多修就是值的——先想清楚要用它换什么。"}, "extra": []}, {"n": 4, "title": "抢课三件事：开放时间、课程代码、备选方案", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱。提前十分钟坐在电脑前。", "说人话": "选课多半是先到先得或志愿抽签，热门课的容量是硬约束。抢课当天要做的是：提前把课程代码抄在一张纸上（别到系统里现找）、用校园网或提前测好的网络、准备好第二和第三备选。抢不到不是失败，没有备选才是——同一类别的课通常有好几门可以顶上。", "收益": "多数高校选课系统在固定时间段开放，热门课程名额有限。一部分学校采用\"志愿＋抽签\"而非先到先得，此时填报的志愿顺序和志愿数量比手速更重要；也有学校老生先选、新生后选，或在开学初再放一轮退课补选窗口。具体规则写在每学期《选课须知》里，各校差别很大。", "证据等级": "C", "来源": "各高校选课系统规则与每学期选课须知（通行做法，无全国统一文件）。", "备注": "受益人是自己。判断方法：先把学校那学期的选课规则原文读一遍，弄清是\"抢\"还是\"抽\"——两种规则的抢课动作完全不一样。"}, "extra": []}, {"n": 5, "title": "必修课先抢，选修课留后手：必修冲突了才是真麻烦", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱。", "说人话": "必修课挂了要重修，重修的时间和你后面的课表打架，会连锁影响毕业；选修课没选到，换个老师、换个学期就能解决。所以每次选课，先确认必修（尤其是只在某一学期开设的专业课）都排稳了，再去挑选修。顺序反了，代价是一整年。", "收益": "必修课是学位授予和专业培养的基础，未通过通常必须补考或重修；选修课一般有替代方案（换课、换学期、跨类别认定），部分学校还允许用其他课程替代。教高〔2019〕6号第 3 条要求\"优化公共课、专业基础课和专业课比例结构\"，而专业课的开设学期往往固定，错过就要等一年。", "证据等级": "C", "来源": "各高校选课与重修管理办法（通行做法）；教育部 (2019). 教高〔2019〕6号第 3 条.", "备注": "受益人是自己。常见误区：把\"好拿分的水课\"排在必修的前面。水课明年还在，必修课今年错过可能就排不过来了。"}, "extra": []}, {"n": 6, "title": "先修课的顺序不能逆：高数—线代—概率—统计这条链断了后面全堵", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱，但要忍住\"先修轻松的\"的诱惑。", "说人话": "很多专业课和升学方向都有前置课程：统计建立在概率之上，概率建立在微积分之上，计量经济学建立在概率统计和线性代数之上。先修课没修好，后面一整串课都跟着卡。更麻烦的是，考研或留学申请会看本科阶段有没有修过某些课，缺了就是硬伤，补都没处补。", "收益": "本科培养方案通常标注课程的前置/先修关系，部分课程明确要求\"修完××课程方可选\"。申请海外统计、数据科学、经济学等方向硕士，通常要求本科修过微积分、线性代数、概率统计三门（具体门数与名称各项目不同，须查目标项目官网的 prerequisites。这是通行做法，不是统一规定）。因此大一大二把这条链排对，等于给\"跨方向\"留了后路。", "证据等级": "B", "来源": "各高校人才培养方案的课程先修关系说明；海外院校研究生项目入学课程要求（各项目不同，以官网为准）。", "备注": "受益人是自己。判断方法：把专业里所有\"要求先修\"的课列出来，画一张箭头图，从没有前置的课开始修，就不会踩坑。"}, "extra": []}, {"n": 7, "title": "按考核方式挑课：先看教学大纲里\"平时分\"和\"期末\"各占多少", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱。看一眼课程大纲。", "说人话": "一门课累不累，先看它怎么考：开卷还是闭卷、期末是论文还是背名词、有没有小组作业、点不点名。同样一门\"水课\"，A 老师期末交一篇 1000 字论文，B 老师闭卷考 40 个名词，两者耗的时间差好几倍。这些信息在开课前的教学大纲里就有，不用等上完才知道。", "收益": "教高〔2019〕6号第 9 条要求\"完善过程性考核与结果性考核有机结合的学业考评制度，综合应用笔试、口试、非标准答案考试等多种形式，科学确定课堂问答、学术论文、调研报告、作业测评、阶段性测试等过程考核比重\"。也就是说，一门课的成绩可以有很多块来源，而不只是期末一张卷子。教学大纲通常载明成绩构成比例、参考书和作业安排，学校一般要求开课前公布。", "证据等级": "A", "来源": "教育部 (2019). 关于深化本科教育教学改革全面提高人才培养质量的意见（教高〔2019〕6号）第 9 条. <https://www.moe.gov.cn/srcsite/A08/s7056/201910/t20191011_402759.html>", "备注": "受益人是自己。真正值得多花时间的，是那些能换成简历上一行字、或能撑起后面专业课的课（编程、写作、数据分析、外语）。"}, "extra": []}, {"n": 8, "title": "平时分是最便宜的分：它经常占 30% 到 50%", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱，花的是按时到、按时交作业。", "说人话": "一门课最终成绩常是\"平时分 × 比例 ＋ 期末 × 比例\"，平时分占 30% 到 50% 的课很常见。考勤、作业、课堂发言、随堂小测、小组汇报都是它的来源。别人熬夜押题，你平时按规则拿满，就领先一大截——这部分几乎算白送。", "收益": "教高〔2019〕6号第 9 条要求在学业考评中\"科学确定课堂问答、学术论文、调研报告、作业测评、阶段性测试等过程考核比重\"，即教育部层面鼓励把过程考核计入总成绩。具体比例由各校课程考核管理办法和每门课的教学大纲规定，学生在开课时有权知晓成绩构成。", "证据等级": "A", "来源": "教育部 (2019). 关于深化本科教育教学改革全面提高人才培养质量的意见（教高〔2019〕6号）第 9 条. <https://www.moe.gov.cn/srcsite/A08/s7056/201910/t20191011_402759.html>；各高校课程考核管理办法与课程教学大纲（各校比例不同）。", "备注": "受益人是自己。判断方法：第一节课认真听老师讲评分规则，把它记进手机备忘录——多数老师只在这节课把\"怎么给分\"讲清楚，之后再也不提。"}, "extra": []}, {"n": 9, "title": "慕课和在线课程的学分认不认：先查认定办法再花钱", "tag": {"money": "低", "time": "少", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "免费课程很多；要平台认证证书时可能花一两百元。", "说人话": "不少学校允许用慕课或在线平台的课程折算通识课学分，但有上限、要认证、往往还要参加线下考核。别自己花钱上完一门才发现学校不认。正确顺序是：先在教务处网站搜\"在线开放课程 学分认定\"办法，看清列入目录的课程和认定上限，再去学。", "收益": "《教育部关于加强高等学校在线开放课程建设应用与管理的意见》（教高〔2015〕3号）明确要求\"推进在线开放课程学分认定和学分管理制度创新\"，鼓励高校\"制订在线课程的教学效果评价办法和学生修读在线课程的学分认定办法\"，在保证教学质量的前提下开展学分认定、学分转换和学习过程认定。认不认、认多少、上限多少，由本校规定。", "证据等级": "A", "来源": "教育部 (2015). 关于加强高等学校在线开放课程建设应用与管理的意见（教高〔2015〕3号）. <https://www.moe.gov.cn/srcsite/A08/s7056/201504/t20150416_189454.html>", "备注": "受益人是自己。慕课真正的价值不只是学分，是让你用很低成本试一门课——想转数据方向，先在平台上把 Python 和统计各上一门，比听别人转述靠谱。"}, "extra": []}, {"n": 10, "title": "重修、补考和\"清考\"：毕业前那次兜底补考已经取消了", "tag": {"money": "中", "time": "多", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "补考通常免费或低价，重修按学分收费（各校差异大），主要代价是时间。", "说人话": "挂了的课一般先补考，补考还不过就得重修。以前很多学校在毕业前还有一次\"清考\"兜底，现在这条路已被教育部明确堵死。所以\"及格\"不是可以讨价还价的线，而是一次性必须过的线——尤其是必修课，越往后拖，重修时间和你后面的课表越容易撞。", "收益": "教高〔2019〕6号第 9 条明确：\"加强考试管理，严肃考试纪律，坚决取消毕业前补考等'清考'行为。\"《普通高等学校学生管理规定》（教育部令第 41 号）规定，学校应当真实、完整地记载、出具学生学业成绩，对通过补考、重修获得的成绩\"应当予以标注，并归入学籍档案\"。两条合起来的意思是：没有毕业前的兜底重考，而且补考、重修会在成绩单上留下痕迹。", "证据等级": "A", "来源": "教育部 (2019). 教高〔2019〕6号第 9 条. <https://www.moe.gov.cn/srcsite/A08/s7056/201910/t20191011_402759.html>；教育部 (2017). 普通高等学校学生管理规定（教育部令第 41 号）第三章\"考核与成绩记载\".", "备注": "受益人是自己。策略上，大一大二把基础课（高数、英语、专业基础）一次性过掉最划算——这两年学分密度最高，也是重修最不容易和专业课撞车的阶段。"}, "extra": []}, {"n": 11, "title": "想靠重修刷分：先问学校记最高分还是只记及格", "tag": {"money": "中", "time": "多", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "重修费加一个学期的时间。", "说人话": "同样是重修，A 校记实际考分（刷分有用），B 校只记及格分（刷分白费）。有学校为保研、评奖还规定\"重修不计入绩点\"或\"取最高分\"。所以动手前，去教务处问一句\"重修成绩在成绩单和绩点里怎么记\"，别自己假设。", "收益": "教育部要求对补考、重修获得的成绩予以标注并归入学籍档案（教育部令第 41 号）。在此前提下，各校对是否取最高分、是否计入绩点、是否影响保研排名有不同规定，属于各校学籍与成绩管理办法自行决定的范围。刷分能不能提升排名，完全取决于本校怎么记。", "证据等级": "B", "来源": "教育部 (2017). 普通高等学校学生管理规定（教育部令第 41 号）；各高校学籍与成绩管理办法（各校差异大）。", "备注": "各校差异。影响成绩单美观但不影响毕业的课，通常不值得为刷分重修；会卡保研或奖学金门槛的课，才值得算这笔账。受益人是自己。"}, "extra": []}, {"n": 12, "title": "辅修、双学位、第二学士学位：是三种东西，先问发什么证", "tag": {"money": "中", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "辅修/双学位按学分收费，通常几千元；占用周末或晚上。", "说人话": "三者差别很大。辅修学士学位是本校在读时辅修另一个专业大类，读完在主修学位证书上\"予以注明\"，不单独发证；双学士学位是高考招生时就录取的复合型项目，在校生很难中途加入；第二学士学位是本科毕业后再读两年的独立学历。报名前一定问清教务处：读完发的是学位、证书，还是只记成绩。", "收益": "国务院学位委员会《学士学位授权与授予管理办法》（学位〔2019〕20号）第十四条规定，辅修学士学位\"应与主修学士学位归属不同的本科专业大类，对没有取得主修学士学位的不得授予辅修学士学位……在主修学士学位证书中予以注明，不单独发放学位证书\"；第十五条规定双学士学位项目\"须……通过高考招收学生\"\"只发放一本学位证书\"。教育部办公厅《关于在普通高校继续开展第二学士学位教育的通知》（教高厅函〔2020〕9号）规定，第二学士学位学制两年、全日制学习，主要招收当年普通高校本科毕业并获得学士学位的应届毕业生，以及近三年本科毕业且目前未就业的往届生。", "证据等级": "A", "来源": "国务院学位委员会 (2019). 学士学位授权与授予管理办法（学位〔2019〕20号）第十四条、第十五条、第二十五条. <https://www.moe.gov.cn/srcsite/A22/yjss_xwgl/moe_818/201907/t20190726_392378.html>；教育部办公厅 (2020). 关于在普通高校继续开展第二学士学位教育的通知. <https://www.moe.gov.cn/jyb_xwfb/s5147/202006/t20200601_461243.html>", "备注": "受益人是自己。判断方法：如果目标是\"简历多一行\"，辅修证书往往够用；如果目标是\"考公/考研要专业对口\"，要先查对方认不认辅修专业——很多单位只认主修学位。另注意学位〔2019〕20号第二十五条曾规定不再招收第二学士学位生，2020 年教育部又发文恢复，政策有反复，务必以你入学当年文件为准。"}, "extra": []}, {"n": 13, "title": "辅修的报名时点：原则上不晚于第二学年起始", "tag": {"money": "中", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "问一次不花钱；决定辅修则要交学费、排时间。", "说人话": "辅修不是想报就能随时报。政策上的时点要求是\"原则上不晚于第二学年起始时间\"，多数学校在第一学年第二学期就组织报名，按成绩择优录取，且要求主修课有余力。等到大三才想起来辅修，通常名额已满或已错过报名窗口。", "收益": "教高〔2019〕6号第 12 条要求\"逐步推行辅修专业制度……原则上，辅修专业学生的遴选不晚于第二学年起始时间\"；学位〔2019〕20号第十四条要求学校为辅修学士学位制定专门实施办法，对课程要求和学位论文（或毕业设计）作出明确规定。辅修课程一般包含该专业核心课程、实践环节和毕业设计（论文），学习年限约两年，需在主修学制内完成。", "证据等级": "B", "来源": "教育部 (2019). 教高〔2019〕6号第 12 条；国务院学位委员会 (2019). 学位〔2019〕20号第十四条；各高校辅修管理办法（各校时点与学分要求不同）。", "备注": "受益人是自己。大一下就去教务处看\"辅修专业目录\"和报名通知，先知道有哪些专业、要修多少学分、周末还是晚上上课，再决定。"}, "extra": []}, {"n": 14, "title": "双学士学位是高考招生的项目，在校生不能中途加入", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，问一句就行。", "说人话": "\"双学位\"这个词很容易被误解。按现行办法，双学士学位复合型人才培养项目是通过高考招生的，也就是说，大一入校后基本没有\"再补报一个双学位\"的口子。在校生想读第二个专业，实际可选的是辅修学士学位，凭证形式和含金量都和双学士学位不同。", "收益": "教高〔2019〕6号第 13 条明确\"开展双学士学位人才培养项目试点……试点须报省级学位委员会审批通过后，通过高考招收学生\"，并对依托学科提出\"所依托的学科专业应具有博士学位授予权，且分属两个不同的学科门类\"的硬要求；学位〔2019〕20号第十五条同时规定\"双学士学位只发放一本学位证书，所授两个学位应在证书中予以注明\"。两条都说明双学士学位是招生环节的项目，而非在校生可中途加入。", "证据等级": "B", "来源": "教育部 (2019). 教高〔2019〕6号第 13 条；国务院学位委员会 (2019). 学位〔2019〕20号第十五条.", "备注": "受益人是自己。别被招生广告或中介\"帮你补一个双学位\"的说法骗到——在校生能办的是辅修，两条路发的东西不一样。"}, "extra": []}, {"n": 15, "title": "跨专业选课和旁听：先看学校认不认学分", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，占的是时间。", "说人话": "想学另一个专业的东西，有三条路：正式选修它的课（能计学分）、跨专业选课（有些学校算任选学分）、旁听或蹭课（一般不计学分，纯粹学东西）。三条路的成本差不多，区别就在\"算不算学分\"。只是好奇的话，旁听最省事；想在成绩单上体现，就先确认选课系统里能不能选、算哪一类。", "收益": "多数高校允许学生选修其他专业的课程，具体是否计入本人培养方案的任选学分、是否需要任课教师同意、是否有容量限制，由各校选课办法规定。以\"旁听\"身份参加考试、获得成绩通常不被允许；正式选修才进入成绩与学分系统。", "证据等级": "C", "来源": "各高校选课管理办法（通行做法，各校差异大）。", "备注": "受益人是自己。判断方法：先问教务员\"我选外专业的这门课，算不算任选学分\"，一句话就能省掉一学期的无用功。"}, "extra": []}, {"n": 16, "title": "思政、大学英语、计算机这类公共必修，别拖到最后", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱，但要排在前面。", "说人话": "公共必修（思想政治理论课、大学英语、计算机基础等）通常学分不小、面向全校、开课班次多，正因如此很多人想\"先挑好的专业课，公共课以后再补\"。风险在于：它们可能和你的专业课时间冲突，也可能卡毕业学分；大学英语还常和四六级、学位外语要求挂钩。把它们按学期均匀排开，比堆在最后两年安全。", "收益": "教高〔2019〕6号第 3 条要求\"优化公共课、专业基础课和专业课比例结构，加强课程体系整体设计……坚决杜绝因人设课\"，并明确\"把思想政治理论课作为落实立德树人根本任务的关键课程\"；第 19 条要求\"切实落实教授全员为本科生上课的要求\"。公共必修属于全校统一开设、学分固定的课程，通常不能免修，须修满相应学分。", "证据等级": "B", "来源": "教育部 (2019). 教高〔2019〕6号第 3 条、第 19 条；各高校人才培养方案的公共必修课要求（各校门数与学分不同）。", "备注": "受益人是自己。判断方法：看培养方案里公共必修一共要多少学分，平均到每个学期是多少，再决定要不要提前修。"}, "extra": []}, {"n": 17, "title": "教材：先查指定书目，再考虑二手和电子版", "tag": {"money": "低", "time": "少", "will": "否", "gain": "中", "scope": "金钱"}, "fields": {"成本": "新教材一本几十到一两百元；二手或电子版常便宜一半以上。", "说人话": "教材钱是可以省的。正确顺序是：先看教学大纲里的指定教材和版本（版本错了等于白买），再决定买新、买二手、买电子版还是用图书馆馆藏。公共课的教材往往一届用完还能传给下一届，学院群、二手书店里最常见。", "收益": "多数课程在教学大纲中列明指定教材和参考书，部分课程由教师自编讲义或指定内部资料。图书馆通常有指定教材的多册馆藏可在馆内借阅。教材版本每年可能更新，买旧版前要确认本学期的指定版次，否则页码和习题都对不上。", "证据等级": "C", "来源": "各高校课程教学大纲与教材选用办法（通行做法）。", "备注": "受益人是自己。常见误区：开学第一周被\"教材统一订购\"刷爆消费——先问老师这学期用不用书、用哪一版，再买。"}, "extra": []}, {"n": 18, "title": "教师评价系统：认真填，它进的是学校的质量评价体系", "tag": {"money": "0", "time": "少", "will": "否", "gain": "小", "scope": "时间精力"}, "fields": {"成本": "不花钱，几分钟。", "说人话": "教务系统里的课堂教学评价不是走过场：它进入学校对课程和教师的质量评价体系，一定程度上影响课程是否保留、教学怎么改进，也影响学弟学妹以后选课。认真填\"哪一章难、哪里讲得快\"，比全打满分有用得多。", "收益": "教高〔2019〕6号第 15 条要求\"完善高校内部教学质量评价体系，建立以本科教学质量报告、学院本科教学评价、专业评价、课程评价、教师评价、学生评价为主体的全链条多维度高校教学质量评价与保障体系\"。也就是说，学生评教是这套体系的正式组成部分，而不只是形式。", "证据等级": "B", "来源": "教育部 (2019). 教高〔2019〕6号第 15 条.", "备注": "受益人是自己（以及下一届的学弟学妹）。有些学校把\"完成评教\"设为查成绩的前置条件——不填看不到分数，这条规则本身就是最好的提醒。"}, "extra": []}, {"n": 19, "title": "开学初的退课、补选窗口：别错过那一次\"改课表\"的机会", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱。", "说人话": "正式选课结束后，通常还有一轮退课/补选窗口（一般在开学后一到两周）。这是你一学期里最后一次调整课表的机会：试听之后发现老师讲不清、和另一门课冲突、或抢到的课其实不适合，都可以在这个窗口处理。多数学校对退课有时间限制，过了就退不掉。", "收益": "多数高校在学期初设有退课、补选开放期，允许学生在规定时间内退选或调整课程；超出期限后调课需走特殊审批。部分学校对退课后低于最低学分、或退掉必修课有限制。规则写在每学期选课通知里。", "证据等级": "C", "来源": "各高校选课与退课管理办法（通行做法，各校窗口时长不同）。", "备注": "受益人是自己。判断方法：开学第一周把所有课试听一遍，第二周之前把不合适的退掉——晚了就只能硬撑一学期。"}, "extra": []}, {"n": 20, "title": "每学期末做一次学分盘点，顺手列好下学期要抢的课", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱，半小时。", "说人话": "期末考完，趁着记得清楚，核对三件事：这学期实际拿到多少学分、哪门课有风险、距离各类别要求还差多少。然后按剩下的空档，把下学期要抢的课列出来。四年下来，这张表就是你自己的进度条，比任何事后复盘都管用。", "收益": "教务系统通常提供\"学分统计/毕业审核\"功能，可查询已获学分与培养方案要求的对比。提前一个学期准备选课，能显著降低\"必需课抢不到\"的风险，对只在某一学期开设的专业课尤其重要。", "证据等级": "C", "来源": "各高校教务系统功能说明（通行做法）。", "备注": "受益人是自己。建议把这张表存进第 1 章提到的\"02-成绩与学分\"文件夹，每学期更新一次。"}, "extra": []}, {"n": 21, "title": "通识选修课怎么挑：看学分、周课时和考核三样", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，看一眼课程信息。", "说人话": "同样 2 学分的通识课，有的每周 2 课时、期末交论文，有的每周 4 课时、期末闭卷还点名。用\"单位时间拿到的学分\"和\"考核成本\"两把尺子一量，差别很大。挑通识课的原则是：留一门你真感兴趣或能拓展视野的，其余按成本挑。", "收益": "通识课（任选课）在各校培养方案中通常有最低学分要求，但可由学生在目录内自由选择；周课时、考核方式、是否点名由课程教学大纲规定并在选课系统或教务网公示。同等学分下，选择周课时少、考核与自己能力匹配的课程，可以在不减少学分的前提下压缩时间投入。", "证据等级": "B", "来源": "各高校通识选修课管理办法与课程信息公示（各校课程目录不同）。", "备注": "受益人是自己。常见误区：只挑\"听说很水\"的课，结果选到一门不适合自己考核方式的课（比如怕写论文却一口气选了三门论文结课的课）。"}, "extra": []}, {"n": 22, "title": "大学英语这门课和四六级是两回事，但门槛常常一起卡人", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱，花的是按时上课和备考。", "说人话": "大学英语是培养方案里的公共必修课，有学分；四六级是全国统一的等级考试，是资格线。很多学校的学位授予、评奖评优、甚至推免都对外语有硬要求（常见是四级 425 分，或六级达到某分数）。别把\"英语课上完\"当成\"外语门槛已过\"——两件事要分别确认。", "收益": "绝大多数高校把大学英语列为公共必修课；同时，不少学校在学士学位授予、评奖评优或推免（保研）条件中设置全国大学英语四、六级成绩门槛（常见为四级 425 分及以上，或六级达到学校规定分数）。这些门槛写在本校学位授予细则和推免办法里，须逐校确认。", "证据等级": "B", "来源": "各高校学士学位授予细则、评奖评优办法与推免工作办法（各校门槛不同，以本校文件为准）。", "备注": "各校差异。受益人是自己。判断方法：把\"本校对四六级的最低要求是多少分、在哪几类事情上卡人\"问清楚，再决定要不要刷分。"}, "extra": []}, {"n": 23, "title": "学位授予除了学分，可能还有课程平均分或绩点门槛", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱，问一次学院教务处。", "说人话": "修满学分只是毕业的条件之一。很多学校对学士学位还设了额外的课程成绩门槛，比如\"必修课平均分不低于某值\"\"专业核心课无不及格\"\"平均学分绩点达到某值\"。这是两条线：学分够了能毕业，但成绩线不够可能拿不到学位证。大一开始就要知道这条线在哪。", "收益": "《中华人民共和国学位法》第十九条规定，授予学士学位需通过规定的课程考核或修满相应学分、通过毕业论文或毕业设计等毕业环节审查，并达到学校规定的其他条件；各校据此在学士学位授予细则中设定具体标准，常见的附加条件包括必修课平均成绩、平均学分绩点（GPA）、无严重违纪、外语成绩等。", "证据等级": "B", "来源": "《中华人民共和国学位法》第十九条；各高校学士学位授予实施细则（各校标准不同）。", "备注": "各校差异。受益人是自己。常见误区：以为\"混到及格就万事大吉\"——有些学校对\"有不及格记录\"或\"绩点过低\"直接不授学位，问清楚才能避免大四才发现。"}, "extra": []}, {"n": 24, "title": "把\"培养方案、已完成、还差\"做成一页纸，四年只用这一张", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱。做一次，用四年。", "说人话": "把前面所有条目收成一页纸：左边是四类学分的要求，中间是已修课程和学分，右边是还要修的类别和课程名。每学期末更新一次。这一页纸能同时回答\"我能不能按时毕业\"\"下学期该抢什么\"\"这门课要不要现在修\"三个问题。", "收益": "培养方案的学分构成、教务系统的学分统计功能，两者拼起来就能做出这张表。教高〔2019〕6号要求高校\"建立学业预警、淘汰机制\"——学校侧的预警依据也是这套学分对比。学生自己先做，就能比系统预警更早发现问题。", "证据等级": "C", "来源": "由本节第 1—23 条依据汇总（属操作清单，非独立文献）；教育部 (2019). 教高〔2019〕6号第 10 条.", "备注": "受益人是自己。做完打印一份贴墙上，电子版放云盘。四年里你会反复用到它。"}, "extra": []}]}, {"file": "03-上课与期末.md", "title": "3. 上课与期末：用最少的时间拿到够用的成绩", "entries": [{"n": 1, "title": "平时分从哪来：把\"能白拿的分\"拿满", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱，花的是按时到、按时交作业。", "说人话": "一门课的最终成绩通常是\"平时分 × 比例 ＋ 期末 × 比例\"，平时分经常占 30% 到 50%。考勤、作业、课堂发言、随堂小测、小组汇报都是分的来源。别人熬夜押题，你平时按规则拿满，就领先一大截——这部分是整门课里最便宜的分。", "收益": "教高〔2019〕6号第 9 条要求在学业考评中\"科学确定课堂问答、学术论文、调研报告、作业测评、阶段性测试等过程考核比重\"，即教育部层面鼓励把过程考核计入课程总成绩。具体比例由各校课程考核管理办法与每门课的教学大纲规定。教高〔2019〕6号第 2 条还要求\"增加学生投入学习的时间，提高自主学习时间比例\"。", "证据等级": "A", "来源": "教育部 (2019). 关于深化本科教育教学改革全面提高人才培养质量的意见（教高〔2019〕6号）第 2 条、第 9 条. <https://www.moe.gov.cn/srcsite/A08/s7056/201910/t20191011_402759.html>；各高校课程考核管理办法（各校比例不同）。", "备注": "受益人是自己。判断方法：第一节课把\"平时分怎么算\"记进手机备忘录。一学期翘几次课看着没什么，扣掉的可能是好几个绩点档位。"}, "extra": []}, {"n": 2, "title": "复习第一步：先找往年真题和题库，再决定背什么", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱。花时间问学长学姐。", "说人话": "大学考试的重复率往往比想象中高——同一门课、同一套教材、同一个老师，考点和题型年年相似。先拿到往年题，你就知道老师考什么、怎么考、重点在哪，然后把有限时间压在这些点上。没有真题的课，才需要从头到尾通读。", "收益": "部分高校图书馆或教务部门提供历年试题服务；更多时候真题通过学院、社团、学长学姐流传。以真题定复习范围是通行的应考方法：它把\"复习一整本书\"变成\"复习被考过的部分\"，直接压缩无效时间。是否提供真题、提供到哪一年，各校差异很大。", "证据等级": "C", "来源": "各高校图书馆/教务部门历年试卷服务（各校情况不同，无全国统一文件）。", "备注": "受益人是自己。要题的时候顺便问两句\"老师给分怎么样\"\"哪一章占分最多\"——这两句的信息量常常比题目本身还大。"}, "extra": []}, {"n": 3, "title": "把复习摊到好几天：分散练习比一次性通读有效", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱。同样三小时，拆成三天各一小时。", "说人话": "认知心理学里最稳的结论之一：同样的总学习时间，分几次学、每次间隔开，比一次集中学完记得更牢。所以\"考前三晚各两小时\"通常好于\"考前一夜连刷六小时\"。分散练习的过程感觉更难，但正是这种感觉在说明它在起作用。", "收益": "Dunlosky 等 (2013) 对十种学习技巧的系统综述中，把\"分散练习（distributed practice）\"与\"练习测验（practice testing）\"并列为效用最高的两项，其余如重读、划线、总结、关键词记忆、想象均为低效用。Cepeda 等 (2006) 对 254 项实验的元分析（发表于 Psychological Bulletin）进一步显示：间隔学习在延迟测验中的保持率优于集中学习，且最佳间隔随需要保持的时间而延长。", "证据等级": "B", "来源": "Dunlosky, J., Rawson, K. A., Marsh, E. J., Nathan, M. J., & Willingham, D. T. (2013). Improving Students' Learning With Effective Learning Techniques. *Psychological Science in the Public Interest*, 14(1), 4–58；Cepeda, N. J., Pashler, H., Vul, E., Wixted, J. T., & Rohrer, D. (2006). Distributed practice in verbal recall tasks: A review and quantitative synthesis. *Psychological Bulletin*, 132(3), 354–380.", "备注": "受益人是自己。执行很简单：把复习计划写成\"每天一小时 × 三天\"，而不是\"考前一晚六小时\"。"}, "extra": []}, {"n": 4, "title": "合上书自己考一遍，比反复看讲义有效", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱。", "说人话": "反复看讲义会产生\"我都懂了\"的错觉，一考试就写不出来。有效的方法是：合上书，自己默写要点、给自己出题、把答案讲出来（哪怕讲给空气）。这个过程很痛苦，但痛苦本身就是记忆在加固。和同学互相出题，比一起看讲义有效得多。", "收益": "Roediger 与 Karpicke (2006) 的实验显示，学完材料后只做一次回忆测验的组，一周后的回忆率约为 80%，而重复阅读组约为 36%。Dunlosky 等 (2013) 把\"练习测验（practice testing）\"评为效用最高的两项技巧之一。这组结论在教育心理学中反复被验证。", "证据等级": "B", "来源": "Roediger, H. L., & Karpicke, J. D. (2006). Test-Enhanced Learning: Taking Memory Tests Improves Long-Term Retention. *Psychological Science*, 17(3), 249–255；Dunlosky 等 (2013), *Psychological Science in the Public Interest*, 14(1).", "备注": "受益人是自己。最省事的执行方式：把讲义标题盖住，只看标题回忆内容，想不起来再翻开对照。"}, "extra": []}, {"n": 5, "title": "别把\"划重点\"当成主要学法", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱。省下的是划线的时间。", "说人话": "把整本书用荧光笔画满，是最容易的仪式感，也是最没用的。画线只让你\"感觉在学\"，没让你把内容记住。真要动手就写摘要、做思维导图、给自己出题——哪怕只是把一段话用自己的话重写一遍。", "收益": "Dunlosky 等 (2013) 的系统综述把十种学习技巧按效用分档：练习测验、分散练习为高效用；精细提问、自我解释、交错练习为中等效用；而重读、划线（highlighting/underlining）、总结、关键词记忆法、想象（imagery for text）被评为低效用。也就是说，\"把书划满\"属于被实验证明效率最低的一类。", "证据等级": "B", "来源": "Dunlosky, J. 等 (2013). Improving Students' Learning With Effective Learning Techniques. *Psychological Science in the Public Interest*, 14(1), 4–58.", "备注": "受益人是自己。划线不是禁止，是别把它当主力：划完必须配一次\"合上书回忆\"（第 4 条），否则划线几乎等于没学。"}, "extra": []}, {"n": 6, "title": "不同题型混着练：交错练习比按题型刷更划算", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱。", "说人话": "把习题按题型分成\"今天只做选择题、明天只做计算题\"，看着有条理，但考试是混着来的。把不同题型的题打乱练，虽然每道题更费劲、即时正确率更低，但你在考场上更能\"认出该用哪个方法\"。这种\"练的时候更难受、考的时候更好用\"的落差，就是交错练习的价值。", "收益": "Dunlosky 等 (2013) 把交错练习（interleaved practice）评为中等效用；在数学、统计等领域的教学实验中，交错练习被证明能提高迁移和延迟测验表现，尽管练习过程中的即时正确率反而更低。", "证据等级": "B", "来源": "Dunlosky, J. 等 (2013). *Psychological Science in the Public Interest*, 14(1)；Rohrer, D., & Taylor, K. 关于数学学习中交错练习的系列实验（综述见 Dunlosky 等 2013）。", "备注": "受益人是自己。执行方法：合上书后随机抽题做，而不是按章节课后题顺序从头做到尾。"}, "extra": []}, {"n": 7, "title": "精细提问与自我解释：多问\"为什么\"和\"这跟我已知的有什么关系\"", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱。", "说人话": "读一段定理或结论时，别只记住它，多问两句：\"为什么是这样？\"\"它和上一章那个结论是什么关系？\"\"如果条件反过来会怎样？\"把新知识和已经会的东西挂上钩，比孤立地背要点记得牢。这不需要额外资料，只需要多花几秒动脑。", "收益": "Dunlosky 等 (2013) 把\"精细提问（elaborative interrogation）\"和\"自我解释（self-explanation）\"都评为中等效用：它们要求学习者对材料主动生成解释，从而建立更多记忆线索，效果优于单纯的重复阅读和划线。", "证据等级": "B", "来源": "Dunlosky, J. 等 (2013). Improving Students' Learning With Effective Learning Techniques. *Psychological Science in the Public Interest*, 14(1), 4–58.", "备注": "受益人是自己。适合概念多、逻辑链长的课（经济、法学、生物、哲学）；纯记忆型课程用第 4 条的\"自测\"更直接。"}, "extra": []}, {"n": 8, "title": "合意困难：学起来\"卡\"一点，反而记得更牢", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱，但要接受\"当下学得慢\"。", "说人话": "很多让人感觉顺畅的学习方式（反复看、集中练同一种题、边看答案边做）其实记不住；反过来，那些让学习过程变难一点的安排（隔开时间复习、混着练、合上书回忆）长期效果更好。判断标准不是\"今天感觉学会了吗\"，而是\"三天后还能不能想起来\"。", "收益": "Bjork 与 Bjork (2011) 提出\"合意困难（desirable difficulties）\"概念：某些使学习过程更费力、即时表现更差的安排，反而能提升长期保持和迁移，典型例子正是分散练习、交错练习和提取练习。这一框架解释了为什么第 3、4、6 条的方法\"当下更难用、长期更有效\"。", "证据等级": "B", "来源": "Bjork, E. L., & Bjork, R. A. (2011). Making things hard on yourself, but in a good way: Creating desirable difficulties to enhance learning. 载 *Psychology and the Real World: Essays Illustrating Fundamental Contributions to Society*.", "备注": "受益人是自己。实用推论：别用\"今天读得很顺\"当复习质量的标准，用\"合上书能不能默写出来\"当标准。"}, "extra": []}, {"n": 9, "title": "笔记法：把一页纸分成\"线索—笔记—总结\"三块", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱。", "说人话": "康奈尔笔记法把一页分成三块：右侧大块记课堂内容，左侧窄条写关键词或问题，底部几行写本页总结。课后把左侧的关键词遮住、靠回忆复述右侧内容，那张纸就自动变成一份自测题。抄得工整不等于学得好，能靠左侧线索复述出来才算。", "收益": "该格式由康奈尔大学的 Walter Pauk 在《How to Study in College》中提出并在该校学习中心推广，其机制是把\"记笔记\"和\"提取练习\"（见第 4 条）耦合在同一份材料上，使笔记在课后能直接当自测用。这属于有明确来源的通行学习法，但没有中国官方文件依据。", "证据等级": "C", "来源": "康奈尔大学学习策略中心（Cornell University, Learning Strategies Center）对康奈尔笔记格式的说明；Pauk, W. *How to Study in College*（该笔记法即由此书推广）。", "备注": "受益人是自己。最常见误区是只画了三条线却从不看左侧关键词——那样它就退化成普通笔记本。"}, "extra": []}, {"n": 10, "title": "课前预习的最小成本做法：花十分钟只看标题和小结", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱，十分钟。", "说人话": "大学课的进度比高中快，不预习很容易在某一句话上卡住、然后整节课掉线。最小成本的预习不是\"提前读懂\"，而是花十分钟扫一遍本节标题、图表和小结，知道这节课在讲什么、和上一节什么关系。带着问题去听课，落点会准很多。", "收益": "教高〔2019〕6号第 2 条明确要求高校\"增加学生投入学习的时间，提高自主学习时间比例，引导学生多读书、深思考、善提问、勤实践\"。也就是说，\"课前先看、带着问题上\"正是政策鼓励的自主学习方式。具体预习多少由学生按课程难度自行决定。", "证据等级": "B", "来源": "教育部 (2019). 关于深化本科教育教学改革全面提高人才培养质量的意见（教高〔2019〕6号）第 2 条. <https://www.moe.gov.cn/srcsite/A08/s7056/201910/t20191011_402759.html>；关于预习与课堂参与的教学法经验（通行做法）。", "备注": "受益人是自己。执行要点：只做十分钟，别把它变成\"提前刷完一章\"——预习的目标是\"不掉线\"，不是\"学会\"。"}, "extra": []}, {"n": 11, "title": "课堂录音、拍照、拍板书之前，先问老师同不同意", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，占手机空间。", "说人话": "录音和拍板书能救回\"走神五分钟错过一页\"的情况，但它有两个前提：老师同意，以及你事后真的会重听（大多数录音从没被第二遍打开过）。更实际的用法不是全程录，而是只在\"这页推导跟不上\"时拍一张板书，课后再补。", "收益": "课堂录音、拍摄板书涉及教师的讲课内容与课堂秩序，是否允许由任课教师和学校课堂管理规定决定，并非当然权利；部分课程（含涉密、临床、实验环节）明确禁止录音录像。把课堂内容录下来再传播，还可能涉及著作权问题。", "证据等级": "C", "来源": "各高校课堂管理规定与教师课程要求（通行做法，各校各课不同）。", "备注": "受益人是自己。先问一句再录，既省掉纠纷，也让老师更愿意在课后给你答疑。录音只留给自己复习，不要转给别人或发到网上。"}, "extra": []}, {"n": 12, "title": "把\"要复习\"改成\"几点在哪复习哪一章\"：执行意图", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱。", "说人话": "定目标容易，执行难。把愿望写成\"如果到了某时间某地点，我就做某件具体的事\"，比只写\"我要好好学习\"更容易真的做起来。例如把\"复习高数\"改成\"今晚 8 点在图书馆三楼，把第四章课后题做 10 道\"。这种句式的关键，是把行动绑定到一个明确的触发点（时间＋地点）上。", "收益": "Gollwitzer (1999) 提出\"执行意图（implementation intentions）\"概念，即把行动写成\"如果情境 X，我就做行为 Y\"的形式；Gollwitzer 与 Sheeran (2006) 对 94 项独立研究、共 8000 余名参与者的元分析显示，执行意图对目标达成的效应量约为 d=0.65（中等偏大）。", "证据等级": "B", "来源": "Gollwitzer, P. M. (1999). Implementation intentions: Strong effects of simple plans. *American Psychologist*, 54(7), 493–503；Gollwitzer, P. M., & Sheeran, P. (2006). Implementation intentions and goal achievement: A meta-analysis of effects and processes. *Advances in Experimental Social Psychology*, 38, 69–119.", "备注": "受益人是自己。这和本书第 12 章\"把'要做'写成'几点在哪做'\"是同一条方法，可对照着看。写的时候必须带具体时间和地点，否则退化成普通待办。"}, "extra": []}, {"n": 13, "title": "番茄工作法：25 分钟一段，先用它解决\"开始\"这个问题", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱。", "说人话": "番茄工作法就是把时间切成 25 分钟专注加 5 分钟休息，四个循环后长休一次。它真正管用的地方不是\"提高效率\"，而是降低\"开始做\"的门槛——反正只要坐 25 分钟，心理阻力小得多。用手机计时器就能开始，不需要专门软件。", "收益": "该方法由 Francesco Cirillo 在 20 世纪 80 年代末提出并推广，核心机制是把长任务拆成可执行的小段并强制休息，对拖延和长时间注意力疲劳有一定帮助。它属于通行的时间管理方法，缺少高质量的对照实验支持其\"提升学业成绩\"的具体数值。", "证据等级": "C", "来源": "Cirillo, F. *The Pomodoro Technique*（番茄工作法的原始来源，属通行做法）。", "备注": "受益人是自己。常见误区：把计时器当监督工具，一被打断就自责放弃。被打断就重新起一段就好，重点是\"每天都起几段\"。"}, "extra": []}, {"n": 14, "title": "费曼技巧：把一个概念讲给完全不懂的人听", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱，花的是把话说清楚的那点力气。", "说人话": "检验自己懂没懂，最直接的办法是假装讲给一个大一新生听：不许用术语，不许跳过步骤。一旦你发现自己讲不下去、只能用\"就是这样\"\"记住就行\"带过，那里就是没懂的地方，回头补那一块。这个方法本质上是第 4 条\"合上书自测\"的口头版。", "收益": "费曼技巧作为学习方法的名称流传自物理学家理查德·费曼的教学风格，但在学术文献中没有统一的原始出处或对照实验；它的有效成分可以用 Dunlosky 等 (2013) 评为中等效用的\"自我解释\"（self-explanation）和第 4 条的提取练习来解释。", "证据等级": "C", "来源": "属通行学习法（本书作者归纳）；其机制依据见 Dunlosky, J. 等 (2013). *Psychological Science in the Public Interest*, 14(1).", "备注": "受益人是自己。找个人（哪怕是室友）听你讲三分钟，比对着墙说更有效——对方会问出你没想到的问题。"}, "extra": []}, {"n": 15, "title": "作业不是\"交了就算\"：它是平时分和补漏洞的双重机会", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱，花的是认真做完。", "说人话": "大学作业通常直接进平时分，同时它是最好的\"找漏洞\"工具——老师布置的题，往往就是期末试卷的母题。作业抄一遍交上去，丢的是两样东西：平时分和一次免费体检。宁可少做几道，也要自己做完并对答案。", "收益": "教高〔2019〕6号第 9 条明确把\"作业测评、阶段性测试\"列为应科学确定比重的过程考核形式，即作业是课程成绩的正式构成部分。各校课程考核管理办法进一步规定作业在平时成绩中的权重；具体占比由每门课教学大纲载明。", "证据等级": "A", "来源": "教育部 (2019). 关于深化本科教育教学改革全面提高人才培养质量的意见（教高〔2019〕6号）第 9 条. <https://www.moe.gov.cn/srcsite/A08/s7056/201910/t20191011_402759.html>；各高校课程考核管理办法.", "备注": "受益人是自己。判断方法：把每次作业当成一次小测，做的时候不翻答案，做完再对——效率远高于\"边看答案边抄\"。"}, "extra": []}, {"n": 16, "title": "小组作业：开工第一件事是分工加留痕，再谈感情", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱。", "说人话": "小组作业最大的风险是\"搭便车\"：活是两个人干的，分是四个人拿的。开工第一件事是把分工写进群里、定好每个环节的截止时间、每一步留痕（谁写了哪部分、哪天交的）。真有人不做，你有证据去找老师，而不是靠记忆吵架。", "收益": "多数高校课程大纲会说明小组作业的评分方式（整体评分或区分个人贡献），部分教师要求填写组内互评表以区分个人得分。留有明确分工记录，是在最终评分有争议时向教师提供说明的依据。", "证据等级": "C", "来源": "各高校课程小组作业评分办法（通行做法）。", "备注": "受益人是自己。组队时选人和选题一样重要：和按时交作业的人一组。分工记录尽量发在群里（有平台时间戳），不要只在两人私下商量。"}, "extra": []}, {"n": 17, "title": "论文式考核：先看引用规范再动手写", "tag": {"money": "0", "time": "多", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱，花的是时间。", "说人话": "论文作业的分数很大一部分在\"格式和引用\"上：参考文献格式、文内引用标注、查重率。写完一定按老师给的格式改一遍，把重复率降到学校线以下再提交。格式规范不用自己发明，国家标准 GB/T 7714 就规定了参考文献怎么写。", "收益": "GB/T 7714-2015《信息与文献 参考文献著录规则》是现行有效的推荐性国家标准（2015 年发布、2015 年 12 月 1 日实施，替代 GB/T 7714-2005），规定了专著、期刊、学位论文、电子资源等的著录格式。本科课程论文与学位论文通常要求按 GB/T 7714 或教师指定格式标注参考文献，部分课程还要求附查重报告。", "证据等级": "A", "来源": "全国信息与文献标准化技术委员会. GB/T 7714-2015《信息与文献 参考文献著录规则》（中华人民共和国国家标准）；各高校课程论文与学位论文规范.", "备注": "受益人是自己。直接复制粘贴再改几个字，查重系统一样能识别出来——改写要改到\"用自己的话说\"的程度，而不是替换同义词。"}, "extra": []}, {"n": 18, "title": "查重：不是越低越好，但超线一定过不了", "tag": {"money": "低", "time": "少", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "学校一般给一定免费查重次数，自费查重一次几十到上百元。", "说人话": "多数高校对本科论文设重复率上限（常见 20% 左右，各校不同），超过就要改、甚至不予答辩。但\"重复率 0%\"不是目标——正常引用、公式、法条都会计入重复率。要做的是：把查重报告当体检表，看清哪些段落标红，逐条改写；而不是为了压数字把正常引用也删干净。", "收益": "教高〔2019〕6号第 9 条要求\"科学合理制定本科毕业设计（论文）要求，严格全过程管理，严肃处理各类学术不端行为\"。《学位论文作假行为处理办法》（教育部令第 34 号，2013 年 1 月 1 日施行）第三条规定，学位论文作假行为包括购买、由他人代写、剽窃他人作品和学术成果、伪造数据等情形；第七条规定，出现上述情形的，未获学位者可被取消学位申请资格，已获学位者\"依法撤销其学位，并注销学位证书\"，且处理决定向社会公布、自处理之日起至少 3 年内各学位授予单位不得再接受其学位申请。", "证据等级": "A", "来源": "教育部 (2013). 学位论文作假行为处理办法（教育部令第 34 号）第三条、第七条. <https://www.gov.cn/zhengce/2012-11/13/content_5713384.htm>；教育部 (2019). 教高〔2019〕6号第 9 条；各高校论文查重标准（各校上限不同）。", "备注": "各校差异。受益人是自己。查重红线只是一条线，真正的红线是\"代写、买卖、伪造数据\"——那是要撤销学位、且 3 年内不得再申请学位的。"}, "extra": []}, {"n": 19, "title": "开卷考要提前做\"目录索引\"，别指望考场现翻", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱。考前两小时。", "说人话": "开卷考不难在\"记不记得\"，难在\"翻不翻得到\"。考前给教材加便签、做一张\"知识点—页码\"索引，考场里就能省下大量翻书时间。带上没做索引的厚书进考场，等于闭卷。索引连\"哪一章讲哪个定理\"都写清楚，比堆满便签更管用。", "收益": "开卷考试通常只允许携带指定教材或资料，不允许携带电子设备和复印材料，考试时间与闭卷相同。预先建立索引是通行的应考方法：它把\"检索知识\"的成本从考场时间挪到了考场外，从而把珍贵的时间留给定答案。", "证据等级": "C", "来源": "各高校考试规则与考场须知（通行做法）。", "备注": "受益人是自己。注意考场规则：有的学校禁止带任何纸质资料，只能带一本指定教材；违规带资料可能按考试违纪处理。"}, "extra": []}, {"n": 20, "title": "期末周的排程：按\"考试先后 × 学分大小\"排，不按心情", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱。考前一周排一次。", "说人话": "考试周几门课挤在一起时，最容易犯的错是\"挑喜欢的先看、难的往后拖\"。正确排法是两把尺子叠着用：先考的先看，学分大、会掉绩点的优先。再配第 3 条的分散练习——把每门课的复习拆成考前几天的固定时段，而不是留到最后一晚。", "收益": "绩点一般为学分加权平均，学分越大的课对排名影响越大；因此把复习时间优先给\"学分大 × 先考 × 掌握差\"的课，是排名意义上的最优分配。把复习拆成多天（分散练习）则对应第 3 条的研究结论：延迟测验中分散学习优于集中学习。", "证据等级": "C", "来源": "由本节第 3 条与第 4 章第 2 条依据推导的排程方法（属判断方法，非独立文献）。", "备注": "受益人是自己。把排程写在一张纸上贴在桌前：哪天、几点、哪一门、看哪几章。写在纸上比记在脑子里更抗临时起意。"}, "extra": []}, {"n": 21, "title": "补考的时间成本：重修会和后面的课表撞车", "tag": {"money": "中", "time": "多", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "补考通常免费，重修按学分收费，再加一学期的时间。", "说人话": "挂一门课的真实代价不是\"补考一次\"，而是它可能挤掉你后面学期的选择：重修要占用课时，和你已经排好的专业课冲突；如果这门课是后续课程的前置，链条会一路堵下去。而且毕业前那次\"清考\"兜底已经取消，补考不过就真的只能重修。", "收益": "教高〔2019〕6号第 9 条明确要求\"坚决取消毕业前补考等'清考'行为\"；同一条还规定\"加强学生体育课程考核，不能达到《国家学生体质健康标准》合格要求者不能毕业\"。这与教育部令第 41 号关于成绩记载（对补考、重修成绩予以标注）的规定叠加，意味着挂科的后果会体现在成绩单和毕业审查两个环节上。", "证据等级": "A", "来源": "教育部 (2019). 教高〔2019〕6号第 9 条. <https://www.moe.gov.cn/srcsite/A08/s7056/201910/t20191011_402759.html>；教育部 (2017). 普通高等学校学生管理规定（教育部令第 41 号）.", "备注": "受益人是自己。策略上，难度大的基础课宁可多花一周复习争取一次过，也别赌补考——两次成本加起来的期望值通常更高。"}, "extra": []}, {"n": 22, "title": "和老师沟通：邮件写清三件事，答疑时间别白跑", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱。", "说人话": "给老师发邮件或消息，写清三件事：你是谁（姓名＋班级＋学号）、你要问什么（具体到题号或章节）、你希望对方做什么（回邮件、约答疑、看一段提纲）。别只发一句\"老师在吗\"。老师通常有固定答疑时间，先查课程通知再去，比自己冲办公室被拒好得多。", "收益": "各高校课程大纲或开学通知一般会告知任课教师的答疑（office hours）安排与联系方式；教师的课后辅导、答疑属于教学环节的一部分。把问题问得具体，既省老师时间，也更可能拿到有针对性的回答。", "证据等级": "C", "来源": "各高校课程教学大纲与教师答疑安排（通行做法）。", "备注": "受益人是自己。三条礼貌底线：用学校邮箱而不是花名；称呼用\"某老师\"；收到回复后回一句\"收到，谢谢\"。这三条几乎决定老师对你的印象。"}, "extra": []}, {"n": 23, "title": "学术诚信的边界：引用、合作、代写，三条线不一样", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，花的是自律。", "说人话": "三条线松紧完全不同。引用别人观点并规范标注，是正常学术行为；和同学讨论、互相看作业，很多课程允许但要遵守老师的规定；找人代写、买论文、伪造数据，则可能丢学位、甚至坐牢。模糊地带的标准动作只有一个字：先问老师这算不算允许，别自己猜。", "收益": "《中华人民共和国学位法》第三十七条规定，学位申请人在攻读学位期间存在代写、剽窃、伪造等学术不端行为的，经学位评定委员会决议，学位授予单位不授予学位或者撤销学位。《学位论文作假行为处理办法》（教育部令第 34 号）第七条规定对作假者可取消学位申请资格或撤销学位，处理决定向社会公布、3 年内各学位授予单位不得再接受其学位申请；第八条规定在校学生为他人代写、出售学位论文可被开除学籍。《高等学校预防与处理学术不端行为办法》（教育部令第 40 号，2016 年 9 月 1 日施行）第二十七条列举了剽窃、篡改、伪造、买卖论文或代写等构成学术不端的情形。", "证据等级": "A", "来源": "《中华人民共和国学位法》（2024 年通过，2025 年 1 月 1 日施行）第三十七条；教育部 (2013). 学位论文作假行为处理办法（教育部令第 34 号）. <https://www.gov.cn/zhengce/2012-11/13/content_5713384.htm>；教育部 (2016). 高等学校预防与处理学术不端行为办法（教育部令第 40 号）. <https://www.moe.gov.cn/srcsite/A02/s5911/moe_621/201607/t20160718_272156.html>", "备注": "受益人是自己。模糊地带默认按\"最严\"处理：不确定能不能合作，就各自独立完成再核对答案；不确定能不能引用，就规范标注并写清出处。"}, "extra": []}, {"n": 24, "title": "考试周：睡眠优先于多刷一套题", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱。", "说人话": "通宵复习换来的记忆，第二天考试时反而更难调出来——缺觉会影响注意、工作记忆和记忆提取。考前那一晚，睡够比多背一章更划算。这不是躺平，是把边际收益算清楚：多背一章的期望加分，很可能小于犯困犯错的期望扣分。", "收益": "Rasch 与 Born (2013) 发表在 *Physiological Reviews* 的综述总结了睡眠在记忆中的作用：睡眠参与记忆的巩固与整合，睡眠剥夺会损害注意、工作记忆和执行功能，进而影响新记忆的形成与提取。也就是说，\"睡一觉再考\"和\"多背一小时再考\"不一定是同一笔账。", "证据等级": "B", "来源": "Rasch, B., & Born, J. (2013). About sleep's role in memory. *Physiological Reviews*, 93(2), 681–766.", "备注": "受益人是自己。可执行的底线是考前一周不熬通宵；当天中午小睡 20 分钟（不超过 30 分钟，避免醒来更困）。第 12 章另有一条\"睡眠是底线\"，可对照着看。"}, "extra": []}]}, {"file": "04-绩点排名与评奖.md", "title": "4. 绩点、排名与评奖：先把规则读一遍", "entries": [{"n": 1, "title": "先把本校的绩点算法抄下来：4.0 制还是 5.0 制，加权还是算术平均", "tag": {"money": "0", "time": "少", "will": "否", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱。十分钟。", "说人话": "绩点算法直接决定你的努力值不值。常见的有 4.0 制（90 分以上为 4.0）、5.0 制、以及直接用\"百分制加权平均分\"。判断方法写下来三句话：满分是多少？按学分加权吗？挂科和重修怎么记？这三句话问清楚，后面的策略才有依据。", "收益": "各高校一般在学籍管理办法或成绩管理办法中明确绩点（GPA）计算方法，教务系统通常同时显示加权平均分和绩点。学分加权是把每门课成绩乘以该课学分数再求平均，因此学分大的课对绩点影响更大。公式本身由各校自定，没有全国统一标准。", "证据等级": "B", "来源": "各高校学籍管理办法与成绩（绩点）管理办法（各校公式不同，以本校文件为准）。", "备注": "各校差异。受益人是自己。留学申请时国外院校通常按自己的算法重新折算，往往同时看\"百分制平均分\"和\"专业排名\"，所以这两个数字也要关注，不能只看绩点。"}, "extra": []}, {"n": 2, "title": "学分越大的课，对绩点的影响越大", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱。", "说人话": "一门 4 学分的高数拿 65 分，比一门 1 学分的通识课拿 65 分严重得多——前者对总绩点的拖累是后者的数倍。所以复习和投入的时间要按学分排序，而不是按\"哪门课有意思\"排序。学期初花五分钟把课按学分从高到低排一遍，重点课一目了然。", "收益": "绩点一般为学分加权平均，权重与该课学分成正比；保研排名、评奖多采用加权成绩或排名。这意味着在总学分固定的情况下，提高高学分课的分数对排名的边际贡献更大。若某门高学分课已有风险，把时间优先投给它，回报高于修补低学分课。", "证据等级": "B", "来源": "各高校绩点计算方法（通行做法）；第 3 章第 20 条关于按学分排复习优先级的推导。", "备注": "受益人是自己。常见误区：为了\"补救\"一门 1 学分的低分课反复重修，却放任 4 学分专业课将将及格。"}, "extra": []}, {"n": 3, "title": "排名有三种口径：专业排名、学院排名、年级排名，问清是谁在算", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱。问一句辅导员。", "说人话": "\"我排名第几\"这个问题，答案取决于跟谁比：本专业比、本院系比，还是全年级比。同一份成绩，可能是专业第 5、年级第 40。保研、评奖、留学申请用的口径各不相同，必须分别问清楚，否则你会拿一个没用的名次去规划。", "收益": "推免（保研）一般由学院按本院系推免办法确定排名与名额分配；评奖评优可能按专业或班级排名。教育部《全国普通高等学校推荐优秀应届本科毕业生免试攻读硕士学位研究生工作管理办法（试行）》（教学〔2006〕14号）要求推荐学校制订\"科学、规范、明确\"的推荐标准与公开透明的操作程序，且所有办法、标准、程序和结果都要公开透明。因此排名口径必须能在学院文件中查到。", "证据等级": "B", "来源": "教育部 (2006). 全国普通高等学校推荐优秀应届本科毕业生免试攻读硕士学位研究生工作管理办法（试行）（教学〔2006〕14号）. <https://hudong.moe.gov.cn/srcsite/A15/moe_778/s3113/200607/t20060712_79975.html>；各高校推免工作办法.", "备注": "受益人是自己。名额少、基数小的专业，专业排名通常比年级排名更容易靠前；反过来，想去外校，对方可能只看年级排名。两个名次都记下来。"}, "extra": []}, {"n": 4, "title": "挂科的连锁后果：补考、重修、学位、保研、评奖，一条链", "tag": {"money": "中", "time": "多", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "补考免费或低价，重修按学分收费；主要代价是一年的时间。", "说人话": "挂一门课不只是\"补考一次\"：可能失去当年评奖资格、掉出保研排名、影响交换申请；如果挂的是必修课且一直没过，最后可能拿不到毕业证和学位证。所以\"及格\"这条线，是整本书里性价比最高的目标之一——它同时守住毕业、学位、评奖、保研四道门。", "收益": "多数高校规定课程不及格需补考或重修，成绩单会标注补考/重修；部分高校规定有挂科记录者不得参加当年评优评先，或影响推免资格。学生须修满规定学分并通过毕业环节审查方授予学位（《中华人民共和国学位法》第十九条）。教高〔2019〕6号第 9 条同时明确\"坚决取消毕业前补考等'清考'行为\"，堵死了最后兜底的路。", "证据等级": "B", "来源": "教育部 (2017). 普通高等学校学生管理规定（教育部令第 41 号）；《中华人民共和国学位法》第十九条；教育部 (2019). 教高〔2019〕6号第 9 条. <https://www.moe.gov.cn/srcsite/A08/s7056/201910/t20191011_402759.html>；各校评奖与推免办法.", "备注": "受益人是自己。策略上，宁可在大一大二把基础课一次性过掉，也别留到后面重修——重修的时间成本随年级上升而增加，且和你已排好的专业课更易冲突。"}, "extra": []}, {"n": 5, "title": "重修和补考的成绩怎么记：先问清学校标不标注、取不取最高分", "tag": {"money": "中", "time": "多", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "重修费加一学期时间。", "说人话": "同样是重修，A 校记\"及格\"，B 校记实际考分，C 校取最高分，三种规则下刷分策略完全不同。教育部只规定\"要标注\"，具体怎么标注、算不算进绩点、影响不影响保研，各校自定。动手刷分前，先去教务处问清规则，别自己假设。", "收益": "教育部《普通高等学校学生管理规定》（教育部令第 41 号）要求学校真实、完整地记载和出具学生学业成绩，对通过补考、重修获得的成绩\"应当予以标注，并归入学籍档案\"。在此前提下，\"取最高分／记及格分／不计入绩点\"等具体规则由各校学籍与成绩管理办法决定。", "证据等级": "A", "来源": "教育部 (2017). 普通高等学校学生管理规定（教育部令第 41 号）第三章\"考核与成绩记载\".；各高校学籍与成绩管理办法（各校差异大）。", "备注": "各校差异。受益人是自己。补救型重修（挂了必须重修）和刷分型重修（已通过想提高）是两件事，成本和收益都不一样，别混着算。"}, "extra": []}, {"n": 6, "title": "保研（推免）的硬门槛：排名、外语、无违纪，三样都要硬", "tag": {"money": "0", "time": "多", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，代价是前几年持续的成绩投入。", "说人话": "想保研，先看本校推免办法里的三条硬线：成绩排名（常见是专业前若干名）、外语（常见四级 425 分或六级某分数）、以及\"无不及格、无违纪、无作弊记录\"。三条里任何一条不达标，排名再高也进不了名单。这三条通常从大一开始累积，大三补救往往来不及。", "收益": "教学〔2006〕14号规定的推免生遴选条件包括：\"勤奋学习，刻苦钻研，成绩优秀，学术研究兴趣浓厚……诚实守信，学风端正，无任何考试作弊和剽窃他人学术成果记录；品行表现优良，无任何违法违纪受处分记录。\"办法还规定推荐名单须在校内公示（办法要求公示期不少于 7 天），未经公示的推免生资格无效。也就是说，违纪与作弊记录是直接否决项。", "证据等级": "A", "来源": "教育部 (2006). 全国普通高等学校推荐优秀应届本科毕业生免试攻读硕士学位研究生工作管理办法（试行）（教学〔2006〕14号）. <https://hudong.moe.gov.cn/srcsite/A15/moe_778/s3113/200607/t20060712_79975.html>；各高校推免工作办法（各校外语与排名门槛不同）。", "备注": "各校差异。受益人是自己。常见误区：只盯着绩点，忽略外语门槛——四级没过，专业第一也可能出局。"}, "extra": []}, {"n": 7, "title": "推免名额怎么分：研究生院高校约 15%、211 约 5%、其他约 2%", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱，查一次本校推免办法。", "说人话": "保研难不难，先看你所在学校、学院的\"保研率\"是多少。政策上，教育部批准设立研究生院的高校一般按应届本科毕业生数的 15% 左右确定名额，\"211 工程\"建设高校一般 5% 左右，其他高校一般 2%。所以同一个专业排名，在不同层次学校里的含金量差别很大。", "收益": "教学〔2006〕14号第十二条规定的名额确定原则为：教育部批准设立研究生院的高等学校一般按应届本科毕业生数的 15% 左右确定；未设立研究生院的\"211 工程\"建设高等学校一般按 5% 左右确定；其他高等学校一般按 2% 确定，其中初次开展推荐工作的学校前 3 年每年一般按 1% 确定；人文、理科等人才培养基地的高校，按基地班招生人数的 50% 左右单独增加名额。", "证据等级": "B", "来源": "教育部 (2006). 教学〔2006〕14号第十二条. <https://hudong.moe.gov.cn/srcsite/A15/moe_778/s3113/200607/t20060712_79975.html>", "备注": "受益人是自己。以上是全国性原则，各校实际名额还受学科、招生计划影响，务必以本校当年公布的推免名额为准。部分高校\"接收本校推免生不得超过本校推免生总数的 65%\"（西部省份及军工、矿业、石油、地质、农林等特殊类型高校可放宽至 75%），这条对\"想留本校\"的人影响很大。"}, "extra": []}, {"n": 8, "title": "国家奖学金：本专科每生每年 1 万元，名额增至每年 12 万名", "tag": {"money": "0", "time": "多", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，代价是长期保持靠前的排名和一贯的表现。", "说人话": "国奖是本科生能拿到的最高一档奖学金，1 万元。它面向\"特别优秀\"的学生，一般看学业排名＋综合素质测评＋竞赛科研等，通常要求二年级以上、当年无不及格。名额比过去翻了倍，但相对在校生总数仍然很少，属于\"够得着就争、够不着别硬耗\"的一档。", "收益": "财政部、教育部、人力资源社会保障部《关于调整高等教育阶段和高中阶段国家奖助学金政策的通知》（财教〔2024〕181号）规定：\"从 2024 年起，将本专科生国家奖学金奖励名额由每年 6 万名增加到 12 万名，奖励标准由每生每年 8000 元提高到 10000 元。\"同一文件还规定研究生国家奖学金名额由每年 4.5 万名增加到 9 万名。", "证据等级": "A", "来源": "财政部、教育部、人力资源社会保障部 (2024). 关于调整高等教育阶段和高中阶段国家奖助学金政策的通知（财教〔2024〕181号）一、（一）. <https://www.gov.cn/zhengce/zhengceku/202410/content_6983670.htm>", "备注": "受益人是自己。国奖的评审按学校当年通知与评审办法执行，通常要提交成绩单、获奖证明、事迹材料，具体程序与名额以本校通知为准（见第 22 条）。"}, "extra": []}, {"n": 9, "title": "国家励志奖学金：6000 元，要\"家庭经济困难\"＋\"品学兼优\"两个条件", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，但要先做家庭经济困难认定。", "说人话": "励志奖学金比国奖好拿一档，因为它多了一个\"家庭经济困难\"的门槛，把很多竞争者挡在外面。前提是你已经通过当年的家庭经济困难学生认定，否则连申请资格都没有。成绩要\"品学兼优\"，但通常不必像国奖那样排到最前面。", "收益": "财教〔2024〕181号规定：\"从 2024 年起，将本专科生国家励志奖学金奖励标准由每生每年 5000 元提高到 6000 元。\"该奖学金面向品学兼优、家庭经济困难的全日制本专科在校生，申请前提是通过家庭经济困难学生认定（认定办法见教育部等六部门教财〔2018〕16 号）。", "证据等级": "A", "来源": "财政部、教育部、人力资源社会保障部 (2024). 财教〔2024〕181号一、（二）. <https://www.gov.cn/zhengce/zhengceku/202410/content_6983670.htm>；教育部等六部门 (2018). 关于做好家庭经济困难学生认定工作的指导意见（教财〔2018〕16 号）.", "备注": "受益人是自己。这条的性价比在于\"双门槛筛掉了大量竞争者\"：先把困难认定办好，再保证成绩在同档里靠前。"}, "extra": []}, {"n": 10, "title": "国家助学金：平均每生每年 3700 元，学校在 2500—5000 元间分档", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，要填申请、交困难证明。", "说人话": "助学金和奖学金的区别是：它主要看家庭经济困难，不看排名。金额按档次发放，越困难越高。它的前置条件同样是\"家庭经济困难学生认定\"，一般每学年做一次。很多人因为\"不好意思申请\"或\"不知道要认定\"而整年错过，这是最可惜的一笔钱。", "收益": "财教〔2024〕181号规定：\"从 2024 年秋季学期起，将本专科生（含预科生，不含退役士兵学生）国家助学金平均资助标准由每生每年 3300 元提高到 3700 元，具体标准由高校在每生每年 2500—5000 元范围内自主确定，可以分为 2—3 档。\"同一文件规定全日制在校退役士兵学生全部享受本专科生国家助学金，标准由每生每年 3300 元提高到 3700 元。同一文件还提高了研究生学业奖学金的支持标准。", "证据等级": "A", "来源": "财政部、教育部、人力资源社会保障部 (2024). 财教〔2024〕181号一、（三）、（五）. <https://www.gov.cn/zhengce/zhengceku/202410/content_6983670.htm>", "备注": "受益人是自己。助学金分档由学校定，所以同一份\"家庭经济困难认定\"等级，在不同学校对应的金额可能不同；先问辅导员本院的分档标准。"}, "extra": []}, {"n": 11, "title": "综合素质测评：加分怎么算，哪些活动算", "tag": {"money": "0", "time": "中", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱，花的是周末。", "说人话": "很多学校的评奖不只看绩点，而是\"学业成绩 ＋ 综合测评加分\"。加分来自竞赛、科研、志愿服务、学生工作、文体活动。算清楚每项加几分、有没有上限，就知道把周末投在哪最划算。关键在于：加分是有限额的，堆低分值项目不如集中攻一两个高分值的。", "收益": "各高校普遍实行学生综合素质测评或德育量化考核，作为评奖评优、推免排序的依据之一；具体加分项目和分值由学校或学院文件规定并公示。教学〔2006〕14号也允许在制定综合评价体系时\"对文艺、体育及社会工作特长等因素予以适当考虑\"，但规定\"具备这些特长者必须参加综合排名，不得单列\"。", "证据等级": "B", "来源": "各高校学生综合素质测评办法（各校差异极大）；教育部 (2006). 教学〔2006〕14号第六条.", "备注": "各校差异。受益人是自己。拿到学院综测办法后做一件事：把每个加分项换算成\"每投入一小时能加几分\"，再决定做什么。"}, "extra": []}, {"n": 12, "title": "评奖评优的硬门槛：体测良好以上、无违纪、志愿时长", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱。", "说人话": "绩点够高也未必拿到奖：体测成绩要\"良好\"以上才能参评，有违纪处分直接否决，志愿服务时长不够可能被卡。这些是\"一票否决\"项，漏一个就白干一年。其中体测是唯一有全国统一标准的，也是最容易被忽视、却最容易补上的一项。", "收益": "教育部《国家学生体质健康标准（2014 年修订）》规定：\"学生测试成绩评定达到良好及以上者，方可参加评优与评奖；成绩达到优秀者，方可获体育奖学分。测试成绩评定不及格者，在本学年度准予补测一次，补测仍不及格，则学年成绩评定为不及格。\"文件同时规定，普通高等学校学生毕业时测试成绩达不到 50 分者按结业或肄业处理；因病或残疾经核准免予执行《标准》的学生，仍可参加评优与评奖，毕业时成绩注明免测。", "证据等级": "A", "来源": "教育部 (2014). 关于印发《国家学生体质健康标准（2014 年修订）》的通知（教体艺〔2014〕5号）. <https://www.moe.gov.cn/moe_879/moe_1252/s8447/201412/t20141204_179589.html>", "备注": "受益人是自己。\"体测良好\"是绩点之外最容易达成的硬门槛——它有明确的量化标准，练两三个月就能从及格提到良好。"}, "extra": []}, {"n": 13, "title": "校级奖学金与企业奖学金：钱不多，但常带\"附加条件\"", "tag": {"money": "低", "time": "中", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "不花钱。", "说人话": "除了国家层面的三项，学校和企业还设了各种奖学金，金额从几百到几千元不等。它们的门槛往往更灵活：有的看单科成绩、有的看竞赛、有的定向给某个专业或某个方向，甚至有企业要求获奖后参加实习。申请前先看清\"拿了之后要履行什么\"。", "收益": "各高校设有校级奖学金、专项奖学金，并与企业、校友基金会合作设立社会奖学金；金额、名额、评审条件由设奖方与学校共同规定，通常在学生手册或学生工作部门网站公布。部分社会奖学金附加实习、宣讲或毕业后服务等条件，须在申请时确认。", "证据等级": "B", "来源": "各高校校级与社会奖学金管理办法（各校与各奖项差异大）。", "备注": "受益人是自己。判断方法：把\"金额 ÷ 申请所需时间\"算一遍，有些小额奖学金填表的时间成本比收益还高，不值得投；带实习机会的则可以按\"实习价值\"另算。"}, "extra": []}, {"n": 14, "title": "评奖材料要提前攒：证书、证明、实践证明", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱，但要从平时开始攒。", "说人话": "评奖通知往往只给一两周时间交材料，而你需要的证明可能散落在各处：竞赛证书、志愿服务时长证明、任职文件、实践证明、成绩单。平时用一个云盘文件夹分门别类存好，通知一到就能立刻凑齐。没存的人，常在截止前一天还在找某张盖章的纸。", "收益": "评奖评优一般要求提交成绩单、获奖证书复印件、志愿服务时长记录、任职与活动证明等材料，具体清单见各校当年评审通知。部分材料（如加盖公章的实践证明、志愿服务时长）需要提前向开具单位申请，无法临时补办。", "证据等级": "C", "来源": "各高校评奖评优材料要求（通行做法，各校清单不同）。", "备注": "受益人是自己。建议文件夹结构和第 1 章第 20 条一致，另开一个\"04-证书与证明\"子目录，收了证书当天就扫描存档。"}, "extra": []}, {"n": 15, "title": "竞赛与证书加分：先查本校的\"加分目录\"", "tag": {"money": "0", "time": "中", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱（部分竞赛有报名费），花的是时间。", "说人话": "不是所有竞赛和证书都能加分。学校的综测办法或推免细则里通常有一张\"加分目录\"，写名单级别、名次和对应分值。拿目录去选比赛，比听别人说\"这个含金量高\"靠谱得多。目录之外的比赛，拿了奖也可能一分不加。", "收益": "教学〔2006〕14号在推免综合评价中允许对\"文艺、体育及社会工作特长等因素予以适当考虑\"；教高〔2019〕6号第 7 条要求\"统筹规范科技竞赛和竞赛证书管理，引导学生理性参加竞赛，达到以赛促教、以赛促学效果\"。各校据此在综测或推免细则中列明可加分的竞赛与证书目录及分值，须逐校查证。", "证据等级": "C", "来源": "各高校综合素质测评办法与推免工作办法中的竞赛/证书加分目录（各校差异极大）；教育部 (2019). 教高〔2019〕6号第 7 条.", "备注": "受益人是自己。常见误区：花一学期准备一个\"听着很厉害\"但不在目录里的比赛，最后加不了分，还挤掉了绩点。"}, "extra": []}, {"n": 16, "title": "专业排名的作用：留学、推免、求职各看什么口径", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。", "说人话": "同一个\"排名\"，在不同场合的价值不一样：留学申请常要你填专业排名或年级排名（尤其是绩点看起来\"不高\"但年级难度大时）；推免看学院/专业排名；求职时部分企业会看排名或直接要成绩单。所以别只记一个数字，把\"专业第几/学院第几/年级第几\"都算出来。", "收益": "海外院校通常按自己的公式重新折算成绩，并要求申请人填写班级/专业排名；推免按教学〔2006〕14号由学院按本院系推免办法确定排名与名额；部分用人单位在校招中要求提供成绩单或排名证明。不同用途的口径互不通用，须分别准备。", "证据等级": "B", "来源": "各高校推免工作办法与成绩单/排名证明办理流程；海外院校研究生申请材料要求（以目标院校官网为准）。", "备注": "受益人是自己。判断方法：先明确自己在争哪件事（保研/留学/求职），再按那件事要的口径去算排名，别把三个数字混着用。"}, "extra": []}, {"n": 17, "title": "成绩单能不能\"隐藏\"低分课：政策差异很大", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱。问一次教务处。", "说人话": "有些学校允许部分课程按\"通过/不通过\"记载（二级记分制），或者交换、体育、通识课不计入绩点；也有学校一律照实记录。想优化成绩单，先问清楚制度允许做什么，别自己动手改。自行修改成绩单属于伪造材料，是标准的学术不端。", "收益": "部分高校对通识选修课、体育课、交换课程采用二级记分制（只记通过/不通过，不计入绩点），具体范围各校不同；而《高等学校预防与处理学术不端行为办法》（教育部令第 40 号）第二十七条将\"在申报课题、成果、奖励和职务评审评定、申请学位过程中提供虚假学术信息\"列为学术不端情形，伪造成绩单属于此列。", "证据等级": "C", "来源": "各高校成绩记载办法（各校差异极大）；教育部 (2016). 高等学校预防与处理学术不端行为办法（教育部令第 40 号）第二十七条. <https://www.moe.gov.cn/srcsite/A02/s5911/moe_621/201607/t20160718_272156.html>", "备注": "各校差异。受益人是自己。常见误区：以为\"把 60 分那门删掉\"是小事——那是伪造材料，代价远大于收益。"}, "extra": []}, {"n": 18, "title": "交换、辅修的成绩怎么计入绩点：出国前一定要算", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱，问一次教务员。", "说人话": "交换回来那一堆课怎么折算？有的是\"通过/不通过\"不入绩点，有的按原分数计入。如果目标是靠绩点保研或申请留学，换回一堆 60 分会很伤，而且换完之后通常改不了。出发前就该把这笔账算清楚。", "收益": "各校学分认定办法规定外校课程的成绩转换规则（转换分值、是否记入绩点、认定上限）；辅修课程成绩参照主修专业管理规定，部分学校允许主修成绩与辅修成绩分开记载。是否记入绩点、如何折算，由本校学分认定与成绩管理办法决定。", "证据等级": "C", "来源": "各高校交换与学分认定管理办法、辅修成绩管理规定（各校差异极大）。", "备注": "受益人是自己。判断方法：报名交换前问三句——\"回来怎么记分\"\"算不算绩点\"\"有没有上限\"，答案不满意就别去。"}, "extra": []}, {"n": 19, "title": "一门课的分数会牵动四件事", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱。", "说人话": "同一门课的分数，会影响：① 加权绩点；② 专业排名（决定保研）；③ 当年评奖资格（尤其是有\"无不及格\"要求的奖）；④ 出国申请的成绩单。所以\"要不要为这门课多花两天\"的判断依据，不是这门课难不难，而是它牵扯到上面哪几件你真正在意的事。", "收益": "推免、评奖、交换、留学申请通常都以本科阶段成绩为重要依据；教学〔2006〕14号把\"成绩优秀\"列为推免遴选条件，多数高校评奖也把\"无不及格课程\"设为条件。因此同一门课的分数会同时进入多条评价链条，作用不限于绩点本身。", "证据等级": "C", "来源": "由本节第 1—18 条依据汇总（属判断方法，非独立文献）。", "备注": "受益人是自己。实践用法：学期初给每门课标一个\"牵扯事项\"清单，标得越多的课，投入优先级越高。"}, "extra": []}, {"n": 20, "title": "不是每一分都值得拼：绩点的边际收益是递减的", "tag": {"money": "0", "time": "多", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "把一门课从 85 拉到 92，可能要多花整整两周。", "说人话": "绩点从 2.0 提到 3.0 的收益，远大于从 3.8 提到 3.9。前者能跨过保研、评奖、奖学金的门槛，后者往往只是排名好看一点。把时间放在\"跨过门槛\"上，而不是\"多加那 0.1\"。判断标准是：这门课再花两天，会不会改变我够不够得着某条线。", "收益": "保研与评奖多为门槛制（如排名前 20% 或前 30%、无不及格、绩点不低于某值），跨过门槛后边际收益下降；但门槛本身的数字各校不同。若目标是顶尖院校的留学申请，尾部的 0.1 也可能有意义——这属于例外，要单独算。", "证据等级": "C", "来源": "由本节第 3、4、6、19 条依据推导的判断方法（属作者判断，非独立文献）。", "备注": "受益人是自己。常见误区：在已经稳过门槛的课上继续死磕，却在另一门差一点就及格的课上放任不管。"}, "extra": []}, {"n": 21, "title": "学业预警与退学风险：有些线是\"底线\"而不是\"门槛\"", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，但要主动去查。", "说人话": "挂科不只是\"这门课没过\"。当累计不及格学分达到学校规定的数量，或者学业成绩未达到学校要求、在规定年限内未完成学业，学校可以给予学业预警，甚至作退学处理。这条线通常在学籍管理办法里写得很清楚，而学生往往是最晚知道的人。", "收益": "《普通高等学校学生管理规定》（教育部令第 41 号）第三章\"学籍管理\"规定，学生学业成绩未达到学校要求或者在学校规定的学习年限内未完成学业的，学校可予退学处理；学校应当建立学业预警机制。教高〔2019〕6号第 10 条同样要求高校\"完善学分标准体系，严格学分质量要求，建立学业预警、淘汰机制\"。", "证据等级": "A", "来源": "教育部 (2017). 普通高等学校学生管理规定（教育部令第 41 号）第三章\"学籍管理\"；教育部 (2019). 教高〔2019〕6号第 10 条. <https://www.moe.gov.cn/srcsite/A08/s7056/201910/t20191011_402759.html>", "备注": "受益人是自己。判断方法：在学籍管理办法里搜\"退学\"\"预警\"，把触发条件抄下来，贴在和培养方案同一页纸上。"}, "extra": []}, {"n": 22, "title": "国家奖学金的评审：为什么\"特别优秀\"也得交材料", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "金钱"}, "fields": {"成本": "不花钱，花的是写材料的时间。", "说人话": "国奖不是\"排名第一自动到账\"。它要经个人申请、班级/学院推荐、学校评审、公示等环节，通常还要交成绩单、事迹材料、获奖证明。你不申请，学校不会替你报。而且材料写得清楚（做了什么、结果如何、可核验），比堆形容词更容易过评审。", "收益": "财教〔2024〕181号确定了本专科生国家奖学金的奖励标准和名额（1 万元、12 万名），评审程序则由教育部、财政部相关评审办法与各校实施细则规定，一般包括学生申请、院系推荐、学校评审与公示。名额分配按中央下达数执行，逐校下达。", "证据等级": "B", "来源": "财政部、教育部、人力资源社会保障部 (2024). 财教〔2024〕181号. <https://www.gov.cn/zhengce/zhengceku/202410/content_6983670.htm>；本专科生国家奖学金评审办法与各高校实施细则（以本校当年通知为准）。", "备注": "受益人是自己。常见误区：觉得自己\"不够优秀\"就不申请。评审是按当年实际申报和名额来的，不申请等于把名额让给愿意写材料的人。"}, "extra": []}, {"n": 23, "title": "学位授予的课程成绩门槛：不止\"修满学分\"一条", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱，问一次学院教务处。", "说人话": "修满学分只是毕业条件之一。很多学校对学士学位另设成绩线，比如\"必修课平均分不低于某值\"\"专业核心课无不及格\"\"平均学分绩点达到某值\"。这属于两条线：学分够了能毕业，成绩线不够可能拿不到学位证。大一就该知道这条线在哪，而不是大四才发现。", "收益": "《中华人民共和国学位法》第十九条规定，授予学士学位需通过规定的课程考核或修满相应学分、通过毕业论文或毕业设计等毕业环节审查，并达到学校规定的其他条件；各校据此在学士学位授予实施细则中设立具体标准，常见附加条件包括必修课平均成绩、平均学分绩点（GPA）、无严重违纪、外语成绩等。", "证据等级": "B", "来源": "《中华人民共和国学位法》第十九条；各高校学士学位授予实施细则（各校标准不同）。", "备注": "各校差异。受益人是自己。这条和第 2 章第 23 条是同一件事，从两个角度说：那边讲\"选课时怎么排\"，这边讲\"评奖时怎么用\"。"}, "extra": []}, {"n": 24, "title": "一张四年的\"绩点与评奖时间表\"", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "时间精力"}, "fields": {"成本": "不花钱，做一次。", "说人话": "把本节和前两章收成一条时间线：大一确认绩点公式、排名口径、学位成绩线；大二前完成困难认定（如需）、开始攒加分材料、盯住体测；大三上算清推免资格（排名、外语、违纪）并在第一次评奖季把材料交齐；大四核对学分与学位条件。有了这条线，你就不会在截止日期前一天才发现漏了一项。", "收益": "这条时间线的锚点都有对应的官方依据：推免遴选条件（教学〔2006〕14号）、学位授予条件（学位法第十九条）、体测参评门槛（教体艺〔2014〕5号）、国家奖助学金名额与标准（财教〔2024〕181号）。把它们的截止时间提前排到自己的日历里，能避免\"资格没问题但错过了申报\"这类损失。", "证据等级": "C", "来源": "由本章第 1—23 条依据汇总（属操作清单，非独立文献）。", "备注": "受益人是自己。最容易被漏掉的两个时间点：家庭经济困难认定（每学年一次，通常秋季）和各类奖学金的申报窗口（常常只有一到两周）。"}, "extra": []}]}, {"file": "05-转专业辅修与交换.md", "title": "5. 转专业、辅修、双学位、交换：换赛道的成本", "entries": [{"n": 1, "title": "转专业的第一步：把教育部令第 41 号第二十一条抄下来", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，十分钟。", "说人话": "全国高校的转专业规则，都长在《普通高等学校学生管理规定》第二十一条这棵树上。它同时给你权利和限制：有权申请（学校必须制定办法、公开程序），但也有\"不得转\"的例外（特殊招生录取的）。先把这条原文读一遍，再去读本校的转专业实施办法，你就知道哪些话是学校自己加的。", "收益": "《普通高等学校学生管理规定》（教育部令第 41 号，2017 年 9 月 1 日施行）第二十一条规定：学生在学习期间对其他专业有兴趣和专长的，可以申请转专业；以特殊招生形式录取的学生，国家有相关规定或者录取前与学校有明确约定的，不得转专业。学校应当制定学生转专业的具体办法，建立公平、公正的标准和程序，健全公示制度。休学创业或退役后复学的学生，因自身情况需要转专业的，学校应当优先考虑。", "证据等级": "A", "来源": "教育部 (2017). 普通高等学校学生管理规定（教育部令第 41 号）第二十一条. <https://hudong.moe.gov.cn/jyb_xxgk/xxgk/zhengce/guizhang/202112/P020211208551013106022.pdf>", "备注": "受益人是自己。第二十一条里藏着三个容易被忽略的信息：① 学校\"应当\"制定并公示办法，办法不公开本身就是瑕疵；② 休学创业和退役复学的学生\"优先考虑\"（第 22 条另讲，见本条第 22 项）；③ 特殊招生是\"不得转\"的硬限制，不是\"一般不转\"。"}, "extra": []}, {"n": 2, "title": "\"转出无门槛、转入有考核\"：看清四道关卡", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱。查文件花半天。", "说人话": "近年多所高校放宽了\"申请\"环节（比如允许大一大二多次申请、可填多个志愿），但\"申请自由\"不等于\"录取自由\"。转入学院有四道关卡：接收名额上限、绩点或排名门槛、笔试/面试、以及时间窗口（只在某几个学期受理）。四条里任何一条不够，申请都白交。所以第一步不是填表，是把目标学院那份文件找出来逐条对。", "收益": "以公开报道的做法为例，吉林大学由学院设定转入人数上限（约为当届专业人数的 20% 至 25%）以保障教学质量；上海交通大学允许大一大二大三多次申请，面试考察专业兴趣、学习态度、专业知识与学业规划。多数高校的转专业流程为\"学生申请—转出学院同意—转入学院考核—学校审批并公示\"，且多安排在每学年春季学期集中受理。", "证据等级": "B", "来源": "新华网/央视关于高校转专业政策的报道（2024-06-30，含上海交大、吉林大学、同济大学等做法）；各高校本科生转专业实施办法（各校差异，以本校教务处文件为准）。", "备注": "受益人是自己。判断哪道关卡卡你：绩点不够，大一就来不及；名额太少，说明要拼排名；只有面试，说明要提前准备\"为什么是这个专业\"。"}, "extra": []}, {"n": 3, "title": "转专业的真实账单：降级、补修、延毕", "tag": {"money": "中", "time": "多", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "可能多读一年（多一年学费加生活费，常见一到两万元），加上补修十几门课。", "说人话": "大二转专业常常要\"降转\"（降一级），因为新专业大一的课你没修；跨学科转的还要补一堆基础课。这笔账要在申请前算清：要不要降级？要补多少门？最早哪年能毕业？同一年转过去，别人修的是大三的课，你还在补大一的课，这就是\"降转\"的日常。", "收益": "多所高校的转专业实施办法规定，二年级转专业学生需降级并重修转入专业原有基础课程，转专业学生须补修未修课程；补修课程的学分通常计入毕业学分，但不冲抵主修专业的必修要求。按多数高校学籍管理办法，学生在最长学习年限内（本科一般为 6 年，含休学）完成学业即可，延期毕业需另行缴纳学费与住宿费。", "证据等级": "B", "来源": "各高校本科生转专业实施办法与学籍管理办法中关于降级、补修、修业年限的规定（各校差异，以本校文件为准）。", "备注": "地区差异/各校差异。判断法：把\"多读一年\"折算成一年时间 + 一到两万元，再问\"换到的这个专业，值不值这个价\"。"}, "extra": []}, {"n": 4, "title": "想转专业，大一就要做三件事：绩点、两门目标课、一次面谈", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "不花钱，但要提前一学期布局。", "说人话": "转专业考核看两样东西——你现在的学习能力（绩点/排名）和你对目标专业的准备（修过相关课、做过相关项目、面试答得出）。绩点是\"门票\"，准备是\"面试分\"。大一上学期就开始做，比大二临时抱佛脚成功率高得多：绩点一旦被第一学期拉低，加权平均很难补回来。", "收益": "多所高校转专业考核包含笔试与面试，面试考察专业兴趣、学习态度、专业知识与学业规划；部分学院要求提供已修相关课程成绩或作品。绩点通常是学分加权平均，大一大二学分密度最高，因此对总绩点影响最大，而转专业、评奖、推免多在前 3—5 学期定型。", "证据等级": "B", "来源": "各高校转专业考核办法与面试考察维度（据公开报道与新余学院、上海交大等做法整理，各校差异）。", "备注": "受益人是自己。三个动作：① 把第一学期绩点守住；② 去旁听或选修目标专业的一门核心课；③ 找一位该专业的高年级学生聊一小时，问\"你们平时在学什么、毕业去哪儿\"。"}, "extra": []}, {"n": 5, "title": "有些专业进校就不能转：强基、专项、中外合作、艺术体育、外语保送", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。报志愿前查一次招生章程。", "说人话": "以特殊招生形式录取的学生（强基计划、各类专项计划、中外合作办学、艺术类、运动训练与民族传统体育、外语类保送生等），入学后通常不能转到普通专业，或只能在同类型内转。这是报志愿时就要看的条款，不是入学后才发现的\"惊喜\"。已经进校的，先确认自己是否属于这一档。", "收益": "《普通高等学校学生管理规定》第二十一条明确\"以特殊招生形式录取的学生，国家有相关规定或者录取前与学校有明确约定的，不得转专业\"。各校招生章程与转专业办法通常会写明哪些类型不得转或限转（如中外合作办学项目学生不得转入非合作办学专业）。", "证据等级": "A", "来源": "教育部 (2017). 普通高等学校学生管理规定（第二十一条）；各高校招生章程与本科生转专业实施办法。", "备注": "受益人是自己。如果正好属于这类，别灰心：辅修、微专业、第二学士学位、跨专业考研都还在（见本章后续条目）。"}, "extra": []}, {"n": 6, "title": "转专业录取后第一件事：要一份\"学分认定书面确认\"", "tag": {"money": "0", "time": "少", "will": "是", "gain": "中", "scope": "成绩"}, "fields": {"成本": "不花钱，跑两趟教务处。", "说人话": "转过去以后，\"原专业修过的课能顶多少\"是你的核心利益，而且各校各院解释空间很大：同样的高等数学，可能被认成必修，也可能只算任选；可能一分不认，也可能认 20 学分。口头答复不算数，一定要拿到教务处或转入学院盖章（或系统内可查）的认定结果，写清哪门顶哪门。", "收益": "各校转专业实施办法一般规定，转专业学生的原修课程由转入学院会同教务处审定，符合要求的可认定为转入专业相应课程学分；不符合的计入任选课或不予认定。学分认定结果直接影响毕业学分是否达标与补修门数，故需留书面凭证。", "证据等级": "C", "来源": "各高校学分认定与转专业管理办法（属通行做法，各校差异大，以本校文件为准）。", "备注": "受益人是自己。留痕方式：截图教务系统的认定结果页、保存盖章的认定表扫描件，放进\"成绩与学分\"文件夹（见第 1 章第 20 条）。"}, "extra": []}, {"n": 7, "title": "辅修、辅修学士学位、双学士学位、第二学士学位：这是四件不同的事", "tag": {"money": "中", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "从几千元（辅修证书）到两年学费生活费（第二学士学位）。", "说人话": "名字只差几个字，含金量差好几档。① 辅修：修完一组课，拿学校发的辅修证书（非学位）；② 辅修学士学位：多拿一个学位，但要和主修分属不同专业大类，且只在主修学位证书上\"注明\"；③ 双学士学位：是高考招生进来的复合型项目，不是进校后再选；④ 第二学士学位：本科毕业后再读两年，拿第二个学士学位。报名前一定问教务处\"给我发什么、学信网怎么登记\"。", "收益": "国务院学位委员会《学士学位授权与授予管理办法》（学位〔2019〕20 号）第十四条规定辅修学士学位，在主修学士学位证书中予以注明、不单独发放学位证书，且未取得主修学士学位的不得授予；第十五条规定双学士学位复合型人才培养项目，只发放一本学位证书、两个学位在证书中注明；第十六条规定联合学士学位；第二十五条规定自办法实施之日起不再招收第二学士学位生。此后教育部办公厅《关于在普通高校继续开展第二学士学位教育的通知》（教高厅函〔2020〕9 号）恢复并规范了第二学士学位教育。", "证据等级": "A", "来源": "国务院学位委员会 (2019). 学士学位授权与授予管理办法（学位〔2019〕20 号，第十四、十五、十六、二十五条）. <https://www.moe.gov.cn/srcsite/A22/yjss_xwgl/moe_818/201907/t20190726_392378.html>；教育部办公厅 (2020). 关于在普通高校继续开展第二学士学位教育的通知（教高厅函〔2020〕9 号）. <https://www.moe.gov.cn/srcsite/A08/moe_1034/s3883/202005/t20200529_460339.html>", "备注": "各校差异。四者证书、学信网登记、用人单位认可度都不同，别把它们统称为\"双学位\"。"}, "extra": []}, {"n": 8, "title": "辅修学士学位：必须跨专业大类，且拿不到主修学位就等于零", "tag": {"money": "中", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "按学分收费，通常几千到上万元，加上周末和晚上的时间。", "说人话": "辅修学士学位有两个硬条件：一是它与你的主修学位必须归属不同的本科专业大类（同一大类里\"辅修\"拿不到学位）；二是你必须先拿到主修学士学位，没拿到，辅修学位一起作废。它的凭证形式也不是一本独立证书，而是在主修学位证书上注明一行字。所以\"辅修能不能算专业背景\"，要看你对面的人认不认这行字。", "收益": "按学位〔2019〕20 号第十四条，辅修学士学位应与主修学士学位归属不同的本科专业大类，对没有取得主修学士学位的不得授予辅修学士学位；辅修学士学位在主修学士学位证书中予以注明，不单独发放学位证书。各校另设主修成绩门槛（常见要求主修课程全部合格、平均绩点不低于 2.5 或排名达到一定比例）与总学分要求（各校不一，常见 40—60 学分区间）。", "证据等级": "B", "来源": "国务院学位委员会 (2019). 学士学位授权与授予管理办法（学位〔2019〕20 号，第十四条）；各高校辅修学士学位管理办法（各校差异）。", "备注": "各校差异。目标是\"简历多一行\"就用不着它；目标是\"考公岗位专业对口\"才要问清对方认不认这套。"}, "extra": []}, {"n": 9, "title": "双学士学位：靠高考招生进来的，不是进校后能补选的", "tag": {"money": "0", "time": "少", "will": "否", "gain": "中", "scope": "选择权"}, "fields": {"成本": "不花钱。查一次招生专业目录。", "说人话": "很多同学以为\"双学位\"是进了大学再报名就能读的，其实现在的\"双学士学位复合型人才培养项目\"是高考招生环节进来的：项目所依托的学科专业要有博士学位授予权，且分属两个不同学科门类，还要经学校学位评定委员会通过、报省级学位委员会审批。也就是说，如果你入学时没被这套项目录取，通常就没有第二条通道进去。", "收益": "学位〔2019〕20 号第十五条规定：具有学士学位授予权的普通高等学校，可在本校全日制本科学生中设立双学士学位复合型人才培养项目；项目所依托的学科专业应具有博士学位授予权，且分属两个不同的学科门类；须由专家论证、有专门培养方案、经学校学位评定委员会表决通过和学校党委常委会研究同意，并报省级学位委员会审批通过后，通过高考招收学生；本科毕业达到要求可授予双学士学位，双学士学位只发放一本学位证书，所授两个学位在证书中注明。", "证据等级": "B", "来源": "国务院学位委员会 (2019). 学士学位授权与授予管理办法（学位〔2019〕20 号，第十五条）。", "备注": "各校差异。判断法：翻你高考那年的招生专业目录，看有没有\"XX+YY 双学士学位\"这种专业；没有，就意味着在校期间基本无缘。"}, "extra": []}, {"n": 10, "title": "第二学士学位：本科毕业后再读两年，按当年应届生身份派遣", "tag": {"money": "中", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "两年学费加生活费，等于把本科重读两年（但只读专业基础课和专业课）。", "说人话": "第二学士学位是\"本科毕业后换专业\"的正式通道：学制两年、全日制、纳入学籍管理，招的是当年本科毕业并获学士学位的应届生，以及近三年毕业、目前未就业的往届生。它对\"考公岗位限定专业\"这类需求特别有用，因为毕业时按当年应届生身份派遣，证书上也会标明\"第二学士学位\"。", "收益": "教育部办公厅《关于在普通高校继续开展第二学士学位教育的通知》（教高厅函〔2020〕9 号）规定：第二学士学位主要招收当年普通高校本科毕业并获得学士学位的应届毕业生，以及近三年普通高校本科毕业并获得学士学位、目前未就业的往届生；其他人员原则上不得报考。学制为两年，全日制学习，纳入高校学籍管理系统；毕业证书须注明第二学士学位的专业名称、学习时间等内容，学位证书须明确标识\"第二学士学位\"字样；第二学士学位毕业学生按当年应届生身份派遣并办理相关就业手续。", "证据等级": "A", "来源": "教育部办公厅 (2020). 关于在普通高校继续开展第二学士学位教育的通知（教高厅函〔2020〕9 号）. <https://www.moe.gov.cn/srcsite/A08/moe_1034/s3883/202005/t20200529_460339.html>", "备注": "各校差异。招生考试办法由招生高校自行制定，报名时间和专业目录以目标院校当年招生简章为准（一般在毕业当年 3—7 月）。"}, "extra": []}, {"n": 11, "title": "微专业：不授学位、不进学信网，值不值取决于课程本身", "tag": {"money": "低", "time": "中", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "按学分或按项目收费，常见几百到几千元；时间是周末、晚上或假期。", "说人话": "微专业是近几年高校流行的\"课组包\"：围绕某个方向开 5—8 门核心课、总学分十几个，修完发一张学校自己印的修读证明或证书。关键要记住它\"三不是\"：不是学历教育、不在学信网备注、不授学位。所以它的价值不在凭证，而在你能不能真学到那门技能（比如数据分析、芯片设计、碳中和管理）。2025 年教育部启动\"双千计划\"，要在全国高校开设 1000 个微专业、1000 门职业培训课程——供给会越来越多，选择时要看课程表，不要看名字。", "收益": "微专业属学校自主设置的非学历教育。据西南石油大学、内蒙古工业大学、湖南师范大学等校公布的微专业管理办法，微专业一般设 5—8 门课、总学分 10—24 学分，明确\"不在中国高等教育学生信息网（学信网）备注信息、不授予学位\"，由学校发放微专业学习证明或修读证书；课程多安排在周末、假期或通识任选课时段，部分学分可申请认定为通识教育选修课学分。教育部 2025 年启动\"双千计划\"，推动全国高校开设微专业与职业培训课程。", "证据等级": "C", "来源": "各高校微专业管理办法（如西南石油大学教务〔2023〕127 号、内蒙古工业大学教务字〔2023〕34 号、湖南师范大学微专业管理办法 2024）；教育部\"双千计划\"相关报道（2025）.", "备注": "各校差异。判断法：把它当成\"打折的辅修\"——学费更低、学分更少，所以更要看这几门课是不是你真的想学、有没有好的任课老师。"}, "extra": []}, {"n": 12, "title": "跨校辅修：以\"上海东北片\"为例，怎么报名、多少钱、能不能拿学位", "tag": {"money": "中", "time": "多", "will": "是", "gain": "中", "scope": "选择权"}, "fields": {"成本": "按学分计费（该片区 2026 年各校听课费约每学分 160—180 元），辅修专业总学分常见 27—49 学分。", "说人话": "一些地区有高校联盟，允许本校学生去周边大学修辅修专业或微专业，学分互认。以成立最早的上海东北片高校合作办学教学协作组为例：17 所成员高校（复旦、同济、上外、上财、华政、上海海事等），2026 年面向片区学生开设 10 个跨校辅修专业和 36 个微专业；报名门槛不高（全日制本科生、平均绩点不低于 2.0 或加权平均分不低于 70 分）。但有一条必须记住：跨校辅修不能申请学位，只能拿开课学校发的辅修专业证书。", "收益": "上海市东北片普通高校教学协作组自 1995 年成立，实施跨校辅修与微专业等人才培养项目；2026 年招生简章载明报名条件为\"各校全日制本科生、平均绩点不低于 2.0（以满分 4.0 计）或平均成绩不低于 70 分\"，并明确\"跨校辅修专业不能申请学位\"、学生须在主修专业毕业前完成全部修读要求；课程成绩可通过\"上海市东北片高校教学信息协作网\"查询，各专业教学计划与学分要求在该网公布。", "证据等级": "B", "来源": "上海市东北片普通高校教学协作信息网（kxxfx2.shec.edu.cn）2026 年跨校辅修专业与微专业招生简章；上海海事大学教务处 (2026). 关于 2026 年上海市东北片普通高校辅修专业招生的通知. <https://kxxfx2.shec.edu.cn>", "备注": "地区差异。类似的高校联盟还有武汉、西安等地的跨校辅修（是否开放、是否已停止以当地当年通知为准）。报名前先问本校教务处：跨校辅修的学分和证书，本校认不认、能不能转换。"}, "extra": []}, {"n": 13, "title": "交换项目分三档：校级、院级、院际，各有各的门槛", "tag": {"money": "中", "time": "中", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "校级公派项目常有资助或免对方学费；学院自费项目要自己出学费生活费。", "说人话": "交换不是\"一个项目\"，而是一堆项目挂了同一块牌子。大致分三档：① 校级校际交换（国际合作与交流处负责，通常免对方学费、名额少、竞争大）；② 院级交换（本院和境外某学院签的协议，门槛含语言和成绩）；③ 院际短期访学/游学（时间短、多为自费）。三档的申请入口、费用、学分认定办法都不一样，别只看学校发的汇总推文。", "收益": "各校国际合作与交流处与教务处会分别公布校级交换项目、院级交换项目与短期访学项目的选拔办法，一般规定申请者需满足成绩排名、外语水平（如雅思/托福或校内测试）、无违纪等条件，并明确学费承担方式（豁免或自付）与学分认定规则。交换名额受校际协议数量限制。", "证据等级": "C", "来源": "各高校国际交流处与教务处交换项目选拔办法（属通行做法，各校差异大，以本校当年通知为准）。", "备注": "受益人是自己。判断法：把项目名里的\"校级/院级\"\"学期/学年\"\"免学费/自费\"三个词圈出来，再去问学长学姐这个项目往年录了几个人。"}, "extra": []}, {"n": 14, "title": "国家公派（CSC）本科插班生：全奖，但要排名前 30% 且无不及格", "tag": {"money": "0", "time": "中", "will": "是", "gain": "大", "scope": "选择权"}, "fields": {"成本": "申请本身不花钱；录取后由基金委资助。", "说人话": "国家留学基金委（CSC）的公派项目不只是给博士的，也有面向本科生的\"本科插班生\"（留学 3—12 个月）与部分校际学分项目。它最大的特点是全奖：一次往返国际旅费加留学期间的奖学金（生活费、注册费、保险等）。代价是门槛硬——多所高校公布的选拔条件包括平均分不低于 80 分或专业排名前 30%、无不及格科目、外语水平达标，且要学校推荐。", "收益": "国家留学基金管理委员会每年发布《国家留学基金资助出国留学人员选派指南》，选派类别含本科生（国家公派项目）与本科插班生（3—12 个月）；资助内容为全额资助，即一次往返国际旅费加资助期内奖学金（含生活费、注册费、保险、签证费等）。多所高校的校内选拔通知载明：成绩平均分不低于 80 分或专业排名前 30%、无不及格科目、通过相应外语要求，采取\"学校选拔推荐、国家留学基金委审核\"的方式确定人选；申报通过国家公派留学管理信息平台办理。", "证据等级": "B", "来源": "国家留学基金管理委员会《国家留学基金资助出国留学人员选派指南》（2025）及官网项目指南 <https://www.csc.edu.cn/chuguo>；西北工业大学、中国人民大学等校 2025 年国家公派本科生项目选拔通知.", "备注": "各校差异。时间线通常在前一年 12 月到当年 3 月（校内报名多在 1—3 月），错过就要等下一年；录取后未按期派出可能影响再次申请资格。"}, "extra": []}, {"n": 15, "title": "交换前把\"学分认定\"写成书面确认，别等回来撞车", "tag": {"money": "0", "time": "少", "will": "是", "gain": "大", "scope": "成绩"}, "fields": {"成本": "不花钱，但要跑一趟教务处。", "说人话": "交换的价值一半在经历、一半在成绩单。去之前一定要确认：对方的哪几门课能顶本校的哪几门课、按什么成绩记（原始分还是转换后的等级）、有没有学分上限、会不会导致延毕。最常见的翻车方式是\"去了很爽，回来发现课不认，只能大四补课补到哭\"。同理，交换学期可能影响保研排名（成绩计入方式各校不同），也要提前问清。", "收益": "各校国际交流处与教务处会公布交换项目的学分认定办法，一般规定交换期间所修课程须事先备案、经认定后方可转为本校学分，并设学分上限与成绩转换规则；部分高校规定未备案或课程不匹配的不予认定。交换成绩是否计入绩点、是否影响排名，各校规定不同。", "证据等级": "C", "来源": "各高校国际交流与教务处交换生学分认定办法（各校差异大，以本校文件为准）。", "备注": "受益人是自己。两个动作：① 出国前填好《交换学习计划》并让教务/学院签字；② 保留对方学校的成绩单原件和课程大纲（Course Syllabus），回国认定时用得上。"}, "extra": []}, {"n": 16, "title": "免学费交换、自费交换、访问学生：差别在\"谁付钱、有没有学籍\"", "tag": {"money": "高", "time": "中", "will": "是", "gain": "中", "scope": "金钱"}, "fields": {"成本": "免学费交换只出生活费与机票；自费交换还要出对方学费（欧美校一学期可达十几万元）。", "说人话": "同样是\"去国外读一学期\"，三种身份差别很大：① 校际交换生（通常免对方学费、保留
